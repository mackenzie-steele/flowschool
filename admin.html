            (v.status === 'published' && v.published_at
              ? '<span class="nf-hint">Published ' + esc(A.fmtDate(v.published_at)) + '</span>' : '') +
            (v.status === 'scheduled' && v.published_at
              ? '<span class="nf-hint">Goes live ' + esc(A.fmtDateTime(v.published_at)) + '</span>' : '') +
          '</div>' +

        '</aside>' +
        '</div>';

      wireVideoForm();

      function section(title, blurb, inner) {
        return '<section class="vid-section">' +
          '<div class="vid-section-head"><h2>' + esc(title) + '</h2>' +
            (blurb ? '<p>' + esc(blurb) + '</p>' : '') + '</div>' +
          '<div class="vid-section-body">' + inner + '</div></section>';
      }
    }

    // Three visible states out of seven internal ones. draft/ready/errored
    // all mean "not out there yet" to a person writing a video.
    function videoVisibility(v) {
      if (v.status === 'published') return 'published';
      if (v.status === 'scheduled') return 'scheduled';
      return 'unpublished';
    }
    // <input type="datetime-local"> wants local wall-clock with no zone, so
    // the UTC timestamp has to be shifted before it will display at all.
    function videoLocalDatetime(iso) {
      var d = iso ? new Date(iso) : new Date(Date.now() + 86400000);
      if (isNaN(d)) return '';
      var off = d.getTimezoneOffset() * 60000;
      return new Date(d.getTime() - off).toISOString().slice(0, 16);
    }

    function vidTag(k) {
      return '<span class="vid-tag" data-kw="' + esc(k) + '">' + esc(k) +
        '<button type="button" class="vid-tag-x" aria-label="Remove ' + esc(k) + '">' +
        '<span class="material-symbols-sharp">close</span></button></span>';
    }

    // The drop zone. mux-uploader's own chrome is replaced entirely — it is
    // given no UI of its own and driven through its API, so what you see is
    // the app's, not a third party's.
    function videoFileZone(v, isNew, processing) {
      if (isNew) return '<p class="muted">Create the draft first — the file attaches to it.</p>';
      if (v.mux_playback_id) {
        // The player sits in the well; Replace sits under it, full width, so
        // it reads as an action on the file rather than a control inside it.
        return '<div class="vid-player is-loading" id="vid-player">' +
                 '<div class="vid-player-skel" aria-live="polite" aria-label="Loading the preview"></div></div>';
      }
      if (processing) {
        return '<div class="vid-progress-wrap">' +
                 '<div class="vid-spinner" aria-hidden="true"></div>' +
                 '<p>' + (v.status === 'uploading' ? 'Uploading…' : 'Processing') + '</p>' +
                 '<span class="nf-hint">' + (v.status === 'uploading'
                   ? 'Keep this tab open.'
                   : 'Mux is encoding it. Usually a few minutes — you can keep writing.') + '</span>' +
               '</div>' +
               '<button class="btn-ghost" id="vid-refresh">Check again</button>';
      }
      if (v.status === 'errored') {
        return '<p class="nf-err">' + esc(v.mux_error || 'The upload failed.') + '</p>' +
               '<button class="btn-secondary" id="vid-start">Try another file</button>';
      }
      return '<label class="vid-drop" id="vid-drop">' +
               '<input type="file" id="vid-file" accept="video/*" hidden>' +
               '<span class="material-symbols-sharp">movie</span>' +
               '<span class="vid-drop-main">Drop a video here</span>' +
               '<span class="nf-hint">or <u>browse for a file</u></span>' +
             '</label>';
    }

    function videoResourceList() {
      var list = VID.resources || [];
      if (!list.length) return '<p class="muted vid-none">Nothing attached yet.</p>';
      return '<ul class="vid-res-list">' + list.map(function (r) {
        return '<li data-rid="' + r.id + '">' +
          '<span class="material-symbols-sharp">note_add</span>' +
          '<span class="vid-res-name">' + esc(r.title) +
            '<span class="nf-hint">' + esc(r.file_name || '') +
            (r.file_size ? ' · ' + Math.round(r.file_size / 1024) + 'KB' : '') + '</span></span>' +
          '<button class="btn-icon adm-del vid-res-del" data-tooltip="Remove" aria-label="Remove ' + esc(r.title) + '">' +
            '<span class="material-symbols-sharp">delete</span></button></li>';
      }).join('') + '</ul>';
    }

    // Everything Save would write, flattened. Comparing this to a snapshot
    // taken at render is what tells the button whether there is anything to
    // do — a dirty FLAG would drift the moment a field was changed and put
    // back, and the button would lie.
    function videoFingerprint() {
      var v = videoRead();
      var vis = (document.querySelector('input[name="vid-vis"]:checked') || {}).value || '';
      var when = (document.getElementById('vid-when-at') || {}).value || '';
      return JSON.stringify([v.title, v.short_description, v.description, v.category_id,
        v.slug, v.seo_title, v.seo_description, v.thumbnail_mode, v.thumbnail_time_seconds,
        (VID.editing.search_keywords || []).join('\u0000'),
        vis, vis === 'scheduled' ? when : '']);
    }

    function videoMarkClean() {
      VID._clean = videoFingerprint();
      videoSyncSave();
    }

    function videoSyncSave() {
      var btn = document.getElementById('vid-save-top');
      if (!btn) return;
      // a new video always has something to save — it does not exist yet
      var dirty = (VID.editing && VID.editing._new) || videoFingerprint() !== VID._clean;
      btn.disabled = !dirty;
      btn.textContent = (VID.editing && VID.editing._new) ? 'Create draft'
        : dirty ? 'Save' : 'Saved';
    }

    function videoRead() {
      var g = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
      var t = function (id) { return (g(id) || '').trim(); };
      return {
        title: t('vid-title'),
        short_description: t('vid-short') || null,
        description: t('vid-desc') || null,
        category_id: g('vid-category') || null,
        slug: t('vid-slug'),
        seo_title: t('vid-seo-title') || null,
        seo_description: t('vid-seo-desc') || null,
        thumbnail_mode: VID.editing.thumbnail_mode || 'auto',
        thumbnail_time_seconds: VID.editing.thumbnail_mode === 'timestamp'
          ? (parseFloat(t('vid-time')) || 0) : null,
      };
    }

    // Everything that has to happen live: counters, the slug, the search
    // preview, the thumbnail image. Cheap enough to run on every keystroke.
    function videoLive() {
      var v = VID.editing;
      var val = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
      var setCount = function (id, len, limit) {
        var e = document.getElementById(id); if (!e) return;
        e.textContent = len + ' / ' + limit;
        e.classList.toggle('over', len > limit);
      };
      setCount('c-short', val('vid-short').length, VIDEO_LIMITS.short);
      setCount('c-seot', val('vid-seo-title').length, VIDEO_LIMITS.seo_title);
      setCount('c-seod', val('vid-seo-desc').length, VIDEO_LIMITS.seo_desc);

      var serp = document.getElementById('vid-serp');
      if (serp) {
        var title = val('vid-seo-title') || val('vid-title') || 'Your video';
        var desc = val('vid-seo-desc') || val('vid-short') || 'A short description of the video.';
        var slug = val('vid-slug') || 'your-video';
        serp.innerHTML =
          '<span class="vid-serp-url">flowschool.io › video › ' + esc(slug) + '</span>' +
          '<span class="vid-serp-title">' + esc(title) + '</span>' +
          '<span class="vid-serp-desc">' + esc(desc) + '</span>';
      }
      videoThumbPreview();
      videoSyncSave();
    }

    function videoThumbPreview() {
      var v = VID.editing;
      var host = document.getElementById('vid-thumb-preview');
      if (!host) return;
      // a custom image is ours, not Mux's — no token, no playback id needed
      if (v.thumbnail_mode === 'custom') {
        host.innerHTML = v.custom_thumbnail_url
          ? '<img alt="" src="' + esc(v.custom_thumbnail_url) + '">'
          : '<span class="nf-hint">Upload an image to see it here.</span>';
        return;
      }
      if (!v.mux_playback_id) return;
      if (!v.thumb_token) { host.innerHTML = '<span class="nf-hint">Preview appears once playback is authorised.</span>'; return; }
      var t = '';
      if (v.thumbnail_mode === 'timestamp') {
        var el = document.getElementById('vid-time');
        var secs = parseFloat(el ? el.value : v.thumbnail_time_seconds);
        if (!isNaN(secs)) t = '&time=' + encodeURIComponent(secs);
      }
      host.innerHTML = '<img alt="" src="https://image.mux.com/' + encodeURIComponent(v.mux_playback_id) +
        '/thumbnail.webp?width=640' + t + '&token=' + encodeURIComponent(v.thumb_token) + '">';
    }

    function wireVideoForm() {
      var v = VID.editing;
      var err = document.getElementById('vid-err');
      var $ = function (id) { return document.getElementById(id); };

      var cancel = $('vid-cancel');
      if (cancel) cancel.addEventListener('click', function () { VID.editing = null; renderVideos(); });

      // ── live fields ──
      ['vid-title', 'vid-short', 'vid-desc', 'vid-seo-title', 'vid-seo-desc', 'vid-slug', 'vid-time']
        .forEach(function (id) { var e = $(id); if (e) e.addEventListener('input', videoLive); });

      // The slug follows the title only while it has never been touched.
      // Once edited it is the admin's, and retyping the title must not
      // silently change a URL that may already be shared.
      var slugEl = $('vid-slug'), titleEl = $('vid-title');
      if (slugEl) slugEl.addEventListener('input', function () { VID._slugTouched = true; });
      if (titleEl && slugEl) titleEl.addEventListener('input', async function () {
        if (VID._slugTouched || v.status === 'published') return;
        var r = await db.rpc('video_slugify', { p_text: titleEl.value });
        if (!VID._slugTouched) { slugEl.value = r.data || ''; videoLive(); }
      });

      // ── keyword tags ──
      var tagInput = $('vid-tag-input');
      var addTag = function (raw) {
        var val = String(raw || '').trim().replace(/\s+/g, ' ');
        if (!val) return;
        var have = (VID.editing.search_keywords || []);
        if (have.some(function (k) { return k.toLowerCase() === val.toLowerCase(); })) return;
        VID.editing.search_keywords = have.concat([val]);
        tagInput.insertAdjacentHTML('beforebegin', vidTag(val));
        tagInput.value = '';
        wireTagRemovers();
        videoSyncSave();
      };
      if (tagInput) {
        tagInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(tagInput.value); }
          else if (e.key === 'Backspace' && !tagInput.value) {
            var last = (VID.editing.search_keywords || []).slice(-1)[0];
            if (last) removeTag(last);
          }
        });
        tagInput.addEventListener('blur', function () { addTag(tagInput.value); });
        // pasting a comma-separated list should just work
        tagInput.addEventListener('paste', function (e) {
          var text = (e.clipboardData || window.clipboardData).getData('text');
          if (text && text.indexOf(',') !== -1) {
            e.preventDefault();
            text.split(',').forEach(addTag);
          }
        });
      }
      function removeTag(kw) {
        VID.editing.search_keywords = (VID.editing.search_keywords || [])
          .filter(function (k) { return k !== kw; });
        var el = document.querySelector('.vid-tag[data-kw="' + CSS.escape(kw) + '"]');
        if (el) el.remove();
        videoSyncSave();
      }
      function wireTagRemovers() {
        document.querySelectorAll('.vid-tag-x').forEach(function (x) {
          if (x.dataset.w) return; x.dataset.w = '1';
          x.addEventListener('click', function () { removeTag(x.closest('.vid-tag').dataset.kw); });
        });
      }
      wireTagRemovers();

      // ── a category without losing the draft ──
      var newcat = $('vid-newcat'), row = $('vid-newcat-row');
      if (newcat) newcat.addEventListener('click', function () {
        row.hidden = false; newcat.hidden = true; $('vid-newcat-name').focus();
      });
      var cancelCat = $('vid-newcat-cancel');
      if (cancelCat) cancelCat.addEventListener('click', function () {
        row.hidden = true; newcat.hidden = false;
      });
      var saveCat = $('vid-newcat-save');
      if (saveCat) saveCat.addEventListener('click', async function () {
        var name = ($('vid-newcat-name').value || '').trim();
        if (!name) return;
        saveCat.disabled = true;
        try {
          var sl = await db.rpc('video_slugify', { p_text: name });
          var r = await db.from('video_categories').insert({ name: name, slug: sl.data }).select().single();
          if (r.error) throw r.error;
          VID.cats.push(r.data);
          var sel = $('vid-category');
          sel.insertAdjacentHTML('beforeend', '<option value="' + r.data.id + '">' + esc(r.data.name) + '</option>');
          sel.value = r.data.id;          // chosen for you — it is why you made it
          videoSyncSave();
          row.hidden = true; newcat.hidden = false;
          toast('Category added');
        } catch (e) {
          toast(/duplicate/i.test(e.message || '') ? 'There is already a category with that name' : e.message);
        } finally { saveCat.disabled = false; }
      });

      // ── thumbnail ──
      document.querySelectorAll('[data-thumb-mode]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          VID.editing.thumbnail_mode = btn.dataset.thumbMode;
          document.querySelectorAll('[data-thumb-mode]').forEach(function (o) {
            o.classList.toggle('on', o === btn);
          });
          var t = $('vid-thumb-time');
          if (t) t.hidden = btn.dataset.thumbMode !== 'timestamp';
          var cu = $('vid-thumb-custom');
          if (cu) cu.hidden = btn.dataset.thumbMode !== 'custom';
          videoThumbPreview();
          videoSyncSave();
        });
      });
      var useNow = $('vid-usenow');
      if (useNow) useNow.addEventListener('click', function () {
        var p = document.querySelector('#vid-player mux-player');
        if (!p || !p.currentTime) { toast('Play the video and pause where you want the frame'); return; }
        VID.editing.thumbnail_mode = 'timestamp';
        var t = $('vid-time'); if (t) t.value = Math.round(p.currentTime * 10) / 10;
        videoThumbPreview();
        videoSyncSave();
      });

      // ── save / publish ──
      // One Save. It writes the fields, then applies whatever Visibility is
      // set to — two buttons meant you could save a video and leave its
      // visibility unapplied, with nothing on screen saying so.
      var saveTop = $('vid-save-top');
      if (saveTop) saveTop.addEventListener('click', function () { saveVideo(saveTop, err); });

      // ── a thumbnail of your own ──
      var tDrop = $('vid-thumb-drop'), tFile = $('vid-thumb-file'), tErr = $('vid-thumb-err');
      if (tDrop && tFile) {
        var takeThumb = function (f) { if (f) uploadThumbnail(f, tErr); };
        tFile.addEventListener('change', function () { takeThumb(tFile.files && tFile.files[0]); tFile.value = ''; });
        ['dragenter', 'dragover'].forEach(function (t) {
          tDrop.addEventListener(t, function (e) { e.preventDefault(); tDrop.classList.add('over'); });
        });
        ['dragleave', 'drop'].forEach(function (t) {
          tDrop.addEventListener(t, function (e) { e.preventDefault(); tDrop.classList.remove('over'); });
        });
        tDrop.addEventListener('drop', function (e) {
          takeThumb(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
        });
      }
      // the radios only change what the box shows; nothing moves until Apply
      document.querySelectorAll('input[name="vid-vis"]').forEach(function (r) {
        r.addEventListener('change', function () {
          document.querySelectorAll('.vid-radio').forEach(function (l) {
            l.classList.toggle('on', l.contains(r) && r.checked);
          });
          var when = $('vid-when');
          if (when) when.hidden = r.value !== 'scheduled';
        });
      });

      // ── the More menu ──
      var moreBtn = $('vid-more-btn'), menu = $('vid-menu');
      if (moreBtn && menu) {
        var closeMenu = function () {
          menu.hidden = true; moreBtn.setAttribute('aria-expanded', 'false');
          document.removeEventListener('click', away);
        };
        var away = function (e) { if (!menu.contains(e.target) && e.target !== moreBtn) closeMenu(); };
        moreBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var open = menu.hidden;
          menu.hidden = !open;
          moreBtn.setAttribute('aria-expanded', String(open));
          if (open) setTimeout(function () { document.addEventListener('click', away); }, 0);
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !menu.hidden) { closeMenu(); moreBtn.focus(); }
        });

        menu.querySelectorAll('[data-act]').forEach(function (item) {
          item.addEventListener('click', async function () {
            var act = item.dataset.act;

            if (act === 'copy') {
              var url = location.origin + '/video/' + (v.slug || '');
              try { await navigator.clipboard.writeText(url); toast('Link copied'); }
              catch (_) { toast(url); }
              closeMenu(); return;
            }

            if (act === 'archive') {
              closeMenu();
              try {
                var r = await db.rpc('archive_video', { p_id: v.id });
                if (r.error) throw r.error;
                toast('Archived'); VID.editing = null; await renderVideos();
              } catch (e) { toast(e.message || 'Could not archive'); }
              return;
            }

            if (act === 'delete') {
              // Two clicks, in the menu itself, rather than a modal — and the
              // label says what survives, because "delete" here does NOT
              // touch the Mux master. Destroying that is a separate act.
              if (item.dataset.armed !== '1') {
                item.dataset.armed = '1';
                item.textContent = 'Really delete? The video file stays on Mux.';
                clearTimeout(item._d);
                item._d = setTimeout(function () {
                  item.dataset.armed = '0'; item.textContent = 'Delete video';
                }, 4000);
                return;
              }
              closeMenu();
              try {
                // resources first: their rows cascade, but the FILES do not,
                // and an orphaned object bills forever with nothing pointing
                // at it
                var res = await db.from('video_resources').select('storage_path').eq('video_id', v.id);
                var paths = (res.data || []).map(function (x) { return x.storage_path; });
                if (paths.length) await db.storage.from('video-resources').remove(paths);
                var d = await db.from('videos').delete().eq('id', v.id);
                if (d.error) throw d.error;
                toast('Deleted');
                VID.editing = null; await renderVideos();
              } catch (e) { toast(e.message || 'Could not delete that'); }
            }
          });
        });
      }

      // ── file ──
      var refresh = $('vid-refresh');
      if (refresh) refresh.addEventListener('click', async function () {
        await renderVideos();
        VID.editing = VID.rows.filter(function (r) { return r.id === v.id; })[0] || null;
        if (VID.editing) drawVideos();
      });
      var drop = $('vid-drop'), file = $('vid-file');
      if (drop && file) {
        file.addEventListener('change', function () {
          if (file.files && file.files[0]) startVideoUpload(false, file.files[0]);
        });
        ['dragenter', 'dragover'].forEach(function (t) {
          drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
        });
        ['dragleave', 'drop'].forEach(function (t) {
          drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
        });
        drop.addEventListener('drop', function (e) {
          var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (f) startVideoUpload(false, f);
        });
      }
      var start = $('vid-start');
      if (start) start.addEventListener('click', function () { startVideoUpload(false); });
      var replace = $('vid-replace');
      if (replace) replace.addEventListener('click', function () {
        if (replace.dataset.armed !== '1') {
          replace.dataset.armed = '1'; replace.textContent = 'Replace — sure?';
          setTimeout(function () { replace.dataset.armed = '0'; replace.textContent = 'Replace'; }, 3000);
          return;
        }
        startVideoUpload(true);
      });

      // The player loads because there is something to play, not because a
      // button exists — Reload was removed and this was gated on it.
      if (v.mux_playback_id && document.getElementById('vid-player')) previewVideo(null, true);

      var catSel = $('vid-category');
      if (catSel) catSel.addEventListener('change', videoSyncSave);

      wireVideoResources();
      videoLive();
      videoMarkClean();            // the baseline is whatever just rendered
      if (!v._new) loadVideoResources();
    }

    async function saveVideo(btn, err, quiet) {
      if (VID.busy && !quiet) return;
      var v = VID.editing;
      var vals = videoRead();
      if (!vals.title) { err.textContent = 'A title is required.'; throw new Error('no title'); }
      if (!quiet) { VID.busy = true; if (btn) btn.disabled = true; }
      err.textContent = '';
      try {
        var kw = VID.editing.search_keywords || [];
        if (v._new) {
          if (!vals.slug) {
            var sl = await db.rpc('video_slugify', { p_text: vals.title });
            vals.slug = sl.data;
          }
          var free = await db.rpc('video_slug_available', { p_slug: vals.slug, p_exclude: null });
          if (free.data === false) vals.slug += '-' + Date.now().toString(36).slice(-4);
          var ins = await db.from('videos').insert(vals).select().single();
          if (ins.error) throw ins.error;
          VID.editing = ins.data;
          if (kw.length) await db.rpc('set_video_keywords', { p_id: ins.data.id, p_keywords: kw });
          toast('Draft created — now add the file');
        } else {
          var free2 = await db.rpc('video_slug_available', { p_slug: vals.slug, p_exclude: v.id });
          if (free2.data === false) throw new Error('That URL is taken by another video.');
          var up = await db.from('videos').update(vals).eq('id', v.id).select().single();
          if (up.error) throw up.error;
          await db.rpc('set_video_keywords', { p_id: v.id, p_keywords: kw });
          VID.editing = up.data;
          if (!quiet) toast('Saved');
        }
        // then the visibility the radios are showing, if it differs from what
        // the row already says
        if (!quiet && !v._new) {
          var chosen = (document.querySelector('input[name="vid-vis"]:checked') || {}).value;
          var now = videoVisibility(VID.editing);
          if (chosen && chosen !== now) {
            if (chosen === 'published') {
              var p = await db.rpc('publish_video', { p_id: VID.editing.id });
              if (p.error) throw p.error;
            } else if (chosen === 'scheduled') {
              var at = (document.getElementById('vid-when-at') || {}).value;
              if (!at) throw new Error('Pick a date and time for it to go live.');
              var sc = await db.rpc('schedule_video', { p_id: VID.editing.id, p_at: new Date(at).toISOString() });
              if (sc.error) throw sc.error;
            } else {
              var un = await db.rpc('unpublish_video', { p_id: VID.editing.id });
              if (un.error) throw un.error;
            }
          }
        }
        if (!quiet) {
          var keep = VID.editing.id;
          await renderVideos();
          VID.editing = VID.rows.filter(function (r) { return r.id === keep; })[0] || VID.editing;
          drawVideos();       // re-renders, which re-baselines through videoMarkClean
        }
      } catch (e) {
        err.textContent = e.message || 'Could not save that.';
        throw e;
      } finally {
        if (!quiet) { VID.busy = false; if (btn) btn.disabled = false; }
      }
    }

    // ── PDF resources ───────────────────────────────────────────────────────
    // Each file uploads on its own and reports its own failure. One bad PDF
    // must not take the others down with it.
    function wireVideoResources() {
      var input = document.getElementById('vid-pdf-input');
      var drop = document.getElementById('vid-pdf-drop');
      var err = document.getElementById('vid-pdf-err');
      if (!input || !drop) return;

      var take = function (files) {
        [].slice.call(files || []).forEach(function (f) { uploadResource(f, err); });
      };
      input.addEventListener('change', function () { take(input.files); input.value = ''; });
      ['dragenter', 'dragover'].forEach(function (t) {
        drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
      });
      ['dragleave', 'drop'].forEach(function (t) {
        drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
      });
      drop.addEventListener('drop', function (e) { take(e.dataTransfer && e.dataTransfer.files); });

      document.querySelectorAll('.vid-res-del').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          if (btn.dataset.armed !== '1') {
            btn.dataset.armed = '1'; btn.classList.add('armed');
            btn.setAttribute('data-tooltip', 'Click again to remove');
            setTimeout(function () {
              btn.dataset.armed = '0'; btn.classList.remove('armed');
              btn.setAttribute('data-tooltip', 'Remove'); }, 3000);
            return;
          }
          var id = btn.closest('li').dataset.rid;
          var row = (VID.resources || []).filter(function (r) { return r.id === id; })[0];
          try {
            // the object first — a row without its file is recoverable, a
            // file with no row is invisible and bills forever
            if (row) await db.storage.from('video-resources').remove([row.storage_path]);
            var r = await db.from('video_resources').delete().eq('id', id);
            if (r.error) throw r.error;
            await loadVideoResources();
          } catch (e) { toast(e.message || 'Could not remove that'); }
        });
      });
    }

    async function uploadResource(file, err) {
      var v = VID.editing;
      if (!v || v._new) return;
      err.textContent = '';
      if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) {
        err.textContent = file.name + ' is not a PDF.'; return;
      }
      if (file.size > 26214400) { err.textContent = file.name + ' is over 25MB.'; return; }

      var host = document.getElementById('vid-resources');
      var tmp = document.createElement('p');
      tmp.className = 'nf-hint';
      tmp.textContent = 'Uploading ' + file.name + '…';
      host.appendChild(tmp);
      try {
        var id = (crypto.randomUUID && crypto.randomUUID()) ||
                 (Date.now().toString(36) + Math.random().toString(36).slice(2));
        var path = v.id + '/' + id + '.pdf';
        var up = await db.storage.from('video-resources')
          .upload(path, file, { contentType: 'application/pdf', upsert: false });
        if (up.error) throw up.error;
        var ins = await db.from('video_resources').insert({
          video_id: v.id, title: file.name.replace(/\.pdf$/i, ''),
          storage_path: path, file_name: file.name, file_size: file.size,
          sort_order: (VID.resources || []).length,
        });
        if (ins.error) {
          // do not leave a file nobody can see
          await db.storage.from('video-resources').remove([path]);
          throw ins.error;
        }
        await loadVideoResources();
      } catch (e) {
        err.textContent = 'Could not attach ' + file.name + ' — ' + (e.message || 'upload failed');
      } finally { tmp.remove(); }
    }

    // Straight to Supabase Storage, not through Mux — Mux stores video, and
    // a poster we chose has nothing to do with the asset.
    async function uploadThumbnail(file, err) {
      var v = VID.editing;
      if (!v || v._new) return;
      err.textContent = '';
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {
        err.textContent = 'That needs to be a JPG, PNG or WebP.'; return;
      }
      if (file.size > 5242880) { err.textContent = 'That image is over 5MB.'; return; }
      var host = document.getElementById('vid-thumb-preview');
      if (host) host.innerHTML = '<div class="vid-spinner" aria-label="Uploading"></div>';
      try {
        var ext = file.type === 'image/png' ? 'png' : file.type === 'image/webp' ? 'webp' : 'jpg';
        // one path per video, overwritten on replace, so old posters do not
        // pile up in the bucket unreferenced
        var path = v.id + '/thumbnail.' + ext;
        var up = await db.storage.from('video-thumbnails')
          .upload(path, file, { contentType: file.type, upsert: true });
        if (up.error) throw up.error;
        var pub = db.storage.from('video-thumbnails').getPublicUrl(path);
        // cache-bust: the path is stable, so a replaced image would otherwise
        // keep showing the old one
        var url = pub.data.publicUrl + '?v=' + Date.now().toString(36);
        var r = await db.from('videos')
          .update({ thumbnail_mode: 'custom', custom_thumbnail_url: url })
          .eq('id', v.id).select().single();
        if (r.error) throw r.error;
        VID.editing.custom_thumbnail_url = url;
        VID.editing.thumbnail_mode = 'custom';
        videoThumbPreview();
        toast('Thumbnail updated');
      } catch (e) {
        err.textContent = e.message || 'Could not upload that image.';
        videoThumbPreview();
      }
    }

    async function loadVideoResources() {
      var v = VID.editing; if (!v || v._new) return;
      var r = await db.from('video_resources').select('*').eq('video_id', v.id).order('sort_order');
      VID.resources = r.data || [];
      var host = document.getElementById('vid-resources');
      if (host) { host.innerHTML = videoResourceList(); wireVideoResources(); }
    }


    // ── preview ─────────────────────────────────────────────────────────────
    // The player bundles hls.js and weighs about a megabyte, so it is fetched
    // the first time a form with a ready video opens rather than on every
    // admin page load. Cached for the session after that.
    var muxPlayerReady = null;
    function loadMuxPlayer() {
      if (muxPlayerReady) return muxPlayerReady;
      muxPlayerReady = new Promise(function (resolve, reject) {
        if (window.customElements && customElements.get('mux-player')) return resolve();
        var sc = document.createElement('script');
        sc.src = 'lib/vendor/mux-player-v3.13.2.js';
        sc.onload = function () { resolve(); };
        sc.onerror = function () { muxPlayerReady = null; reject(new Error('Could not load the player')); };
        document.head.appendChild(sc);
      });
      return muxPlayerReady;
    }

    // The token comes from the server, which checks admin AND that there is
    // something to play. Nothing here decides who may watch — that lives in
    // canWatch() so the rule cannot drift between admin and member.
    async function previewVideo(btn, auto) {
      var v = VID.editing;
      var host = document.getElementById('vid-player');
      if (!v || !host) return;
      if (btn) btn.disabled = true;
      var was = btn ? btn.textContent : '';
      if (btn && !auto) { btn.textContent = 'Loading…'; host.classList.add('is-loading'); }
      try {
        var sess = await db.auth.getSession();
        var token = sess.data && sess.data.session && sess.data.session.access_token;
        var r = await fetch('/api/mux/playback-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ videoId: v.id }),
        });
        var out = await r.json();
        if (!r.ok) throw new Error(out.error || 'Could not start playback');

        // stills are signed too — keep the token so the thumbnail picker and
        // the list can render images at all
        if (out.thumbnailToken) {
          VID.editing.thumb_token = out.thumbnailToken;
          var listed = VID.rows.filter(function (x) { return x.id === VID.editing.id; })[0];
          if (listed) listed.thumb_token = out.thumbnailToken;
          videoThumbPreview();
        }

        await loadMuxPlayer();

        var el = document.createElement('mux-player');
        el.setAttribute('playback-id', out.playbackId);
        el.setAttribute('playback-token', out.playbackToken);
        if (out.thumbnailToken) el.setAttribute('thumbnail-token', out.thumbnailToken);
        el.setAttribute('stream-type', 'on-demand');
        el.setAttribute('metadata-video-title', v.title || '');
        el.setAttribute('metadata-video-id', v.id);
        // Mux Data attributes it to the admin, not a member, so previews do
        // not pollute the engagement numbers for this video.
        el.setAttribute('metadata-viewer-user-id', 'admin-preview');
        el.setAttribute('accent-color', getComputedStyle(document.documentElement)
          .getPropertyValue('--accent').trim() || '#7A3E70');
        host.innerHTML = '';
        host.classList.remove('is-loading');
        host.appendChild(el);
        if (btn) { btn.textContent = 'Reload'; btn.disabled = false; }
        if (typeof fsTrack === 'function') {
          fsTrack('admin_video_previewed', { resourceType: 'video', resourceId: v.id });
        }
      } catch (e) {
        host.classList.remove('is-loading');
        host.innerHTML = '<p class="nf-err">' + esc(e.message || 'Could not preview that.') + '</p>';
        if (btn) { btn.textContent = was === 'Loading…' ? 'Reload' : was; btn.disabled = false; }
      }
    }

    // Asks our server for a one-time Mux URL, then hands it to <mux-uploader>.
    // The file goes browser → Mux directly; it never passes through Vercel,
    // which is the only way a large class recording uploads at all.
    async function startVideoUpload(replace, file) {
      var v = VID.editing;
      var host = document.getElementById('vid-upload');
      var note = document.getElementById('vid-upload-note');
      if (!v || v._new || !host) return;
      host.innerHTML = '<p class="muted">Getting an upload link…</p>';
      try {
        var sess = await db.auth.getSession();
        var token = sess.data && sess.data.session && sess.data.session.access_token;
        var r = await fetch('/api/mux/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ videoId: v.id, replace: !!replace }),
        });
        var out = await r.json();
        if (!r.ok) throw new Error(out.error || 'Could not start the upload');

        // mux-uploader with NO chrome of its own: our drop zone already
        // collected the file, so it is driven through its API and only its
        // progress is surfaced, through our own bar.
        host.innerHTML =
          '<div class="vid-progress-wrap">' +
            '<div class="vid-bar"><span id="vid-bar-fill"></span></div>' +
            '<p id="vid-pct">Starting…</p>' +
            '<span class="nf-hint">Keep this tab open.</span>' +
          '</div>' +
          '<mux-uploader id="vid-mux" endpoint="' + esc(out.uploadUrl) + '" hidden></mux-uploader>';
        note.textContent = '';

        var up = document.getElementById('vid-mux');
        var fill = document.getElementById('vid-bar-fill');
        var pct = document.getElementById('vid-pct');
        up.addEventListener('progress', function (ev) {
          var p = Math.max(0, Math.min(100, Math.round(ev.detail || 0)));
          if (fill) fill.style.width = p + '%';
          if (pct) pct.textContent = p + '%';
        });
        // a file the drop zone already has never needs a second dialog
        if (file) { try { up.uploadFile ? up.uploadFile(file) : (up.file = file); } catch (_) {} }
        // leaving mid-upload loses the transfer — Mux has no resume for a
        // half-sent direct upload, so it is worth interrupting the admin for
        var guard = function (e) { e.preventDefault(); e.returnValue = ''; };
        window.addEventListener('beforeunload', guard);

        up.addEventListener('success', async function () {
          window.removeEventListener('beforeunload', guard);
          note.textContent = 'Uploaded. Mux is processing it now — this usually takes a few minutes.';
          // The webhook sets the real status; this only reflects what we know.
          await db.from('videos').update({ status: 'processing' }).eq('id', v.id);
          await renderVideos();
          VID.editing = VID.rows.filter(function (r) { return r.id === v.id; })[0] || null;
          if (VID.editing) drawVideos();
        });
        up.addEventListener('uploaderror', function (ev) {
          window.removeEventListener('beforeunload', guard);
          note.textContent = '';
          host.innerHTML = '<p class="nf-err">The upload failed. ' +
            esc((ev.detail && ev.detail.message) || '') + '</p>' +
            '<button class="btn-secondary" id="vid-start">Try again</button>';
          wireVideoForm();
        });
      } catch (e) {
        host.innerHTML = '<p class="nf-err">' + esc(e.message) + '</p>' +
          '<button class="btn-secondary" id="vid-start">Try again</button>';
        wireVideoForm();
      }
    }

    // ── Content › Video › Categories ────────────────────────────────────────
    async function renderVideoCategories() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var res = await db.from('video_categories').select('*').order('sort_order');
        if (res.error) throw res.error;
        VID.cats = res.data || [];
        drawVideoCategories();
      } catch (e) {
        b.innerHTML = /relation .* does not exist/i.test(e.message || '')
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Categories</h2></div>' +
            '<div class="adm-intro" style="margin:0">This needs <code>supabase/video-library.sql</code> run in Supabase.</div></div>'
          : stateError(e && e.message);
      }
    }

    function drawVideoCategories() {
      var b = bodyEl(); if (!b) return;
      var live = VID.cats.filter(function (c) { return c.status === 'active'; });
      b.innerHTML =
        '<div class="adm-explain"><p>How the library is grouped. A video needs a category before it can be published, and the order here is the order members will see.</p></div>' +
        '<div class="cat-controls"><input type="text" class="modal-input" id="vcat-name" maxlength="80" placeholder="New category name…" aria-label="New category name">' +
        '<button class="btn-secondary" id="vcat-add">Add</button><span class="nf-err" id="vcat-err"></span></div>' +
        '<div class="adm-panel" style="margin-top:16px"><div class="adm-panel-head"><h2>Categories</h2>' +
          '<span class="muted adm-mono">' + num(live.length) + '</span></div>' +
          (live.length
            ? '<div class="adm-scroll"><table class="adm-table"><thead><tr><th>Name</th><th>URL</th><th>Videos</th><th></th></tr></thead><tbody>' +
              live.map(function (c) {
                var used = VID.rows.filter(function (v) { return v.category_id === c.id; }).length;
                return '<tr data-cid="' + c.id + '">' +
                  '<td><strong>' + esc(c.name) + '</strong></td>' +
                  '<td class="muted adm-mono">' + esc(c.slug) + '</td>' +
                  '<td class="muted adm-mono">' + num(used) + '</td>' +
                  '<td class="adm-actcell"><button class="btn-icon adm-del vcat-del" data-tooltip="Archive" aria-label="Archive ' + esc(c.name) + '"><span class="material-symbols-sharp">delete</span></button></td>' +
                '</tr>';
              }).join('') + '</tbody></table></div>'
            : stateEmpty('No categories yet.')) +
        '</div>';
      wireVideoCategories();
    }

    function wireVideoCategories() {
      var b = bodyEl(); if (!b) return;
      var add = document.getElementById('vcat-add');
      var name = document.getElementById('vcat-name');
      var err = document.getElementById('vcat-err');
      if (add) add.addEventListener('click', async function () {
        if (VID.busy) return;
        var v = (name.value || '').trim();
        if (!v) { err.textContent = 'Give it a name.'; return; }
        VID.busy = true; add.disabled = true; err.textContent = '';
        try {
          var slugRes = await db.rpc('video_slugify', { p_text: v });
          var slug = slugRes.data || '';
          if (!slug) throw new Error('That name has no letters or numbers in it.');
          var r = await db.from('video_categories').insert({ name: v, slug: slug }).select().single();
          if (r.error) throw r.error;
          toast('Category added');
          name.value = '';
          await renderVideoCategories();
        } catch (e) {
          err.textContent = /duplicate key/i.test(e.message || '')
            ? 'There is already a category with that name.'
            : (e.message || 'Could not add that.');
        } finally { VID.busy = false; add.disabled = false; }
      });
      b.querySelectorAll('tr[data-cid] .vcat-del').forEach(function (btn) {
        var id = btn.closest('tr').dataset.cid;
        btn.addEventListener('click', async function () {
          if (btn.dataset.armed !== '1') {
            btn.dataset.armed = '1'; btn.classList.add('armed');
            btn.setAttribute('data-tooltip', 'Click again to archive');
            clearTimeout(btn._d);
            btn._d = setTimeout(function () {
              btn.dataset.armed = '0'; btn.classList.remove('armed');
              btn.setAttribute('data-tooltip', 'Archive'); }, 3000);
            return;
          }
          btn.disabled = true;
          try {
            // archived, never deleted — videos reference it, and the FK is
            // ON DELETE RESTRICT precisely so a category cannot vanish from
            // under them
            var r = await db.from('video_categories').update({ status: 'archived' }).eq('id', id);
            if (r.error) throw r.error;
            toast('Category archived'); await renderVideoCategories();
          } catch (e) { toast(e.message || 'Could not archive that'); btn.disabled = false; }
        });
      });
    }

    // ── Communications › Notifications ──────────────────────────────────────
    // Publishing is the only irreversible-feeling act in this admin — it puts
    // a badge on ~900 people's screens — so the composer keeps a live preview
    // of exactly what they will see, and publish is a two-step.
    var NOTIF_TYPES = [
      ['announcement',    'Announcement'],
      ['new_class',       'New class'],
      ['new_feature',     'New feature'],
      ['platform_update', 'Platform update'],
    ];
    var NF = { editing: null, rows: [], reach: {}, busy: false };

    // "142 of 880" beside a bar. The number leads because the percentage is
    // the thing that misleads — 50% of nine people is not a result. A draft
    // has no reach and says so with a dash rather than a persuasive zero.
    function notifReach(r) {
      if (r.status !== 'published') return '<span class="muted">—</span>';
      var x = NF.reach[r.id];
      if (!x) return '<span class="muted">—</span>';
      var pct = x.audience ? Math.round(x.reads / x.audience * 100) : 0;
      return '<div class="nf-reach" title="' + num(x.reads) + ' of ' + num(x.audience) +
             ' teachers have opened this">' +
        '<span class="nf-reach-n">' + num(x.reads) + '<span class="muted"> / ' + num(x.audience) + '</span></span>' +
        '<span class="nf-reach-bar"><span style="width:' + Math.min(100, pct) + '%"></span></span>' +
      '</div>';
    }

    function notifTypeLabel(t) {
      var m = NOTIF_TYPES.filter(function (x) { return x[0] === t; })[0];
      return m ? m[1] : 'Announcement';
    }
    // .adm-pill is the admin's badge — outlined, mono, uppercase, --rf radius.
    // Published is the only state that earns the accent: it is the one that
    // means "this is live in front of people". Draft and archived are quiet
    // by default, which is what the base pill already is.
    function notifStatusPill(s) {
      return '<span class="adm-pill' + (s === 'published' ? ' on' : '') + '">' + esc(s) + '</span>';
    }

    async function renderNotifs() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var res = await db.from('notifications').select('*').order('created_at', { ascending: false });
        if (res.error) throw res.error;
        NF.rows = res.data || [];
        // Reach is a separate migration. If it has not been run the table
        // still works — the column just stays quiet — rather than the whole
        // section failing over a number.
        NF.reach = {};
        try {
          var rr = await db.rpc('notification_reach');
          // `nid`, not notification_id — see the note in notifications-reach.sql
          if (!rr.error) (rr.data || []).forEach(function (x) {
            NF.reach[x.nid] = { reads: x.reads, audience: x.audience };
          });
        } catch (_) {}
        drawNotifs();
      } catch (e) {
        // the one error worth naming precisely: the table not existing yet
        b.innerHTML = /relation .* does not exist/i.test(e.message || '')
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Notifications</h2></div>' +
            '<div class="adm-intro" style="margin:0">This needs <code>supabase/notifications.sql</code> run in Supabase, then it’ll show here.</div></div>'
          : stateError(e && e.message);
      }
    }

    function drawNotifs(keepForm) {
      var b = bodyEl(); if (!b) return;
      var e = NF.editing;
      // Archived rows stay in the database — nothing is deleted, and the
      // reach numbers stay joinable — but they leave this table. Archiving is
      // how you take something back down, and a list of things you have taken
      // down is not what you came here to read.
      var shown = NF.rows.filter(function (r) { return r.status !== 'archived'; });
      var archivedCount = NF.rows.length - shown.length;
      b.innerHTML =
        '<div class="adm-explain">' +
          '<p>An announcement here appears in every teacher’s notification panel — the bell in their sidebar — the moment you publish it. There is no email and no push; it waits quietly until they look.</p>' +
          '<p>Drafts are invisible to teachers. Archiving takes a published notification back down and removes it from their unread count.</p>' +
        '</div>' +
        (e ? notifForm(e) : '<button class="btn-primary" id="nf-new">Write an announcement</button>') +
        '<div class="adm-panel" style="margin-top:20px"><div class="adm-panel-head"><h2>Notifications</h2>' +
          // no archived count here — the Archived panel below names it, and
          // saying it twice made this header read like a warning
          '<span class="muted adm-mono">' + num(shown.length) + '</span></div>' +
          (shown.length
            ? '<div class="adm-scroll"><table class="adm-table"><thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Read</th><th>Created</th><th>Published</th><th></th></tr></thead><tbody>' +
              shown.map(notifRow).join('') + '</tbody></table></div>'
            : stateEmpty('Nothing written yet.')) +
        '</div>' +
        // Archived sits below rather than mixed in: it is a record, not a
        // worklist. Delete is only offered here — a published notification
        // has to be taken down before it can be destroyed, which makes
        // "gone from everyone's panel" a separate decision from "gone".
        (archivedCount
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Archived</h2>' +
              '<span class="muted adm-mono">' + num(archivedCount) + '</span></div>' +
              '<div class="adm-intro" style="margin:2px 0 14px">Taken down. Teachers no longer see these and they count towards nobody’s unread. Deleting one removes it and its read history for good.</div>' +
              '<div class="adm-scroll"><table class="adm-table"><thead><tr><th>Title</th><th>Type</th><th>Published</th><th>Archived</th><th></th></tr></thead><tbody>' +
              NF.rows.filter(function (r) { return r.status === 'archived'; }).map(notifArchivedRow).join('') +
              '</tbody></table></div></div>'
          : '');
      wireNotifs();
      if (e && !keepForm) { var t = document.getElementById('nf-title'); if (t) t.focus(); }
    }

    function notifRow(r) {
      return '<tr data-nid="' + r.id + '">' +
        '<td><strong>' + esc(r.title) + '</strong></td>' +
        '<td class="muted adm-mono">' + esc(notifTypeLabel(r.notification_type)) + '</td>' +
        '<td>' + notifStatusPill(r.status) + '</td>' +
        '<td>' + notifReach(r) + '</td>' +
        '<td class="muted">' + esc(A.fmtDate(r.created_at)) + '</td>' +
        '<td class="muted">' + (r.published_at ? esc(A.fmtDate(r.published_at)) : '—') + '</td>' +
        '<td class="mus-actions">' +
          '<button class="btn-ghost nf-edit">Edit</button> ' +
          (r.status === 'draft'
            ? '<button class="btn-secondary nf-publish">Publish</button> ' +
              '<button class="btn-icon adm-del nf-del" data-tooltip="Delete" aria-label="Delete draft ' + esc(r.title) + '">' +
                '<span class="material-symbols-sharp">delete</span></button>'

              ? '<button class="btn-ghost nf-archive">Archive</button>'

              // only fires if that filter is ever relaxed — kept, because
              // publish_notification() already restores them correctly
              : '<button class="btn-secondary nf-publish">Restore</button>') +
        '</td></tr>';
    }

    // Same row shape as the live table minus the things that no longer apply:
    // no status pill (they are all archived), no reach (it stopped counting
    // when it came down).
    function notifArchivedRow(r) {
      return '<tr data-aid="' + r.id + '">' +
        '<td><strong>' + esc(r.title) + '</strong></td>' +
        '<td class="muted adm-mono">' + esc(notifTypeLabel(r.notification_type)) + '</td>' +
        '<td class="muted">' + (r.published_at ? esc(A.fmtDate(r.published_at)) : '—') + '</td>' +
        '<td class="muted">' + (r.archived_at ? esc(A.fmtDate(r.archived_at)) : '—') + '</td>' +
        '<td class="adm-actcell">' +
          '<button class="btn-icon adm-del" data-tooltip="Delete" aria-label="Delete ' + esc(r.title) + ' permanently">' +
            '<span class="material-symbols-sharp">delete</span></button>' +
        '</td></tr>';
    }

    function notifForm(e) {
      return '<div class="adm-panel nf-form">' +
        '<div class="adm-panel-head"><h2>' + (e.id ? 'Edit' : 'New announcement') + '</h2>' +
          '<button class="btn-ghost" id="nf-cancel">Cancel</button></div>' +
        '<div class="nf-grid">' +
          '<div class="nf-fields">' +
            '<label class="nf-label" for="nf-title">Title <span class="nf-req">required</span></label>' +
            '<input class="modal-input" id="nf-title" maxlength="120" value="' + esc(e.title || '') + '" placeholder="Sequencing tool is live">' +
            '<label class="nf-label" for="nf-msg">Message <span class="nf-req">required</span></label>' +
            '<textarea class="modal-input nf-msg" id="nf-msg" rows="5" maxlength="2000" placeholder="Line breaks are kept.">' + esc(e.message || '') + '</textarea>' +
            '<label class="nf-label" for="nf-type">Type</label>' +
            '<select class="modal-input" id="nf-type">' + NOTIF_TYPES.map(function (t) {
              return '<option value="' + t[0] + '"' + (e.notification_type === t[0] ? ' selected' : '') + '>' + t[1] + '</option>';
            }).join('') + '</select>' +
            '<label class="nf-label" for="nf-url">Link <span class="nf-opt">optional</span></label>' +
            // an in-app route is just its path — the same string the sidebar
            // uses — so there is nothing to look up or pick from
            '<input class="modal-input" id="nf-url" value="' + esc(e.link_url || '') + '" placeholder="your-flows   or   https://…">' +
            '<span class="nf-hint">An in-app page (<span class="adm-mono">your-flows</span>, <span class="adm-mono">playlist-builder</span>) or a full external URL.</span>' +
            '<label class="nf-label" for="nf-label-in">Link label</label>' +
            '<input class="modal-input" id="nf-label-in" maxlength="40" value="' + esc(e.link_label || '') + '" placeholder="Open Your Flows">' +
            '<div class="nf-actions">' +
              '<button class="btn-secondary" id="nf-save">Save draft</button>' +
              '<button class="btn-primary" id="nf-pub">' + (e.status === 'published' ? 'Save changes' : 'Publish now') + '</button>' +
              '<span class="nf-err" id="nf-err"></span>' +
            '</div>' +
          '</div>' +
          '<div class="nf-preview"><span class="nf-preview-cap">What teachers will see</span>' +
            '<div class="nf-preview-box" id="nf-preview"></div></div>' +
        '</div></div>';
    }

    function notifPreview() {
      var host = document.getElementById('nf-preview'); if (!host) return;
      var title = (document.getElementById('nf-title') || {}).value || '';
      var msg   = (document.getElementById('nf-msg') || {}).value || '';
      var type  = (document.getElementById('nf-type') || {}).value || 'announcement';
      var url   = (document.getElementById('nf-url') || {}).value || '';
      var label = (document.getElementById('nf-label-in') || {}).value || '';
      var href  = window.fsNotify ? fsNotify.safeHref(url) : null;

      // Rendered by the panel's OWN item renderer, so the preview cannot drift
      // from the thing it previews. `expanded` because a preview that hid the
      // message you are typing would be useless.
      var markup = (window.fsNotifyPanel && fsNotifyPanel.renderItem)
        ? fsNotifyPanel.renderItem({
            id: 0,
            title: title || 'Your title',
            message: msg || 'Your message.',
            notification_type: type,
            link_url: url, link_label: label,
            published_at: new Date().toISOString(),
            is_read: false,
          }).replace('class="fs-np-item unread"', 'class="fs-np-item unread expanded"')
        : '<p class="muted">Preview unavailable.</p>';

      host.innerHTML = markup +
        (url && !href ? '<p class="nf-err" style="margin:8px 0 0">That link isn’t a page or a URL we can open.</p>' : '');
      // the composer is not the panel: nothing here should navigate or toggle
      host.querySelectorAll('a').forEach(function (a) {
        a.removeAttribute('href'); a.style.cursor = 'default';
      });
      var art = host.querySelector('.fs-np-item');
      if (art) { art.removeAttribute('tabindex'); art.removeAttribute('role'); }
    }

    function notifRead() {
      return {
        title: (document.getElementById('nf-title').value || '').trim(),
        message: (document.getElementById('nf-msg').value || '').trim(),
        notification_type: document.getElementById('nf-type').value,
        link_url: (document.getElementById('nf-url').value || '').trim() || null,
        link_label: (document.getElementById('nf-label-in').value || '').trim() || null,
      };
    }

    // Validation lives here rather than in the buttons so "save" and "publish"
    // cannot drift apart on what counts as complete.
    function notifValidate(v) {
      if (!v.title) return 'A title is required.';
      if (!v.message) return 'A message is required.';
      if (v.link_url && window.fsNotify && !fsNotify.safeHref(v.link_url))
        return 'That link isn’t a page or a URL we can open.';
      if (v.link_label && !v.link_url) return 'A link label needs a link.';
      return null;
    }

    async function notifSave(publish) {
      if (NF.busy) return;                       // the double-click guard
      var v = notifRead();
      var bad = notifValidate(v);
      var errEl = document.getElementById('nf-err');
      if (bad) { if (errEl) errEl.textContent = bad; return; }
      if (errEl) errEl.textContent = '';
      NF.busy = true;
      ['nf-save', 'nf-pub'].forEach(function (id) {
        var el = document.getElementById(id); if (el) el.disabled = true;
      });
      try {
        var id = NF.editing && NF.editing.id;
        if (id) {
          var up = await db.from('notifications').update(v).eq('id', id).select().single();
          if (up.error) throw up.error;
        } else {
          var ins = await db.from('notifications').insert(v).select().single();
          if (ins.error) throw ins.error;
          id = ins.data.id;
          if (typeof fsTrack === 'function')
            fsTrack('admin_notification_created', { resourceType: 'notification', resourceId: id,
                                                    metadata: { type: v.notification_type } });
        }
        if (publish) {
          var pub = await db.rpc('publish_notification', { p_id: Number(id) });
          if (pub.error) throw pub.error;
          if (typeof fsTrack === 'function')
            fsTrack('admin_notification_published', { resourceType: 'notification', resourceId: id,
                                                      metadata: { type: v.notification_type } });
          // your own bell is one of the ones that just changed — without this
          // it keeps its pre-publish count until a reload
          if (window.fsNotify) fsNotify.unreadCount(true);
          toast('Published — it’s in everyone’s panel now');
        } else {
          toast('Draft saved');
        }
        NF.editing = null;
        await renderNotifs();
      } catch (err) {
        if (errEl) errEl.textContent = (err && err.message) || 'Could not save that.';
      } finally {
        NF.busy = false;
        ['nf-save', 'nf-pub'].forEach(function (id2) {
          var el = document.getElementById(id2); if (el) el.disabled = false;
        });
      }
    }

    function wireNotifs() {
      var b = bodyEl(); if (!b || b.dataset.nfWired === '1') { /* re-bind below */ }
      var nw = document.getElementById('nf-new');
      if (nw) nw.addEventListener('click', function () {
        NF.editing = { notification_type: 'announcement' }; drawNotifs();
      });
      var cancel = document.getElementById('nf-cancel');
      if (cancel) cancel.addEventListener('click', function () { NF.editing = null; drawNotifs(); });

      ['nf-title', 'nf-msg', 'nf-type', 'nf-url', 'nf-label-in'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', notifPreview);
        if (el && el.tagName === 'SELECT') el.addEventListener('change', notifPreview);
      });
      if (document.getElementById('nf-preview')) notifPreview();

      var save = document.getElementById('nf-save');
      if (save) save.addEventListener('click', function () { notifSave(false); });
      var pub = document.getElementById('nf-pub');
      if (pub) pub.addEventListener('click', function () { notifSave(true); });

      // row actions — delegated, and armed twice for anything destructive,
      // the same two-step the catalogue's Remove uses
      b.querySelectorAll('tr[data-nid]').forEach(function (tr) {
        var id = Number(tr.dataset.nid);
        var row = NF.rows.filter(function (r) { return r.id === id; })[0];
        var ed = tr.querySelector('.nf-edit');
        if (ed) ed.addEventListener('click', function () { NF.editing = Object.assign({}, row); drawNotifs(); });
        var pb = tr.querySelector('.nf-publish');
        if (pb) pb.addEventListener('click', async function () {
          if (NF.busy) return; NF.busy = true; pb.disabled = true;
          try {
            var r = await db.rpc('publish_notification', { p_id: id });
            if (r.error) throw r.error;
            if (typeof fsTrack === 'function')
              fsTrack('admin_notification_published', { resourceType: 'notification', resourceId: id });
            if (window.fsNotify) fsNotify.unreadCount(true);
            toast('Published'); await renderNotifs();
          } catch (e) { toast((e && e.message) || 'Could not publish'); pb.disabled = false; }
          finally { NF.busy = false; }
        });
        var ar = tr.querySelector('.nf-archive');
        if (ar) ar.addEventListener('click', async function () {
          if (ar.dataset.armed !== '1') {
            ar.dataset.armed = '1'; ar.textContent = 'Really archive?'; ar.classList.add('mus-del-armed'); return;
          }
          try {
            var r = await db.rpc('archive_notification', { p_id: id });
            if (r.error) throw r.error;
            if (typeof fsTrack === 'function')
              fsTrack('admin_notification_archived', { resourceType: 'notification', resourceId: id });
            // archiving takes it off the badge too, not just out of the list
            if (window.fsNotify) fsNotify.unreadCount(true);
            toast('Archived — it’s off everyone’s panel'); await renderNotifs();
          } catch (e) { toast((e && e.message) || 'Could not archive'); }
        });
        // same icon + .armed pattern as the archived table below and the
        // feedback table elsewhere — one delete affordance in this admin
        var dl = tr.querySelector('.nf-del');
        if (dl) dl.addEventListener('click', async function () {
          if (dl.dataset.armed !== '1') {
            dl.dataset.armed = '1'; dl.classList.add('armed');
            dl.setAttribute('data-tooltip', 'Click again to delete');
            clearTimeout(dl._disarm);
            dl._disarm = setTimeout(function () {
              dl.dataset.armed = '0'; dl.classList.remove('armed');
              dl.setAttribute('data-tooltip', 'Delete');
            }, 3000);
            return;
          }
          dl.disabled = true;
          try {
            var r = await db.from('notifications').delete().eq('id', id);
            if (r.error) throw r.error;
            toast('Draft deleted'); await renderNotifs();
          } catch (e) {
            toast((e && e.message) || 'Could not delete');
            dl.disabled = false; dl.dataset.armed = '0';
            dl.classList.remove('armed'); dl.setAttribute('data-tooltip', 'Delete');
          }
        });
      });
      // archived rows: permanent delete, using the admin's own icon pattern —
      // arm on first click, disarm after 3s, exactly as the feedback table does
      b.querySelectorAll('tr[data-aid] .adm-del').forEach(function (btn) {
        var id = Number(btn.closest('tr').dataset.aid);
        btn.addEventListener('click', async function () {
          if (btn.dataset.armed === '1') {
            btn.disabled = true;
            try {
              // notification_reads cascades on the foreign key, so the read
              // history goes with it rather than being orphaned
              var r = await db.from('notifications').delete().eq('id', id);
              if (r.error) throw r.error;
              toast('Deleted for good');
              await renderNotifs();
            } catch (e) {
              toast((e && e.message) || 'Could not delete that');
              btn.disabled = false; btn.dataset.armed = '0';
              btn.classList.remove('armed'); btn.setAttribute('data-tooltip', 'Delete');
            }
            return;
          }
          btn.dataset.armed = '1'; btn.classList.add('armed');
          btn.setAttribute('data-tooltip', 'Click again to delete');
          clearTimeout(btn._disarm);
          btn._disarm = setTimeout(function () {
            btn.dataset.armed = '0'; btn.classList.remove('armed');
            btn.setAttribute('data-tooltip', 'Delete');
          }, 3000);
        });
      });

      // One click anywhere else disarms, so an armed button never lingers.
      // Two kinds live here now: text buttons that swap their label, and icon
      // buttons whose label IS a child <span>. Writing textContent to the
      // second kind would delete the glyph and leave a bare word behind.
      b.addEventListener('click', function (ev) {
        b.querySelectorAll('[data-armed="1"]').forEach(function (o) {
          if (o === ev.target || o.contains(ev.target)) return;
          o.dataset.armed = '';
          clearTimeout(o._disarm);
          if (o.querySelector('.material-symbols-sharp')) {
            o.classList.remove('armed');
            o.setAttribute('data-tooltip', 'Delete');
          } else {
            o.classList.remove('mus-del-armed');
            o.textContent = 'Archive';
          }
        });
      });
    }

    // ── the landing page ────────────────────────────────────────────────────
    // A menu that only lists its options is a toll on the way to work. These
    // cards carry the state of the thing behind them, so the page answers
    // "is there anything for me?" without being entered.
    // Name, one line about what it is for, and a way in. The cards used to
    // carry a number and a contents list; at three doors you are not counting
    // and you are not choosing by inventory — the label already tells you.
    function renderHome() {
      var b = bodyEl();
      if (!b) return;
      b.innerHTML =
        '<p class="adm-intro">Three areas. Analytics is for reading, Content and Communications are for changing.</p>' +
        '<div class="adm-areas">' + AREAS.map(function (a) {
          // a real href, so cmd-click and the status bar behave; no click
          // handler needed, which means no way for one to go missing
          return '<a class="adm-area" href="#' + a.home + '">' +
            '<h2 class="adm-area-name">' + esc(a.label) + '</h2>' +
            '<p class="adm-area-blurb">' + esc(a.blurb) + '</p>' +
            '<span class="adm-area-cta">Open<span class="material-symbols-sharp">arrow_forward</span></span>' +
          '</a>';
        }).join('') + '</div>';
    }

    // ── router ──
    function route() {
      var id = (location.hash || '#home').slice(1);
      var sec = SECTIONS.filter(function (s) { return s.id === id; })[0] || SECTIONS[0];
      // 'home' belongs to no group; groupOf() would fall through to Overview
      // and a later Overview pill click would land back on the landing page
      if (sec.id !== 'home') groupLast[groupOf(sec.id).label] = sec.id;
      shell(sec.id);
      // every tab carries the "Updated …" stamp. Overview fills it from the
      // server snapshot time (generated_at) inside its own render; for the
      // rest, stamp the load time here once their data has come in.
      Promise.resolve(sec.render()).then(function () {
        var u = document.getElementById('adm-updated');
        if (u && !u.textContent) u.textContent = 'Updated ' + A.fmtDateTime(new Date());
      });
    }
    window.addEventListener('hashchange', route);

    // Tables arrive at three different times — with the section render, from a
    // panel that loads after it (loadTools, loadSignups), and in the user
    // drawer. Rather than calling admSortable at each of those ~28 sites, watch
    // and upgrade whatever appears. Idempotent, so the observer re-firing on
    // admSortable's own edits settles immediately.
    //
    // OBSERVE document.body, NOT #adm-body: that element doesn't exist yet when
    // this runs (shell() builds it), and shell() REPLACES it on every route —
    // so an observer bound to it would either never attach or go stale on the
    // first tab change. document.body is the only node that outlives both.
    (function () {
      if (!window.MutationObserver) { admSortable(document); return; }
      var queued = false;
      new MutationObserver(function () {
        if (queued) return;              // coalesce a render's burst into one pass
        queued = true;
        requestAnimationFrame(function () { queued = false; admSortable(document); });
      }).observe(document.body, { childList: true, subtree: true });
      admSortable(document);
    })();

    // ── shared chart tooltip — styled pill, animated, positioned above the bar ──
    (function () {
      var tt = document.createElement('div');
      tt.className = 'adm-tt';
      tt.setAttribute('aria-hidden', 'true');
      document.body.appendChild(tt);
      var SEL = '.suc-col[data-tip], .adm-spk-col[data-tip], .adm-hm[data-tip], .adm-tbar-fill[data-tip], .adm-info[data-tip], .adm-thinfo[data-tip]';
      function show(el) {
        var tip = el.getAttribute('data-tip');
        if (!tip) return;
        tt.textContent = tip;
        var r = el.getBoundingClientRect();
        var tw = tt.offsetWidth, th = tt.offsetHeight;   // measured while hidden (still laid out)
        var left = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 8));
        var above = r.top - th - 8;
        var below = above < 8;
        tt.style.left = left + 'px';
        tt.style.top = (below ? r.bottom + 8 : above) + 'px';
        tt.classList.toggle('below', below);
        tt.classList.add('on');
      }
      function hide() { tt.classList.remove('on'); }
      document.addEventListener('pointerover', function (e) {
        var el = e.target && e.target.closest ? e.target.closest(SEL) : null;
        if (el) show(el);
      });
      document.addEventListener('pointerout', function (e) {
        var el = e.target && e.target.closest ? e.target.closest(SEL) : null;
        if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) hide();
      });
      window.addEventListener('scroll', hide, true);
    })();

    // ── boot: gate on admin (server truth) ──
    (async function boot() {
      // sync.js already redirected to /login if there was no session.
      try { if (window.fsSync && window.fsSync.ready) await window.fsSync.ready; } catch (_) {}
      var ok = await A.isAdmin();
      if (!ok) {
        root.innerHTML = '<div class="adm-denied"><span class="material-symbols-sharp">visibility_lock</span>' +
          '<h1>Not authorized</h1><p>This area is for Flow School administrators. If you believe you should have access, ask an existing admin to add you.</p>' +
          '<p style="margin-top:16px"><a class="btn-secondary" href="dashboard">Back to dashboard</a></p></div>';
        return;
      }
      route();
    })();
  })();
  </script>
</body>
</html>
