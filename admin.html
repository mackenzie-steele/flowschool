            '<ul class="lib-list">' +
            RES.rows.map(function (r) {
              var editing = RES.editingId === r.id;
              if (editing) {
                return '<li class="lib-row" data-rid="' + r.id + '" style="cursor:default">' +
                  '<span class="lib-thumb lib-thumb-doc" data-thumb="' + r.id + '"><span class="material-symbols-sharp">note_add</span></span>' +
                  '<span class="lib-main">' +
                    '<input class="modal-input" id="res-edit-title" value="' + esc(r.title) + '" maxlength="120" aria-label="Title">' +
                    '<input class="modal-input" id="res-edit-desc" value="' + esc(r.description || '') + '" maxlength="300" placeholder="Description (optional)" aria-label="Description" style="margin-top:6px">' +
                  '</span>' +
                  '<span class="lib-side">' +
                    '<button class="btn-secondary res-save">Save</button>' +
                    '<button class="btn-ghost res-cancel">Cancel</button>' +
                  '</span>' +
                '</li>';
              }
              var meta = [
                r.file_name || r.storage_path.split('/').pop(),
                r.file_size ? Math.round(r.file_size / 1024) + 'KB' : null,
                'Uploaded ' + A.fmtDate(r.created_at),
                resourceUsageLabel(r.id),
              ].filter(Boolean);
              return '<li class="lib-row" data-rid="' + r.id + '" tabindex="0" role="button" aria-label="Open ' + esc(r.title) + '">' +
                '<span class="lib-thumb lib-thumb-doc" data-thumb="' + r.id + '"><span class="material-symbols-sharp">note_add</span></span>' +
                '<span class="lib-main">' +
                  '<span class="lib-title">' + esc(r.title) + '</span>' +
                  (r.description ? '<span class="lib-note">' + esc(r.description) + '</span>' : '') +
                  '<span class="lib-meta">' + esc(meta.join(' · ')) + '</span>' +
                '</span>' +
                '<span class="lib-side">' +
                  (r.status === 'archived' ? '<span class="adm-pill">Archived</span>' : '') +
                  '<button class="btn-icon res-open" data-tooltip="Open the PDF" aria-label="Open ' + esc(r.title) + '">' +
                    '<span class="material-symbols-sharp">open_in_new</span></button>' +
                  '<button class="btn-icon res-edit" data-tooltip="Rename" aria-label="Rename ' + esc(r.title) + '">' +
                    '<span class="material-symbols-sharp">edit</span></button>' +
                  '<button class="btn-icon adm-del res-del" data-tooltip="Delete" aria-label="Delete ' + esc(r.title) + '">' +
                    '<span class="material-symbols-sharp">delete</span></button>' +
                '</span>' +
              '</li>';
            }).join('') + '</ul>'
          : '<div class="adm-state"><span class="adm-state-ico"><span class="material-symbols-sharp">note_add</span></span>' +
            '<h3>No files yet</h3>' +
            '<p>Drop a PDF above, or attach one from any video or collection — it lands in this library either way.</p></div>');
      wireResourceLibrary();
      loadResourceThumbs();
    }

    // ── PDF thumbnails: the document shows its own face ────────────────────
    // The first page renders ONCE, then lives in storage beside the file —
    // 'library/<id>.pdf' owns 'library/<id>.png'. Every later visit is a
    // signed-URL fetch of a small image, never a re-render of the PDF.
    var pdfjsReady = null;
    function loadPdfjs() {
      if (!pdfjsReady) {
        pdfjsReady = import('./lib/vendor/pdf-v6.2.108.min.mjs').then(function (m) {
          m.GlobalWorkerOptions.workerSrc = './lib/vendor/pdf.worker-v6.2.108.min.mjs';
          return m;
        });
      }
      return pdfjsReady;
    }
    function resourceThumbPath(row) {
      return row.storage_path.replace(/\.pdf$/i, '') + '.png';
    }
    function setResourceThumb(id, url) {
      RES.thumbs[id] = url;
      document.querySelectorAll('[data-thumb="' + id + '"]').forEach(function (el) {
        el.innerHTML = '<img src="' + url + '" alt="" loading="lazy">';
      });
    }

    async function loadResourceThumbs() {
      var rows = RES.rows; if (!rows.length) return;
      // whatever this session already resolved paints straight away
      rows.forEach(function (r) { if (RES.thumbs[r.id]) setResourceThumb(r.id, RES.thumbs[r.id]); });
      var want = rows.filter(function (r) { return !RES.thumbs[r.id]; });
      if (!want.length) return;
      try {
        var got = await db.storage.from('video-resources')
          .createSignedUrls(want.map(resourceThumbPath), 3600);
        var missing = [];
        (got.data || []).forEach(function (s, i) {
          if (s.signedUrl && !s.error) setResourceThumb(want[i].id, s.signedUrl);
          else missing.push(want[i]);
        });
        // files from before thumbnails existed grow one now, one at a time
        for (var i = 0; i < missing.length; i++) {
          try { setResourceThumb(missing[i].id, await makeResourceThumb(missing[i])); }
          catch (e) { console.warn('thumb failed for', missing[i].file_name, e); }
        }
      } catch (e) { console.warn('thumbs unavailable', e); }
    }

    async function makeResourceThumb(row) {
      var pdfjs = await loadPdfjs();
      var s = await db.storage.from('video-resources').createSignedUrl(row.storage_path, 600);
      if (s.error) throw s.error;
      var task = pdfjs.getDocument({ url: s.data.signedUrl });
      var pdf = await task.promise;
      try {
        var page = await pdf.getPage(1);
        var vp = page.getViewport({ scale: 240 / page.getViewport({ scale: 1 }).width });
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(vp.width);
        canvas.height = Math.round(vp.height);
        var ctx = canvas.getContext('2d');
        // a transparent-background page still reads as paper
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
      } finally { task.destroy(); }
      var blob = await new Promise(function (res) { canvas.toBlob(res, 'image/png'); });
      if (blob) {
        var up = await db.storage.from('video-resources')
          .upload(resourceThumbPath(row), blob, { contentType: 'image/png', upsert: true });
        if (up.error) console.warn('thumb not cached', up.error);
      }
      return canvas.toDataURL('image/png');
    }

    // the bucket is private; a short-lived signed URL is how an admin looks
    // at the actual file rather than just its title
    async function openResourceFile(id) {
      var row = RES.rows.filter(function (r) { return r.id === id; })[0];
      if (!row) return;
      try {
        var s = await db.storage.from('video-resources').createSignedUrl(row.storage_path, 600);
        if (s.error) throw s.error;
        window.open(s.data.signedUrl, '_blank', 'noopener');
      } catch (e) { toast(e.message || 'Could not open that file'); }
    }

    function wireResourceLibrary() {
      var b = bodyEl(); if (!b) return;
      var input = document.getElementById('res-input');
      var drop = document.getElementById('res-drop');
      var err = document.getElementById('res-err');
      if (input && drop) {
        var take = function (files) {
          [].slice.call(files || []).forEach(async function (f) {
            if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) {
              err.textContent = f.name + ' is not a PDF.'; return;
            }
            if (f.size > 26214400) { err.textContent = f.name + ' is over 25MB.'; return; }
            try {
              var id = (crypto.randomUUID && crypto.randomUUID()) ||
                       (Date.now().toString(36) + Math.random().toString(36).slice(2));
              var path = 'library/' + id + '.pdf';
              var up = await db.storage.from('video-resources')
                .upload(path, f, { contentType: 'application/pdf', upsert: false });
              if (up.error) throw up.error;
              var ins = await db.from('resources').insert({
                title: f.name.replace(/\.pdf$/i, ''),
                storage_path: path, file_name: f.name, file_size: f.size,
              });
              if (ins.error) {
                await db.storage.from('video-resources').remove([path]);
                throw ins.error;
              }
              await renderResourceLibrary();
            } catch (e) {
              err.textContent = 'Could not upload ' + f.name + ' — ' + (e.message || 'failed');
            }
          });
        };
        input.addEventListener('change', function () { take(input.files); input.value = ''; });
        ['dragenter', 'dragover'].forEach(function (t) {
          drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
        });
        ['dragleave', 'drop'].forEach(function (t) {
          drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
        });
        drop.addEventListener('drop', function (e) { take(e.dataTransfer && e.dataTransfer.files); });
      }

      b.querySelectorAll('.lib-row[data-rid]').forEach(function (tr) {
        var id = tr.dataset.rid;
        // the row opens the file itself — the title is the document, so
        // clicking it shows the document; metadata edits are the pencil
        if (!tr.querySelector('.res-save')) {
          tr.addEventListener('click', function (e) {
            if (e.target.closest('button')) return;
            openResourceFile(id);
          });
          tr.addEventListener('keydown', function (e) {
            if (e.target !== tr) return;
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openResourceFile(id); }
          });
        }
        var openBtn = tr.querySelector('.res-open');
        if (openBtn) openBtn.addEventListener('click', function () { openResourceFile(id); });
        var edit = tr.querySelector('.res-edit');
        if (edit) edit.addEventListener('click', function () { RES.editingId = id; drawResourceLibrary(); });
        var cancel = tr.querySelector('.res-cancel');
        if (cancel) cancel.addEventListener('click', function () { RES.editingId = null; drawResourceLibrary(); });
        var save = tr.querySelector('.res-save');
        if (save) save.addEventListener('click', async function () {
          var title = (document.getElementById('res-edit-title').value || '').trim();
          if (!title) { toast('Give it a title.'); return; }
          var desc = (document.getElementById('res-edit-desc').value || '').trim() || null;
          try {
            var r = await db.from('resources').update({ title: title, description: desc }).eq('id', id);
            if (r.error) throw r.error;
            RES.editingId = null;
            await renderResourceLibrary();
          } catch (e) { toast(e.message || 'Could not save that'); }
        });
        var del = tr.querySelector('.res-del');
        if (del) del.addEventListener('click', async function () {
          var used = resourceUsage(id).length;
          if (del.dataset.armed !== '1') {
            del.dataset.armed = '1'; del.classList.add('armed');
            del.setAttribute('data-tooltip', used
              ? 'Attached to ' + used + ' piece' + (used === 1 ? '' : 's') + ' of content — click again to delete anyway'
              : 'Click again to delete');
            clearTimeout(del._d);
            del._d = setTimeout(function () {
              del.dataset.armed = '0'; del.classList.remove('armed');
              del.setAttribute('data-tooltip', 'Delete'); }, 4000);
            return;
          }
          var row = RES.rows.filter(function (r) { return r.id === id; })[0];
          try {
            // the object first — a row without its file is recoverable, a
            // file with no row is invisible and bills forever
            if (row) await db.storage.from('video-resources').remove([row.storage_path, resourceThumbPath(row)]);
            var r = await db.from('resources').delete().eq('id', id);
            if (r.error) throw r.error;
            toast(used ? 'Deleted — it is gone from ' + used + ' piece' + (used === 1 ? '' : 's') + ' of content' : 'Deleted');
            await renderResourceLibrary();
          } catch (e) { toast(e.message || 'Could not delete that'); }
        });
      });
    }

    // ── Content › Video › Filters ───────────────────────────────────────────
    // Bonnie defines the taxonomy: a filter is a question (Movement Focus),
    // its options are the answers (Hips, Shoulders…). Values attach in the
    // video and collection editors. Nothing here is hard-coded yoga.
    var FIL = { filters: [], options: [], counts: {}, busy: false };

    async function renderFilterAdmin() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var got = await Promise.all([
          db.from('filters').select('*').order('sort_order').order('created_at'),
          db.from('filter_options').select('*').order('sort_order').order('created_at'),
          db.from('content_filter_values').select('option_id'),
        ]);
        var err = got.filter(function (r) { return r.error; })[0];
        if (err) throw err.error;
        FIL.filters = (got[0].data || []).filter(function (f) { return f.status === 'active'; });
        FIL.options = (got[1].data || []).filter(function (o) { return o.status === 'active'; });
        FIL.counts = {};
        (got[2].data || []).forEach(function (v) {
          FIL.counts[v.option_id] = (FIL.counts[v.option_id] || 0) + 1;
        });
        drawFilterAdmin();
      } catch (e) {
        b.innerHTML = /relation .* does not exist/i.test(e.message || '')
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Filters</h2></div>' +
            '<div class="adm-intro" style="margin:0">This needs <code>supabase/video-collections.sql</code> run in Supabase.</div></div>'
          : stateError(e && e.message);
      }
    }

    function drawFilterAdmin() {
      var b = bodyEl(); if (!b) return;
      b.innerHTML =
        '<div class="cat-controls lib-bar">' +
          '<button class="btn-primary" id="fil-new">New filter</button>' +
          '<span class="adm-count">' + num(FIL.filters.length) + (FIL.filters.length === 1 ? ' filter' : ' filters') + '</span>' +
        '</div>' +
        (FIL.filters.length
          ? FIL.filters.map(function (f) {
              var opts = FIL.options.filter(function (o) { return o.filter_id === f.id; });
              return '<div class="adm-panel fil-panel" data-fid="' + f.id + '">' +
                '<div class="adm-panel-head">' +
                  // the name IS the field — click it, type, done. A filter
                  // has no detail page, so it renames where it lives.
                  '<h2><input class="fil-name-input" value="' + esc(f.name) + '" maxlength="80" aria-label="Filter name"></h2>' +
                  '<span class="fil-count">' + num(opts.length) + (opts.length === 1 ? ' option' : ' options') + '</span>' +
                  '<button class="btn-icon adm-del fil-del" data-tooltip="Archive filter" aria-label="Archive ' + esc(f.name) + '">' +
                    '<span class="material-symbols-sharp">delete</span></button></div>' +
                '<div class="col-chips">' +
                  opts.map(function (o) {
                    var n = FIL.counts[o.id] || 0;
                    return '<span class="col-chip on" data-oid="' + o.id + '"' +
                      (n ? ' data-tooltip="On ' + n + ' piece' + (n === 1 ? '' : 's') + ' of content"' : '') + '>' + esc(o.name) +
                      (n ? ' <span class="chip-n">' + n + '</span>' : '') +
                      '<button type="button" class="vid-tag-x fil-opt-del" aria-label="Archive option ' + esc(o.name) + '">' +
                        '<span class="material-symbols-sharp">close</span></button></span>';
                  }).join('') +
                  (opts.length ? '' : '<span class="nf-hint" style="margin:0">No options yet — a filter with no answers never shows to members.</span>') +
                '</div>' +
                '<div class="vid-newcat-row" style="margin-top:12px">' +
                  '<input class="modal-input fil-opt-name" maxlength="80" placeholder="Add an option — e.g. Hips" aria-label="New option for ' + esc(f.name) + '">' +
                  '<button class="btn-ghost fil-opt-add" type="button">Add</button>' +
                '</div>' +
              '</div>';
            }).join('')
          : '<div class="adm-state"><span class="adm-state-ico"><span class="material-symbols-sharp">checklist</span></span>' +
            '<h3>No filters yet</h3>' +
            '<p>Start with the ones members will actually use — Experience Level, Class Placement, Movement Focus.</p></div>');
      wireFilterAdmin();
    }

    function wireFilterAdmin() {
      var b = bodyEl(); if (!b) return;
      // New creates the filter immediately and hands you its name field —
      // no form before the thing itself
      var nw = document.getElementById('fil-new');
      if (nw) nw.addEventListener('click', async function () {
        if (FIL.busy) return;
        FIL.busy = true; nw.disabled = true;
        try {
          var name = 'New filter', n = 2;
          while (FIL.filters.some(function (f) { return f.name.toLowerCase() === name.toLowerCase(); })) {
            name = 'New filter ' + n++;
          }
          var sl = await db.rpc('video_slugify', { p_text: name });
          var r = await db.from('filters').insert({
            name: name, slug: sl.data, sort_order: FIL.filters.length }).select().single();
          if (r.error && /duplicate/i.test(r.error.message || '')) {
            // an archived filter may still hold the slug — suffix and move on
            r = await db.from('filters').insert({
              name: name, slug: sl.data + '-' + Date.now().toString(36),
              sort_order: FIL.filters.length }).select().single();
          }
          if (r.error) throw r.error;
          FIL.busy = false;
          await renderFilterAdmin();
          var fresh = document.querySelector('[data-fid="' + r.data.id + '"] .fil-name-input');
          if (fresh) { fresh.focus(); fresh.select(); }
          return;
        } catch (e) {
          toast(e.message || 'Could not create that.');
          FIL.busy = false; nw.disabled = false;
        }
      });

      // renames save themselves on blur (Enter just blurs)
      b.querySelectorAll('.fil-name-input').forEach(function (inp) {
        var fid = inp.closest('[data-fid]').dataset.fid;
        var was = inp.value;
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
          if (e.key === 'Escape') { inp.value = was; inp.blur(); }
        });
        inp.addEventListener('blur', async function () {
          var v = (inp.value || '').trim();
          if (!v || v === was) { inp.value = was; return; }
          try {
            var r = await db.from('filters').update({ name: v }).eq('id', fid);
            if (r.error) throw r.error;
            was = v;
            var f = FIL.filters.filter(function (x) { return x.id === fid; })[0];
            if (f) f.name = v;
          } catch (e) {
            inp.value = was;
            toast(/duplicate/i.test((e && e.message) || '')
              ? 'There is already a filter with that name.' : (e.message || 'Could not rename that'));
          }
        });
      });

      b.querySelectorAll('[data-fid]').forEach(function (panel) {
        var fid = panel.dataset.fid;
        var optAdd = panel.querySelector('.fil-opt-add');
        var optName = panel.querySelector('.fil-opt-name');
        var addOpt = async function () {
          var v = (optName.value || '').trim();
          if (!v) return;
          optAdd.disabled = true;
          try {
            var sl = await db.rpc('video_slugify', { p_text: v });
            var have = FIL.options.filter(function (o) { return o.filter_id === fid; });
            var r = await db.from('filter_options').insert({
              filter_id: fid, name: v, slug: sl.data, sort_order: have.length });
            if (r.error) throw r.error;
            await renderFilterAdmin();
          } catch (e) {
            toast(/duplicate/i.test(e.message || '') ? 'That option already exists.' : (e.message || 'Could not add that'));
            optAdd.disabled = false;
          }
        };
        if (optAdd) optAdd.addEventListener('click', addOpt);
        if (optName) optName.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); addOpt(); }
        });

        var del = panel.querySelector('.fil-del');
        if (del) del.addEventListener('click', async function () {
          if (del.dataset.armed !== '1') {
            del.dataset.armed = '1'; del.classList.add('armed');
            del.setAttribute('data-tooltip', 'Click again to archive');
            clearTimeout(del._d);
            del._d = setTimeout(function () {
              del.dataset.armed = '0'; del.classList.remove('armed');
              del.setAttribute('data-tooltip', 'Archive filter'); }, 3000);
            return;
          }
          try {
            // archived, not deleted: content keeps its tags, members just
            // stop seeing the filter. Un-archiving is a support question,
            // deleting values silently is a data loss.
            var r = await db.from('filters').update({ status: 'archived' }).eq('id', fid);
            if (r.error) throw r.error;
            toast('Filter archived'); await renderFilterAdmin();
          } catch (e) { toast(e.message || 'Could not archive that'); }
        });

        panel.querySelectorAll('.fil-opt-del').forEach(function (x) {
          x.addEventListener('click', async function () {
            var oid = x.closest('[data-oid]').dataset.oid;
            try {
              var r = await db.from('filter_options').update({ status: 'archived' }).eq('id', oid);
              if (r.error) throw r.error;
              await renderFilterAdmin();
            } catch (e) { toast(e.message || 'Could not archive that'); }
          });
        });
      });
    }

    // ── signed stills for admin content lists ───────────────────────────────
    // Any list row can carry data-tok="<video id>" data-pb="<playback id>";
    // this fills them all from ONE batch call. Same sessionStorage cache the
    // member library uses ('fs-vl-thumbtok'), so tokens minted on either
    // side of the app serve both.
    async function admHydrateThumbs(root) {
      var els = [].slice.call((root || document).querySelectorAll('[data-tok]'))
        .filter(function (el) {
          if (el.dataset.admHydrated || el.querySelector('img')) return false;
          el.dataset.admHydrated = '1';
          return true;
        });
      if (!els.length) return;
      var cache = {};
      try { cache = JSON.parse(sessionStorage.getItem('fs-vl-thumbtok')) || {}; } catch (_) {}
      var now = Date.now();
      var need = Array.from(new Set(els.map(function (el) { return el.dataset.tok; })))
        .filter(function (id) { return !(cache[id] && cache[id].exp > now); });
      if (need.length) {
        try {
          var sess = await db.auth.getSession();
          var tok = sess.data && sess.data.session && sess.data.session.access_token;
          var r = await fetch('/api/mux/playback-token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok },
            body: JSON.stringify({ videoIds: need.slice(0, 100) }),
          });
          var out = await r.json();
          if (r.ok && out.thumbnails) {
            Object.keys(out.thumbnails).forEach(function (id) {
              cache[id] = { t: out.thumbnails[id], exp: now + 5 * 3600 * 1000 };
            });
            try { sessionStorage.setItem('fs-vl-thumbtok', JSON.stringify(cache)); } catch (_) {}
          }
        } catch (_) { /* the glyph well is the designed fallback */ }
      }
      els.forEach(function (el) {
        var c = cache[el.dataset.tok];
        if (!c || c.exp <= now || !el.dataset.pb) return;
        var img = new Image();
        img.alt = '';
        img.onload = function () {
          var glyph = el.querySelector('.material-symbols-sharp');
          if (glyph) glyph.remove();
          el.classList.add('has-art');
          el.insertBefore(img, el.firstChild);
        };
        img.src = 'https://image.mux.com/' + encodeURIComponent(el.dataset.pb) +
          '/thumbnail.webp?width=320&token=' + encodeURIComponent(c.t);
      });
    }

    // the thumb cell those lists share: uploaded art wins, then a signed
    // still hydrates in, and the glyph well is what remains
    function admContentThumb(kind, row, tokVideoId, tokPlaybackId) {
      if (row && row.thumbnail_mode === 'custom' && row.custom_thumbnail_url) {
        return '<span class="vid-thumb has-art"><img alt="" loading="lazy" src="' + esc(row.custom_thumbnail_url) + '"></span>';
      }
      var tok = (tokVideoId && tokPlaybackId)
        ? ' data-tok="' + esc(tokVideoId) + '" data-pb="' + esc(tokPlaybackId) + '"' : '';
      return '<span class="vid-thumb"' + tok + '><span class="material-symbols-sharp">' +
        (kind === 'collection' ? 'stacks' : 'movie') + '</span></span>';
    }

    // ── Content › Video › Featured ──────────────────────────────────────────
    // The library home's hero, as a list: a row IS a slide, the order here
    // is the carousel order. Videos and collections mix freely. Members only
    // see slides whose content is live (RLS), so featuring something
    // scheduled is safe — it appears when the content does.
    var FEAT = { rows: [], videos: {}, collections: {}, stats: {}, items: [], busy: false };
    var FEAT_SOFT_CAP = 6;

    function featLive(r) {
      return r && (r.status === 'published' ||
        (r.status === 'scheduled' && r.published_at && new Date(r.published_at) <= new Date()));
    }

    async function renderFeatured() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var got = await Promise.all([
          db.from('library_featured').select('*').order('sort_order').order('created_at'),
          db.from('videos').select('id, title, status, published_at, duration_seconds, thumbnail_mode, custom_thumbnail_url, mux_playback_id'),
          db.from('collections').select('id, title, status, published_at, visibility, thumbnail_mode, custom_thumbnail_url'),
          db.from('collection_stats').select('*'),
          db.from('collection_items').select('collection_id, kind, video_id, position').order('position'),
        ]);
        var err = got.filter(function (r) { return r.error; })[0];
        if (err) throw err.error;
        FEAT.rows = got[0].data || [];
        FEAT.videos = {}; (got[1].data || []).forEach(function (v) { FEAT.videos[v.id] = v; });
        FEAT.collections = {}; (got[2].data || []).forEach(function (c) { FEAT.collections[c.id] = c; });
        FEAT.stats = {}; (got[3].data || []).forEach(function (s) { FEAT.stats[s.collection_id] = s; });
        FEAT.items = got[4].data || [];
        drawFeatured();
      } catch (e) {
        b.innerHTML = /relation .* does not exist/i.test(e.message || '')
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Featured</h2></div>' +
            '<div class="adm-intro" style="margin:0">This needs <code>supabase/library-featured.sql</code> run in Supabase, then it’ll show here.</div></div>'
          : stateError(e && e.message);
      }
    }

    function featTarget(row) {
      return row.video_id
        ? { kind: 'video', row: FEAT.videos[row.video_id] }
        : { kind: 'collection', row: FEAT.collections[row.collection_id] };
    }

    // a collection's stand-in art when it has none of its own: the first
    // video in its playlist (same fallback the member library uses)
    function featFirstVideo(colId) {
      var first = FEAT.items.filter(function (i) {
        return i.collection_id === colId && i.kind === 'video' && FEAT.videos[i.video_id];
      })[0];
      return first ? FEAT.videos[first.video_id] : null;
    }
    function featThumb(kind, r, id) {
      if (kind === 'video') return admContentThumb('video', r, r && r.mux_playback_id ? id : null, r && r.mux_playback_id);
      if (r && r.thumbnail_mode === 'custom' && r.custom_thumbnail_url) return admContentThumb('collection', r);
      var fv = featFirstVideo(id);
      if (fv && fv.thumbnail_mode === 'custom' && fv.custom_thumbnail_url) return admContentThumb('collection', fv);
      return admContentThumb('collection', null, fv && fv.mux_playback_id ? fv.id : null, fv && fv.mux_playback_id);
    }

    function drawFeatured() {
      var b = bodyEl(); if (!b) return;
      b.innerHTML =
        '<div class="cat-controls lib-bar">' +
          '<button class="btn-primary" id="feat-add">Add featured video</button>' +
          (FEAT.rows.length > FEAT_SOFT_CAP
            ? '<span class="nf-hint" style="margin:0">' + FEAT.rows.length + ' slides is a lot of hero — past ' + FEAT_SOFT_CAP + ' it reads as a list.</span>'
            : '') +
          '<span class="adm-count">' + num(FEAT.rows.length) + (FEAT.rows.length === 1 ? ' slide' : ' slides') + '</span>' +
        '</div>' +
        (FEAT.rows.length
          ? '<ul class="col-list" id="feat-list">' +
            FEAT.rows.map(function (f) {
              var t = featTarget(f);
              var r = t.row || {};
              var art = featThumb(t.kind, t.row, f.video_id || f.collection_id);
              var s = t.kind === 'collection' ? (FEAT.stats[f.collection_id] || {}) : null;
              var hint = !t.row
                ? 'This content was deleted — remove the slide.'
                : (!featLive(r)
                    ? (r.status === 'scheduled' ? 'Scheduled — the slide appears when it goes live.' : 'Not visible to members right now (' + esc(r.status) + ').')
                    : (t.kind === 'collection' && s ? num(s.video_count || 0) + ' videos · ' + esc(fmtRuntime(s.total_seconds)) : ''));
              // the row is a miniature of the slide it controls: eyebrow
              // over title, same order the hero renders them. No Collection
              // tag here — the eyebrow's own default already says it.
              return '<li class="col-item feat-slide" draggable="true" data-feat="' + f.id + '">' +
                '<span class="col-grip" aria-hidden="true"><span class="material-symbols-sharp">drag_indicator</span></span>' +
                art +
                '<span class="col-item-name">' +
                  '<span class="feat-eyebrow-row">' +
                    '<input class="feat-eyebrow" maxlength="40" value="' + esc(f.eyebrow || '') + '"' +
                      ' placeholder="' + (t.kind === 'collection' ? 'Collection' : 'New in the library') + '"' +
                      ' aria-label="Eyebrow text for ' + esc((t.row && r.title) || 'slide') + '">' +
                    '<span class="material-symbols-sharp feat-eyebrow-pen" aria-hidden="true">edit</span>' +
                  '</span>' +
                  '<strong>' + esc((t.row && r.title) || 'Deleted') + '</strong>' +
                  (hint ? '<span class="nf-hint">' + hint + '</span>' : '') + '</span>' +
                (t.kind === 'video' && r.duration_seconds != null
                  ? '<span class="col-item-dur">' + videoDuration(r.duration_seconds) + '</span>' : '') +
                '<button class="btn-icon adm-del feat-del" data-tooltip="Remove from the hero" aria-label="Remove ' + esc((t.row && r.title) || 'slide') + '">' +
                  '<span class="material-symbols-sharp">close</span></button>' +
              '</li>';
            }).join('') + '</ul>'
          : '<div class="adm-state"><span class="adm-state-ico"><span class="material-symbols-sharp">movie</span></span>' +
            '<h3>Nothing featured</h3>' +
            '<p>The library has no hero right now — it opens straight on search and the shelves. Feature something to give it one.</p></div>');
      wireFeatured();
      admHydrateThumbs(b);
    }

    async function persistFeaturedOrder() {
      var list = document.getElementById('feat-list');
      if (!list) return;
      var writes = [];
      [].forEach.call(list.querySelectorAll('.col-item'), function (row, at) {
        writes.push(db.from('library_featured').update({ sort_order: at + 1 }).eq('id', row.dataset.feat));
        var f = FEAT.rows.filter(function (x) { return x.id === row.dataset.feat; })[0];
        if (f) f.sort_order = at + 1;
      });
      var results = await Promise.all(writes);
      var bad = results.filter(function (r) { return r.error; })[0];
      if (bad) { toast(bad.error.message || 'Could not save the new order'); return; }
      FEAT.rows.sort(function (a, b2) { return a.sort_order - b2.sort_order; });
      toast('Hero order saved');
    }

    function wireFeatured() {
      var b = bodyEl(); if (!b) return;
      var add = document.getElementById('feat-add');
      if (add) add.addEventListener('click', openFeaturedPicker);

      // the pencil is a pointer to the field, not a second control
      b.querySelectorAll('.feat-eyebrow-pen').forEach(function (pen) {
        pen.addEventListener('click', function () {
          var inp = pen.parentNode.querySelector('.feat-eyebrow');
          if (inp) { inp.focus(); inp.select(); }
        });
      });

      // eyebrows save themselves on blur; Enter commits, Escape reverts,
      // and clearing the field returns the slide to its default label
      b.querySelectorAll('.feat-eyebrow').forEach(function (inp) {
        var id = inp.closest('.col-item').dataset.feat;
        var was = inp.value;
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
          if (e.key === 'Escape') { inp.value = was; inp.blur(); }
        });
        inp.addEventListener('blur', async function () {
          var v = (inp.value || '').trim();
          if (v === was) return;
          try {
            var r = await db.from('library_featured').update({ eyebrow: v || null }).eq('id', id);
            if (r.error) throw r.error;
            was = v;
            var f = FEAT.rows.filter(function (x) { return x.id === id; })[0];
            if (f) f.eyebrow = v || null;
          } catch (e) {
            inp.value = was;
            toast(/eyebrow.*does not exist/i.test((e && e.message) || '')
              ? 'Eyebrows need the latest supabase/library-featured.sql run'
              : (e.message || 'Could not save that'));
          }
        });
      });

      b.querySelectorAll('.feat-del').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var id = btn.closest('.col-item').dataset.feat;
          try {
            var r = await db.from('library_featured').delete().eq('id', id);
            if (r.error) throw r.error;
            FEAT.rows = FEAT.rows.filter(function (f) { return f.id !== id; });
            drawFeatured();
          } catch (e) { toast(e.message || 'Could not remove that'); }
        });
      });

      var list = document.getElementById('feat-list');
      if (!list) return;
      var dragging = null;
      list.querySelectorAll('.col-item').forEach(function (row) {
        row.addEventListener('dragstart', function (e) {
          dragging = row; row.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', row.dataset.feat); } catch (_) {}
        });
        row.addEventListener('dragend', function () {
          if (dragging) dragging.classList.remove('dragging');
          dragging = null;
          list.querySelectorAll('.col-item').forEach(function (r) {
            r.classList.remove('drop-above', 'drop-below'); });
        });
        row.addEventListener('dragover', function (e) {
          if (!dragging || dragging === row) return;
          e.preventDefault();
          var rect = row.getBoundingClientRect();
          var above = e.clientY < rect.top + rect.height / 2;
          list.querySelectorAll('.col-item').forEach(function (r) {
            r.classList.remove('drop-above', 'drop-below'); });
          row.classList.add(above ? 'drop-above' : 'drop-below');
        });
        row.addEventListener('drop', async function (e) {
          if (!dragging || dragging === row) return;
          e.preventDefault();
          var rect = row.getBoundingClientRect();
          var above = e.clientY < rect.top + rect.height / 2;
          row.parentNode.insertBefore(dragging, above ? row : row.nextSibling);
          list.querySelectorAll('.col-item').forEach(function (r) {
            r.classList.remove('drop-above', 'drop-below'); });
          await persistFeaturedOrder();
        });
      });
    }

    function openFeaturedPicker() {
      var have = {};
      FEAT.rows.forEach(function (f) { have[(f.video_id ? 'video:' + f.video_id : 'collection:' + f.collection_id)] = true; });
      var picked = {};

      // only what members could actually see — a hero should be curated from
      // live, listed content
      var pool = [];
      Object.keys(FEAT.collections).forEach(function (id) {
        var c = FEAT.collections[id];
        if (featLive(c) && c.visibility !== 'unlisted') pool.push({ kind: 'collection', id: id, row: c });
      });
      Object.keys(FEAT.videos).forEach(function (id) {
        var v = FEAT.videos[id];
        if (featLive(v)) pool.push({ kind: 'video', id: id, row: v });
      });

      var backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML =
        '<div class="modal-card vidpick" role="dialog" aria-modal="true" aria-label="Feature content">' +
          '<h3>Feature in the hero</h3>' +
          '<div class="vidpick-controls">' +
            '<input type="text" class="modal-input" id="fp-q" placeholder="Search live videos and collections…" aria-label="Search content">' +
          '</div>' +
          '<ul class="vidpick-list" id="fp-list"></ul>' +
          '<div class="modal-actions">' +
            '<button class="btn-ghost" id="fp-cancel">Cancel</button>' +
            '<button class="btn-primary" id="fp-add" disabled>Feature</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(backdrop);

      var listEl = backdrop.querySelector('#fp-list');
      var qEl = backdrop.querySelector('#fp-q');
      var addBtn = backdrop.querySelector('#fp-add');

      function paint() {
        var q = (qEl.value || '').trim().toLowerCase();
        var hits = pool.filter(function (it) {
          return !q || (it.row.title || '').toLowerCase().indexOf(q) !== -1;
        });
        listEl.innerHTML = hits.length ? hits.map(function (it) {
          var key = it.kind + ':' + it.id;
          var already = !!have[key];
          return '<li class="vidpick-row' + (already ? ' in' : '') + '" data-key="' + key + '">' +
            '<input type="checkbox"' + (already ? ' checked disabled' : (picked[key] ? ' checked' : '')) +
              ' aria-label="Select ' + esc(it.row.title) + '">' +
            featThumb(it.kind, it.row, it.id) +
            (it.kind === 'collection' ? '<span class="cate-kind">Collection</span>' : '') +
            '<span class="vidpick-name"><strong>' + esc(it.row.title) + '</strong>' +
              (already ? '<span class="nf-hint">Already in the hero</span>' : '') + '</span>' +
          '</li>';
        }).join('') : '<li class="muted" style="padding:12px">Nothing live matches that.</li>';

        listEl.querySelectorAll('.vidpick-row:not(.in)').forEach(function (row) {
          row.addEventListener('click', function (e) {
            var box = row.querySelector('input');
            if (e.target !== box) box.checked = !box.checked;
            picked[row.dataset.key] = box.checked;
            sync();
          });
        });
        sync();
        admHydrateThumbs(listEl);
      }
      function sync() {
        var n = Object.keys(picked).filter(function (k) { return picked[k]; }).length;
        addBtn.disabled = !n;
        addBtn.textContent = n ? 'Feature ' + n : 'Feature';
      }
      var qt;
      qEl.addEventListener('input', function () { clearTimeout(qt); qt = setTimeout(paint, 150); });
      paint();
      qEl.focus();

      function close() { backdrop.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); }
      document.addEventListener('keydown', onKey);
      backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
      backdrop.querySelector('#fp-cancel').addEventListener('click', close);

      addBtn.addEventListener('click', async function () {
        var keys = Object.keys(picked).filter(function (k) { return picked[k]; });
        if (!keys.length) return;
        addBtn.disabled = true;
        try {
          var top = FEAT.rows.reduce(function (m, f) { return Math.max(m, f.sort_order || 0); }, 0);
          var rows = keys.map(function (key, at) {
            var kind = key.split(':')[0], id = key.split(':')[1];
            return {
              video_id: kind === 'video' ? id : null,
              collection_id: kind === 'collection' ? id : null,
              sort_order: top + at + 1,
            };
          });
          var r = await db.from('library_featured').insert(rows);
          if (r.error) throw r.error;
          close();
          toast(keys.length === 1 ? 'Featured' : keys.length + ' featured');
          await renderFeatured();
        } catch (e) {
          toast(e.message || 'Could not feature those');
          addBtn.disabled = false;
        }
      });
    }

    // ── Communications › Notifications ──────────────────────────────────────
    // Publishing is the only irreversible-feeling act in this admin — it puts
    // a badge on ~900 people's screens — so the composer keeps a live preview
    // of exactly what they will see, and publish is a two-step.
    var NOTIF_TYPES = [
      ['announcement',    'Announcement'],
      ['new_class',       'New class'],
      ['new_feature',     'New feature'],
      ['platform_update', 'Platform update'],
    ];
    var NF = { editing: null, rows: [], reach: {}, busy: false };

    // "142 of 880" beside a bar. The number leads because the percentage is
    // the thing that misleads — 50% of nine people is not a result. A draft
    // has no reach and says so with a dash rather than a persuasive zero.
    function notifReach(r) {
      if (r.status !== 'published') return '<span class="muted">—</span>';
      var x = NF.reach[r.id];
      if (!x) return '<span class="muted">—</span>';
      var pct = x.audience ? Math.round(x.reads / x.audience * 100) : 0;
      return '<div class="nf-reach" title="' + num(x.reads) + ' of ' + num(x.audience) +
             ' teachers have opened this">' +
        '<span class="nf-reach-n">' + num(x.reads) + '<span class="muted"> / ' + num(x.audience) + '</span></span>' +
        '<span class="nf-reach-bar"><span style="width:' + Math.min(100, pct) + '%"></span></span>' +
      '</div>';
    }

    function notifTypeLabel(t) {
      var m = NOTIF_TYPES.filter(function (x) { return x[0] === t; })[0];
      return m ? m[1] : 'Announcement';
    }
    // .adm-pill is the admin's badge — outlined, mono, uppercase, --rf radius.
    // Published is the only state that earns the accent: it is the one that
    // means "this is live in front of people". Draft and archived are quiet
    // by default, which is what the base pill already is.
    function notifStatusPill(s) {
      return '<span class="adm-pill' + (s === 'published' ? ' on' : '') + '">' + esc(s) + '</span>';
    }

    async function renderNotifs() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var res = await db.from('notifications').select('*').order('created_at', { ascending: false });
        if (res.error) throw res.error;
        NF.rows = res.data || [];
        // Reach is a separate migration. If it has not been run the table
        // still works — the column just stays quiet — rather than the whole
        // section failing over a number.
        NF.reach = {};
        try {
          var rr = await db.rpc('notification_reach');
          // `nid`, not notification_id — see the note in notifications-reach.sql
          if (!rr.error) (rr.data || []).forEach(function (x) {
            NF.reach[x.nid] = { reads: x.reads, audience: x.audience };
          });
        } catch (_) {}
        drawNotifs();
      } catch (e) {
        // the one error worth naming precisely: the table not existing yet
        b.innerHTML = /relation .* does not exist/i.test(e.message || '')
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Notifications</h2></div>' +
            '<div class="adm-intro" style="margin:0">This needs <code>supabase/notifications.sql</code> run in Supabase, then it’ll show here.</div></div>'
          : stateError(e && e.message);
      }
    }

    function drawNotifs(keepForm) {
      var b = bodyEl(); if (!b) return;
      var e = NF.editing;
      // Archived rows stay in the database — nothing is deleted, and the
      // reach numbers stay joinable — but they leave this table. Archiving is
      // how you take something back down, and a list of things you have taken
      // down is not what you came here to read.
      var shown = NF.rows.filter(function (r) { return r.status !== 'archived'; });
      var archivedCount = NF.rows.length - shown.length;
      b.innerHTML =
        '<div class="adm-explain">' +
          '<p>An announcement here appears in every teacher’s notification panel — the bell in their sidebar — the moment you publish it. There is no email and no push; it waits quietly until they look.</p>' +
          '<p>Drafts are invisible to teachers. Archiving takes a published notification back down and removes it from their unread count.</p>' +
        '</div>' +
        (e ? notifForm(e) : '<button class="btn-primary" id="nf-new">Write an announcement</button>') +
        '<div class="adm-panel" style="margin-top:20px"><div class="adm-panel-head"><h2>Notifications</h2>' +
          // no archived count here — the Archived panel below names it, and
          // saying it twice made this header read like a warning
          '<span class="muted adm-mono">' + num(shown.length) + '</span></div>' +
          (shown.length
            ? '<div class="adm-scroll"><table class="adm-table"><thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Read</th><th>Created</th><th>Published</th><th></th></tr></thead><tbody>' +
              shown.map(notifRow).join('') + '</tbody></table></div>'
            : stateEmpty('Nothing written yet.')) +
        '</div>' +
        // Archived sits below rather than mixed in: it is a record, not a
        // worklist. Delete is only offered here — a published notification
        // has to be taken down before it can be destroyed, which makes
        // "gone from everyone's panel" a separate decision from "gone".
        (archivedCount
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Archived</h2>' +
              '<span class="muted adm-mono">' + num(archivedCount) + '</span></div>' +
              '<div class="adm-intro" style="margin:2px 0 14px">Taken down. Teachers no longer see these and they count towards nobody’s unread. Deleting one removes it and its read history for good.</div>' +
              '<div class="adm-scroll"><table class="adm-table"><thead><tr><th>Title</th><th>Type</th><th>Published</th><th>Archived</th><th></th></tr></thead><tbody>' +
              NF.rows.filter(function (r) { return r.status === 'archived'; }).map(notifArchivedRow).join('') +
              '</tbody></table></div></div>'
          : '');
      wireNotifs();
      if (e && !keepForm) { var t = document.getElementById('nf-title'); if (t) t.focus(); }
    }

    function notifRow(r) {
      return '<tr data-nid="' + r.id + '">' +
        '<td><strong>' + esc(r.title) + '</strong></td>' +
        '<td class="muted adm-mono">' + esc(notifTypeLabel(r.notification_type)) + '</td>' +
        '<td>' + notifStatusPill(r.status) + '</td>' +
        '<td>' + notifReach(r) + '</td>' +
        '<td class="muted">' + esc(A.fmtDate(r.created_at)) + '</td>' +
        '<td class="muted">' + (r.published_at ? esc(A.fmtDate(r.published_at)) : '—') + '</td>' +
        '<td class="mus-actions">' +
          '<button class="btn-ghost nf-edit">Edit</button> ' +
          (r.status === 'draft'
            ? '<button class="btn-secondary nf-publish">Publish</button> ' +
              '<button class="btn-icon adm-del nf-del" data-tooltip="Delete" aria-label="Delete draft ' + esc(r.title) + '">' +
                '<span class="material-symbols-sharp">delete</span></button>'
            : r.status === 'published'
              ? '<button class="btn-ghost nf-archive">Archive</button>'
              // archived rows are filtered out of this table, so this branch
              // only fires if that filter is ever relaxed — kept, because
              // publish_notification() already restores them correctly
              : '<button class="btn-secondary nf-publish">Restore</button>') +
        '</td></tr>';
    }

    // Same row shape as the live table minus the things that no longer apply:
    // no status pill (they are all archived), no reach (it stopped counting
    // when it came down).
    function notifArchivedRow(r) {
      return '<tr data-aid="' + r.id + '">' +
        '<td><strong>' + esc(r.title) + '</strong></td>' +
        '<td class="muted adm-mono">' + esc(notifTypeLabel(r.notification_type)) + '</td>' +
        '<td class="muted">' + (r.published_at ? esc(A.fmtDate(r.published_at)) : '—') + '</td>' +
        '<td class="muted">' + (r.archived_at ? esc(A.fmtDate(r.archived_at)) : '—') + '</td>' +
        '<td class="adm-actcell">' +
          '<button class="btn-icon adm-del" data-tooltip="Delete" aria-label="Delete ' + esc(r.title) + ' permanently">' +
            '<span class="material-symbols-sharp">delete</span></button>' +
        '</td></tr>';
    }

    function notifForm(e) {
      return '<div class="adm-panel nf-form">' +
        '<div class="adm-panel-head"><h2>' + (e.id ? 'Edit' : 'New announcement') + '</h2>' +
          '<button class="btn-ghost" id="nf-cancel">Cancel</button></div>' +
        '<div class="nf-grid">' +
          '<div class="nf-fields">' +
            '<label class="nf-label" for="nf-title">Title <span class="nf-req">required</span></label>' +
            '<input class="modal-input" id="nf-title" maxlength="120" value="' + esc(e.title || '') + '" placeholder="Sequencing tool is live">' +
            '<label class="nf-label" for="nf-msg">Message <span class="nf-req">required</span></label>' +
            '<textarea class="modal-input nf-msg" id="nf-msg" rows="5" maxlength="2000" placeholder="Line breaks are kept.">' + esc(e.message || '') + '</textarea>' +
            '<label class="nf-label" for="nf-type">Type</label>' +
            '<select class="modal-input" id="nf-type">' + NOTIF_TYPES.map(function (t) {
              return '<option value="' + t[0] + '"' + (e.notification_type === t[0] ? ' selected' : '') + '>' + t[1] + '</option>';
            }).join('') + '</select>' +
            '<label class="nf-label" for="nf-url">Link <span class="nf-opt">optional</span></label>' +
            // an in-app route is just its path — the same string the sidebar
            // uses — so there is nothing to look up or pick from
            '<input class="modal-input" id="nf-url" value="' + esc(e.link_url || '') + '" placeholder="your-flows   or   https://…">' +
            '<span class="nf-hint">An in-app page (<span class="adm-mono">your-flows</span>, <span class="adm-mono">playlist-builder</span>) or a full external URL.</span>' +
            '<label class="nf-label" for="nf-label-in">Link label</label>' +
            '<input class="modal-input" id="nf-label-in" maxlength="40" value="' + esc(e.link_label || '') + '" placeholder="Open Your Flows">' +
            '<div class="nf-actions">' +
              '<button class="btn-secondary" id="nf-save">Save draft</button>' +
              '<button class="btn-primary" id="nf-pub">' + (e.status === 'published' ? 'Save changes' : 'Publish now') + '</button>' +
              '<span class="nf-err" id="nf-err"></span>' +
            '</div>' +
          '</div>' +
          '<div class="nf-preview"><span class="nf-preview-cap">What teachers will see</span>' +
            '<div class="nf-preview-box" id="nf-preview"></div></div>' +
        '</div></div>';
    }

    function notifPreview() {
      var host = document.getElementById('nf-preview'); if (!host) return;
      var title = (document.getElementById('nf-title') || {}).value || '';
      var msg   = (document.getElementById('nf-msg') || {}).value || '';
      var type  = (document.getElementById('nf-type') || {}).value || 'announcement';
      var url   = (document.getElementById('nf-url') || {}).value || '';
      var label = (document.getElementById('nf-label-in') || {}).value || '';
      var href  = window.fsNotify ? fsNotify.safeHref(url) : null;

      // Rendered by the panel's OWN item renderer, so the preview cannot drift
      // from the thing it previews. `expanded` because a preview that hid the
      // message you are typing would be useless.
      var markup = (window.fsNotifyPanel && fsNotifyPanel.renderItem)
        ? fsNotifyPanel.renderItem({
            id: 0,
            title: title || 'Your title',
            message: msg || 'Your message.',
            notification_type: type,
            link_url: url, link_label: label,
            published_at: new Date().toISOString(),
            is_read: false,
          }).replace('class="fs-np-item unread"', 'class="fs-np-item unread expanded"')
        : '<p class="muted">Preview unavailable.</p>';

      host.innerHTML = markup +
        (url && !href ? '<p class="nf-err" style="margin:8px 0 0">That link isn’t a page or a URL we can open.</p>' : '');
      // the composer is not the panel: nothing here should navigate or toggle
      host.querySelectorAll('a').forEach(function (a) {
        a.removeAttribute('href'); a.style.cursor = 'default';
      });
      var art = host.querySelector('.fs-np-item');
      if (art) { art.removeAttribute('tabindex'); art.removeAttribute('role'); }
    }

    function notifRead() {
      return {
        title: (document.getElementById('nf-title').value || '').trim(),
        message: (document.getElementById('nf-msg').value || '').trim(),
        notification_type: document.getElementById('nf-type').value,
        link_url: (document.getElementById('nf-url').value || '').trim() || null,
        link_label: (document.getElementById('nf-label-in').value || '').trim() || null,
      };
    }

    // Validation lives here rather than in the buttons so "save" and "publish"
    // cannot drift apart on what counts as complete.
    function notifValidate(v) {
      if (!v.title) return 'A title is required.';
      if (!v.message) return 'A message is required.';
      if (v.link_url && window.fsNotify && !fsNotify.safeHref(v.link_url))
        return 'That link isn’t a page or a URL we can open.';
      if (v.link_label && !v.link_url) return 'A link label needs a link.';
      return null;
    }

    async function notifSave(publish) {
      if (NF.busy) return;                       // the double-click guard
      var v = notifRead();
      var bad = notifValidate(v);
      var errEl = document.getElementById('nf-err');
      if (bad) { if (errEl) errEl.textContent = bad; return; }
      if (errEl) errEl.textContent = '';
      NF.busy = true;
      ['nf-save', 'nf-pub'].forEach(function (id) {
        var el = document.getElementById(id); if (el) el.disabled = true;
      });
      try {
        var id = NF.editing && NF.editing.id;
        if (id) {
          var up = await db.from('notifications').update(v).eq('id', id).select().single();
          if (up.error) throw up.error;
        } else {
          var ins = await db.from('notifications').insert(v).select().single();
          if (ins.error) throw ins.error;
          id = ins.data.id;
          if (typeof fsTrack === 'function')
            fsTrack('admin_notification_created', { resourceType: 'notification', resourceId: id,
                                                    metadata: { type: v.notification_type } });
        }
        if (publish) {
          var pub = await db.rpc('publish_notification', { p_id: Number(id) });
          if (pub.error) throw pub.error;
          if (typeof fsTrack === 'function')
            fsTrack('admin_notification_published', { resourceType: 'notification', resourceId: id,
                                                      metadata: { type: v.notification_type } });
          // your own bell is one of the ones that just changed — without this
          // it keeps its pre-publish count until a reload
          if (window.fsNotify) fsNotify.unreadCount(true);
          toast('Published — it’s in everyone’s panel now');
        } else {
          toast('Draft saved');
        }
        NF.editing = null;
        await renderNotifs();
      } catch (err) {
        if (errEl) errEl.textContent = (err && err.message) || 'Could not save that.';
      } finally {
        NF.busy = false;
        ['nf-save', 'nf-pub'].forEach(function (id2) {
          var el = document.getElementById(id2); if (el) el.disabled = false;
        });
      }
    }

    function wireNotifs() {
      var b = bodyEl(); if (!b || b.dataset.nfWired === '1') { /* re-bind below */ }
      var nw = document.getElementById('nf-new');
      if (nw) nw.addEventListener('click', function () {
        NF.editing = { notification_type: 'announcement' }; drawNotifs();
      });
      var cancel = document.getElementById('nf-cancel');
      if (cancel) cancel.addEventListener('click', function () { NF.editing = null; drawNotifs(); });

      ['nf-title', 'nf-msg', 'nf-type', 'nf-url', 'nf-label-in'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', notifPreview);
        if (el && el.tagName === 'SELECT') el.addEventListener('change', notifPreview);
      });
      if (document.getElementById('nf-preview')) notifPreview();

      var save = document.getElementById('nf-save');
      if (save) save.addEventListener('click', function () { notifSave(false); });
      var pub = document.getElementById('nf-pub');
      if (pub) pub.addEventListener('click', function () { notifSave(true); });

      // row actions — delegated, and armed twice for anything destructive,
      // the same two-step the catalogue's Remove uses
      b.querySelectorAll('tr[data-nid]').forEach(function (tr) {
        var id = Number(tr.dataset.nid);
        var row = NF.rows.filter(function (r) { return r.id === id; })[0];
        var ed = tr.querySelector('.nf-edit');
        if (ed) ed.addEventListener('click', function () { NF.editing = Object.assign({}, row); drawNotifs(); });
        var pb = tr.querySelector('.nf-publish');
        if (pb) pb.addEventListener('click', async function () {
          if (NF.busy) return; NF.busy = true; pb.disabled = true;
          try {
            var r = await db.rpc('publish_notification', { p_id: id });
            if (r.error) throw r.error;
            if (typeof fsTrack === 'function')
              fsTrack('admin_notification_published', { resourceType: 'notification', resourceId: id });
            if (window.fsNotify) fsNotify.unreadCount(true);
            toast('Published'); await renderNotifs();
          } catch (e) { toast((e && e.message) || 'Could not publish'); pb.disabled = false; }
          finally { NF.busy = false; }
        });
        var ar = tr.querySelector('.nf-archive');
        if (ar) ar.addEventListener('click', async function () {
          if (ar.dataset.armed !== '1') {
            ar.dataset.armed = '1'; ar.textContent = 'Really archive?'; ar.classList.add('mus-del-armed'); return;
          }
          try {
            var r = await db.rpc('archive_notification', { p_id: id });
            if (r.error) throw r.error;
            if (typeof fsTrack === 'function')
              fsTrack('admin_notification_archived', { resourceType: 'notification', resourceId: id });
            // archiving takes it off the badge too, not just out of the list
            if (window.fsNotify) fsNotify.unreadCount(true);
            toast('Archived — it’s off everyone’s panel'); await renderNotifs();
          } catch (e) { toast((e && e.message) || 'Could not archive'); }
        });
        // same icon + .armed pattern as the archived table below and the
        // feedback table elsewhere — one delete affordance in this admin
        var dl = tr.querySelector('.nf-del');
        if (dl) dl.addEventListener('click', async function () {
          if (dl.dataset.armed !== '1') {
            dl.dataset.armed = '1'; dl.classList.add('armed');
            dl.setAttribute('data-tooltip', 'Click again to delete');
            clearTimeout(dl._disarm);
            dl._disarm = setTimeout(function () {
              dl.dataset.armed = '0'; dl.classList.remove('armed');
              dl.setAttribute('data-tooltip', 'Delete');
            }, 3000);
            return;
          }
          dl.disabled = true;
          try {
            var r = await db.from('notifications').delete().eq('id', id);
            if (r.error) throw r.error;
            toast('Draft deleted'); await renderNotifs();
          } catch (e) {
            toast((e && e.message) || 'Could not delete');
            dl.disabled = false; dl.dataset.armed = '0';
            dl.classList.remove('armed'); dl.setAttribute('data-tooltip', 'Delete');
          }
        });
      });
      // archived rows: permanent delete, using the admin's own icon pattern —
      // arm on first click, disarm after 3s, exactly as the feedback table does
      b.querySelectorAll('tr[data-aid] .adm-del').forEach(function (btn) {
        var id = Number(btn.closest('tr').dataset.aid);
        btn.addEventListener('click', async function () {
          if (btn.dataset.armed === '1') {
            btn.disabled = true;
            try {
              // notification_reads cascades on the foreign key, so the read
              // history goes with it rather than being orphaned
              var r = await db.from('notifications').delete().eq('id', id);
              if (r.error) throw r.error;
              toast('Deleted for good');
              await renderNotifs();
            } catch (e) {
              toast((e && e.message) || 'Could not delete that');
              btn.disabled = false; btn.dataset.armed = '0';
              btn.classList.remove('armed'); btn.setAttribute('data-tooltip', 'Delete');
            }
            return;
          }
          btn.dataset.armed = '1'; btn.classList.add('armed');
          btn.setAttribute('data-tooltip', 'Click again to delete');
          clearTimeout(btn._disarm);
          btn._disarm = setTimeout(function () {
            btn.dataset.armed = '0'; btn.classList.remove('armed');
            btn.setAttribute('data-tooltip', 'Delete');
          }, 3000);
        });
      });

      // One click anywhere else disarms, so an armed button never lingers.
      // Two kinds live here now: text buttons that swap their label, and icon
      // buttons whose label IS a child <span>. Writing textContent to the
      // second kind would delete the glyph and leave a bare word behind.
      b.addEventListener('click', function (ev) {
        b.querySelectorAll('[data-armed="1"]').forEach(function (o) {
          if (o === ev.target || o.contains(ev.target)) return;
          o.dataset.armed = '';
          clearTimeout(o._disarm);
          if (o.querySelector('.material-symbols-sharp')) {
            o.classList.remove('armed');
            o.setAttribute('data-tooltip', 'Delete');
          } else {
            o.classList.remove('mus-del-armed');
            o.textContent = 'Archive';
          }
        });
      });
    }

    // ── the landing page ────────────────────────────────────────────────────
    // A menu that only lists its options is a toll on the way to work. These
    // cards carry the state of the thing behind them, so the page answers
    // "is there anything for me?" without being entered.
    // Name, one line about what it is for, and a way in. The cards used to
    // carry a number and a contents list; at three doors you are not counting
    // and you are not choosing by inventory — the label already tells you.
    function renderHome() {
      var b = bodyEl();
      if (!b) return;
      b.innerHTML =
        '<p class="adm-intro">Three areas. Analytics is for reading, Content and Communications are for changing.</p>' +
        '<div class="adm-areas">' + AREAS.map(function (a) {
          // a real href, so cmd-click and the status bar behave; no click
          // handler needed, which means no way for one to go missing
          return '<a class="adm-area" href="#' + a.home + '">' +
            '<h2 class="adm-area-name">' + esc(a.label) + '</h2>' +
            '<p class="adm-area-blurb">' + esc(a.blurb) + '</p>' +
            '<span class="adm-area-cta">Open<span class="material-symbols-sharp">arrow_forward</span></span>' +
          '</a>';
        }).join('') + '</div>';
    }

    // ── router ──
    function route() {
      var raw = (location.hash || '#home').slice(1);
      // #<section>/<id> deep-links one detail editor; the part before the
      // slash is still the section, so every other route is untouched
      var slash = raw.indexOf('/');
      var id = slash > 0 ? raw.slice(0, slash) : raw;
      var deepable = { videos: VID, collections: COL, 'video-categories': CATE };
      if (deepable[id]) deepable[id]._openOnRender = slash > 0 ? raw.slice(slash + 1) : null;
      var sec = SECTIONS.filter(function (s) { return s.id === id; })[0] || SECTIONS[0];
      // 'home' belongs to no group; groupOf() would fall through to Overview
      // and a later Overview pill click would land back on the landing page
      if (sec.id !== 'home') groupLast[groupOf(sec.id).label] = sec.id;
      shell(sec.id);
      // every tab carries the "Updated …" stamp. Overview fills it from the
      // server snapshot time (generated_at) inside its own render; for the
      // rest, stamp the load time here once their data has come in.
      Promise.resolve(sec.render()).then(function () {
        var u = document.getElementById('adm-updated');
        if (u && !u.textContent) u.textContent = 'Updated ' + A.fmtDateTime(new Date());
      });
    }
    window.addEventListener('hashchange', route);

    // Tables arrive at three different times — with the section render, from a
    // panel that loads after it (loadTools, loadSignups), and in the user
    // drawer. Rather than calling admSortable at each of those ~28 sites, watch
    // and upgrade whatever appears. Idempotent, so the observer re-firing on
    // admSortable's own edits settles immediately.
    //
    // OBSERVE document.body, NOT #adm-body: that element doesn't exist yet when
    // this runs (shell() builds it), and shell() REPLACES it on every route —
    // so an observer bound to it would either never attach or go stale on the
    // first tab change. document.body is the only node that outlives both.
    (function () {
      if (!window.MutationObserver) { admSortable(document); return; }
      var queued = false;
      new MutationObserver(function () {
        if (queued) return;              // coalesce a render's burst into one pass
        queued = true;
        requestAnimationFrame(function () { queued = false; admSortable(document); });
      }).observe(document.body, { childList: true, subtree: true });
      admSortable(document);
    })();

    // ── shared chart tooltip — styled pill, animated, positioned above the bar ──
    (function () {
      var tt = document.createElement('div');
      tt.className = 'adm-tt';
      tt.setAttribute('aria-hidden', 'true');
      document.body.appendChild(tt);
      var SEL = '.suc-col[data-tip], .adm-spk-col[data-tip], .adm-hm[data-tip], .adm-tbar-fill[data-tip], .adm-info[data-tip], .adm-thinfo[data-tip]';
      function show(el) {
        var tip = el.getAttribute('data-tip');
        if (!tip) return;
        tt.textContent = tip;
        var r = el.getBoundingClientRect();
        var tw = tt.offsetWidth, th = tt.offsetHeight;   // measured while hidden (still laid out)
        var left = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 8));
        var above = r.top - th - 8;
        var below = above < 8;
        tt.style.left = left + 'px';
        tt.style.top = (below ? r.bottom + 8 : above) + 'px';
        tt.classList.toggle('below', below);
        tt.classList.add('on');
      }
      function hide() { tt.classList.remove('on'); }
      document.addEventListener('pointerover', function (e) {
        var el = e.target && e.target.closest ? e.target.closest(SEL) : null;
        if (el) show(el);
      });
      document.addEventListener('pointerout', function (e) {
        var el = e.target && e.target.closest ? e.target.closest(SEL) : null;
        if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) hide();
      });
      window.addEventListener('scroll', hide, true);
    })();

    // ── boot: gate on admin (server truth) ──
    (async function boot() {
      // sync.js already redirected to /login if there was no session.
      try { if (window.fsSync && window.fsSync.ready) await window.fsSync.ready; } catch (_) {}
      var ok = await A.isAdmin();
      if (!ok) {
        root.innerHTML = '<div class="adm-denied"><span class="material-symbols-sharp">visibility_lock</span>' +
          '<h1>Not authorized</h1><p>This area is for Flow School administrators. If you believe you should have access, ask an existing admin to add you.</p>' +
          '<p style="margin-top:16px"><a class="btn-secondary" href="dashboard">Back to dashboard</a></p></div>';
        return;
      }
      route();
    })();
  })();
  </script>
</body>
</html>
