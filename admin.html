          });
        });
        var chapAdd = $('vid-chap-add');
        if (chapAdd) chapAdd.addEventListener('click', function () {
          chapList.insertAdjacentHTML('beforeend', chapRowHTML({ t: 0, title: '' }));
          var rows = chapList.querySelectorAll('.chap-row');
          rows[rows.length - 1].querySelector('.chap-title').focus();
          videoSyncSave();
        });
        // the paste box waits behind its door — importing is an occasional
        // act, not furniture
        var chapBox = $('vid-chap-importbox');
        var chapOpen = $('vid-chap-open');
        function chapCloseImport() {
          chapBox.hidden = true;
          chapOpen.hidden = false;
          $('vid-chap-paste').value = '';
        }
        if (chapOpen) chapOpen.addEventListener('click', function () {
          chapBox.hidden = false;
          chapOpen.hidden = true;
          $('vid-chap-paste').focus();
        });
        var chapCancel = $('vid-chap-cancel');
        if (chapCancel) chapCancel.addEventListener('click', chapCloseImport);
        var chapImport = $('vid-chap-import');
        if (chapImport) chapImport.addEventListener('click', function () {
          var parsed = parseChaptersPaste($('vid-chap-paste').value);
          if (!parsed.length) { toast('Nothing parseable in there — JSON, VTT, or "0:00 Title" lines.'); return; }
          renderChapterRows(parsed);
          chapCloseImport();
          toast(parsed.length + ' chapter' + (parsed.length === 1 ? '' : 's') + ' imported — save to keep them.');
          videoSyncSave();
        });
      }

      // ── extra shelves ──
      wireVideoXcats();

      // ── jump to a collection this video belongs to ──
      document.querySelectorAll('.vid-col-jump').forEach(function (a) {
        a.addEventListener('click', function (e) {
          e.preventDefault();   // the deep link, not the anchor's plain #collections
          VID.editing = null;
          location.hash = '#collections/' + a.dataset.col;
        });
      });

      // ── filter chips ──
      wireVideoFilters();

      // ── generate captions for a pre-automation video ──
      var genCap = $('vid-gen-captions');
      if (genCap) genCap.addEventListener('click', async function () {
        genCap.disabled = true; genCap.textContent = 'Starting…';
        try {
          var sess = await db.auth.getSession();
          var tok = sess.data && sess.data.session && sess.data.session.access_token;
          var r = await fetch('/api/mux/generate-captions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok },
            body: JSON.stringify({ videoId: v.id }),
          });
          var out;
          // a static preview (plain file server) answers /api/* with an HTML
          // 404 — say what is actually wrong instead of a JSON parse error
          try { out = await r.json(); }
          catch (_) { throw new Error('The server endpoint is not running — this preview needs `vercel dev`, or the deployed site.'); }
          if (!r.ok) throw new Error(out.error || 'Could not start caption generation');
          genCap.textContent = 'Generating…';
          toast('Captions are on their way — they appear here when Mux finishes, usually a few minutes.');
        } catch (e) {
          toast(e.message || 'Could not start caption generation');
          genCap.disabled = false; genCap.textContent = 'Generate captions';
        }
      });

      // The slug follows the title only while it has never been touched.
      // Once edited it is the admin's, and retyping the title must not
      // silently change a URL that may already be shared.
      var slugEl = $('vid-slug'), titleEl = $('vid-title');
      if (slugEl) slugEl.addEventListener('input', function () { VID._slugTouched = true; });
      if (titleEl && slugEl) titleEl.addEventListener('input', async function () {
        if (VID._slugTouched || v.status === 'published') return;
        var r = await db.rpc('video_slugify', { p_text: titleEl.value });
        if (!VID._slugTouched) { slugEl.value = r.data || ''; videoLive(); }
      });

      // ── keyword tags ──
      var tagInput = $('vid-tag-input');
      var addTag = function (raw) {
        var val = String(raw || '').trim().replace(/\s+/g, ' ');
        if (!val) return;
        var have = (VID.editing.search_keywords || []);
        if (have.some(function (k) { return k.toLowerCase() === val.toLowerCase(); })) return;
        VID.editing.search_keywords = have.concat([val]);
        tagInput.insertAdjacentHTML('beforebegin', vidTag(val));
        tagInput.value = '';
        wireTagRemovers();
        videoSyncSave();
      };
      if (tagInput) {
        tagInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(tagInput.value); }
          else if (e.key === 'Backspace' && !tagInput.value) {
            var last = (VID.editing.search_keywords || []).slice(-1)[0];
            if (last) removeTag(last);
          }
        });
        tagInput.addEventListener('blur', function () { addTag(tagInput.value); });
        // pasting a comma-separated list should just work
        tagInput.addEventListener('paste', function (e) {
          var text = (e.clipboardData || window.clipboardData).getData('text');
          if (text && text.indexOf(',') !== -1) {
            e.preventDefault();
            text.split(',').forEach(addTag);
          }
        });
      }
      function removeTag(kw) {
        VID.editing.search_keywords = (VID.editing.search_keywords || [])
          .filter(function (k) { return k !== kw; });
        var el = document.querySelector('.vid-tag[data-kw="' + CSS.escape(kw) + '"]');
        if (el) el.remove();
        videoSyncSave();
      }
      function wireTagRemovers() {
        document.querySelectorAll('.vid-tag-x').forEach(function (x) {
          if (x.dataset.w) return; x.dataset.w = '1';
          x.addEventListener('click', function () { removeTag(x.closest('.vid-tag').dataset.kw); });
        });
      }
      wireTagRemovers();

      // ── a category without losing the draft ──
      var newcat = $('vid-newcat'), row = $('vid-newcat-row');
      if (newcat) newcat.addEventListener('click', function () {
        row.hidden = false; newcat.hidden = true; $('vid-newcat-name').focus();
      });
      var cancelCat = $('vid-newcat-cancel');
      if (cancelCat) cancelCat.addEventListener('click', function () {
        row.hidden = true;
        if (newcat) newcat.hidden = false;
      });
      var saveCat = $('vid-newcat-save');
      if (saveCat) saveCat.addEventListener('click', async function () {
        var name = ($('vid-newcat-name').value || '').trim();
        if (!name) return;
        saveCat.disabled = true;
        try {
          var sl = await db.rpc('video_slugify', { p_text: name });
          var r = await db.from('video_categories').insert({ name: name, slug: sl.data }).select().single();
          if (r.error) throw r.error;
          VID.cats.push(r.data);
          var sel = $('vid-category');
          if (sel) {
            // the pre-collections fallback select
            sel.insertAdjacentHTML('beforeend', '<option value="' + r.data.id + '">' + esc(r.data.name) + '</option>');
            sel.value = r.data.id;        // chosen for you — it is why you made it
          } else {
            // chips: it becomes home if there is none, an extra shelf otherwise
            if (!VID.catPrimary) VID.catPrimary = r.data.id;
            else (VID.catExtra = VID.catExtra || []).push(r.data.id);
            wireVideoXcats();
          }
          videoSyncSave();
          row.hidden = true;
          if (newcat) newcat.hidden = false;
          $('vid-newcat-name').value = '';
          toast('Category added');
        } catch (e) {
          toast(/duplicate/i.test(e.message || '') ? 'There is already a category with that name' : e.message);
        } finally { saveCat.disabled = false; }
      });

      // ── thumbnail ──
      VID._timeTok = null;   // scrub tokens never outlive a form draw
      document.querySelectorAll('[data-thumb-mode]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          VID.editing.thumbnail_mode = btn.dataset.thumbMode;
          document.querySelectorAll('[data-thumb-mode]').forEach(function (o) {
            o.classList.toggle('on', o === btn);
          });
          var t = $('vid-thumb-time');
          if (t) t.hidden = btn.dataset.thumbMode !== 'timestamp';
          videoThumbPreview();   // renders the mode, including Upload's drop surface
          if (btn.dataset.thumbMode === 'timestamp') videoThumbTimeChanged();
          videoSyncSave();
        });
      });
      // the scrubber: slider and seconds box are one control — moving
      // either updates the other and re-cuts the preview frame
      var timeSlider = $('vid-time-slider'), timeBox = $('vid-time');
      if (timeSlider && timeBox) {
        timeSlider.addEventListener('input', function () {
          timeBox.value = timeSlider.value;
          videoSyncSave();
          videoThumbTimeChanged();
        });
        timeBox.addEventListener('input', function () {
          var n = parseFloat(timeBox.value);
          if (!isNaN(n)) timeSlider.value = Math.min(Math.max(n, 0), parseFloat(timeSlider.max));
          videoThumbTimeChanged();
        });
      }

      // ── save / publish ──
      // One Save. It writes the fields, then applies whatever Visibility is
      // set to — two buttons meant you could save a video and leave its
      // visibility unapplied, with nothing on screen saying so.
      var saveTop = $('vid-save-top');
      if (saveTop) saveTop.addEventListener('click', function () { saveVideo(saveTop, err); });

      // ── a thumbnail of your own ──
      // The preview surface takes the click, the drop and the keyboard —
      // listeners live on the host, which survives every innerHTML redraw.
      var tHost = $('vid-thumb-preview'), tFile = $('vid-thumb-file'), tErr = $('vid-thumb-err');
      if (tHost && tFile) {
        var takeThumb = function (f) { if (f) uploadThumbnail(f, tErr); };
        var droppable = function () { return tHost.classList.contains('droppable'); };
        tFile.addEventListener('change', function () { takeThumb(tFile.files && tFile.files[0]); tFile.value = ''; });
        tHost.addEventListener('click', function () { if (droppable()) tFile.click(); });
        tHost.addEventListener('keydown', function (e) {
          if (!droppable()) return;
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tFile.click(); }
        });
        ['dragenter', 'dragover'].forEach(function (t) {
          tHost.addEventListener(t, function (e) {
            if (!droppable()) return;
            e.preventDefault(); tHost.classList.add('over');
          });
        });
        ['dragleave', 'drop'].forEach(function (t) {
          tHost.addEventListener(t, function (e) {
            if (!droppable()) return;
            e.preventDefault(); tHost.classList.remove('over');
          });
        });
        tHost.addEventListener('drop', function (e) {
          if (!droppable()) return;
          takeThumb(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
        });
      }
      // the radios only change what the box shows; nothing moves until Apply
      document.querySelectorAll('input[name="vid-vis"]').forEach(function (r) {
        r.addEventListener('change', function () {
          document.querySelectorAll('.vid-radio').forEach(function (l) {
            l.classList.toggle('on', l.contains(r) && r.checked);
          });
          var when = $('vid-when');
          if (when) when.hidden = r.value !== 'scheduled';
          // visibility is part of the save fingerprint — without this, Save
          // stayed asleep after choosing Published (the collection editor
          // already did it; this one had forgotten)
          videoSyncSave();
        });
      });
      var visWhenAt = $('vid-when-at');
      if (visWhenAt) visWhenAt.addEventListener('input', videoSyncSave);

      // ── the More menu ──
      var moreBtn = $('vid-more-btn'), menu = $('vid-menu');
      if (moreBtn && menu) {
        var closeMenu = function () {
          menu.hidden = true; moreBtn.setAttribute('aria-expanded', 'false');
          document.removeEventListener('click', away);
        };
        var away = function (e) { if (!menu.contains(e.target) && e.target !== moreBtn) closeMenu(); };
        moreBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var open = menu.hidden;
          menu.hidden = !open;
          moreBtn.setAttribute('aria-expanded', String(open));
          if (open) setTimeout(function () { document.addEventListener('click', away); }, 0);
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !menu.hidden) { closeMenu(); moreBtn.focus(); }
        });

        menu.querySelectorAll('[data-act]').forEach(function (item) {
          item.addEventListener('click', async function () {
            var act = item.dataset.act;

            if (act === 'copy') {
              var url = location.origin + '/video/' + (v.slug || '');
              try { await navigator.clipboard.writeText(url); toast('Link copied'); }
              catch (_) { toast(url); }
              closeMenu(); return;
            }

            if (act === 'archive') {
              closeMenu();
              try {
                var r = await db.rpc('archive_video', { p_id: v.id });
                if (r.error) throw r.error;
                toast('Archived'); VID.editing = null; editorHash('videos', null); await renderVideos();
              } catch (e) { toast(e.message || 'Could not archive'); }
              return;
            }

            if (act === 'delete') {
              // Two clicks, in the menu itself, rather than a modal — and the
              // label says what survives, because "delete" here does NOT
              // touch the Mux master. Destroying that is a separate act.
              if (item.dataset.armed !== '1') {
                item.dataset.armed = '1';
                item.textContent = 'Really delete? The video file stays on Mux.';
                clearTimeout(item._d);
                item._d = setTimeout(function () {
                  item.dataset.armed = '0'; item.textContent = 'Delete video';
                }, 4000);
                return;
              }
              closeMenu();
              try {
                // Resource LINKS cascade with the row; the files themselves
                // stay in the shared Resources library, where they may serve
                // other videos and collections. Real file deletion — with its
                // in-use warning — lives in Content → Resources.
                var d = await db.from('videos').delete().eq('id', v.id);
                if (d.error) throw d.error;
                toast('Deleted. Its files stay in Resources; the video stays on Mux.');
                VID.editing = null; editorHash('videos', null); await renderVideos();
              } catch (e) { toast(e.message || 'Could not delete that'); }
            }
          });
        });
      }

      // ── file ──
      var refresh = $('vid-refresh');
      if (refresh) refresh.addEventListener('click', async function () {
        await renderVideos();
        VID.editing = VID.rows.filter(function (r) { return r.id === v.id; })[0] || null;
        if (VID.editing) drawVideos();
      });
      var upCancel = $('vid-upload-cancel');
      if (upCancel) upCancel.addEventListener('click', async function () {
        if (upCancel.dataset.armed !== '1') {
          upCancel.dataset.armed = '1';
          upCancel.textContent = 'Sure? The stalled transfer is lost';
          setTimeout(function () {
            upCancel.dataset.armed = '0';
            upCancel.textContent = 'Cancel and start over';
          }, 4000);
          return;
        }
        upCancel.disabled = true;
        try {
          var r = await db.from('videos')
            .update({ status: 'draft', mux_upload_id: null, mux_asset_status: null, mux_error: null })
            .eq('id', v.id).select().single();
          if (r.error) throw r.error;
          VID.editing = r.data;
          drawVideos();   // the drop zone comes back, ready for the file
          toast('Upload cancelled — drop the file again when ready.');
        } catch (e) {
          toast(e.message || 'Could not cancel that.');
          upCancel.disabled = false;
        }
      });
      var drop = $('vid-drop'), file = $('vid-file');
      if (drop && file) {
        file.addEventListener('change', function () {
          if (file.files && file.files[0]) startVideoUpload(false, file.files[0]);
        });
        ['dragenter', 'dragover'].forEach(function (t) {
          drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
        });
        ['dragleave', 'drop'].forEach(function (t) {
          drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
        });
        drop.addEventListener('drop', function (e) {
          var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (f) startVideoUpload(false, f);
        });
      }
      var start = $('vid-start');
      // "Try again" seats the DROP ZONE, not the uploader — with no file in
      // hand and the component's chrome hidden, starting the upload flow
      // directly would stall at 0% with nothing to pick a file with
      if (start) start.addEventListener('click', function () {
        var host = document.getElementById('vid-upload');
        if (host) { host.innerHTML = dropZoneHTML(); wireVideoForm(); }
      });
      var replace = $('vid-replace');
      if (replace) replace.addEventListener('click', function () {
        if (replace.dataset.armed !== '1') {
          replace.dataset.armed = '1'; replace.textContent = 'Replace — sure?';
          setTimeout(function () { replace.dataset.armed = '0'; replace.textContent = 'Replace'; }, 3000);
          return;
        }
        startVideoUpload(true);
      });

      // The player loads because there is something to play, not because a
      // button exists — Reload was removed and this was gated on it.
      if (v.mux_playback_id && document.getElementById('vid-player')) previewVideo(null, true);

      var catSel = $('vid-category');
      if (catSel) catSel.addEventListener('change', function () {
        videoSyncSave();
        wireVideoXcats();   // the new primary is no longer offered as an extra shelf
      });

      wireVideoResources();
      videoLive();
      videoMarkClean();            // the baseline is whatever just rendered
      if (!v._new) loadVideoResources();
    }

    async function saveVideo(btn, err, quiet) {
      if (VID.busy && !quiet) return;
      var v = VID.editing;
      var vals = videoRead();
      if (!vals.title) { err.textContent = 'A title is required.'; throw new Error('no title'); }
      if (!quiet) { VID.busy = true; if (btn) btn.disabled = true; }
      err.textContent = '';
      try {
        var kw = VID.editing.search_keywords || [];
        if (v._new) {
          if (!vals.slug) {
            var sl = await db.rpc('video_slugify', { p_text: vals.title });
            vals.slug = sl.data;
          }
          var free = await db.rpc('video_slug_available', { p_slug: vals.slug, p_exclude: null });
          if (free.data === false) vals.slug += '-' + Date.now().toString(36).slice(-4);
          var ins = await db.from('videos').insert(vals).select().single();
          if (ins.error) throw ins.error;
          VID.editing = ins.data;
          editorHash('videos', ins.data.id);   // the fresh draft is addressable from its first save
          if (kw.length) await db.rpc('set_video_keywords', { p_id: ins.data.id, p_keywords: kw });
          await applyVideoCategoryLinks(ins.data.id, null, vals.category_id);
          // quiet = upload-first created this draft; "add the file" would
          // be nonsense while the file is already on its way
          if (!quiet) toast('Draft created — now add the file');
        } else {
          var free2 = await db.rpc('video_slug_available', { p_slug: vals.slug, p_exclude: v.id });
          if (free2.data === false) throw new Error('That URL is taken by another video.');
          var oldPrimary = v.category_id || null;
          var up = await db.from('videos').update(vals).eq('id', v.id).select().single();
          if (up.error) throw up.error;
          await db.rpc('set_video_keywords', { p_id: v.id, p_keywords: kw });
          await applyVideoCategoryLinks(v.id, oldPrimary, vals.category_id);
          VID.editing = up.data;
          // a rename follows the video up to Mux, so their dashboard keeps
          // knowing this asset by name — fire and forget
          if (vals.title !== v.title && up.data.mux_asset_id) syncAssetTitle(v.id);
          if (!quiet) toast('Saved');
        }
        // then the visibility the radios are showing, if it differs from what
        // the row already says
        if (!quiet && !v._new) {
          var chosen = (document.querySelector('input[name="vid-vis"]:checked') || {}).value;
          var now = videoVisibility(VID.editing);
          if (chosen && chosen !== now) {
            if (chosen === 'published') {
              var p = await db.rpc('publish_video', { p_id: VID.editing.id });
              if (p.error) throw p.error;
            } else if (chosen === 'scheduled') {
              var at = (document.getElementById('vid-when-at') || {}).value;
              if (!at) throw new Error('Pick a date and time for it to go live.');
              var sc = await db.rpc('schedule_video', { p_id: VID.editing.id, p_at: new Date(at).toISOString() });
              if (sc.error) throw sc.error;
            } else {
              var un = await db.rpc('unpublish_video', { p_id: VID.editing.id });
              if (un.error) throw un.error;
            }
          }
        }
        if (!quiet) {
          var keep = VID.editing.id;
          await renderVideos();
          VID.editing = VID.rows.filter(function (r) { return r.id === keep; })[0] || VID.editing;
          drawVideos();       // re-renders, which re-baselines through videoMarkClean
        }
      } catch (e) {
        err.textContent = e.message || 'Could not save that.';
        throw e;
      } finally {
        if (!quiet) { VID.busy = false; if (btn) btn.disabled = false; }
      }
    }

    // The junction is the membership; the primary category on the row is
    // mirrored into it by a database trigger. Here only the DIFFERENCE the
    // admin made is applied — and when the primary changes, the old shelf
    // comes off unless it was deliberately kept as an extra.
    async function applyVideoCategoryLinks(videoId, oldPrimary, newPrimary) {
      if (!VID.x || !VID.x.ok) return;
      var extras = VID.catExtra || [];
      var initial = VID.catExtraInitial || [];
      var adds = extras.filter(function (id) { return initial.indexOf(id) === -1; });
      var dels = initial.filter(function (id) {
        return extras.indexOf(id) === -1 && id !== newPrimary;
      });
      if (oldPrimary && newPrimary && oldPrimary !== newPrimary &&
          extras.indexOf(oldPrimary) === -1 && dels.indexOf(oldPrimary) === -1) {
        dels.push(oldPrimary);
      }
      if (adds.length) {
        var a = await db.from('video_category_links').upsert(
          adds.map(function (id) { return { video_id: videoId, category_id: id }; }),
          { onConflict: 'video_id,category_id', ignoreDuplicates: true });
        if (a.error) throw a.error;
      }
      if (dels.length) {
        var d = await db.from('video_category_links').delete()
          .eq('video_id', videoId).in('category_id', dels);
        if (d.error) throw d.error;
      }
      VID.catExtraInitial = extras.slice();
    }

    // ── PDF resources ───────────────────────────────────────────────────────
    // Each file uploads on its own and reports its own failure. One bad PDF
    // must not take the others down with it.
    function wireVideoResources() {
      var input = document.getElementById('vid-pdf-input');
      var drop = document.getElementById('vid-pdf-drop');
      var err = document.getElementById('vid-pdf-err');
      if (!input || !drop) return;

      var take = function (files) {
        [].slice.call(files || []).forEach(function (f) { uploadResource(f, err); });
      };
      input.addEventListener('change', function () { take(input.files); input.value = ''; });
      ['dragenter', 'dragover'].forEach(function (t) {
        drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
      });
      ['dragleave', 'drop'].forEach(function (t) {
        drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
      });
      drop.addEventListener('drop', function (e) { take(e.dataTransfer && e.dataTransfer.files); });

      // detach — the LINK goes; the file stays in the Resources library,
      // where deleting for real (with an in-use warning) lives
      document.querySelectorAll('.vid-res-del').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          if (btn.dataset.armed !== '1') {
            btn.dataset.armed = '1'; btn.classList.add('armed');
            btn.setAttribute('data-tooltip', 'Click again to detach');
            setTimeout(function () {
              btn.dataset.armed = '0'; btn.classList.remove('armed');
              btn.setAttribute('data-tooltip', 'Detach'); }, 3000);
            return;
          }
          var id = btn.closest('li').dataset.link;
          try {
            var r = await db.from('resource_links').delete().eq('id', id);
            if (r.error) throw r.error;
            await loadVideoResources();
            toast('Detached — the file stays in Resources');
          } catch (e) { toast(e.message || 'Could not detach that'); }
        });
      });

      var pick = document.getElementById('vid-res-pick');
      if (pick) pick.addEventListener('change', async function () {
        if (!pick.value) return;
        try {
          var r = await db.from('resource_links').insert({
            resource_id: pick.value, video_id: VID.editing.id,
            sort_order: (VID.resources || []).length,
          });
          if (r.error) throw r.error;
          await loadVideoResources();
        } catch (e) { toast(e.message || 'Could not attach that'); }
      });
    }

    async function uploadResource(file, err) {
      var v = VID.editing;
      if (!v || v._new) return;
      err.textContent = '';
      if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) {
        err.textContent = file.name + ' is not a PDF.'; return;
      }
      if (file.size > 26214400) { err.textContent = file.name + ' is over 25MB.'; return; }

      var host = document.getElementById('vid-resources');
      var tmp = document.createElement('p');
      tmp.className = 'nf-hint';
      tmp.textContent = 'Uploading ' + file.name + '…';
      host.appendChild(tmp);
      try {
        var id = (crypto.randomUUID && crypto.randomUUID()) ||
                 (Date.now().toString(36) + Math.random().toString(36).slice(2));
        var path = v.id + '/' + id + '.pdf';
        var up = await db.storage.from('video-resources')
          .upload(path, file, { contentType: 'application/pdf', upsert: false });
        if (up.error) throw up.error;
        // into the shared library, then linked to this video — the same file
        // can later be attached to a collection or another video for free
        var ins = await db.from('resources').insert({
          title: file.name.replace(/\.pdf$/i, ''),
          storage_path: path, file_name: file.name, file_size: file.size,
        }).select().single();
        if (ins.error) {
          // do not leave a file nobody can see
          await db.storage.from('video-resources').remove([path]);
          throw ins.error;
        }
        var link = await db.from('resource_links').insert({
          resource_id: ins.data.id, video_id: v.id,
          sort_order: (VID.resources || []).length,
        });
        if (link.error) throw link.error;
        await loadVideoResources();
      } catch (e) {
        err.textContent = 'Could not attach ' + file.name + ' — ' + (e.message || 'upload failed');
      } finally { tmp.remove(); }
    }

    // Straight to Supabase Storage, not through Mux — Mux stores video, and
    // a poster we chose has nothing to do with the asset.
    async function uploadThumbnail(file, err) {
      var v = VID.editing;
      if (!v || v._new) return;
      err.textContent = '';
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {
        err.textContent = 'That needs to be a JPG, PNG or WebP.'; return;
      }
      if (file.size > 5242880) { err.textContent = 'That image is over 5MB.'; return; }
      var host = document.getElementById('vid-thumb-preview');
      if (host) host.innerHTML = '<div class="vid-spinner" aria-label="Uploading"></div>';
      try {
        var ext = file.type === 'image/png' ? 'png' : file.type === 'image/webp' ? 'webp' : 'jpg';
        // one path per video, overwritten on replace, so old posters do not
        // pile up in the bucket unreferenced
        var path = v.id + '/thumbnail.' + ext;
        var up = await db.storage.from('video-thumbnails')
          .upload(path, file, { contentType: file.type, upsert: true });
        if (up.error) throw up.error;
        var pub = db.storage.from('video-thumbnails').getPublicUrl(path);
        // cache-bust: the path is stable, so a replaced image would otherwise
        // keep showing the old one
        var url = pub.data.publicUrl + '?v=' + Date.now().toString(36);
        var r = await db.from('videos')
          .update({ thumbnail_mode: 'custom', custom_thumbnail_url: url })
          .eq('id', v.id).select().single();
        if (r.error) throw r.error;
        VID.editing.custom_thumbnail_url = url;
        VID.editing.thumbnail_mode = 'custom';
        videoThumbPreview();
        toast('Thumbnail updated');
      } catch (e) {
        err.textContent = e.message || 'Could not upload that image.';
        videoThumbPreview();
      }
    }

    async function loadVideoResources() {
      var v = VID.editing; if (!v || v._new) return;
      var got = await Promise.all([
        db.from('resource_links').select('*, resources(*)').eq('video_id', v.id).order('sort_order'),
        db.from('resources').select('*').order('created_at', { ascending: false }),
      ]);
      if (got[0].error) {
        // video-collections.sql has not been run yet — say so where the
        // files would be, rather than failing silently
        var h = document.getElementById('vid-resources');
        if (h) h.innerHTML = '<p class="muted vid-none">Resources need <code>supabase/video-collections.sql</code> run in Supabase.</p>';
        return;
      }
      VID.resources = got[0].data || [];
      VID.allResources = got[1].data || [];
      var host = document.getElementById('vid-resources');
      if (host) { host.innerHTML = videoResourceList(); }
      var attach = document.getElementById('vid-res-attach');
      if (attach) attach.innerHTML = videoAttachPicker();
      wireVideoResources();
    }


    // ── preview ─────────────────────────────────────────────────────────────
    // The player bundles hls.js and weighs about a megabyte, so it is fetched
    // the first time a form with a ready video opens rather than on every
    // admin page load. Cached for the session after that.
    var muxPlayerReady = null;
    function loadMuxPlayer() {
      if (muxPlayerReady) return muxPlayerReady;
      muxPlayerReady = new Promise(function (resolve, reject) {
        if (window.customElements && customElements.get('mux-player')) return resolve();
        var sc = document.createElement('script');
        sc.src = 'lib/vendor/mux-player-v3.13.2.js';
        sc.onload = function () { resolve(); };
        sc.onerror = function () { muxPlayerReady = null; reject(new Error('Could not load the player')); };
        document.head.appendChild(sc);
      });
      return muxPlayerReady;
    }

    // Mux's dashboard lists assets by meta.title — this keeps that name in
    // step with ours. Best-effort: a miss costs nothing and self-heals on
    // the next title save.
    async function syncAssetTitle(videoId) {
      try {
        var sess = await db.auth.getSession();
        var token = sess.data && sess.data.session && sess.data.session.access_token;
        await fetch('/api/mux/asset-title', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ videoId: videoId }),
        });
      } catch (_) { /* never interrupts a save */ }
    }

    // The token comes from the server, which checks admin AND that there is
    // something to play. Nothing here decides who may watch — that lives in
    // canWatch() so the rule cannot drift between admin and member.
    async function previewVideo(btn, auto) {
      var v = VID.editing;
      var host = document.getElementById('vid-player');
      if (!v || !host) return;
      if (btn) btn.disabled = true;
      var was = btn ? btn.textContent : '';
      if (btn && !auto) { btn.textContent = 'Loading…'; host.classList.add('is-loading'); }
      try {
        var sess = await db.auth.getSession();
        var token = sess.data && sess.data.session && sess.data.session.access_token;
        var r = await fetch('/api/mux/playback-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ videoId: v.id }),
        });
        var out = await r.json();
        if (!r.ok) throw new Error(out.error || 'Could not start playback');

        // stills are signed too — keep the token so the thumbnail picker and
        // the list can render images at all
        if (out.thumbnailToken) {
          VID.editing.thumb_token = out.thumbnailToken;
          var listed = VID.rows.filter(function (x) { return x.id === VID.editing.id; })[0];
          if (listed) listed.thumb_token = out.thumbnailToken;
          videoThumbPreview();
        }

        await loadMuxPlayer();

        var el = document.createElement('mux-player');
        el.setAttribute('playback-id', out.playbackId);
        el.setAttribute('playback-token', out.playbackToken);
        if (out.thumbnailToken) el.setAttribute('thumbnail-token', out.thumbnailToken);
        el.setAttribute('stream-type', 'on-demand');
        el.setAttribute('metadata-video-title', v.title || '');
        el.setAttribute('metadata-video-id', v.id);
        // Mux Data attributes it to the admin, not a member, so previews do
        // not pollute the engagement numbers for this video.
        el.setAttribute('metadata-viewer-user-id', 'admin-preview');
        el.setAttribute('accent-color', getComputedStyle(document.documentElement)
          .getPropertyValue('--accent').trim() || '#7A3E70');
        var poster = videoPlayerPoster();
        if (poster) el.setAttribute('poster', poster);
        host.innerHTML = '';
        host.classList.remove('is-loading');
        host.appendChild(el);
        if (btn) { btn.textContent = 'Reload'; btn.disabled = false; }
        if (typeof fsTrack === 'function') {
          fsTrack('admin_video_previewed', { resourceType: 'video', resourceId: v.id });
        }
      } catch (e) {
        host.classList.remove('is-loading');
        host.innerHTML = '<p class="nf-err">' + esc(e.message || 'Could not preview that.') + '</p>';
        if (btn) { btn.textContent = was === 'Loading…' ? 'Reload' : was; btn.disabled = false; }
      }
    }

    // Asks our server for a one-time Mux URL, then hands it to <mux-uploader>.
    // The file goes browser → Mux directly; it never passes through Vercel,
    // which is the only way a large class recording uploads at all.
    async function startVideoUpload(replace, file) {
      var v = VID.editing;
      var host = document.getElementById('vid-upload');
      var note = document.getElementById('vid-upload-note');
      if (!v || !host) return;
      // upload-first: a brand-new form creates its own draft the moment a
      // file arrives — named from the title box if one was typed, else from
      // the file itself. The form stays put; only the zone changes.
      if (v._new) {
        var titleEl = document.getElementById('vid-title');
        if (titleEl && !titleEl.value.trim() && file) {
          titleEl.value = file.name.replace(/\.[a-z0-9]+$/i, '').replace(/[._-]+/g, ' ').trim() || 'Untitled video';
        }
        try {
          await saveVideo(null, document.getElementById('vid-err'), true);
          v = VID.editing;              // the row exists now, with an id
          videoMarkClean();             // the Save button relaxes to Saved
        } catch (e2) {
          host.innerHTML = '<p class="nf-err">' + esc(e2.message || 'Could not create the draft.') + '</p>' +
            '<button class="btn-secondary" id="vid-start">Try again</button>';
          wireVideoForm();
          return;
        }
      }
      host.innerHTML = '<p class="muted">Getting an upload link…</p>';
      try {
        var sess = await db.auth.getSession();
        var token = sess.data && sess.data.session && sess.data.session.access_token;
        var r = await fetch('/api/mux/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ videoId: v.id, replace: !!replace }),
        });
        var out = await r.json();
        if (!r.ok) throw new Error(out.error || 'Could not start the upload');

        // mux-uploader with NO chrome of its own: our drop zone already
        // collected the file, so it is driven through its API and only its
        // progress is surfaced, through our own bar.
        host.innerHTML =
          '<div class="vid-progress-wrap">' +
            '<div class="vid-bar"><span id="vid-bar-fill"></span></div>' +
            '<p id="vid-pct">Starting…</p>' +
            '<span class="nf-hint">Keep this tab open.</span>' +
          '</div>' +
          '<mux-uploader id="vid-mux" endpoint="' + esc(out.uploadUrl) + '" hidden></mux-uploader>';
        note.textContent = '';

        var up = document.getElementById('vid-mux');
        var fill = document.getElementById('vid-bar-fill');
        var pct = document.getElementById('vid-pct');
        up.addEventListener('progress', function (ev) {
          var p = Math.max(0, Math.min(100, Math.round(ev.detail || 0)));
          if (fill) fill.style.width = p + '%';
          if (pct) pct.textContent = p + '%';
        });
        // a file the drop zone already has never needs a second dialog.
        // mux-uploader's ONLY programmatic hand-off is the file-ready
        // event (there is no uploadFile method and no file setter — the
        // old guess at both did nothing, silently, forever).
        if (file) {
          up.dispatchEvent(new CustomEvent('file-ready', {
            composed: true, bubbles: true, detail: file,
          }));
        }
        // leaving mid-upload loses the transfer — Mux has no resume for a
        // half-sent direct upload, so it is worth interrupting the admin for
        var guard = function (e) { e.preventDefault(); e.returnValue = ''; };
        window.addEventListener('beforeunload', guard);

        up.addEventListener('success', async function () {
          window.removeEventListener('beforeunload', guard);
          note.textContent = 'Uploaded. Mux is processing it now — this usually takes a few minutes.';
          // The webhook sets the real status; this only reflects what we know.
          await db.from('videos').update({ status: 'processing' }).eq('id', v.id);
          await renderVideos();
          VID.editing = VID.rows.filter(function (r) { return r.id === v.id; })[0] || null;
          if (VID.editing) drawVideos();
        });
        up.addEventListener('uploaderror', function (ev) {
          window.removeEventListener('beforeunload', guard);
          note.textContent = '';
          host.innerHTML = '<p class="nf-err">The upload failed. ' +
            esc((ev.detail && ev.detail.message) || '') + '</p>' +
            '<button class="btn-secondary" id="vid-start">Try again</button>';
          wireVideoForm();
        });
      } catch (e) {
        host.innerHTML = '<p class="nf-err">' + esc(e.message) + '</p>' +
          '<button class="btn-secondary" id="vid-start">Try again</button>';
        wireVideoForm();
      }
    }

    // ── Content › Video › Categories ────────────────────────────────────────
    async function renderVideoCategories() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var res = await db.from('video_categories').select('*').order('sort_order');
        if (res.error) throw res.error;
        VID.cats = res.data || [];
        // usage counts — videos via the link table (falls back to the
        // primary column pre-migration), collections via their junction
        VID.catCounts = { vids: {}, cols: {} };
        var links = await db.from('video_category_links').select('video_id, category_id');
        if (!links.error) {
          (links.data || []).forEach(function (l) {
            VID.catCounts.vids[l.category_id] = (VID.catCounts.vids[l.category_id] || 0) + 1;
          });
          var cc = await db.from('collection_categories').select('collection_id, category_id');
          (cc.data || []).forEach(function (l) {
            VID.catCounts.cols[l.category_id] = (VID.catCounts.cols[l.category_id] || 0) + 1;
          });
          VID.catCounts.hasCols = true;
        } else {
          var vids = await db.from('videos').select('id, category_id');
          (vids.data || []).forEach(function (v) {
            if (v.category_id) VID.catCounts.vids[v.category_id] = (VID.catCounts.vids[v.category_id] || 0) + 1;
          });
        }
        // arriving via the router: #video-categories/<id> opens that editor,
        // the plain hash closes any editor so the page matches the address.
        // Direct renderVideoCategories() calls skip this entirely.
        if (CATE._openOnRender !== undefined) {
          var want = CATE._openOnRender; CATE._openOnRender = undefined;
          if (want && VID.cats.some(function (c) { return c.id === want; })) {
            await openCategory(want);
            return;
          }
          CATE.editing = null;
          editorHash('video-categories', null);   // gone or never existed — the list is the truth
        }
        drawVideoCategories();
      } catch (e) {
        b.innerHTML = /relation .* does not exist/i.test(e.message || '')
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Categories</h2></div>' +
            '<div class="adm-intro" style="margin:0">This needs <code>supabase/video-library.sql</code> run in Supabase.</div></div>'
          : stateError(e && e.message);
      }
    }

    function drawVideoCategories() {
      var b = bodyEl(); if (!b) return;
      if (CATE.editing) { drawCategoryForm(); return; }
      var live = VID.cats.filter(function (c) { return c.status === 'active'; });
      var counts = VID.catCounts || { vids: {}, cols: {} };
      b.innerHTML =
        '<div class="cat-controls lib-bar">' +
          '<button class="btn-primary" id="vcat-new">New category</button>' +
          '<span class="adm-count">' + num(live.length) + (live.length === 1 ? ' category' : ' categories') + '</span>' +
        '</div>' +
        (live.length
          ? '<ul class="lib-list" id="vcat-list">' +
            live.map(function (c) {
              var meta = ['/' + (c.slug || ''),
                num(counts.vids[c.id] || 0) + ((counts.vids[c.id] || 0) === 1 ? ' video' : ' videos')];
              if (counts.hasCols) meta.push(num(counts.cols[c.id] || 0) + ((counts.cols[c.id] || 0) === 1 ? ' collection' : ' collections'));
              return '<li class="lib-row" draggable="true" data-catid="' + c.id + '" tabindex="0" role="button" aria-label="Edit ' + esc(c.name) + '">' +
                '<span class="col-grip" aria-hidden="true"><span class="material-symbols-sharp">drag_indicator</span></span>' +
                '<span class="lib-thumb">' +
                  (c.cover_image_url
                    ? '<img alt="" loading="lazy" src="' + esc(c.cover_image_url) + '">'
                    : '<span class="material-symbols-sharp">library_books</span>') + '</span>' +
                '<span class="lib-main">' +
                  '<span class="lib-title">' + esc(c.name) + '</span>' +
                  '<span class="lib-meta">' + esc(meta.join(' · ')) + '</span>' +
                '</span>' +
                '<span class="lib-side">' +
                  '<button class="btn-icon adm-del vcat-del" data-tooltip="Archive" aria-label="Archive ' + esc(c.name) + '"><span class="material-symbols-sharp">delete</span></button>' +
                '</span>' +
              '</li>';
            }).join('') + '</ul>'
          : '<div class="adm-state"><span class="adm-state-ico"><span class="material-symbols-sharp">library_books</span></span>' +
            '<h3>No categories yet</h3>' +
            '<p>Name the first shelf above — videos and collections need one to live on.</p></div>');
      wireVideoCategories();

    // walk the DOM order and stamp 1..n onto video_categories.sort_order —
    // the list is the ordering surface, so dragging here IS the member order
    async function persistCategoryListOrder() {
      var list = document.getElementById('vcat-list');
      if (!list) return;
      var writes = [];
      [].forEach.call(list.querySelectorAll('.lib-row'), function (row, at) {
        var id = row.dataset.catid;
        writes.push(db.from('video_categories').update({ sort_order: at + 1 }).eq('id', id));
        var c = VID.cats.filter(function (x) { return x.id === id; })[0];
        if (c) c.sort_order = at + 1;
      });
      var results = await Promise.all(writes);
      var bad = results.filter(function (r) { return r.error; })[0];
      if (bad) { toast(bad.error.message || 'Could not save the new order'); return; }
      VID.cats.sort(function (a, b2) { return (a.sort_order || 0) - (b2.sort_order || 0); });
      toast('Order saved');
    }

    function wireVideoCategories() {
      var b = bodyEl(); if (!b) return;
      // New goes STRAIGHT to the editor: the row is born with a placeholder
      // name and a throwaway slug, and the first save with a real title
      // claims a real URL. No form before the form.
      var nw = document.getElementById('vcat-new');
      if (nw) nw.addEventListener('click', async function () {
        if (VID.busy) return;
        VID.busy = true; nw.disabled = true;
        try {
          var slug = 'new-category-' + Date.now().toString(36);
          var r = await db.from('video_categories')
            .insert({ name: 'New category', slug: slug }).select().single();
          if (r.error) throw r.error;
          CATE._freshSlug = slug;
          VID.busy = false;
          await openCategory(r.data.id);
          return;
        } catch (e) {
          toast(e.message || 'Could not create that.');
          VID.busy = false; nw.disabled = false;
        }
      });

      // rows open the editor; the grip drags; the bin archives
      b.querySelectorAll('.lib-row[data-catid]').forEach(function (row) {
        var open = function () { openCategory(row.dataset.catid); };
        row.addEventListener('click', function (e) {
          if (e.target.closest('.vcat-del') || e.target.closest('.col-grip')) return;
          open();
        });
        row.addEventListener('keydown', function (e) {
          if (e.target !== row) return;
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
        });
      });

      var list = document.getElementById('vcat-list');
      if (list) {
        var dragging = null;
        list.querySelectorAll('.lib-row').forEach(function (row) {
          row.addEventListener('dragstart', function (e) {
            dragging = row; row.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            try { e.dataTransfer.setData('text/plain', row.dataset.catid); } catch (_) {}
          });
          row.addEventListener('dragend', function () {
            if (dragging) dragging.classList.remove('dragging');
            dragging = null;
            list.querySelectorAll('.lib-row').forEach(function (r) {
              r.classList.remove('drop-above', 'drop-below'); });
          });
          row.addEventListener('dragover', function (e) {
            if (!dragging || dragging === row) return;
            e.preventDefault();
            var rect = row.getBoundingClientRect();
            var above = e.clientY < rect.top + rect.height / 2;
            list.querySelectorAll('.lib-row').forEach(function (r) {
              r.classList.remove('drop-above', 'drop-below'); });
            row.classList.add(above ? 'drop-above' : 'drop-below');
          });
          row.addEventListener('drop', async function (e) {
            if (!dragging || dragging === row) return;
            e.preventDefault();
            var rect = row.getBoundingClientRect();
            var above = e.clientY < rect.top + rect.height / 2;
            row.parentNode.insertBefore(dragging, above ? row : row.nextSibling);
            list.querySelectorAll('.lib-row').forEach(function (r) {
              r.classList.remove('drop-above', 'drop-below'); });
            await persistCategoryListOrder();
          });
        });
      }

      b.querySelectorAll('.lib-row[data-catid] .vcat-del').forEach(function (btn) {
        var id = btn.closest('.lib-row').dataset.catid;
        btn.addEventListener('click', async function () {
          if (btn.dataset.armed !== '1') {
            btn.dataset.armed = '1'; btn.classList.add('armed');
            btn.setAttribute('data-tooltip', 'Click again to archive');
            clearTimeout(btn._d);
            btn._d = setTimeout(function () {
              btn.dataset.armed = '0'; btn.classList.remove('armed');
              btn.setAttribute('data-tooltip', 'Archive'); }, 3000);
            return;
          }
          btn.disabled = true;
          try {
            // archived, never deleted — videos reference it, and the FK is
            // ON DELETE RESTRICT precisely so a category cannot vanish from
            // under them
            var r = await db.from('video_categories').update({ status: 'archived' }).eq('id', id);
            if (r.error) throw r.error;
            toast('Category archived'); await renderVideoCategories();
          } catch (e) { toast(e.message || 'Could not archive that'); btn.disabled = false; }
        });
      });
    }

    // ── the category editor ─────────────────────────────────────────────────
    // A category is a page, not just a label: it has art, SEO, and a MANUAL
    // content order — one list interleaving collections and videos, dragged
    // into the order the member page will show. The order lives as
    // sort_order on the two junction tables, one sequence per category.
    var CATE = { editing: null, items: [], allVideos: [], allCollections: [],
                 hasLinks: false, busy: false };
    var CATE_LIMITS = { seo_title: 60, seo_desc: 155 };

    async function openCategory(id) {
      var b = bodyEl(); if (b) b.innerHTML = stateLoading();
      try {
        var row = await db.from('video_categories').select('*').eq('id', id).single();
        if (row.error) throw row.error;
        CATE.editing = row.data;
        editorHash('video-categories', id);
        CATE.items = []; CATE.hasLinks = false;
        // the content list needs the junction tables; older databases (SQL
        // not yet run) still get About / Image / SEO
        var got = await Promise.all([
          db.from('video_category_links')
            .select('video_id, sort_order, videos(id, title, status, duration_seconds, thumbnail_mode, custom_thumbnail_url, mux_playback_id)')
            .eq('category_id', id),
          db.from('collection_categories')
            .select('collection_id, sort_order, collections(id, title, status, thumbnail_mode, custom_thumbnail_url)')
            .eq('category_id', id),
          db.from('videos').select('id, title, status, category_id, duration_seconds, thumbnail_mode, custom_thumbnail_url, mux_playback_id').order('created_at', { ascending: false }),
          db.from('collections').select('id, title, status, thumbnail_mode, custom_thumbnail_url').order('updated_at', { ascending: false }),
        ]);
        if (!got[0].error && !got[1].error) {
          CATE.hasLinks = true;
          var vids = (got[0].data || []).map(function (l) {
            return { kind: 'video', id: l.video_id, sort: l.sort_order, row: l.videos || {} };
          });
          var cols = (got[1].data || []).map(function (l) {
            return { kind: 'collection', id: l.collection_id, sort: l.sort_order, row: l.collections || {} };
          });
          CATE.items = vids.concat(cols).sort(function (a, b2) {
            return (a.sort - b2.sort) || (a.row.title || '').localeCompare(b2.row.title || '');
          });
          CATE.allVideos = got[2].data || [];
          CATE.allCollections = (got[3].data) || [];
        }
        CATE._slugTouched = true;   // an existing category's slug never follows the title
        drawCategoryForm();
      } catch (e) {
        if (b) b.innerHTML = stateError(e && e.message);
      }
    }

    function categoryRead() {
      var g = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
      var t = function (id) { return (g(id) || '').trim(); };
      return {
        name: t('cate-title'),
        subtitle: t('cate-subtitle') || null,
        sort_order: parseInt(g('cate-pos'), 10) || 0,
        short_description: t('cate-short') || null,
        description: t('cate-desc') || null,
        slug: t('cate-slug'),
        seo_title: t('cate-seo-title') || null,
        seo_description: t('cate-seo-desc') || null,
      };
    }
    function categoryFingerprint() {
      var v = categoryRead();
      return JSON.stringify([v.name, v.subtitle, v.sort_order, v.short_description, v.description,
        v.slug, v.seo_title, v.seo_description]);
    }
    function categoryDirty() {
      if (!CATE.editing) return false;
      try { return categoryFingerprint() !== CATE._clean; } catch (_) { return false; }
    }
    function categorySyncSave() {
      var btn = document.getElementById('cate-save');
      if (!btn) return;
      var dirty = categoryFingerprint() !== CATE._clean;
      btn.disabled = !dirty;
      btn.textContent = dirty ? 'Save' : 'Saved';
    }

    function categoryContentList() {
      if (!CATE.hasLinks) {
        return '<p class="muted vid-none">The content list needs <code>supabase/video-collections.sql</code> run in Supabase.</p>';
      }
      if (!CATE.items.length) {
        return '<p class="muted vid-none">Nothing in this category yet.</p>';
      }
      return '<ul class="col-list" id="cate-items">' + CATE.items.map(function (it) {
        var r = it.row;
        var live = r.status === 'published' || r.status === 'scheduled' ||
                   (it.kind === 'video' && r.status === 'ready');
        return '<li class="col-item" draggable="true" data-kind="' + it.kind + '" data-id="' + it.id + '">' +
          '<span class="col-grip" aria-hidden="true"><span class="material-symbols-sharp">drag_indicator</span></span>' +
          admContentThumb(it.kind, r, it.kind === 'video' ? it.id : null, r.mux_playback_id) +
          (it.kind === 'collection' ? '<span class="cate-kind">Collection</span>' : '') +

            (r.status === 'published' || r.status === 'scheduled' ? '' :

          '</span>' +
