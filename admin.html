    // ── MUSIC LIBRARY ──
    // The first WRITE surface in this admin. Everything else here reports;
    // this one changes what teachers get, so every approval is gated on a
    // human having set an energy — see approve_song() in the SQL.
    // The one playlist this tool reads from and writes to. Bonnie and
    // Mackenzie add music to it in Apple Music; Pull brings new songs in for
    // review, Push sends back anything matched by hand.
    //
    // Two identifiers, because Apple needs both. The ID is the catalogue id
    // from the share link, and is all READING needs. The NAME is how the
    // library playlist is found when WRITING, since a share link never yields
    // a library id — so renaming it in Apple Music means changing it here too,
    // or Push stops finding it.
    //
    // If it is ever deleted and recreated the id changes: open it in Apple
    // Music, Share → Copy Link, and take the pl.… from the end.
    // NOTE: turning collaboration on or off in Apple Music CHANGES a
    // playlist's id. If Push fails with "Unable to update tracks", that is
    // Apple's collaborative-playlist bug — turn collaboration off, re-share,
    // and put the new pl.… here.
    var MUSIC_PLAYLIST = {
      id: 'pl.u-yZyVVEXTDJ2NjW',
      name: 'Flow School \u00b7 Master Library',
      url: 'https://music.apple.com/us/playlist/flow-school-master-library/pl.u-yZyVVEXTDJ2NjW',
    };

    var MUS = { pending: [], linked: {}, removed: {}, edits: {}, q: '', lvl: 'all', shown: 20 };

    // Three axes, both poles shown. A single highlighted "vocal" chip never
    // said what the alternative was — a song that isn't vocal is
    // instrumental, and "not highlighted" could equally have meant nobody had
    // decided yet. Naming both sides removes the guess and makes the unset
    // case impossible to confuse with a choice.
    // The same control the Playlist Builder gives teachers: the artwork IS
    // the play button, with the glyph always visible over a scrim rather than
    // appearing on hover. Admins are on laptops where hover exists, but two
    // different play affordances in one product is one too many.
    function musArt(artUrl, preview, title) {
      var src = artUrl ? artUrl.replace(/{px}/g, '80') : null;
      var playable = !!preview;
      return '<button class="mus-art' + (src ? ' has-art' : '') + (playable ? '' : ' no-audio') + '"' +
        (playable ? ' data-prev="' + esc(preview) + '"' : ' tabindex="-1" aria-disabled="true"') +
        ' aria-label="' + esc(playable ? 'Preview ' + title : 'No preview for ' + title) + '">' +
        (src ? '<img src="' + esc(src) + '" alt="">' : '') +
        '<span class="material-symbols-sharp">' + (playable ? 'play_arrow' : 'music_note') + '</span>' +
        // hidden until .playing; decoration to a screen reader, which already
        // has the button's label
        (playable ? '<span class="mus-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>' : '') +
        '</button>';
    }

    // The top of the energy scale, matching the Playlist Builder's curve.
    // Nothing in the catalogue has ever reached 9, so offering 9 and 10 here
    // invited scoring a song into a level no arc can ask for.
    var MAX_E = 8;

    var MUS_AXES = [
      { f: 'vocal',      off: 'instrumental', on: 'vocal' },
      { f: 'electronic', off: 'acoustic',     on: 'electronic' },
      { f: 'bright',     off: 'moody',        on: 'bright' },
    ];

    function musAxes(song) {
      return '<div class="ch-set">' + MUS_AXES.map(function (a) {
        var v = song ? !!song[a.f] : false;
        return '<div class="ch-pair" data-f="' + a.f + '">' +
          '<button class="ch-opt' + (v ? '' : ' on') + '" data-v="0">' + a.off + '</button>' +
          '<button class="ch-opt' + (v ? ' on' : '') + '" data-v="1">' + a.on + '</button>' +
          '</div>';
      }).join('') + '</div>';
    }

    function musReadAxes(tr) {
      var out = {};
      MUS_AXES.forEach(function (a) {
        var on = tr.querySelector('.ch-pair[data-f="' + a.f + '"] .ch-opt.on');
        out[a.f] = !!(on && on.dataset.v === '1');
      });
      return out;
    }

    function musLevels() {
      var out = [];
      for (var i = 0; i <= MAX_E; i++) out.push(i);
      return out;
    }

    function musDur(d) { return Math.floor(d / 60) + ':' + String(d % 60).padStart(2, '0'); }

    function musRow(r) {
      return '<tr data-sid="' + r.song_id + '">' +
        '<td>' + musArt(r.art, r.preview, r.title) + '</td>' +
        '<td><strong>' + esc(r.title) + '</strong><br><span class="muted">' + esc(r.artist) + '</span>' +
          (r.genre ? '<br><span class="muted adm-mono">' + esc(r.genre) + '</span>' : '') + '</td>' +
        '<td class="muted adm-mono">' + musDur(r.dur) + '</td>' +
        '<td><div class="mus-energy">' +
          musLevels().map(function (n) { return '<button class="mus-e" data-e="' + n + '">' + n + '</button>'; }).join('') +
        '</div></td>' +
        '<td>' + musAxes(null) + '</td>' +
        '<td class="mus-actions"><button class="btn-primary mus-ok" disabled>Approve</button>' +
        '<button class="btn-ghost mus-no">Pass</button></td></tr>';
    }

    // Songs with no artwork and no preview. The resolver refused to guess when
    // title, artist or duration disagreed — the right call, since a wrong match
    // puts the wrong thirty seconds against a song and nobody notices until it
    // plays. Refusing leaves a gap only a person can close, so: search Apple,
    // listen, pick. The duration difference is shown against every candidate
    // because it is the cheapest tell that a result is a live cut or a remix.
    function musUnmatched() {
      if (typeof SONGS === 'undefined') return [];
      return SONGS.filter(function (sg) {
        var hasMedia = (typeof APPLE_MEDIA !== 'undefined') && APPLE_MEDIA[sg.id];
        return !hasMedia && !MUS.linked[sg.id] && !MUS.removed[sg.id];
      });
    }

    // ── The whole catalogue ───────────────────────────────────────────
    // 838 songs is far past what a table should render at once, and past what
    // anyone reads. So: search first, show what matches, cap the list. You
    // come here looking for a song, not to scroll a library.
    // Twenty at a time, appended. This list is for working THROUGH the
    // catalogue, not glancing at it — the old cap of 60 with "narrow the
    // search to see the rest" made the other 778 unreachable by scrolling.
    var MUS_PAGE = 20;

    function musLive() {
      if (typeof SONGS === 'undefined') return [];
      return SONGS.filter(function (sg) { return !MUS.removed[sg.id]; })
        .map(function (sg) {
          var e = MUS.edits[sg.id];
          // a correction made in the admin is what this song IS now, whatever
          // the shipped file still says
          return e ? {
            id: sg.id, title: sg.title, artist: sg.artist, dur: sg.dur,
            energy: e.energy, vocal: e.vocal, electronic: e.electronic,
            bright: e.bright, edited: true,
          } : sg;
        });
    }

    function musMatches() {
      var q = (MUS.q || '').trim().toLowerCase();
      var lvl = MUS.lvl;
      return musLive().filter(function (sg) {
        if (lvl !== 'all' && sg.energy !== Number(lvl)) return false;
        if (!q) return true;
        return (sg.title + ' ' + sg.artist).toLowerCase().indexOf(q) !== -1;
      });
    }

    function musCatalogueRow(sg) {
      var m = (typeof APPLE_MEDIA !== 'undefined') && APPLE_MEDIA[sg.id];
      var art = m && m.art ? m.art.replace(/{px}/g, '80') : null;
      return '<tr data-cid="' + sg.id + '">' +
        '<td>' + musArt(m && m.art, m && m.prev, sg.title) + '</td>' +
        '<td><strong>' + esc(sg.title) + '</strong><br><span class="muted">' + esc(sg.artist) + '</span>' +
          (sg.edited ? ' <span class="adm-pill admin">edited</span>' : '') + '</td>' +
        '<td class="muted adm-mono">' + musDur(sg.dur) + '</td>' +
        // a select, not the eleven-button picker: that one is for fast triage
        // of a few songs; this list is dense and mostly read, not rewritten
        '<td><select class="cat-e" aria-label="Energy for ' + esc(sg.title) + '">' +
          musLevels().map(function (n) {
            return '<option value="' + n + '"' + (n === sg.energy ? ' selected' : '') + '>' + n + '</option>';
          }).join('') + '</select></td>' +
        '<td class="cat-axes">' + musAxes(sg) + '</td>' +
        '<td class="mus-actions"><button class="btn-ghost cat-del" data-t="' + esc(sg.title) + '" data-a="' + esc(sg.artist) + '">Remove</button></td>' +
        '</tr>';
    }

    // The metric tiles are the only other thing a removal changes, so update
    // them in place rather than redrawing everything that surrounds them.
    function musRefreshCounts() {
      var live = musLive().length;
      var media = musLive().filter(function (sg) {
        return (typeof APPLE_MEDIA !== 'undefined' && APPLE_MEDIA[sg.id]) || MUS.linked[sg.id];
      }).length;
      var tiles = bodyEl().querySelectorAll('.adm-metric');
      if (tiles[0]) tiles[0].querySelector('.val').textContent = num(live);
      if (tiles[1]) tiles[1].querySelector('.val').textContent = num(media);
      var c = document.getElementById('cat-count');
      if (c) c.textContent = musCatalogueCount();
    }

    function musCatalogueCount() {
      var all = musLive(), hits = musMatches();
      var n = Math.min(MUS.shown, hits.length);
      if (hits.length === all.length) {
        return n >= all.length ? num(all.length) + ' songs' : 'showing ' + num(n) + ' of ' + num(all.length);
      }
      return n >= hits.length
        ? num(hits.length) + ' of ' + num(all.length)
        : 'showing ' + num(n) + ' of ' + num(hits.length) + ' matches';
    }

    function musCatalogueList() {
      var hits = musMatches();
      var shown = hits.slice(0, MUS.shown);
      if (!shown.length) return stateEmpty('Nothing matches that.');
      var rest = hits.length - shown.length;
      return '<div class="adm-scroll"><table class="adm-table mus-table"><thead><tr><th></th><th>Song</th><th>Length</th><th>Energy</th><th>Character</th><th></th></tr></thead><tbody>' +
        shown.map(musCatalogueRow).join('') + '</tbody></table></div>' +
        (rest > 0
          ? '<div class="cat-more"><button class="btn-secondary" id="cat-more">Show ' +
            Math.min(MUS_PAGE, rest) + ' more</button> <span class="muted adm-mono">' +
            num(rest) + ' still to go</span></div>'
          : '');
    }

    // Redraws ONLY the list. Searching used to call renderMusic(), which
    // rebuilt the whole tab — so the search box you were typing into was
    // destroyed and recreated mid-word, taking the caret and the scroll
    // position with it.
    function musRedrawList() {
      var host = document.getElementById('cat-list');
      var count = document.getElementById('cat-count');
      if (host) host.innerHTML = musCatalogueList();
      if (count) count.textContent = musCatalogueCount();
    }

    // Appends the next page rather than redrawing the list. Rebuilding it
    // would throw away every row you had already worked through, and put you
    // back at the top of a list you were halfway down.
    function musShowMore() {
      var hits = musMatches();
      var next = hits.slice(MUS.shown, MUS.shown + MUS_PAGE);
      MUS.shown += MUS_PAGE;
      var tbody = document.querySelector('#cat-list tbody');
      if (tbody) tbody.insertAdjacentHTML('beforeend', next.map(musCatalogueRow).join(''));
      var more = document.querySelector('.cat-more');
      if (more) {
        var rest = hits.length - MUS.shown;
        if (rest > 0) {
          more.querySelector('#cat-more').textContent = 'Show ' + Math.min(MUS_PAGE, rest) + ' more';
          more.querySelector('.muted').textContent = num(rest) + ' still to go';
        } else {
          more.remove();
        }
      }
      var count = document.getElementById('cat-count');
      if (count) count.textContent = musCatalogueCount();
    }

    function musCataloguePanel() {
      var all = musLive(), hits = musMatches();
      var shown = hits.slice(0, MUS_PAGE);
      return '<div class="adm-panel"><div class="adm-panel-head"><h2>Every song</h2>' +
        '<span class="muted adm-mono">' + num(all.length) + '</span></div>' +
        '<div class="adm-panel-body">' +
          '<div class="cat-controls">' +
            '<input type="text" class="modal-input" id="cat-q" placeholder="Search title or artist\u2026" value="' + esc(MUS.q) + '" aria-label="Search songs">' +
            '<select id="cat-lvl" aria-label="Filter by energy"><option value="all">Every energy</option>' +
              musLevels().map(function (n) {
                return '<option value="' + n + '"' + (String(MUS.lvl) === String(n) ? ' selected' : '') + '>energy ' + n + '</option>';
              }).join('') + '</select>' +
          '</div>' +
          '<p class="muted adm-mono" id="cat-count">' + musCatalogueCount() + '</p>' +
        '</div>' +
        '<div id="cat-list">' + musCatalogueList() + '</div>' +
        '</div>';
    }

    function musUnmatchedPanel() {
      var miss = musUnmatched();
      if (!miss.length) return '';
      return '<div class="adm-panel"><div class="adm-panel-head"><h2>No artwork or preview</h2>' +
        '<span class="muted adm-mono">' + num(miss.length) + '</span></div>' +
        '<div class="adm-panel-body"><p class="muted">The resolver wouldn\u2019t guess on these \u2014 usually a live version, a remaster, or a song of the same name. Search Apple, listen, and pick the right recording.</p></div>' +
        '<div class="adm-scroll"><table class="adm-table mus-table"><thead><tr><th>Song</th><th>Length</th><th></th></tr></thead><tbody>' +
        miss.map(function (sg) {
          return '<tr data-mid="' + sg.id + '" data-q="' + esc(sg.artist + ' ' + sg.title) + '" data-dur="' + sg.dur + '">' +
            '<td><strong>' + esc(sg.title) + '</strong><br><span class="muted">' + esc(sg.artist) + '</span></td>' +
            '<td class="muted adm-mono">' + musDur(sg.dur) + '</td>' +
            '<td class="mus-actions"><button class="btn-secondary mus-find">Find on Apple Music</button> ' +
            '<button class="btn-ghost mus-del" data-t="' + esc(sg.title) + '" data-a="' + esc(sg.artist) + '">Remove</button></td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }

    // candidates render into a row beneath the song, tagged with the song id so
    // the pick handler never has to guess which row it belongs to
    function d3(tr) {
      var next = tr.nextElementSibling;
      if (next && next.classList.contains('mus-cand-row')) return next.querySelector('.mus-cand-host');
      var host = document.createElement('tr');
      host.className = 'mus-cand-row';
      host.innerHTML = '<td colspan="3"><div class="mus-cand-host" data-for="' + tr.dataset.mid + '"></div></td>';
      tr.parentNode.insertBefore(host, tr.nextSibling);
      return host.querySelector('.mus-cand-host');
    }

    function musCandidateRow(sg, c, ourDur) {
      var gap = Math.abs(c.dur - ourDur);
      return '<div class="mus-cand" data-apple="' + esc(c.appleId) + '">' +
        musArt(c.art, c.preview, c.title) +
        '<div class="mus-cand-txt"><strong>' + esc(c.title) + '</strong><br><span class="muted">' + esc(c.artist) +
          (c.album ? ' \u00b7 ' + esc(c.album) : '') + '</span></div>' +
        '<span class="mus-gap' + (gap <= 3 ? ' good' : gap <= 10 ? ' near' : ' off') + '">' +
          musDur(c.dur) + (gap === 0 ? '' : ' \u00b7 ' + (gap <= 3 ? 'matches' : gap + 's off')) + '</span>' +

        '<button class="btn-primary mus-pick">This one</button>' +
        '<span class="mus-cand-data" hidden>' + esc(JSON.stringify(c)) + '</span></div>';
    }

    // Saves whatever the row currently shows. Called on every change rather
    // than behind a Save button — four fields on one song is not a form.
    async function musSaveRow(tr) {
      if (!tr) return;
      var sel = tr.querySelector('.cat-e');
      var ax = musReadAxes(tr);
      var flag = function (f) { return ax[f]; };
      var id = Number(tr.dataset.cid);
      tr.classList.add('cat-saving');
      try {
        await A.rpc('edit_song', {
          p_song_id: id, p_energy: Number(sel.value),
          p_vocal: flag('vocal'), p_electronic: flag('electronic'), p_bright: flag('bright'),
        });
        // keep the in-memory copy in step so a re-render does not undo what
        // was just saved
        MUS.edits[id] = {
          song_id: id, energy: Number(sel.value), vocal: flag('vocal'),
          electronic: flag('electronic'), bright: flag('bright'),
        };
        tr.classList.remove('cat-saving');
        tr.classList.add('cat-saved');
        setTimeout(function () { tr.classList.remove('cat-saved'); }, 900);
      } catch (err) {
        tr.classList.remove('cat-saving');
        toast(err.message || 'Could not save that');
      }
    }

    // Approving, pulling and pushing change enough that a full redraw is
    // honest. Losing your place while doing it is not — the panel you were
    // working in jumps to the top and you have to find it again.
    async function renderMusic(keepPlace) {
      var y = keepPlace ? window.scrollY : 0;
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var staged = await db.from('music_staging').select('*').order('added_at', { ascending: false });
        if (staged.error) throw staged.error;
        var rows = staged.data || [];
        var removed = await db.from('music_removed').select('*').order('removed_at', { ascending: false });
        MUS.removed = {};
        MUS.removedRows = removed.data || [];
        MUS.removedRows.forEach(function (r) { MUS.removed[r.song_id] = true; });

        var edits = await db.from('music_edits').select('*');
        MUS.edits = {};
        (edits.data || []).forEach(function (e) { MUS.edits[e.song_id] = e; });

        var linked = await db.from('music_links').select('song_id');
        MUS.linked = {};
        (linked.data || []).forEach(function (l) { MUS.linked[l.song_id] = true; });
        MUS.pending = rows.filter(function (r) { return r.status === 'pending'; });
        var approved = rows.filter(function (r) { return r.status === 'approved'; });
        // 'rejected' rows are still recorded — they are what stops a passed-on
        // song being offered for review again — they just aren't listed here.

        // SONGS is the SHIPPED file. Approved songs are live for teachers the
        // moment they are approved — the Builder merges them — so leaving
        // them out made approving a song look like it had done nothing.
        // WHAT A TEACHER CAN ACTUALLY USE, not what the file says.
        //
        // Three times now a metric has been computed straight off the shipped
        // file and been wrong the moment somebody did something: linking a
        // song moved no number, then approving one, then removing one. Each
        // was fixed on its own and the next state broke it again — because
        // every count derived the live catalogue independently and forgot
        // whichever state came last.
        //
        // So the live set is built ONCE, here, and every metric reads it. A
        // fourth state only has to be handled in this block.
        // Only the catalogue count survives. A parallel media set used to be
        // built alongside it for the artwork/preview tile; that tile is gone,
        // so tracking media here would be counting for nobody. MUS.linked is
        // still read elsewhere — musUnmatched() needs it — just not here.
        var liveIds = {};
        if (typeof SONGS !== 'undefined') SONGS.forEach(function (sg) { liveIds[sg.id] = true; });
        // approved — usable by teachers now, though not in the file yet
        approved.forEach(function (r) {
          if (r.energy == null) return;                  // never judged
          liveIds[r.song_id] = true;
        });
        // removed — gone from the Builder immediately, file or not
        Object.keys(MUS.removed).forEach(function (id) { delete liveIds[id]; });

        var inFile = Object.keys(liveIds).length;

        // the sub-line keeps "live" and "published" visibly different things
        var shippedIds = {};
        if (typeof SONGS !== 'undefined') SONGS.forEach(function (sg) { shippedIds[sg.id] = true; });
        var liveExtra = Object.keys(liveIds).filter(function (id) { return !shippedIds[id]; }).length;

        b.innerHTML =
          '<div class="adm-intro">The catalogue behind the Playlist Builder. Songs approved here are live for teachers immediately \u2014 read alongside <span class="adm-mono">songs.js</span> and folded into it on the next deploy.</div>' +
          '<div class="adm-metrics">' +
            // The artwork/preview count retired once the catalogue was fully
            // matched — it read the same as the total forever, and its
            // hand-link sub-line went with it. Approved-not-yet-in-the-file
            // is the one staging state worth surfacing: it is the difference
            // between what teachers see and what the file says.
            '<div class="adm-metric"><div class="lbl">Songs in the catalogue</div><div class="val">' + num(inFile) + '</div>' +
              (liveExtra ? '<div class="adm-metric-sub">' + num(liveExtra) + ' approved, not in the file yet</div>' : '') + '</div>' +
            '<div class="adm-metric"><div class="lbl">Waiting for review</div><div class="val">' + num(MUS.pending.length) + '</div></div>' +
          '</div>' +
          // Pull sits here because this is where its result lands \u2014 songs
          // arrive in the review queue, so the button and its outcome are in
          // one place rather than a panel apart.
          '<div class="adm-panel"><div class="adm-panel-head"><h2>Waiting for review</h2>' +
          '<div class="mus-pull"><span class="muted adm-mono">' + num(MUS.pending.length) + '</span>' +
          '<button class="btn-secondary" id="mus-pull">Pull new songs</button></div></div>' +
          '<p class="muted adm-mono" id="mus-pull-note"></p>' +
            (MUS.pending.length
              ? '<div class="adm-scroll"><table class="adm-table mus-table"><thead><tr><th></th><th>Song</th><th>Length</th><th>Energy \u00b7 0\u2013' + MAX_E + '</th><th>Character</th><th></th></tr></thead><tbody>' + MUS.pending.map(musRow).join('') + '</tbody></table></div>'
              : stateEmpty('Nothing waiting. Add songs to \u201c' + esc(MUSIC_PLAYLIST.name) + '\u201d in Apple Music, then pull them in.')) +
          '</div>' +
          musCataloguePanel() +
          musUnmatchedPanel() +
          (approved.length
            ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Approved</h2><span class="muted adm-mono">live for teachers now</span></div><div class="adm-scroll"><table class="adm-table"><thead><tr><th>Song</th><th class="num">Energy</th><th>Character</th><th>Approved</th></tr></thead><tbody>' +
              approved.map(function (r) {
                return '<tr><td><strong>' + esc(r.title) + '</strong><br><span class="muted">' + esc(r.artist) + '</span></td><td class="num">' + r.energy + '</td><td class="muted adm-mono">' +
                  [r.vocal ? 'vocal' : 'instrumental', r.electronic ? 'electronic' : 'acoustic', r.bright ? 'bright' : 'moody'].join(' \u00b7 ') +
                  '</td><td class="muted">' + A.ago(r.reviewed_at) + '</td></tr>';
              }).join('') + '</tbody></table></div></div>'
            : '');
        wireMusic();
        if (keepPlace) window.scrollTo(0, y);
        // so the Push button's authorize() is the first async thing its click
        // does, rather than the fourth
        if (window.fsMusicKit && fsMusicKit.prewarm) fsMusicKit.prewarm();
      } catch (e) { b.innerHTML = stateError(e && e.message); }
    }

    // Energy and the three flags are chosen per row; Approve stays disabled
    // until an energy is picked, because approve_song() rejects a null and a
    // guessed number is exactly how the existing catalogue got its wrong ones.
    function musState(tr) {
      var e = tr.querySelector('.mus-e.on');
      var ax = musReadAxes(tr);
      return {
        energy: e ? Number(e.dataset.e) : null,
        vocal: ax.vocal, electronic: ax.electronic, bright: ax.bright,
      };
    }

    var musAudio = null, musBtn = null;
    function musStop() {
      if (musAudio) musAudio.pause();
      if (musBtn) {
        musBtn.classList.remove('playing');
        musBtn.querySelector('.material-symbols-sharp').textContent = 'play_arrow';
        musBtn = null;
      }
    }

    function wireMusic() {
      var b = bodyEl();

      // renderMusic() calls this after EVERY render, and the body element
      // survives its own innerHTML being replaced — so without this guard the
      // listeners stack up and one click runs the handler N times. That is
      // invisible for a toggle and catastrophic for the two-step delete: the
      // first press armed it and the second run of the same click confirmed.
      if (!b.dataset.musWired) {
        b.dataset.musWired = '1';
        b.addEventListener('click', musClick);
        b.addEventListener('change', function (ev) {
          var sel = ev.target.closest && ev.target.closest('.cat-e');
          if (sel) musSaveRow(sel.closest('tr'));
        });
      }

      // these live inside the replaced markup, so they are re-bound each time
      var q = document.getElementById('cat-q');
      if (q) {
        var qt;
        q.addEventListener('input', function () {
          clearTimeout(qt);
          // re-rendering on every keystroke would rebuild 60 rows per letter
          qt = setTimeout(function () { MUS.q = q.value; MUS.shown = MUS_PAGE; musRedrawList(); }, 200);
        });
      }
      var lvl = document.getElementById('cat-lvl');
      if (lvl) lvl.addEventListener('change', function () { MUS.lvl = lvl.value; MUS.shown = MUS_PAGE; musRedrawList(); });

      var pull = document.getElementById('mus-pull');
      if (pull) pull.addEventListener('click', musPull);
    }

    async function musClick(ev) {
      {
        var b = bodyEl();
        var t = ev.target;

        var e = t.closest && t.closest('.mus-e');
        if (e) {
          var row = e.closest('tr');
          row.querySelectorAll('.mus-e').forEach(function (x) { x.classList.toggle('on', x === e); });
          row.querySelector('.mus-ok').disabled = false;
          return;
        }

        // Catalogue toggles carry BOTH classes, so this branch catches them
        // too — and used to return before the catalogue's own branch could
        // run, which is why editing character there silently saved nothing.
        // One branch, no ordering to get wrong.
        // One branch for both tables. In the catalogue a choice IS the edit
        // and saves at once; in the review queue it is only read when Approve
        // is pressed. Selecting a pole is idempotent — pressing the one
        // already chosen does nothing rather than un-choosing it, because
        // "neither" is not an answer the database will accept.
        if (t.id === 'cat-more' || (t.closest && t.closest('#cat-more'))) { musShowMore(); return; }

        var opt = t.closest && t.closest('.ch-opt');
        if (opt) {
          if (opt.classList.contains('on')) return;
          var pair = opt.closest('.ch-pair');
          pair.querySelectorAll('.ch-opt').forEach(function (o) { o.classList.toggle('on', o === opt); });
          var row = opt.closest('tr');
          if (row && row.dataset.cid) musSaveRow(row);
          return;
        }

        var play = t.closest && t.closest('.mus-art[data-prev]');
        if (play) {
          var same = musBtn === play;
          musStop();
          if (same) return;
          if (!musAudio) { musAudio = new Audio(); musAudio.addEventListener('ended', musStop); }
          musAudio.src = play.dataset.prev;
          musBtn = play;
          play.classList.add('playing');
          play.querySelector('.material-symbols-sharp').textContent = 'pause';
              musAudio.play().catch(musStop);
          return;
        }

        var ok = t.closest && t.closest('.mus-ok');
        if (ok && !ok.disabled) {
          var tr = ok.closest('tr'), st = musState(tr);
          if (st.energy === null) return;
          ok.disabled = true;
          try {
            await A.rpc('approve_song', {
              p_song_id: Number(tr.dataset.sid), p_energy: st.energy,
              p_vocal: st.vocal, p_electronic: st.electronic, p_bright: st.bright,
            });
            musStop();
            toast('Approved \u2014 teachers can use it now');
            renderMusic(true);
          } catch (err) { ok.disabled = false; toast(err.message || 'Could not approve that'); }
          return;
        }

        var find = t.closest && t.closest('.mus-find');
        if (find) {
          var ftr = find.closest('tr');
          find.disabled = true; find.textContent = 'Searching\u2026';
          try {
            var cands = await fsMusicKit.search(ftr.dataset.q, 6);
            var host = d3(ftr);
            host.innerHTML = cands.length
              ? cands.map(function (c) { return musCandidateRow(null, c, Number(ftr.dataset.dur)); }).join('')
              : '<div class="muted" style="padding:12px 0">Nothing came back for that. It may not be on Apple Music.</div>';
            find.textContent = 'Search again';
          } catch (err) {
            toast(fsMusicKit.explain(err));
            find.textContent = 'Find on Apple Music';
          }
          find.disabled = false;
          return;
        }

        var pick = t.closest && t.closest('.mus-pick');
        if (pick) {
          var cand = pick.closest('.mus-cand');
          // the host row carries the song id it was opened for — no walking
          // the table and hoping the sibling order held
          var sid = Number(cand.closest('.mus-cand-host').dataset.for);
          var info = JSON.parse(cand.querySelector('.mus-cand-data').textContent);
          if (!sid) { toast('Lost track of which song that was'); return; }
          pick.disabled = true;
          try {
            await A.rpc('link_song', {
              p_song_id: sid, p_apple_id: Number(info.appleId),
              p_art: info.art, p_preview: info.preview,
              p_genre: info.genre, p_isrc: info.isrc,
            });
            musStop();
            toast('Linked \u2014 ' + info.title);
            renderMusic(true);
          } catch (err) { pick.disabled = false; toast(err.message || 'Could not link that'); }
          return;
        }

        // Removing is destructive and the row vanishes, so it asks once —
        // in place, on the button itself. A native confirm() dialog for this
        // is heavier than the action deserves, and clicking anywhere else
        // cancels, which a dialog cannot do.
        var cdel = t.closest && t.closest('.cat-del');
        if (cdel) {
          if (cdel.dataset.armed !== '1') {
            b.querySelectorAll('.cat-del[data-armed="1"], .mus-del[data-armed="1"]').forEach(function (o) {
              o.dataset.armed = ''; o.textContent = 'Remove'; o.classList.remove('mus-del-armed');
            });
            cdel.dataset.armed = '1';
            cdel.textContent = 'Really remove?';
            cdel.classList.add('mus-del-armed');
            return;
          }
          var ctr = cdel.closest('tr');
          cdel.disabled = true;
          try {
            await A.rpc('remove_song', {
              p_song_id: Number(ctr.dataset.cid),
              p_title: cdel.dataset.t, p_artist: cdel.dataset.a, p_reason: null,
            });
            musStop();
            // the row goes, nothing else moves. Rebuilding the tab to delete
            // one line is how you end up back at the top of the page.
            MUS.removed[Number(ctr.dataset.cid)] = true;
            ctr.remove();
            musRefreshCounts();
            toast('Removed \u2014 ' + cdel.dataset.t);
          } catch (err) {
            cdel.disabled = false;
            cdel.dataset.armed = ''; cdel.textContent = 'Remove';
            cdel.classList.remove('mus-del-armed');
            toast(err.message || 'Could not remove that');
          }
          return;
        }

        var del = t.closest && t.closest('.mus-del');
        if (del) {
          if (del.dataset.armed !== '1') {
            b.querySelectorAll('.mus-del[data-armed="1"]').forEach(function (o) {
              o.dataset.armed = ''; o.textContent = 'Remove'; o.classList.remove('mus-del-armed');
            });
            del.dataset.armed = '1';
            del.textContent = 'Really remove?';
            del.classList.add('mus-del-armed');
            return;
          }
          var dtr = del.closest('tr');
          del.disabled = true;
          try {
            await A.rpc('remove_song', {
              p_song_id: Number(dtr.dataset.mid),
              p_title: del.dataset.t, p_artist: del.dataset.a, p_reason: null,
            });
            musStop();
            MUS.removed[Number(dtr.dataset.mid)] = true;
            dtr.remove();
            // it may also have been showing in the catalogue above
            var twin = bodyEl().querySelector('tr[data-cid="' + dtr.dataset.mid + '"]');
            if (twin) twin.remove();
            musRefreshCounts();
            toast('Removed \u2014 ' + del.dataset.t);
          } catch (err) {
            del.disabled = false;
            del.dataset.armed = ''; del.textContent = 'Remove';
            del.classList.remove('mus-del-armed');
            toast(err.message || 'Could not remove that');
          }
          return;
        }

        // clicking anywhere else disarms whatever was armed
        if (!del) {
          b.querySelectorAll('.mus-del[data-armed="1"], .cat-del[data-armed="1"]').forEach(function (o) {
            o.dataset.armed = ''; o.textContent = 'Remove'; o.classList.remove('mus-del-armed');
          });
        }

        var no = t.closest && t.closest('.mus-no');
        if (no) {
          var tr2 = no.closest('tr');
          no.disabled = true;
          try {
            await A.rpc('reject_song', { p_song_id: Number(tr2.dataset.sid), p_note: null });
            musStop();
            renderMusic(true);
          } catch (err) { no.disabled = false; toast(err.message || 'Could not do that'); }
          return;
        }
      }

    }

    // Everything Apple already knows about a track comes back with the
    // playlist read — title, artist, length, artwork, preview, genre, ISRC.
    // Only energy and the three character flags are left blank, because they
    // are the only parts a machine has no business deciding.
    async function musPull() {
      var btn = document.getElementById('mus-pull');
      var note = document.getElementById('mus-pull-note');

      btn.disabled = true;
      var restore = btn.textContent;
      btn.textContent = 'Reading\u2026';
      try {
        var tracks = await fsMusicKit.readPlaylist(MUSIC_PLAYLIST.id);

        // three places a song might already be known: the shipped catalogue,
        // a manual link, and the queue itself
        var known = {};
        if (typeof APPLE_MEDIA !== 'undefined') {
          Object.keys(APPLE_MEDIA).forEach(function (k) { known[String(APPLE_MEDIA[k].id)] = true; });
        }
        var seen = await db.from('music_staging').select('apple_id');
        (seen.data || []).forEach(function (r) { known[String(r.apple_id)] = true; });
        var links = await db.from('music_links').select('apple_id');
        (links.data || []).forEach(function (r) { known[String(r.apple_id)] = true; });

        var fresh = tracks.filter(function (t) { return !known[String(t.appleId)]; });
        if (!fresh.length) {
          note.textContent = 'Read ' + tracks.length + ' songs \u2014 nothing new since last time.';
          return;
        }

        var maxId = (typeof SONGS !== 'undefined')
          ? SONGS.reduce(function (a, s2) { return Math.max(a, s2.id); }, 0) : 0;

        var staged = 0;
        for (var i = 0; i < fresh.length; i++) {
          var t = fresh[i];
          btn.textContent = 'Adding ' + (i + 1) + ' of ' + fresh.length + '\u2026';
          try {
            await A.rpc('stage_song', {
              p_apple_id: Number(t.appleId), p_title: t.title, p_artist: t.artist,
              p_dur: t.dur, p_genre: t.genre, p_art: t.art,
              p_preview: t.preview, p_isrc: t.isrc, p_known_max: maxId,
            });
            staged++;
          } catch (e) { console.warn('[music] could not stage', t.title, e && e.message); }
        }
        toast(staged + (staged === 1 ? ' song is' : ' songs are') + ' waiting for review');
        renderMusic(true);
      } catch (err) {
        toast(fsMusicKit.explain(err));
      } finally {
        btn.disabled = false;
        btn.textContent = restore;
      }
    }

          }).join('');

            : 'No files stored yet.';

          : stateEmpty('No errors logged — clean bill of health.');

    // ── router ──
    function route() {
      var id = (location.hash || '#overview').slice(1);
      var sec = SECTIONS.filter(function (s) { return s.id === id; })[0] || SECTIONS[0];
      groupLast[groupOf(sec.id).label] = sec.id;
      shell(sec.id);
      // every tab carries the "Updated …" stamp. Overview fills it from the
      // server snapshot time (generated_at) inside its own render; for the
      // rest, stamp the load time here once their data has come in.
      Promise.resolve(sec.render()).then(function () {
        var u = document.getElementById('adm-updated');
        if (u && !u.textContent) u.textContent = 'Updated ' + A.fmtDateTime(new Date());
      });
    }
    window.addEventListener('hashchange', route);

    // Tables arrive at three different times — with the section render, from a
    // panel that loads after it (loadTools, loadSignups), and in the user
    // drawer. Rather than calling admSortable at each of those ~28 sites, watch
    // and upgrade whatever appears. Idempotent, so the observer re-firing on
    // admSortable's own edits settles immediately.
    //
    // OBSERVE document.body, NOT #adm-body: that element doesn't exist yet when
    // this runs (shell() builds it), and shell() REPLACES it on every route —
    // so an observer bound to it would either never attach or go stale on the
    // first tab change. document.body is the only node that outlives both.
    (function () {
      if (!window.MutationObserver) { admSortable(document); return; }
      var queued = false;
      new MutationObserver(function () {
        if (queued) return;              // coalesce a render's burst into one pass
        queued = true;
        requestAnimationFrame(function () { queued = false; admSortable(document); });
      }).observe(document.body, { childList: true, subtree: true });
      admSortable(document);
    })();

    // ── shared chart tooltip — styled pill, animated, positioned above the bar ──
    (function () {
      var tt = document.createElement('div');
      tt.className = 'adm-tt';
      tt.setAttribute('aria-hidden', 'true');
      document.body.appendChild(tt);
      var SEL = '.suc-col[data-tip], .adm-spk-col[data-tip], .adm-hm[data-tip], .adm-tbar-fill[data-tip], .adm-info[data-tip], .adm-thinfo[data-tip]';
      function show(el) {
        var tip = el.getAttribute('data-tip');
        if (!tip) return;
        tt.textContent = tip;
        var r = el.getBoundingClientRect();
        var tw = tt.offsetWidth, th = tt.offsetHeight;   // measured while hidden (still laid out)
        var left = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 8));
        var above = r.top - th - 8;
        var below = above < 8;
        tt.style.left = left + 'px';
        tt.style.top = (below ? r.bottom + 8 : above) + 'px';
        tt.classList.toggle('below', below);
        tt.classList.add('on');
      }
      function hide() { tt.classList.remove('on'); }
      document.addEventListener('pointerover', function (e) {
        var el = e.target && e.target.closest ? e.target.closest(SEL) : null;
        if (el) show(el);
      });
      document.addEventListener('pointerout', function (e) {
        var el = e.target && e.target.closest ? e.target.closest(SEL) : null;
        if (el && !(e.relatedTarget && el.contains(e.relatedTarget))) hide();
      });
      window.addEventListener('scroll', hide, true);
    })();

    // ── boot: gate on admin (server truth) ──
    (async function boot() {
      // sync.js already redirected to /login if there was no session.
      try { if (window.fsSync && window.fsSync.ready) await window.fsSync.ready; } catch (_) {}
      var ok = await A.isAdmin();
      if (!ok) {
        root.innerHTML = '<div class="adm-denied"><span class="material-symbols-sharp">visibility_lock</span>' +
          '<h1>Not authorized</h1><p>This area is for Flow School administrators. If you believe you should have access, ask an existing admin to add you.</p>' +
          '<p style="margin-top:16px"><a class="btn-secondary" href="dashboard">Back to dashboard</a></p></div>';
        return;
      }
      route();
    })();
  })();
