      background: var(--well-bg); box-shadow: var(--well);
      display: grid; place-items: center; color: var(--text-3);
    }
    .lib-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lib-thumb .material-symbols-sharp { font-size: var(--icon-lg); opacity: .45; }
    /* documents stand upright — the page's own proportions, not the video's */
    .lib-thumb-doc { width: 58px; height: 82px; }
    .lib-thumb-doc img { object-fit: cover; object-position: top; }
    .lib-dur {
      position: absolute; right: 4px; bottom: 4px;
      font-family: var(--font-mono); font-size: var(--fs-meta);
      color: #fff; background: rgba(0, 0, 0, .6);
      padding: 1px 5px; border-radius: var(--rf);
    }
    .lib-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .lib-title { font-size: var(--fs-h7); font-weight: var(--weight-medium); color: var(--text-1);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lib-meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--text-3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lib-note { font-size: var(--fs-label-1); color: var(--text-3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lib-flag { font-size: var(--fs-label-1); color: var(--danger); }
    .lib-side { flex: none; display: flex; align-items: center; gap: 10px; }
    /* a generous hit area around the checkbox so selecting never mis-fires
       into opening the editor */
    .lib-check { flex: none; display: grid; place-items: center; padding: 10px 2px 10px 8px; cursor: pointer; }
    .lib-check input { cursor: pointer; accent-color: var(--accent); }
    .lib-row .col-grip { padding: 10px 0 10px 6px; }
    .lib-drop { max-width: none; }
    @media (max-width: 640px) {
      .lib-row { gap: 10px; }
      .lib-thumb { width: 84px; height: 47px; }
      .lib-thumb-doc { width: 47px; height: 66px; }
      .lib-meta { white-space: normal; }
    }

    /* per-filter panels: a filter is a sub-object of this page, not a page
       section — its name sits a step below the panel scale */
    .fil-panel .adm-panel-head h2 { font-size: var(--fs-h7); flex: 1; min-width: 0; }
    /* the filter's name is a bare input wearing the heading's clothes; the
       hairline only appears when it is actually being edited */
    .fil-name-input { width: 100%; border: 0; background: none; outline: none; padding: 0;
      font: inherit; color: var(--text-1);
      border-bottom: 1px solid transparent;
      transition: border-color var(--transition-base); }
    .fil-name-input:hover { border-bottom-color: var(--border); }
    .fil-name-input:focus { border-bottom-color: var(--accent); }

    /* ── a featured slide's row IS a miniature of the slide ──────────
       Artwork at slide proportions, then the copy stack in hero order:
       eyebrow over title. The eyebrow is the one editable thing here,
       and it says so at rest — a dotted underline (the editable-text
       convention) and a pencil that rises when the row is engaged. */
    .feat-slide { padding: 10px 14px 10px 10px; gap: 14px; }
    .feat-slide .vid-thumb { width: 96px; height: 54px; }
    .feat-slide .col-item-name { gap: 3px; }
    .feat-eyebrow-row { display: inline-flex; align-items: center; gap: 7px; }
    /* system voice: mono caps labels are ink, never accent — the accent
       appears only as the focus state, where the system already uses it */
    .feat-eyebrow { border: 0; background: none; outline: none; padding: 1px 0 2px;
      min-width: 110px; max-width: 260px; field-sizing: content;
      font-family: var(--font-mono); font-size: var(--fs-meta);
      letter-spacing: var(--ls-micro); text-transform: uppercase; color: var(--text-2);
      border-bottom: 1px dashed rgba(var(--ink-rgb), .28);
      transition: border-color var(--transition-base), color var(--transition-base); }
    .feat-eyebrow::placeholder { color: var(--text-4); text-transform: uppercase; }
    .feat-eyebrow:hover { border-bottom-color: rgba(var(--ink-rgb), .45); }
    .feat-eyebrow:focus { border-bottom-style: solid; border-bottom-color: var(--accent);
      color: var(--text-1); }
    .feat-eyebrow-pen { font-size: 12px; color: var(--text-4); cursor: text;
      opacity: 0; transform: translateX(-2px);
      transition: opacity var(--transition-base), transform var(--transition-base),
                  color var(--transition-base); }
    .feat-slide:hover .feat-eyebrow-pen,
    .feat-eyebrow:focus ~ .feat-eyebrow-pen { opacity: 1; transform: none; }
    .feat-eyebrow-pen:hover { color: var(--text-2); }
    @media (prefers-reduced-motion: reduce) { .feat-eyebrow-pen { transition: opacity var(--transition-base); transform: none; } }
    .fil-panel .adm-panel-head { margin-bottom: 10px; }
    .fil-count { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--text-3); margin-left: auto; margin-right: 10px; }
    .col-chip .chip-n { font-family: var(--font-mono); font-size: var(--fs-meta); opacity: .65; }
  </style>
</head>
<body class="has-sidebar">
  <script src="lib/version.js"></script>
  <script src="lib/nav.js"></script>
  <script src="lib/vendor/supabase-js-v2.110.7.min.js"></script>
  <!-- Mux's uploader, vendored and pinned like supabase-js rather than hot-
       linked from a CDN: a third party in the critical path of the admin is
       an availability dependency nobody chose. It is a web component, so it
       needs no build step — it registers <mux-uploader> and that is all. -->
  <script src="lib/vendor/mux-uploader-v1.5.0.js" defer></script>
  <script src="lib/supabase.js"></script>
  <script src="lib/telemetry.js"></script>
  <script src="lib/sync.js"></script>
  <script src="lib/analytics.js"></script>
  <script src="lib/notifications.js"></script>
  <script src="lib/notification-panel.js"></script>
  <script src="lib/admin.js"></script>
  <script src="data/songs.js"></script>
  <script src="data/apple-media.js"></script>
  <script src="lib/musickit.js"></script>
  <script src="lib/toast.js"></script>
  <div class="toast" id="toast"></div>

  <main>
    <div class="adm" id="adm-root">
      <div class="adm-state" id="adm-boot"><div class="adm-skel"></div><div class="adm-skel"></div><div class="adm-skel"></div></div>
    </div>
  </main>

  <!-- user detail drawer -->
  <div class="adm-drawer-backdrop" id="drawer-backdrop" hidden></div>
  <div class="adm-drawer" id="drawer" hidden aria-modal="true" role="dialog">
    <button class="btn-icon adm-drawer-close" id="drawer-close" data-tooltip="Close" aria-label="Close">
      <span class="material-symbols-sharp">close</span>
    </button>
    <div id="drawer-body"></div>
  </div>

  <script>
  (function () {
    var A = window.fsAdmin;
    var root = document.getElementById('adm-root');
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

    // section registry
    var SECTIONS = [
      { id: 'home',        label: 'Admin Center',        render: renderHome },
      { id: 'notifs',      label: 'Notifications',       render: renderNotifs },
      { id: 'videos',           label: 'Videos',          render: renderVideos },
      { id: 'collections',      label: 'Collections',     render: renderCollections },
      { id: 'video-categories', label: 'Categories',      render: renderVideoCategories },
      { id: 'video-featured',   label: 'Featured',        render: renderFeatured },
      { id: 'video-resources',  label: 'Resources',       render: renderResourceLibrary },
      { id: 'video-filters',    label: 'Filters',         render: renderFilterAdmin },
      // Labels name the question, not the method — every one passes the
      // say-it-out-loud test (would Bonnie use this word asking the question?)
      { id: 'overview',    label: 'Today',               render: renderOverview },
      { id: 'impact',      label: 'Milestones',          render: renderImpact },
      { id: 'users',       label: 'Everyone',            render: renderUsers },
      { id: 'activation',  label: 'First Week',          render: renderActivation },
      { id: 'retention',   label: 'Do They Stay',        render: renderRetention },
      { id: 'activity',    label: 'Live Feed',           render: renderActivity },
      { id: 'classes',     label: 'Classes',             render: renderClasses },
      { id: 'flows',       label: 'Flows',               render: renderFlows },
      { id: 'watching',    label: 'Videos',              render: renderWatching },
      { id: 'experiments', label: 'Experiments',         render: renderExperiments },
      { id: 'public',      label: 'The Circle',          render: renderPublic },
      { id: 'tools',       label: 'Every Tool',          render: renderTools },
      { id: 'devices',     label: 'Sessions',            render: renderDevices },
      { id: 'music',       label: 'Music Library',      render: renderMusic },
      { id: 'feedback',    label: 'Feedback',            render: renderFeedback },
      { id: 'health',      label: 'Errors',              render: renderHealth },
      { id: 'admins',      label: 'Admins',              render: renderAdmins },
      { id: 'exports',     label: 'Exports',             render: renderExports },
    ];

    // section groups — top-level nav (a group holds one or more sections)
    // Two areas, because they are two different jobs. Analytics is READING:
    // you go to find out how the app is doing. Content is WRITING: you go to
    // change what teachers get.
    //
    // Within Analytics: four questions, in the order Bonnie asks them —
    // how is it going · who's here · what are they making and watching ·
    // is anything broken. The middle question is answered BY NOUN (Classes,
    // Flows, Videos…) — teachers think in the product's nouns, not analyst
    // concepts. The analytics "Content" group REPORTS on content; the
    // Content AREA manages it.
    var GROUPS = [
      { label: 'Overview', area: 'analytics', sections: ['overview', 'impact'] },
      { label: 'Teachers', area: 'analytics', sections: ['users', 'activation', 'retention', 'activity'] },
      { label: 'Content',  area: 'analytics', sections: ['classes', 'flows', 'watching', 'experiments', 'public', 'tools'] },
      { label: 'System',   area: 'analytics', sections: ['feedback', 'health', 'devices', 'admins', 'exports'] },
      { label: 'Music',    area: 'content',   sections: ['music'] },
      { label: 'Video',    area: 'content',   sections: ['videos', 'collections', 'video-categories', 'video-featured', 'video-resources', 'video-filters'] },
      { label: 'Notifications', area: 'comms', sections: ['notifs'] },
    ];

    // The cards on the landing page. `blurb` says what the area is FOR, in the
    // second person, because a label alone ("Content") does not tell you
    // whether the thing you came to do lives behind it.
    var AREAS = [
      { id: 'analytics', label: 'Analytics',
        blurb: 'How the app is actually being used — who arrives, what they make, where they get stuck.',
        home: 'overview' },
      { id: 'content',   label: 'Content',
        blurb: 'The material the app hands to teachers. Edit it here rather than in the code.',
        home: 'music' },
      { id: 'comms',     label: 'Communications',
        blurb: 'What you say to everyone at once. Announcements land in each teacher’s notification panel.',
        home: 'notifs' },
    ];
    function areaOf(id) { return groupOf(id).area || 'analytics'; }
    function areaById(a) { return AREAS.filter(function (x) { return x.id === a; })[0] || AREAS[0]; }
    function groupOf(id) { return GROUPS.filter(function (g) { return g.sections.indexOf(id) !== -1; })[0] || GROUPS[0]; }
    function sectionById(id) { return SECTIONS.filter(function (s) { return s.id === id; })[0]; }
    var groupLast = {};   // group label → last section viewed in it (so a pill returns you where you were)

    // ── shell ──
    function shell(activeId) {
      // the landing page is chrome-less on purpose: no pills to choose from
      // when choosing is the whole task, and no time range or refresh when
      // there is nothing on the page that a time range would change.
      if (activeId === 'home') {
        root.innerHTML =
          '<div class="adm-head"><div><h1>Admin Center</h1></div></div>' +
          '<div id="adm-body"></div>';
        return;
      }

      var g = groupOf(activeId);
      var area = areaById(areaOf(activeId));
      // pills are scoped to the area — an area with one group shows none,

    // ── SORTABLE COLUMNS ─────────────────────────────────────────────────────
    // Every .adm-table gets clickable headers. Client-side, on rows already in
    // the DOM: these tables are tens of rows and already fetched, so sorting
    // costs nothing and needs no round trip.
    //
    // The Users table opts out with `data-nosort` — it's paginated server-side,
    // so reordering the visible page would sort 50 rows out of 400 and quietly
    // answer a different question than the one asked. Its own select drives
    // p_sort instead.
    //
    // Upgrading is idempotent (data-sortready), which is what lets the observer
    // below re-scan freely without looping on its own DOM edits.

    function admCellValue(row, i) {
      var c = row.cells[i];
      return c ? (c.textContent || '').trim() : '';
    }

    // numeric if the header says so — .num already marks every number column,
    // so nothing new has to be added at the ~28 call sites
    function admParseNum(t) {
      var n = parseFloat(String(t).replace(/[,%\s]/g, '').replace(/[^0-9.eE+-]/g, ''));
      return isNaN(n) ? null : n;
    }

    function admSortTable(tbl, i, dir, numeric) {
      var body = tbl.tBodies[0];
      var rows = [].slice.call(body.rows);
      // decorate with the original index so equal values keep their order —
      // a stable sort means repeated sorts compose instead of shuffling
      rows.forEach(function (r, n) { r._i = n; });
      rows.sort(function (a, b) {
        var av = admCellValue(a, i), bv = admCellValue(b, i), d;
        if (numeric) {
          var an = admParseNum(av), bn = admParseNum(bv);
          // blanks and em-dashes sort to the bottom whichever way you're going
          if (an === null && bn === null) d = 0;
          else if (an === null) return 1;
          else if (bn === null) return -1;
          else d = an - bn;
        } else {
          d = av.localeCompare(bv, undefined, { numeric: true, sensitivity: 'base' });
        }
        return (d ? (dir === 'asc' ? d : -d) : a._i - b._i);
      });
      rows.forEach(function (r) { body.appendChild(r); });
    }

    function admSortable(root) {
      var scope = root || document;
      [].forEach.call(scope.querySelectorAll('table.adm-table:not([data-nosort])'), function (tbl) {
        if (tbl.dataset.sortready) return;
        var head = tbl.tHead && tbl.tHead.rows[0];
        var body = tbl.tBodies && tbl.tBodies[0];
        if (!head || !body || body.rows.length < 2) return;   // nothing worth sorting
        tbl.dataset.sortready = '1';

        [].forEach.call(head.cells, function (th, i) {
          // checkbox and row-action columns aren't data
          if (th.classList.contains('adm-checkcell') || th.classList.contains('adm-actcell')) return;
          var numeric = th.classList.contains('num');
          var info = th.querySelector('.adm-thinfo');
          // lift the label out without swallowing the info tooltip — it stays a
          // sibling, so clicking "what does this mean?" never sorts the table
          var clone = th.cloneNode(true);
          var ci = clone.querySelector('.adm-thinfo');
          if (ci) ci.parentNode.removeChild(ci);
          var label = clone.innerHTML.trim();
          if (!label) return;

          th.innerHTML = '<button type="button" class="adm-th-sort">' + label +
            '<span class="adm-th-caret" aria-hidden="true"></span></button>' +
            (info ? info.outerHTML : '');

          th.querySelector('.adm-th-sort').addEventListener('click', function () {
            var active = tbl.dataset.sortcol === String(i);
            // numbers open descending — nobody clicking "Saves" wants the least
            var dir = active ? (tbl.dataset.sortdir === 'asc' ? 'desc' : 'asc')
                             : (numeric ? 'desc' : 'asc');
            tbl.dataset.sortcol = String(i);
            tbl.dataset.sortdir = dir;
            [].forEach.call(head.cells, function (o) { o.removeAttribute('aria-sort'); });
            th.setAttribute('aria-sort', dir === 'asc' ? 'ascending' : 'descending');
            th.querySelector('.adm-th-caret').textContent = dir === 'asc' ? '↑' : '↓';
            [].forEach.call(head.cells, function (o) {
              if (o !== th) { var c = o.querySelector('.adm-th-caret'); if (c) c.textContent = ''; }
            });
            admSortTable(tbl, i, dir, numeric);
          });
        });
      });
    }
    // small +/- indicator comparing a period to the one before it
    function deltaHtml(cur, prev, label) {
      cur = Number(cur || 0); prev = Number(prev || 0);
      var diff = cur - prev;
      var cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
      var arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '–';
      return '<div class="adm-delta ' + cls + '">' + arrow + ' ' + num(Math.abs(diff)) + ' ' + esc(label) + '</div>';
    }
    // compact 14-day activity sparkline for the user drawer
    function miniSpark(daily) {
      daily = daily || [];
      var total = daily.reduce(function (a, x) { return a + Number(x.count || 0); }, 0);
      if (!total) return '';
      var max = Math.max.apply(null, daily.map(function (x) { return Number(x.count || 0); }).concat([1]));
      var bars = daily.map(function (x) {
        var c = Number(x.count || 0);
        var h = c > 0 ? Math.max(8, Math.round(c / max * 100)) : 0;
        return '<div class="adm-spk-col"' + (c > 0 ? ' data-tip="' + esc(A.fmtDate(x.day) + ' · ' + c + (c === 1 ? ' action' : ' actions')) + '"' : '') + '>' + (h ? '<div class="adm-spk-bar" style="height:' + h + '%"></div>' : '') + '</div>';
      }).join('');
      return '<div class="adm-spk">' + bars + '</div><div class="adm-spk-cap">' + num(total) + (total === 1 ? ' action' : ' actions') + ' · last 14 days</div>';
    }

    // ── OVERVIEW ──

          metric('Saved items · all', o.total_saved_items, 'all time', 'Every item in every user’s library — classes, flows, cue sheets, stories, playlists, rules, and more. Counted from library contents, which carry no per-item date — so this can’t follow the date range.', null, 'saved');

        // the funnel itself lives on First Week — Today gets the one-line

            '<div id="su-chart">' + stateLoading() + '</div></div>' +
          '<div class="adm-panel"><div class="adm-panel-head"><h2>Most-used tools · ' + esc(rangeLbl) + '</h2></div><div id="tools-mini">' + stateLoading() + '</div></div>' +
          '<div class="adm-panel"><div class="adm-panel-head"><h2>Most-saved public classes</h2></div>' + pubMini(pub.rows) + '</div>';

    // ── click-through: each Overview metric opens the list behind it ──
    function resetUsers() { usersState.search = ''; usersState.status = ''; usersState.signupDays = 0; usersState.sort = 'recent_activity'; usersState.page = 0; }

    // ── activation funnel: signed up → created content → shared a class ──
    function funnelHtml(f) {

    // ── ACTIVATION — the first week (funnel · time-to-create · cohorts · unconfirmed) ──
    async function renderActivation() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var a = await A.rpc('admin_activation').catch(function (e) { console.warn('[admin] activation fetch failed:', e && e.message); return null; });
        if (!a) {
          b.innerHTML = '<div class="adm-panel"><div class="adm-panel-head"><h2>First week</h2></div><div class="adm-intro" style="margin:0">First-week metrics need the latest <code>admin-analytics.sql</code> run in Supabase, then they’ll show here.</div></div>';
          return;
        }
        var unc = await A.rpc('admin_unconfirmed', { p_limit: 100, p_offset: 0 }).catch(function () { return { total: 0, rows: [] }; });

        var mh = a.median_hours_to_create;
        var ttc = (mh == null) ? '—' : (Number(mh) >= 48 ? Math.round(mh / 24) + ' days' : mh + ' hrs');
        var metrics =
          '<div class="adm-metrics">' +
            '<div class="adm-metric"><span class="adm-info" data-tip="Median time from signup to a teacher’s first meaningful action — generating, saving, or creating something."><span class="material-symbols-sharp">info</span></span><div class="lbl">Median time to first create</div><div class="val">' + ttc + '</div></div>' +
            '<div class="adm-metric"><div class="lbl">Teachers who created</div><div class="val">' + num(a.creators) + '</div></div>' +
            '<div class="adm-metric"><div class="lbl">Unconfirmed accounts</div><div class="val">' + num(a.unconfirmed_count) + '</div></div>' +
          '</div>';

        var funnel = a.funnel || [];
        var topCount = funnel.length ? (Number(funnel[0].count) || 0) : 0;
        var fnRows = funnel.map(function (step, i) {
          var c = Number(step.count) || 0;
          var w = topCount ? Math.max(2, c / topCount * 100) : 0;
          var conv = (i === 0) ? '' : (Number(funnel[i - 1].count) ? Math.round(c / Number(funnel[i - 1].count) * 100) + '%' : '');
          return '<div class="adm-fn-row"><div class="adm-fn-label">' + esc(step.label) + '</div>' +
            '<div class="adm-fn-bar"><div class="adm-fn-fill" style="width:' + w.toFixed(1) + '%"></div></div>' +
            '<div class="adm-fn-count">' + num(c) + '</div>' +

        }).join('');
        var funnelPanel =
          '<div class="adm-panel"><div class="adm-panel-head"><h2>From signup to sharing</h2><span class="muted adm-mono" style="font-size:11px">% = kept from the step above</span></div>' +
          '<div class="adm-funnel">' + fnRows + '</div></div>';

        // where teachers come from — signups by acquisition channel + how many
        // activated (created in week one). The payoff of first-touch capture.
        function acqLabel(ch) {
          if (ch === 'shared_class') return 'Shared class link';
          if (ch === 'profile') return 'Profile link';
          if (ch === 'campaign') return 'Campaign (UTM)';
          if (ch === 'direct') return 'Direct';
          if (ch === 'internal') return 'Internal / unattributed';
          if (ch === 'unknown') return 'Unknown (pre-tracking)';

          return ch || 'Unknown';
        }
        var acq = a.acquisition || [];
        var acqTotal = acq.reduce(function (s, x) { return s + (Number(x.signups) || 0); }, 0);
        var acqRows = acq.map(function (x) {
          var s = Number(x.signups) || 0, act = Number(x.activated) || 0;
          return '<tr><td>' + esc(acqLabel(x.channel)) + '</td><td class="num">' + num(s) + '</td>' +
            '<td class="num muted">' + (acqTotal ? Math.round(s / acqTotal * 100) + '%' : '—') + '</td>' +
            '<td class="num">' + num(act) + '</td><td class="num">' + (s ? Math.round(act / s * 100) + '%' : '—') + '</td></tr>';
        }).join('');
        var acqPanel = acq.length
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Where teachers come from</h2><span class="muted adm-mono" style="font-size:11px">signups by source · activated = created in week 1</span></div>' +
            '<div class="adm-scroll"><table class="adm-table"><thead><tr><th>Source</th><th class="num">Signups</th><th class="num">% of total</th><th class="num">Activated</th><th class="num">Activation rate</th></tr></thead><tbody>' + acqRows + '</tbody></table></div></div>'
          : '';

    // ── global time range: one control in the header, every panel obeys it ──
    var admRange = 30;

      { d: 7, label: '7 days' }, { d: 30, label: '30 days' }, { d: 90, label: '90 days' },
      { d: 180, label: '6 months' }, { d: 365, label: '1 year' },

    function admRangeLabel(d) { var m = ADM_RANGES.filter(function (r) { return r.d === d; })[0]; return m ? m.label : d + ' days'; }

    // ── New users over time: filterable, bucketed bar chart ──
    function suShort(iso) { try { return new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (_) { return iso; } }
    function suBucket(daily, days) {
      // daily rows → adaptive buckets so a long range stays readable
      if (days <= 30) return (daily || []).map(function (d) {
        return { label: A.fmtDate(d.day), short: suShort(d.day), count: Number(d.count || 0) };
      });
      var byKey = {}, order = [], monthly = days > 180;
      (daily || []).forEach(function (d) {
        var dt = new Date(d.day + 'T00:00:00'); var key, label, short;
        if (monthly) {
          key = dt.getFullYear() + '-' + dt.getMonth();
          label = dt.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
          short = dt.toLocaleDateString(undefined, { month: 'short' });
        } else {
          var wk = new Date(dt); wk.setDate(dt.getDate() - dt.getDay());   // week start (Sun)
          key = wk.toISOString().slice(0, 10);
          label = 'Week of ' + wk.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          short = suShort(wk.toISOString().slice(0, 10));
        }
        if (!(key in byKey)) { byKey[key] = { label: label, short: short, count: 0 }; order.push(key); }
        byKey[key].count += Number(d.count || 0);
      });
      return order.map(function (k) { return byKey[k]; });
    }
    // reusable bar chart for any daily series (unit = singular noun)
    function seriesChart(daily, days, unit) {
      var buckets = suBucket(daily, days);
      var total = buckets.reduce(function (a, x) { return a + x.count; }, 0);
      if (!buckets.length || !total) return stateEmpty('No ' + unit + 's in this range.');
      var max = Math.max.apply(null, buckets.map(function (x) { return x.count; }).concat([1]));
      var n = buckets.length;
      var cols = buckets.map(function (x) {
        var h = x.count > 0 ? Math.max(3, Math.round(x.count / max * 100)) : 0;
        return '<div class="suc-col"' + (x.count > 0 ? ' data-tip="' + esc(x.label + ' · ' + x.count + ' ' + unit + (x.count === 1 ? '' : 's')) + '"' : '') + '>' +
          (h ? '<div class="suc-bar" style="height:' + h + '%"></div>' : '') + '</div>';
      }).join('');
      var axis = '<span>' + esc(buckets[0].short) + '</span>' +
        (n > 2 ? '<span>' + esc(buckets[Math.floor((n - 1) / 2)].short) + '</span>' : '') +
        '<span>' + esc(buckets[n - 1].short) + '</span>';
      return '<div class="suc">' +
        '<div class="suc-ymax">' + num(max) + ' max</div>' +
        '<div class="suc-plot"><div class="suc-grid" style="top:50%"></div><div class="suc-grid" style="top:25%"></div>' + cols + '</div>' +
        '<div class="suc-axis">' + axis + '</div>' +
        '<div class="suc-total">' + num(total) + ' ' + unit + (total === 1 ? '' : 's') + ' · each bar = ' + unit + 's per ' +

    // ── Users: headers drive the SERVER sort ─────────────────────────────────
    // This table is paginated, so it can't use admSortable — reordering the
    // fifty rows on screen would sort a page out of four hundred and look like
    // an answer. Clicking a header sets p_sort/p_dir and refetches from page 1.
    //
    // The `u-sort` select stays and stays in sync: on narrow screens
    // .adm-cardable hides thead entirely and the table becomes cards, so the
    // select is the ONLY sort control there. Removing it would leave mobile
    // with none.
    function wireUserSort(scope) {
      var head = scope.querySelector('thead tr');
      if (!head) return;
      Object.keys(USER_COLS).forEach(function (idx) {
        var i = parseInt(idx, 10);
        var th = head.cells[i];
        var col = USER_COLS[idx];
        if (!th) return;

        var info = th.querySelector('.adm-thinfo');
        var clone = th.cloneNode(true);
        var ci = clone.querySelector('.adm-thinfo');
        if (ci) ci.parentNode.removeChild(ci);
        var label = clone.innerHTML.trim();

        var on = usersState.sort === col.key;
        var caret = on ? (usersState.dir === 'asc' ? '↑' : '↓') : '';
        th.innerHTML = '<button type="button" class="adm-th-sort">' + label +
          '<span class="adm-th-caret" aria-hidden="true">' + caret + '</span></button>' +
          (info ? info.outerHTML : '');
        if (on) th.setAttribute('aria-sort', usersState.dir === 'asc' ? 'ascending' : 'descending');
        else th.removeAttribute('aria-sort');

        th.querySelector('.adm-th-sort').addEventListener('click', function () {
          usersState.dir = (usersState.sort === col.key)
            ? (usersState.dir === 'asc' ? 'desc' : 'asc')   // same column → reverse
            : col.dir;                                      // new column → its natural start
          usersState.sort = col.key;
          usersState.page = 0;        // a new order means page 1, or you're reading
          var sel = document.getElementById('u-sort');       // the middle of a list

          loadUsers();

    // ── RETENTION (signup-month cohorts) ──
    async function renderRetention() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var rows = await A.rpc('admin_retention') || [];
        var grid = await A.rpc('admin_retention_grid').catch(function () { return null; });
        var churn = await A.rpc('admin_churn').catch(function () { return null; });

        var totalUsers = rows.reduce(function (a, r) { return a + Number(r.signups || 0); }, 0);
        var totalActive = rows.reduce(function (a, r) { return a + Number(r.active_30d || 0); }, 0);
        var overall = totalUsers ? Math.round(totalActive / totalUsers * 100) : 0;
        var metrics = '<div class="adm-metrics">' +
          mtile('Overall retention', overall + '%', 'Share of all teachers active in the last 30 days.', 'active · last 30 days') +
          mtile('At-risk', churn ? num(churn.at_risk_count) : '—', 'Engaged teachers who’ve gone quiet for 14–90 days.') +
          mtile('Resurrected', churn ? num(churn.resurrected_count) : '—', 'Teachers who returned in the last 30 days after 3+ weeks away.') +
          '</div>';

        // D1 — weekly cohort retention grid (the triangle)
        var gridPanel;
        if (grid && (grid.cohorts || []).length) {
          var cohorts = grid.cohorts, maxK = 0;
          cohorts.forEach(function (c) { (c.cells || []).forEach(function (cell) { if (cell.k > maxK) maxK = cell.k; }); });
          maxK = Math.min(maxK, 8);
          var head = '<tr><th>Cohort</th><th class="num">Size</th>';
          for (var hk = 0; hk <= maxK; hk++) head += '<th class="num">W' + hk + '</th>';
          head += '</tr>';
          var gridRows = cohorts.map(function (c) {
            var byK = {}; (c.cells || []).forEach(function (cell) { byK[cell.k] = cell; });
            var tds = '';
            for (var k = 0; k <= maxK; k++) {
              if (k > c.weeks_elapsed) { tds += '<td></td>'; continue; }
              var cell = byK[k], pct = cell ? (Number(cell.pct) || 0) : 0, active = cell ? cell.active : 0;
              var alpha = (pct / 100 * 0.55 + 0.05).toFixed(2);
              tds += '<td class="adm-hm" style="background:rgba(var(--accent-rgb),' + alpha + ')" data-tip="' + active + ' of ' + c.size + ' active">' + pct + '</td>';
            }
            return '<tr><td>' + A.fmtDate(c.cohort_week) + '</td><td class="num">' + num(c.size) + '</td>' + tds + '</tr>';
          }).join('');
          gridPanel = '<div class="adm-panel"><div class="adm-panel-head"><h2>Do they stay, week by week</h2><span class="muted adm-mono" style="font-size:11px">share of the cohort active each week · W0 = signup week</span></div><div class="adm-scroll"><table class="adm-table adm-grid"><thead>' + head + '</thead><tbody>' + gridRows + '</tbody></table></div></div>';
        } else {
          gridPanel = '<div class="adm-panel"><div class="adm-panel-head"><h2>Do they stay, week by week</h2></div><div class="adm-intro" style="margin:0">The cohort grid needs the latest <code>admin-analytics.sql</code> run in Supabase.</div></div>';
        }

        // D2 — at-risk · D3 — resurrected
        var churnPanels = '';
        if (churn) {
          var arRows = (churn.at_risk || []).map(function (u) {
            return '<tr><td class="adm-mono">' + esc(u.email || '') + '</td><td class="muted">' + A.fmtDate(u.last_seen) + '</td><td class="num">' + num(u.days_quiet) + 'd</td><td class="num muted">' + num(u.actions) + '</td></tr>';
          }).join('');

            '<div class="adm-intro" style="margin-top:0">Teachers who were building things, then stopped. The best re-engagement list you have.</div>' +
            (arRows ? '<div class="adm-scroll"><table class="adm-table"><thead><tr><th>Email</th><th>Last seen</th><th class="num">Quiet</th><th class="num">Actions</th></tr></thead><tbody>' + arRows + '</tbody></table></div>' : stateEmpty('Nobody engaged has gone quiet. Great sign.')) + '</div>';

          var rsRows = (churn.resurrected || []).map(function (u) {
            return '<tr><td class="adm-mono">' + esc(u.email || '') + '</td><td class="muted">' + A.fmtDate(u.returned_at) + '</td><td class="num">' + num(u.gap_days) + 'd away</td></tr>';
          }).join('');
          if (rsRows) {
            churnPanels += '<div class="adm-panel"><div class="adm-panel-head"><h2>Resurrected — came back</h2><span class="muted adm-mono" style="font-size:11px">' + num(churn.resurrected_count) + ' · last 30 days</span></div>' +
              '<div class="adm-scroll"><table class="adm-table"><thead><tr><th>Email</th><th>Returned</th><th class="num">Was away</th></tr></thead><tbody>' + rsRows + '</tbody></table></div></div>';
          }
        }

        b.innerHTML =
          metrics + gridPanel + churnPanels;
      } catch (e) { b.innerHTML = stateError(e && e.message); }
    }

    function renderDanger(u) {

    // ── ENGAGEMENT DEPTH — stickiness · tool-usage rate · action depth · reach/return ──

    // gone — its tool reach & return lives on Every Tool now.)
    async function renderDevices() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var got = await Promise.all([
          A.rpc('admin_devices', { p_days: admRange }).catch(function (er) { console.warn('[admin] devices fetch failed:', er && er.message); return null; }),
          A.rpc('admin_friction', { p_days: admRange }).catch(function (er) { console.warn('[admin] sessions fetch failed:', er && er.message); return null; }),
        ]);
        var d = got[0], fr = got[1];
        if (!d && !fr) { b.innerHTML = runSqlNote('Sessions'); return; }
        d = d || {};
        var win = admRangeLabel(admRange).toLowerCase();

        var s = (fr && fr.sessions) || {};
        var sessionTiles = '<div class="adm-metrics">' +
          card('Sessions', num(s.total || 0), win, 'Distinct tab-sessions in this window (counted from session_start).') +
          card('Median visit', (s.median_minutes != null ? s.median_minutes + ' min' : '—'), 'engaged visits only', 'Half the visits where a teacher did something run shorter than this, half longer. Bounces are excluded so they don’t drag it to zero.') +
          card('Bounced', num(s.bounce || 0) + ' of ' + num(s.total || 0), (s.bounce_pct != null ? s.bounce_pct + '%' : null), 'Visits where a teacher landed and left without doing anything — no action, no creation start.') +
          '</div>';
        var LABELS = { mobile: 'Mobile', tablet: 'Tablet', desktop: 'Desktop', unknown: 'Unknown' };
        var reach = d.reach || [];
        var byDev = {}; reach.forEach(function (x) { byDev[x.device] = x; });
        var cards = ['mobile', 'tablet', 'desktop', 'unknown'].filter(function (k) { return byDev[k]; }).map(function (k) {
          var x = byDev[k];
          var sessions = Number(x.sessions) || 0;
          var share = (x.share != null) ? x.share + '%' : '—';
          var per = (x.per_session != null) ? x.per_session : '—';
          return card(LABELS[k] || k, share,
            num(sessions) + ' sessions · ' + per + ' uses/session',
            'Reach = share of sessions on ' + (LABELS[k] || k).toLowerCase() + '. Depth = events per session (higher = more done per visit). ' + (k === 'unknown' ? 'Unknown = sessions from before device tracking shipped.' : 'Best-effort from the browser.'));
        }).join('');
        var metrics = reach.length ? '<div class="adm-metrics">' + cards + '</div>' : '';

        var tools = d.by_tool || [];
        var toolRows = tools.map(function (t) {
          var m = Number(t.mobile) || 0, ta = Number(t.tablet) || 0, de = Number(t.desktop) || 0, tot = Number(t.total) || 0;

        }).join('');
        var toolPanel = tools.length
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Where each tool is used</h2><span class="muted adm-mono" style="font-size:11px">sessions by device · ' + esc(win) + '</span></div><div class="adm-scroll"><table class="adm-table"><thead><tr><th>Tool</th><th class="num">Mobile</th><th class="num">Tablet</th><th class="num">Desktop</th><th class="num">Total</th></tr></thead><tbody>' + toolRows + '</tbody></table></div></div>'
          : '';

        b.innerHTML =
          sessionTiles + metrics + toolPanel;
      } catch (er) { b.innerHTML = stateError(er && er.message); }
    }

    // ── TOOLS ──
    var toolsRows = [];
    // horizontal opens-vs-actions bars, ranked, above the detail table
    function toolsBars(rows) {
      if (!rows || !rows.length) return '';
      var ranked = rows.slice().sort(function (a, b) { return (Number(b.opens || 0) + Number(b.actions || 0)) - (Number(a.opens || 0) + Number(a.actions || 0)); });
      var maxTotal = Math.max.apply(null, ranked.map(function (t) { return Number(t.opens || 0) + Number(t.actions || 0); }).concat([1]));
      var bars = ranked.map(function (t) {
        var opens = Number(t.opens || 0), actions = Number(t.actions || 0), total = opens + actions;
        var w = Math.round(total / maxTotal * 100);

    // ── MUSIC LIBRARY ──
    // The first WRITE surface in this admin. Everything else here reports;
    // this one changes what teachers get, so every approval is gated on a
    // human having set an energy — see approve_song() in the SQL.
    // The one playlist this tool reads from and writes to. Bonnie and
    // Mackenzie add music to it in Apple Music; Pull brings new songs in for
    // review, Push sends back anything matched by hand.
    //
    // Two identifiers, because Apple needs both. The ID is the catalogue id
    // from the share link, and is all READING needs. The NAME is how the
    // library playlist is found when WRITING, since a share link never yields
    // a library id — so renaming it in Apple Music means changing it here too,
    // or Push stops finding it.
    //
    // If it is ever deleted and recreated the id changes: open it in Apple
    // Music, Share → Copy Link, and take the pl.… from the end.
    // NOTE: turning collaboration on or off in Apple Music CHANGES a
    // playlist's id. If Push fails with "Unable to update tracks", that is
    // Apple's collaborative-playlist bug — turn collaboration off, re-share,
    // and put the new pl.… here.
    var MUSIC_PLAYLIST = {
      id: 'pl.u-yZyVVEXTDJ2NjW',
      name: 'Flow School \u00b7 Master Library',
      url: 'https://music.apple.com/us/playlist/flow-school-master-library/pl.u-yZyVVEXTDJ2NjW',
    };

    var MUS = { pending: [], linked: {}, removed: {}, edits: {}, q: '', lvl: 'all', shown: 20 };

    // Three axes, both poles shown. A single highlighted "vocal" chip never
    // said what the alternative was — a song that isn't vocal is
    // instrumental, and "not highlighted" could equally have meant nobody had
    // decided yet. Naming both sides removes the guess and makes the unset
    // case impossible to confuse with a choice.
    // The same control the Playlist Builder gives teachers: the artwork IS
    // the play button, with the glyph always visible over a scrim rather than
    // appearing on hover. Admins are on laptops where hover exists, but two
    // different play affordances in one product is one too many.
    function musArt(artUrl, preview, title) {
      var src = artUrl ? artUrl.replace(/{px}/g, '80') : null;
      var playable = !!preview;
      return '<button class="mus-art' + (src ? ' has-art' : '') + (playable ? '' : ' no-audio') + '"' +
        (playable ? ' data-prev="' + esc(preview) + '"' : ' tabindex="-1" aria-disabled="true"') +
        ' aria-label="' + esc(playable ? 'Preview ' + title : 'No preview for ' + title) + '">' +
        (src ? '<img src="' + esc(src) + '" alt="">' : '') +
        '<span class="material-symbols-sharp">' + (playable ? 'play_arrow' : 'music_note') + '</span>' +
        // hidden until .playing; decoration to a screen reader, which already
        // has the button's label
        (playable ? '<span class="mus-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>' : '') +
        '</button>';
    }

    // The top of the energy scale, matching the Playlist Builder's curve.
    // Nothing in the catalogue has ever reached 9, so offering 9 and 10 here
    // invited scoring a song into a level no arc can ask for.
    var MAX_E = 8;

    var MUS_AXES = [
      { f: 'vocal',      off: 'instrumental', on: 'vocal' },
      { f: 'electronic', off: 'acoustic',     on: 'electronic' },
      { f: 'bright',     off: 'moody',        on: 'bright' },
    ];

    function musAxes(song) {
      return '<div class="ch-set">' + MUS_AXES.map(function (a) {
        var v = song ? !!song[a.f] : false;
        return '<div class="ch-pair" data-f="' + a.f + '">' +
          '<button class="ch-opt' + (v ? '' : ' on') + '" data-v="0">' + a.off + '</button>' +
          '<button class="ch-opt' + (v ? ' on' : '') + '" data-v="1">' + a.on + '</button>' +
          '</div>';
      }).join('') + '</div>';
    }

    function musReadAxes(tr) {
      var out = {};
      MUS_AXES.forEach(function (a) {
        var on = tr.querySelector('.ch-pair[data-f="' + a.f + '"] .ch-opt.on');
        out[a.f] = !!(on && on.dataset.v === '1');
      });
      return out;
    }

    function musLevels() {
      var out = [];
      for (var i = 0; i <= MAX_E; i++) out.push(i);
      return out;
    }

    function musDur(d) { return Math.floor(d / 60) + ':' + String(d % 60).padStart(2, '0'); }

    function musRow(r) {
      return '<tr data-sid="' + r.song_id + '">' +
        '<td>' + musArt(r.art, r.preview, r.title) + '</td>' +
        '<td><strong>' + esc(r.title) + '</strong><br><span class="muted">' + esc(r.artist) + '</span>' +
          (r.genre ? '<br><span class="muted adm-mono">' + esc(r.genre) + '</span>' : '') + '</td>' +
        '<td class="muted adm-mono">' + musDur(r.dur) + '</td>' +
        '<td><div class="mus-energy">' +
          musLevels().map(function (n) { return '<button class="mus-e" data-e="' + n + '">' + n + '</button>'; }).join('') +
        '</div></td>' +
        '<td>' + musAxes(null) + '</td>' +
        '<td class="mus-actions"><button class="btn-primary mus-ok" disabled>Approve</button>' +
        '<button class="btn-ghost mus-no">Pass</button></td></tr>';
    }

    // Songs with no artwork and no preview. The resolver refused to guess when
    // title, artist or duration disagreed — the right call, since a wrong match
    // puts the wrong thirty seconds against a song and nobody notices until it
    // plays. Refusing leaves a gap only a person can close, so: search Apple,
    // listen, pick. The duration difference is shown against every candidate
    // because it is the cheapest tell that a result is a live cut or a remix.
    function musUnmatched() {
      if (typeof SONGS === 'undefined') return [];
      return SONGS.filter(function (sg) {
        var hasMedia = (typeof APPLE_MEDIA !== 'undefined') && APPLE_MEDIA[sg.id];
        return !hasMedia && !MUS.linked[sg.id] && !MUS.removed[sg.id];
      });
    }

    // ── The whole catalogue ───────────────────────────────────────────
    // 838 songs is far past what a table should render at once, and past what
    // anyone reads. So: search first, show what matches, cap the list. You
    // come here looking for a song, not to scroll a library.
    // Twenty at a time, appended. This list is for working THROUGH the
    // catalogue, not glancing at it — the old cap of 60 with "narrow the
    // search to see the rest" made the other 778 unreachable by scrolling.
    var MUS_PAGE = 20;

    function musLive() {
      if (typeof SONGS === 'undefined') return [];
      return SONGS.filter(function (sg) { return !MUS.removed[sg.id]; })
        .map(function (sg) {
          var e = MUS.edits[sg.id];
          // a correction made in the admin is what this song IS now, whatever
          // the shipped file still says
          return e ? {
            id: sg.id, title: sg.title, artist: sg.artist, dur: sg.dur,
            energy: e.energy, vocal: e.vocal, electronic: e.electronic,
            bright: e.bright, edited: true,
          } : sg;
        });
    }

    function musMatches() {
      var q = (MUS.q || '').trim().toLowerCase();
      var lvl = MUS.lvl;
      return musLive().filter(function (sg) {
        if (lvl !== 'all' && sg.energy !== Number(lvl)) return false;
        if (!q) return true;
        return (sg.title + ' ' + sg.artist).toLowerCase().indexOf(q) !== -1;
      });
    }

    function musCatalogueRow(sg) {
      var m = (typeof APPLE_MEDIA !== 'undefined') && APPLE_MEDIA[sg.id];
      var art = m && m.art ? m.art.replace(/{px}/g, '80') : null;
      return '<tr data-cid="' + sg.id + '">' +
        '<td>' + musArt(m && m.art, m && m.prev, sg.title) + '</td>' +
        '<td><strong>' + esc(sg.title) + '</strong><br><span class="muted">' + esc(sg.artist) + '</span>' +
          (sg.edited ? ' <span class="adm-pill admin">edited</span>' : '') + '</td>' +
        '<td class="muted adm-mono">' + musDur(sg.dur) + '</td>' +
        // a select, not the eleven-button picker: that one is for fast triage
        // of a few songs; this list is dense and mostly read, not rewritten
        '<td><select class="cat-e" aria-label="Energy for ' + esc(sg.title) + '">' +
          musLevels().map(function (n) {
            return '<option value="' + n + '"' + (n === sg.energy ? ' selected' : '') + '>' + n + '</option>';
          }).join('') + '</select></td>' +
        '<td class="cat-axes">' + musAxes(sg) + '</td>' +
        '<td class="mus-actions"><button class="btn-ghost cat-del" data-t="' + esc(sg.title) + '" data-a="' + esc(sg.artist) + '">Remove</button></td>' +
        '</tr>';
    }

    // The metric tiles are the only other thing a removal changes, so update
    // them in place rather than redrawing everything that surrounds them.
    function musRefreshCounts() {
      var live = musLive().length;
      var media = musLive().filter(function (sg) {
        return (typeof APPLE_MEDIA !== 'undefined' && APPLE_MEDIA[sg.id]) || MUS.linked[sg.id];
      }).length;
      var tiles = bodyEl().querySelectorAll('.adm-metric');
      if (tiles[0]) tiles[0].querySelector('.val').textContent = num(live);
      if (tiles[1]) tiles[1].querySelector('.val').textContent = num(media);
      var c = document.getElementById('cat-count');
      if (c) c.textContent = musCatalogueCount();
    }

    // "showing X of Y" is a promise that Y is the thing you are looking at.
    // Filtered-and-fully-shown used to quote the whole catalogue as Y — energy
    // 7 read "16 of 881", which says 16 of 881 RELEVANT songs. It only looked
    // like a 7-and-8 problem because those two fit on one page; any level said
    // it once you loaded the rest. When everything is shown there is no
    // remainder to describe, so it just counts.
    function musCatalogueCount() {
      var all = musLive(), hits = musMatches();
      var n = Math.min(MUS.shown, hits.length);
      var filtered = hits.length !== all.length;
      if (n >= hits.length) return num(hits.length) + (filtered ? ' matches' : ' songs');
      return filtered
        ? 'showing ' + num(n) + ' of ' + num(hits.length) + ' matches'
        : 'showing ' + num(n) + ' of ' + num(all.length);
    }

    function musCatalogueList() {
      var hits = musMatches();
      var shown = hits.slice(0, MUS.shown);
      if (!shown.length) return stateEmpty('Nothing matches that.');
      var rest = hits.length - shown.length;
      return '<div class="adm-scroll"><table class="adm-table mus-table"><thead><tr><th></th><th>Song</th><th>Length</th><th>Energy</th><th>Character</th><th></th></tr></thead><tbody>' +
        shown.map(musCatalogueRow).join('') + '</tbody></table></div>' +
        (rest > 0
          ? '<div class="cat-more"><button class="btn-secondary" id="cat-more">Show ' +
            Math.min(MUS_PAGE, rest) + ' more</button> <span class="muted adm-mono">' +
            num(rest) + ' still to go</span></div>'
          : '');
    }

    // Redraws ONLY the list. Searching used to call renderMusic(), which
    // rebuilt the whole tab — so the search box you were typing into was
    // destroyed and recreated mid-word, taking the caret and the scroll
    // position with it.
    function musRedrawList() {
      var host = document.getElementById('cat-list');
      var count = document.getElementById('cat-count');
      if (host) host.innerHTML = musCatalogueList();
      if (count) count.textContent = musCatalogueCount();
    }

    // Appends the next page rather than redrawing the list. Rebuilding it
    // would throw away every row you had already worked through, and put you
    // back at the top of a list you were halfway down.
    function musShowMore() {
      var hits = musMatches();
      var next = hits.slice(MUS.shown, MUS.shown + MUS_PAGE);
      MUS.shown += MUS_PAGE;
      var tbody = document.querySelector('#cat-list tbody');
      if (tbody) tbody.insertAdjacentHTML('beforeend', next.map(musCatalogueRow).join(''));
      var more = document.querySelector('.cat-more');
      if (more) {
        var rest = hits.length - MUS.shown;
        if (rest > 0) {
          more.querySelector('#cat-more').textContent = 'Show ' + Math.min(MUS_PAGE, rest) + ' more';
          more.querySelector('.muted').textContent = num(rest) + ' still to go';
        } else {
          more.remove();
        }
      }
      var count = document.getElementById('cat-count');
      if (count) count.textContent = musCatalogueCount();
    }

    function musCataloguePanel() {
      var all = musLive(), hits = musMatches();
      var shown = hits.slice(0, MUS_PAGE);
      return '<div class="adm-panel"><div class="adm-panel-head"><h2>All songs</h2>' +
        '<span class="muted adm-mono">' + num(all.length) + '</span></div>' +
        '<div class="adm-panel-body">' +
          '<div class="cat-controls">' +
            '<input type="text" class="modal-input" id="cat-q" placeholder="Search title or artist\u2026" value="' + esc(MUS.q) + '" aria-label="Search songs">' +
            '<select id="cat-lvl" aria-label="Filter by energy"><option value="all">Every energy</option>' +
              musLevels().map(function (n) {
                return '<option value="' + n + '"' + (String(MUS.lvl) === String(n) ? ' selected' : '') + '>energy ' + n + '</option>';
              }).join('') + '</select>' +
          '</div>' +
          '<p class="muted adm-mono" id="cat-count">' + musCatalogueCount() + '</p>' +
        '</div>' +
        '<div id="cat-list">' + musCatalogueList() + '</div>' +
        '</div>';
    }

    function musUnmatchedPanel() {
      var miss = musUnmatched();
      if (!miss.length) return '';
      return '<div class="adm-panel"><div class="adm-panel-head"><h2>No artwork or preview</h2>' +
        '<span class="muted adm-mono">' + num(miss.length) + '</span></div>' +
        '<div class="adm-panel-body"><p class="muted">The resolver wouldn\u2019t guess on these \u2014 usually a live version, a remaster, or a song of the same name. Search Apple, listen, and pick the right recording.</p></div>' +
        '<div class="adm-scroll"><table class="adm-table mus-table"><thead><tr><th>Song</th><th>Length</th><th></th></tr></thead><tbody>' +
        miss.map(function (sg) {
          return '<tr data-mid="' + sg.id + '" data-q="' + esc(sg.artist + ' ' + sg.title) + '" data-dur="' + sg.dur + '">' +
            '<td><strong>' + esc(sg.title) + '</strong><br><span class="muted">' + esc(sg.artist) + '</span></td>' +
            '<td class="muted adm-mono">' + musDur(sg.dur) + '</td>' +
            '<td class="mus-actions"><button class="btn-secondary mus-find">Find on Apple Music</button> ' +
            '<button class="btn-ghost mus-del" data-t="' + esc(sg.title) + '" data-a="' + esc(sg.artist) + '">Remove</button></td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }

    // candidates render into a row beneath the song, tagged with the song id so
    // the pick handler never has to guess which row it belongs to
    function d3(tr) {
      var next = tr.nextElementSibling;
      if (next && next.classList.contains('mus-cand-row')) return next.querySelector('.mus-cand-host');
      var host = document.createElement('tr');
      host.className = 'mus-cand-row';
      host.innerHTML = '<td colspan="3"><div class="mus-cand-host" data-for="' + tr.dataset.mid + '"></div></td>';
      tr.parentNode.insertBefore(host, tr.nextSibling);
      return host.querySelector('.mus-cand-host');
    }

    function musCandidateRow(sg, c, ourDur) {
      var gap = Math.abs(c.dur - ourDur);
      return '<div class="mus-cand" data-apple="' + esc(c.appleId) + '">' +
        musArt(c.art, c.preview, c.title) +
        '<div class="mus-cand-txt"><strong>' + esc(c.title) + '</strong><br><span class="muted">' + esc(c.artist) +
          (c.album ? ' \u00b7 ' + esc(c.album) : '') + '</span></div>' +
        '<span class="mus-gap' + (gap <= 3 ? ' good' : gap <= 10 ? ' near' : ' off') + '">' +
          musDur(c.dur) + (gap === 0 ? '' : ' \u00b7 ' + (gap <= 3 ? 'matches' : gap + 's off')) + '</span>' +

        '<button class="btn-primary mus-pick">This one</button>' +
        '<span class="mus-cand-data" hidden>' + esc(JSON.stringify(c)) + '</span></div>';
    }

    // Saves whatever the row currently shows. Called on every change rather
    // than behind a Save button — four fields on one song is not a form.
    async function musSaveRow(tr) {
      if (!tr) return;
      var sel = tr.querySelector('.cat-e');
      var ax = musReadAxes(tr);
      var flag = function (f) { return ax[f]; };
      var id = Number(tr.dataset.cid);
      tr.classList.add('cat-saving');
      try {
        await A.rpc('edit_song', {
          p_song_id: id, p_energy: Number(sel.value),
          p_vocal: flag('vocal'), p_electronic: flag('electronic'), p_bright: flag('bright'),
        });
        // keep the in-memory copy in step so a re-render does not undo what
        // was just saved
        MUS.edits[id] = {
          song_id: id, energy: Number(sel.value), vocal: flag('vocal'),
          electronic: flag('electronic'), bright: flag('bright'),
        };
        tr.classList.remove('cat-saving');
        tr.classList.add('cat-saved');
        setTimeout(function () { tr.classList.remove('cat-saved'); }, 900);
      } catch (err) {
        tr.classList.remove('cat-saving');
        toast(err.message || 'Could not save that');
      }
    }

    // Approving, pulling and pushing change enough that a full redraw is
    // honest. Losing your place while doing it is not — the panel you were
    // working in jumps to the top and you have to find it again.
    async function renderMusic(keepPlace) {
      var y = keepPlace ? window.scrollY : 0;
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var staged = await db.from('music_staging').select('*').order('added_at', { ascending: false });
        if (staged.error) throw staged.error;
        var rows = staged.data || [];
        var removed = await db.from('music_removed').select('*').order('removed_at', { ascending: false });
        MUS.removed = {};
        MUS.removedRows = removed.data || [];
        MUS.removedRows.forEach(function (r) { MUS.removed[r.song_id] = true; });

        var edits = await db.from('music_edits').select('*');
        MUS.edits = {};
        (edits.data || []).forEach(function (e) { MUS.edits[e.song_id] = e; });

        var linked = await db.from('music_links').select('song_id');
        MUS.linked = {};
        (linked.data || []).forEach(function (l) { MUS.linked[l.song_id] = true; });
        MUS.pending = rows.filter(function (r) { return r.status === 'pending'; });
        var approved = rows.filter(function (r) { return r.status === 'approved'; });
        // 'rejected' rows are still recorded — they are what stops a passed-on
        // song being offered for review again — they just aren't listed here.

        // SONGS is the SHIPPED file. Approved songs are live for teachers the
        // moment they are approved — the Builder merges them — so leaving
        // them out made approving a song look like it had done nothing.
        // WHAT A TEACHER CAN ACTUALLY USE, not what the file says.
        //
        // Three times now a metric has been computed straight off the shipped
        // file and been wrong the moment somebody did something: linking a
        // song moved no number, then approving one, then removing one. Each
        // was fixed on its own and the next state broke it again — because
        // every count derived the live catalogue independently and forgot
        // whichever state came last.
        //
        // So the live set is built ONCE, here, and every metric reads it. A
        // fourth state only has to be handled in this block.
        // Only the catalogue count survives. A parallel media set used to be
        // built alongside it for the artwork/preview tile; that tile is gone,
        // so tracking media here would be counting for nobody. MUS.linked is
        // still read elsewhere — musUnmatched() needs it — just not here.
        var liveIds = {};
        if (typeof SONGS !== 'undefined') SONGS.forEach(function (sg) { liveIds[sg.id] = true; });
        // approved — live for teachers now; the nightly job adds it to the file
        approved.forEach(function (r) {
          if (r.energy == null) return;                  // never judged
          liveIds[r.song_id] = true;
        });
        // removed — gone from the Builder immediately, file or not
        Object.keys(MUS.removed).forEach(function (id) { delete liveIds[id]; });

        var inFile = Object.keys(liveIds).length;

        b.innerHTML =
          // The one thing the old intro carried that the screen cannot: the
          // door to the source playlist. The pipeline explanation lives in
          // the panels' own copy now.
          '<div>' +
            '<a class="btn-secondary adm-explain-cta" href="' + esc(MUSIC_PLAYLIST.url) + '" target="_blank" rel="noopener">' +
              'Open the playlist in Apple Music<span class="material-symbols-sharp">open_in_new</span></a>' +
          '</div>' +
          '<div class="adm-metrics">' +
            // Two numbers, both actionable: how much music there is, and how
            // much is waiting on you. The file-versus-live distinction used to
            // hang here as a sub-line; the paragraph above explains it once,
            // properly, and a count that asks for nothing is just noise beside
            // one that does.
            '<div class="adm-metric"><div class="lbl">Songs in catalogue</div><div class="val">' + num(inFile) + '</div></div>' +
            '<div class="adm-metric"><div class="lbl">Needs review</div><div class="val">' + num(MUS.pending.length) + '</div></div>' +
          '</div>' +
          // Pull sits here because this is where its result lands \u2014 songs
          // arrive in the review queue, so the button and its outcome are in
          // one place rather than a panel apart.
          '<div class="adm-panel"><div class="adm-panel-head"><h2>Needs review</h2>' +
          '<div class="mus-pull"><span class="muted adm-mono">' + num(MUS.pending.length) + '</span>' +
          '<button class="btn-secondary" id="mus-pull">Pull new songs</button></div></div>' +
          '<p class="muted adm-mono" id="mus-pull-note"></p>' +
            (MUS.pending.length
              ? '<div class="adm-scroll"><table class="adm-table mus-table"><thead><tr><th></th><th>Song</th><th>Length</th><th>Energy \u00b7 0\u2013' + MAX_E + '</th><th>Character</th><th></th></tr></thead><tbody>' + MUS.pending.map(musRow).join('') + '</tbody></table></div>'
              : stateEmpty('Nothing waiting. Add songs to \u201c' + esc(MUSIC_PLAYLIST.name) + '\u201d in Apple Music, then pull them in.')) +
          '</div>' +
          musCataloguePanel() +
          musUnmatchedPanel() +
          (approved.length
            ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Approved</h2><span class="muted adm-mono">live for teachers now</span></div><div class="adm-scroll"><table class="adm-table"><thead><tr><th>Song</th><th class="num">Energy</th><th>Character</th><th>Approved</th></tr></thead><tbody>' +
              approved.map(function (r) {
                return '<tr><td><strong>' + esc(r.title) + '</strong><br><span class="muted">' + esc(r.artist) + '</span></td><td class="num">' + r.energy + '</td><td class="muted adm-mono">' +
                  [r.vocal ? 'vocal' : 'instrumental', r.electronic ? 'electronic' : 'acoustic', r.bright ? 'bright' : 'moody'].join(' \u00b7 ') +
                  '</td><td class="muted">' + A.ago(r.reviewed_at) + '</td></tr>';
              }).join('') + '</tbody></table></div></div>'
            : '');
        wireMusic();
        if (keepPlace) window.scrollTo(0, y);
        // so the Push button's authorize() is the first async thing its click
        // does, rather than the fourth
        if (window.fsMusicKit && fsMusicKit.prewarm) fsMusicKit.prewarm();
      } catch (e) { b.innerHTML = stateError(e && e.message); }
    }

    // Energy and the three flags are chosen per row; Approve stays disabled
    // until an energy is picked, because approve_song() rejects a null and a
    // guessed number is exactly how the existing catalogue got its wrong ones.
    function musState(tr) {
      var e = tr.querySelector('.mus-e.on');
      var ax = musReadAxes(tr);
      return {
        energy: e ? Number(e.dataset.e) : null,
        vocal: ax.vocal, electronic: ax.electronic, bright: ax.bright,
      };
    }

    var musAudio = null, musBtn = null;
    function musStop() {
      if (musAudio) musAudio.pause();
      if (musBtn) {
        musBtn.classList.remove('playing');
        musBtn.querySelector('.material-symbols-sharp').textContent = 'play_arrow';
        musBtn = null;
      }
    }

    function wireMusic() {
      var b = bodyEl();

      // renderMusic() calls this after EVERY render, and the body element
      // survives its own innerHTML being replaced — so without this guard the
      // listeners stack up and one click runs the handler N times. That is
      // invisible for a toggle and catastrophic for the two-step delete: the
      // first press armed it and the second run of the same click confirmed.
      if (!b.dataset.musWired) {
        b.dataset.musWired = '1';
        b.addEventListener('click', musClick);
        b.addEventListener('change', function (ev) {
          var sel = ev.target.closest && ev.target.closest('.cat-e');
          if (sel) musSaveRow(sel.closest('tr'));
        });
      }

      // these live inside the replaced markup, so they are re-bound each time
      var q = document.getElementById('cat-q');
      if (q) {
        var qt;
        q.addEventListener('input', function () {
          clearTimeout(qt);
          // re-rendering on every keystroke would rebuild 60 rows per letter
          qt = setTimeout(function () { MUS.q = q.value; MUS.shown = MUS_PAGE; musRedrawList(); }, 200);
        });
      }
      var lvl = document.getElementById('cat-lvl');
      if (lvl) lvl.addEventListener('change', function () { MUS.lvl = lvl.value; MUS.shown = MUS_PAGE; musRedrawList(); });

      var pull = document.getElementById('mus-pull');
      if (pull) pull.addEventListener('click', musPull);
    }

    async function musClick(ev) {
      {
        var b = bodyEl();
        var t = ev.target;

        var e = t.closest && t.closest('.mus-e');
        if (e) {
          var row = e.closest('tr');
          row.querySelectorAll('.mus-e').forEach(function (x) { x.classList.toggle('on', x === e); });
          row.querySelector('.mus-ok').disabled = false;
          return;
        }

        // Catalogue toggles carry BOTH classes, so this branch catches them
        // too — and used to return before the catalogue's own branch could
        // run, which is why editing character there silently saved nothing.
        // One branch, no ordering to get wrong.
        // One branch for both tables. In the catalogue a choice IS the edit
        // and saves at once; in the review queue it is only read when Approve
        // is pressed. Selecting a pole is idempotent — pressing the one
        // already chosen does nothing rather than un-choosing it, because
        // "neither" is not an answer the database will accept.
        if (t.id === 'cat-more' || (t.closest && t.closest('#cat-more'))) { musShowMore(); return; }

        var opt = t.closest && t.closest('.ch-opt');
        if (opt) {
          if (opt.classList.contains('on')) return;
          var pair = opt.closest('.ch-pair');
          pair.querySelectorAll('.ch-opt').forEach(function (o) { o.classList.toggle('on', o === opt); });
          var row = opt.closest('tr');
          if (row && row.dataset.cid) musSaveRow(row);
          return;
        }

        var play = t.closest && t.closest('.mus-art[data-prev]');
        if (play) {
          var same = musBtn === play;
          musStop();
          if (same) return;
          if (!musAudio) { musAudio = new Audio(); musAudio.addEventListener('ended', musStop); }
          musAudio.src = play.dataset.prev;
          musBtn = play;
          play.classList.add('playing');
          play.querySelector('.material-symbols-sharp').textContent = 'pause';
              musAudio.play().catch(musStop);
          return;
        }

        var ok = t.closest && t.closest('.mus-ok');
        if (ok && !ok.disabled) {
          var tr = ok.closest('tr'), st = musState(tr);
          if (st.energy === null) return;
          ok.disabled = true;
          try {
            await A.rpc('approve_song', {
              p_song_id: Number(tr.dataset.sid), p_energy: st.energy,
              p_vocal: st.vocal, p_electronic: st.electronic, p_bright: st.bright,
            });
            musStop();
            toast('Approved \u2014 teachers can use it now');
            renderMusic(true);
          } catch (err) { ok.disabled = false; toast(err.message || 'Could not approve that'); }
          return;
        }

        var find = t.closest && t.closest('.mus-find');
        if (find) {
          var ftr = find.closest('tr');
          find.disabled = true; find.textContent = 'Searching\u2026';
          try {
            var cands = await fsMusicKit.search(ftr.dataset.q, 6);
            var host = d3(ftr);
            host.innerHTML = cands.length
              ? cands.map(function (c) { return musCandidateRow(null, c, Number(ftr.dataset.dur)); }).join('')
              : '<div class="muted" style="padding:12px 0">Nothing came back for that. It may not be on Apple Music.</div>';
            find.textContent = 'Search again';
          } catch (err) {
            toast(fsMusicKit.explain(err));
            find.textContent = 'Find on Apple Music';
          }
          find.disabled = false;
          return;
        }

        var pick = t.closest && t.closest('.mus-pick');
        if (pick) {
          var cand = pick.closest('.mus-cand');
          // the host row carries the song id it was opened for — no walking
          // the table and hoping the sibling order held
          var sid = Number(cand.closest('.mus-cand-host').dataset.for);
          var info = JSON.parse(cand.querySelector('.mus-cand-data').textContent);
          if (!sid) { toast('Lost track of which song that was'); return; }
          pick.disabled = true;
          try {
            await A.rpc('link_song', {
              p_song_id: sid, p_apple_id: Number(info.appleId),
              p_art: info.art, p_preview: info.preview,
              p_genre: info.genre, p_isrc: info.isrc,
            });
            musStop();
            toast('Linked \u2014 ' + info.title);
            renderMusic(true);
          } catch (err) { pick.disabled = false; toast(err.message || 'Could not link that'); }
          return;
        }

        // Removing is destructive and the row vanishes, so it asks once —
        // in place, on the button itself. A native confirm() dialog for this
        // is heavier than the action deserves, and clicking anywhere else
        // cancels, which a dialog cannot do.
        var cdel = t.closest && t.closest('.cat-del');
        if (cdel) {
          if (cdel.dataset.armed !== '1') {
            b.querySelectorAll('.cat-del[data-armed="1"], .mus-del[data-armed="1"]').forEach(function (o) {
              o.dataset.armed = ''; o.textContent = 'Remove'; o.classList.remove('mus-del-armed');
            });
            cdel.dataset.armed = '1';
            cdel.textContent = 'Really remove?';
            cdel.classList.add('mus-del-armed');
            return;
          }
          var ctr = cdel.closest('tr');
          cdel.disabled = true;
          try {
            await A.rpc('remove_song', {
              p_song_id: Number(ctr.dataset.cid),
              p_title: cdel.dataset.t, p_artist: cdel.dataset.a, p_reason: null,
            });
            musStop();
            // the row goes, nothing else moves. Rebuilding the tab to delete
            // one line is how you end up back at the top of the page.
            MUS.removed[Number(ctr.dataset.cid)] = true;
            ctr.remove();
            musRefreshCounts();
            toast('Removed \u2014 ' + cdel.dataset.t);
          } catch (err) {
            cdel.disabled = false;
            cdel.dataset.armed = ''; cdel.textContent = 'Remove';
            cdel.classList.remove('mus-del-armed');
            toast(err.message || 'Could not remove that');
          }
          return;
        }

        var del = t.closest && t.closest('.mus-del');
        if (del) {
          if (del.dataset.armed !== '1') {
            b.querySelectorAll('.mus-del[data-armed="1"]').forEach(function (o) {
              o.dataset.armed = ''; o.textContent = 'Remove'; o.classList.remove('mus-del-armed');
            });
            del.dataset.armed = '1';
            del.textContent = 'Really remove?';
            del.classList.add('mus-del-armed');
            return;
          }
          var dtr = del.closest('tr');
          del.disabled = true;
          try {
            await A.rpc('remove_song', {
              p_song_id: Number(dtr.dataset.mid),
              p_title: del.dataset.t, p_artist: del.dataset.a, p_reason: null,
            });
            musStop();
            MUS.removed[Number(dtr.dataset.mid)] = true;
            dtr.remove();
            // it may also have been showing in the catalogue above
            var twin = bodyEl().querySelector('tr[data-cid="' + dtr.dataset.mid + '"]');
            if (twin) twin.remove();
            musRefreshCounts();
            toast('Removed \u2014 ' + del.dataset.t);
          } catch (err) {
            del.disabled = false;
            del.dataset.armed = ''; del.textContent = 'Remove';
            del.classList.remove('mus-del-armed');
            toast(err.message || 'Could not remove that');
          }
          return;
        }

        // clicking anywhere else disarms whatever was armed
        if (!del) {
          b.querySelectorAll('.mus-del[data-armed="1"], .cat-del[data-armed="1"]').forEach(function (o) {
            o.dataset.armed = ''; o.textContent = 'Remove'; o.classList.remove('mus-del-armed');
          });
        }

        var no = t.closest && t.closest('.mus-no');
        if (no) {
          var tr2 = no.closest('tr');
          no.disabled = true;
          try {
            await A.rpc('reject_song', { p_song_id: Number(tr2.dataset.sid), p_note: null });
            musStop();
            renderMusic(true);
          } catch (err) { no.disabled = false; toast(err.message || 'Could not do that'); }
          return;
        }
      }

    }

    // Everything Apple already knows about a track comes back with the
    // playlist read — title, artist, length, artwork, preview, genre, ISRC.
    // Only energy and the three character flags are left blank, because they
    // are the only parts a machine has no business deciding.
    async function musPull() {
      var btn = document.getElementById('mus-pull');
      var note = document.getElementById('mus-pull-note');

      btn.disabled = true;
      var restore = btn.textContent;
      btn.textContent = 'Reading\u2026';
      try {
        var tracks = await fsMusicKit.readPlaylist(MUSIC_PLAYLIST.id);

        // three places a song might already be known: the shipped catalogue,
        // a manual link, and the queue itself
        var known = {};
        if (typeof APPLE_MEDIA !== 'undefined') {
          Object.keys(APPLE_MEDIA).forEach(function (k) { known[String(APPLE_MEDIA[k].id)] = true; });
        }
        var seen = await db.from('music_staging').select('apple_id');
        (seen.data || []).forEach(function (r) { known[String(r.apple_id)] = true; });
        var links = await db.from('music_links').select('apple_id');
        (links.data || []).forEach(function (r) { known[String(r.apple_id)] = true; });

        var fresh = tracks.filter(function (t) { return !known[String(t.appleId)]; });
        if (!fresh.length) {
          note.textContent = 'Read ' + tracks.length + ' songs \u2014 nothing new since last time.';
          return;
        }

        var maxId = (typeof SONGS !== 'undefined')
          ? SONGS.reduce(function (a, s2) { return Math.max(a, s2.id); }, 0) : 0;

        var staged = 0;
        for (var i = 0; i < fresh.length; i++) {
          var t = fresh[i];
          btn.textContent = 'Adding ' + (i + 1) + ' of ' + fresh.length + '\u2026';
          try {
            await A.rpc('stage_song', {
              p_apple_id: Number(t.appleId), p_title: t.title, p_artist: t.artist,
              p_dur: t.dur, p_genre: t.genre, p_art: t.art,
              p_preview: t.preview, p_isrc: t.isrc, p_known_max: maxId,
            });
            staged++;
          } catch (e) { console.warn('[music] could not stage', t.title, e && e.message); }
        }
        toast(staged + (staged === 1 ? ' song is' : ' songs are') + ' waiting for review');
        renderMusic(true);
      } catch (err) {
        toast(fsMusicKit.explain(err));
      } finally {
        btn.disabled = false;
        btn.textContent = restore;
      }
    }


    // ── ACTIVITY ──
    async function renderActivity() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var feed = await A.rpc('admin_recent_activity', { p_limit: 60 });
        var audit = await A.rpc('admin_audit', { p_limit: 60 }).catch(function () { return []; });
