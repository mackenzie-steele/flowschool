    // ── Content › Video ─────────────────────────────────────────────────────
    // Mux owns the file; this owns everything Flow School means by "a video".
    // The list never asks Mux anything — it reads the videos table, which the
    // webhook keeps current.
    var VID = { rows: [], cats: [], editing: null, busy: false, q: '', status: 'all', cat: 'all', sort: 'newest' };

    var VIDEO_STATUS = {
      draft:      ['Draft', ''],
      uploading:  ['Uploading', ''],
      processing: ['Processing', ''],
      ready:      ['Ready', ''],
      errored:    ['Failed', 'off'],
      published:  ['Published', 'on'],
      scheduled:  ['Scheduled', ''],
      archived:   ['Archived', ''],
    };
    function videoPill(s) {
      var m = VIDEO_STATUS[s] || [s, ''];
      return '<span class="adm-pill' + (m[1] ? ' ' + m[1] : '') + '">' + esc(m[0]) + '</span>';
    }
    function videoDuration(sec) {
      if (sec == null) return '—';
      var s = Math.round(Number(sec)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
      var r = s % 60;
      return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(r).padStart(2, '0');
    }
    // Detail editors have addresses — #videos/<id>, #collections/<id>,
    // #video-categories/<id> — so a refresh lands back inside the editor
    // instead of on its list. replaceState changes the hash WITHOUT firing
    // hashchange, so writing it never re-routes the page.
    function editorHash(sec, id) {
      var want = '#' + sec + (id ? '/' + id : '');
      if (location.hash !== want) history.replaceState(null, '', want);
    }

    async function renderVideos() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var res = await db.from('videos').select('*').order('created_at', { ascending: false });
        if (res.error) throw res.error;
        VID.rows = res.data || [];
        var cats = await db.from('video_categories').select('*').order('sort_order');
        VID.cats = (cats.data) || [];
        // The collections layer (video-collections.sql). Loaded separately
        // and allowed to fail: the Videos tab must keep working before that
        // file has been run — everything below simply stays hidden.
        VID.x = { ok: false, collections: [], items: [], links: [], filters: [], options: [] };
        try {
          var x = await Promise.all([
            db.from('collections').select('id, title, slug, status'),
            db.from('collection_items').select('id, collection_id, video_id, kind, position'),
            db.from('video_category_links').select('*'),
            db.from('filters').select('*').eq('status', 'active').order('sort_order'),
            db.from('filter_options').select('*').eq('status', 'active').order('sort_order'),
          ]);
          if (!x.some(function (r) { return r.error; })) {
            VID.x = { ok: true, collections: x[0].data || [], items: x[1].data || [],
                      links: x[2].data || [], filters: x[3].data || [], options: x[4].data || [] };
          }
        } catch (_) {}
        VID.sel = {};
        // arriving via the router with #videos/<id> in the URL: open that
        // editor. Plain #videos closes any editor so the page matches the
        // address. Direct renderVideos() calls leave _openOnRender unset
        // and keep today's behaviour.
        if (VID._openOnRender !== undefined) {
          var want = VID._openOnRender; VID._openOnRender = undefined;
          var row = want && VID.rows.filter(function (r) { return r.id === want; })[0];
          VID.editing = row ? Object.assign({}, row) : null;
          if (row) openVideoExtras(row.id);
          else editorHash('videos', null);   // gone or never existed — the list is the truth
        }
        drawVideos();
        loadListThumbTokens();
      } catch (e) {
        b.innerHTML = /relation .* does not exist/i.test(e.message || '')
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Videos</h2></div>' +
            '<div class="adm-intro" style="margin:0">This needs <code>supabase/video-library.sql</code> run in Supabase, then it’ll show here.</div></div>'
          : stateError(e && e.message);
      }
    }

    // Stills are signed like everything else, so list rows without an
    // uploaded poster start as the quiet icon well. ONE batch request
    // fetches thumbnail tokens for the whole list, then the posters drop
    // into the rows already on screen — no redraw, no lost search focus.
    async function loadListThumbTokens() {
      var need = VID.rows.filter(function (v) {
        return v.mux_playback_id && !v.thumb_token &&
               !(v.thumbnail_mode === 'custom' && v.custom_thumbnail_url);
      }).map(function (v) { return v.id; });
      if (!need.length) return;
      try {
        var sess = await db.auth.getSession();
        var tok = sess.data && sess.data.session && sess.data.session.access_token;
        if (!tok) return;
        var r = await fetch('/api/mux/playback-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok },
          body: JSON.stringify({ videoIds: need }),
        });
        var out = await r.json();
        if (!r.ok || !out.thumbnails) return;
        VID.rows.forEach(function (v) {
          if (out.thumbnails[v.id]) v.thumb_token = out.thumbnails[v.id];
        });
        var b = bodyEl(); if (!b) return;
        b.querySelectorAll('.lib-row[data-vid]').forEach(function (row) {
          var v = VID.rows.filter(function (x) { return x.id === row.dataset.vid; })[0];
          if (!v || !v.thumb_token) return;
          var t = row.querySelector('.lib-thumb');
          if (t) t.outerHTML = libVideoThumb(v);
        });
      } catch (_) { /* the icon well is the designed fallback */ }
    }

    function videoMatches() {
      var q = (VID.q || '').trim().toLowerCase();
      return VID.rows.filter(function (v) {
        if (VID.status !== 'all' && v.status !== VID.status) return false;
        if (VID.cat !== 'all' && v.category_id !== VID.cat) return false;
        if (!q) return true;
        return ((v.title || '') + ' ' + (v.short_description || '') + ' ' +
                (v.search_keywords || []).join(' ')).toLowerCase().indexOf(q) !== -1;
      }).sort(function (a, b2) {
        switch (VID.sort) {
          case 'updated': return new Date(b2.updated_at) - new Date(a.updated_at);
          case 'alpha':   return (a.title || '').localeCompare(b2.title || '');
          case 'longest': return (b2.duration_seconds || 0) - (a.duration_seconds || 0);
          default:        return new Date(b2.created_at) - new Date(a.created_at);
        }
      });
    }

    // the list row's art: same sources as the table cell had, at row scale,
    // with the duration burned into the corner the way every video card
    // in the world says "this is a video"
    function libVideoThumb(v) {
      var img = '';
      if (v.thumbnail_mode === 'custom' && v.custom_thumbnail_url) {
        img = '<img alt="" loading="lazy" src="' + esc(v.custom_thumbnail_url) + '">';
      } else if (v.mux_playback_id && v.thumb_token) {
        var t = v.thumbnail_mode === 'timestamp' && v.thumbnail_time_seconds != null
          ? '&time=' + encodeURIComponent(v.thumbnail_time_seconds) : '';
        img = '<img alt="" loading="lazy" src="https://image.mux.com/' +
          encodeURIComponent(v.mux_playback_id) + '/thumbnail.webp?width=320' + t +
          '&token=' + encodeURIComponent(v.thumb_token) + '">';
      }
      return '<span class="lib-thumb">' +
        (img || '<span class="material-symbols-sharp">movie</span>') +
        (v.duration_seconds != null
          ? '<span class="lib-dur">' + videoDuration(v.duration_seconds) + '</span>' : '') +
      '</span>';
    }

    function drawVideos() {
      var b = bodyEl(); if (!b) return;
      if (VID.editing) { drawVideoForm(); return; }
      var hits = videoMatches();
      var catName = {};
      VID.cats.forEach(function (c) { catName[c.id] = c.name; });

      b.innerHTML =
        '<div class="cat-controls lib-bar">' +
          '<input type="text" class="modal-input" id="vid-q" placeholder="Search title, description or keywords…" value="' + esc(VID.q) + '" aria-label="Search videos">' +
          '<div class="lib-bar-end">' +
          '<select id="vid-status" aria-label="Filter by status"><option value="all">Any status</option>' +
            Object.keys(VIDEO_STATUS).map(function (k) {
              return '<option value="' + k + '"' + (VID.status === k ? ' selected' : '') + '>' + VIDEO_STATUS[k][0] + '</option>';
            }).join('') + '</select>' +
          '<select id="vid-cat" aria-label="Filter by category"><option value="all">Any category</option>' +
            // active shelves only — archived categories keep resolving names
            // in the rows below, but they are not a place to browse to
            VID.cats.filter(function (c) { return c.status === 'active'; }).map(function (c) {
              return '<option value="' + c.id + '"' + (VID.cat === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
            }).join('') + '</select>' +
          '<select id="vid-sort" aria-label="Sort videos">' +
            [['newest', 'Newest first'], ['updated', 'Recently updated'], ['alpha', 'A to Z'], ['longest', 'Longest first']]
              .map(function (o) {
                return '<option value="' + o[0] + '"' + (VID.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
              }).join('') + '</select>' +
          '<span class="adm-count">' + num(hits.length) + (hits.length === 1 ? ' video' : ' videos') + '</span>' +
          '<button class="btn-primary" id="vid-new">Add a video</button>' +
          '</div>' +
        '</div>' +
        (VID.cats.length ? '' :
          '<p class="nf-err">There are no categories yet — add one in Categories before publishing.</p>') +
        '<div id="vid-bulkbar"></div>' +
        (hits.length
          ? '<ul class="lib-list">' +
            hits.map(function (v) {
              var meta = [catName[v.category_id] || 'No category', 'Updated ' + A.fmtDate(v.updated_at)];
              return '<li class="lib-row" data-vid="' + v.id + '" tabindex="0" role="button" aria-label="Edit ' + esc(v.title || 'Untitled') + '">' +
                '<label class="lib-check"><input type="checkbox" class="vid-pick"' +
                  (VID.sel[v.id] ? ' checked' : '') + ' aria-label="Select ' + esc(v.title) + '"></label>' +
                libVideoThumb(v) +
                '<span class="lib-main">' +
                  '<span class="lib-title">' + esc(v.title || 'Untitled') + '</span>' +
                  '<span class="lib-meta">' + esc(meta.join(' · ')) + '</span>' +
                  (v.mux_error ? '<span class="lib-flag">' + esc(v.mux_error) + '</span>' : '') +
                '</span>' +
                '<span class="lib-side">' + videoPill(v.status) + '</span>' +
              '</li>';
            }).join('') + '</ul>'
          : (VID.rows.length
              ? stateEmpty('Nothing matches that.')
              : '<div class="adm-state"><span class="adm-state-ico"><span class="material-symbols-sharp">movie</span></span>' +
                '<h3>No videos yet</h3>' +
                '<p>Upload the first one — you can write its title, description and category while the file processes.</p>' +
                '<button class="btn-primary" id="vid-first">Add a video</button></div>'));
      wireVideos();
    }

    function wireVideos() {
      var b = bodyEl(); if (!b) return;
      var fresh = function () {
        VID.editing = { _new: true, thumbnail_mode: 'auto', search_keywords: [] };
        VID.catPrimary = null;
        VID.catExtra = []; VID.catExtraInitial = []; VID.values = [];
        drawVideos();
      };
      ['vid-new', 'vid-first'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('click', fresh);
      });
      var q = document.getElementById('vid-q');
      if (q) { var qt; q.addEventListener('input', function () {
        clearTimeout(qt); qt = setTimeout(function () { VID.q = q.value; drawVideos(); }, 200); }); }
      [['vid-status', 'status'], ['vid-cat', 'cat'], ['vid-sort', 'sort']].forEach(function (p) {
        var el = document.getElementById(p[0]);
        if (el) el.addEventListener('change', function () { VID[p[1]] = el.value; drawVideos(); });
      });

      // the row IS the way in; the checkbox is the one part of it that isn't
      b.querySelectorAll('.lib-row[data-vid]').forEach(function (row) {
        var open = function () {
          var id = row.dataset.vid;
          VID.editing = Object.assign({}, VID.rows.filter(function (v) { return v.id === id; })[0]);
          openVideoExtras(id);
          editorHash('videos', id);
          drawVideos();
        };
        row.addEventListener('click', function (e) {
          if (e.target.closest('.lib-check')) return;
          open();
        });
        row.addEventListener('keydown', function (e) {
          if (e.target !== row) return;   // Space on the checkbox is the checkbox's
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
        });
      });

      // ── bulk selection ──
      b.querySelectorAll('.lib-row[data-vid] .vid-pick').forEach(function (box) {
        box.addEventListener('change', function () {
          var id = box.closest('.lib-row').dataset.vid;
          if (box.checked) VID.sel[id] = true; else delete VID.sel[id];
          paintVideoBulkbar();
        });
      });
      paintVideoBulkbar();
    }

    // The bar appears when something is selected and names exactly what will
    // happen. No bulk delete — archive is the bulk-safe verb here.
    function paintVideoBulkbar() {
      var host = document.getElementById('vid-bulkbar');
      if (!host) return;
      var ids = Object.keys(VID.sel || {});
      if (!ids.length) { host.innerHTML = ''; return; }
      var x = VID.x || {};
      host.innerHTML =
        '<div class="adm-bulkbar">' +
          '<span class="n">' + ids.length + ' selected</span>' +
          (x.ok && VID.cats.length
            ? '<select id="bulk-cat" aria-label="Add to category"><option value="">Add to category…</option>' +
              VID.cats.filter(function (c) { return c.status === 'active'; }).map(function (c) {
                return '<option value="' + c.id + '">' + esc(c.name) + '</option>'; }).join('') + '</select>'
            : '') +
          (x.ok && x.collections.length
            ? '<select id="bulk-col" aria-label="Add to collection"><option value="">Add to collection…</option>' +
              x.collections.filter(function (c) { return c.status !== 'archived'; }).map(function (c) {
                return '<option value="' + c.id + '">' + esc(c.title) + '</option>'; }).join('') + '</select>'
            : '') +
          '<button class="btn-ghost" id="bulk-archive">Archive</button>' +
          '<button class="btn-ghost" id="bulk-clear">Clear</button>' +
        '</div>';

      var clear = document.getElementById('bulk-clear');
      if (clear) clear.addEventListener('click', function () { VID.sel = {}; drawVideos(); });

      var cat = document.getElementById('bulk-cat');
      if (cat) cat.addEventListener('change', async function () {
        if (!cat.value) return;
        try {
          // the link table is the membership; a video with no primary
          // category also gets this as its primary, so it can publish
          var rows = ids.map(function (id) { return { video_id: id, category_id: cat.value }; });
          var r = await db.from('video_category_links')
            .upsert(rows, { onConflict: 'video_id,category_id', ignoreDuplicates: true });
          if (r.error) throw r.error;
          var noPrimary = ids.filter(function (id) {
            var v = VID.rows.filter(function (row) { return row.id === id; })[0];
            return v && !v.category_id;
          });
          if (noPrimary.length) {
            var pr = await db.from('videos').update({ category_id: cat.value }).in('id', noPrimary);
            if (pr.error) throw pr.error;
          }
          toast('Added to the category');
          VID.sel = {}; await renderVideos();
        } catch (e) { toast(e.message || 'Could not do that'); }
      });

      var col = document.getElementById('bulk-col');
      if (col) col.addEventListener('change', async function () {
        if (!col.value) return;
        try {
          var have = {};
          (VID.x.items || []).forEach(function (i) {
            if (i.collection_id === col.value && i.video_id) have[i.video_id] = true;
          });
          var fresh = ids.filter(function (id) { return !have[id]; });
          if (!fresh.length) { toast('Already in that collection'); return; }
          var top = (VID.x.items || []).filter(function (i) { return i.collection_id === col.value; })
            .reduce(function (m, i) { return Math.max(m, i.position); }, 0);
          var rows = fresh.map(function (id, at) {
            return { collection_id: col.value, kind: 'video', video_id: id, position: top + at + 1 };
          });
          var r = await db.from('collection_items').insert(rows);
          if (r.error) throw r.error;
          toast(fresh.length + (fresh.length === 1 ? ' video added' : ' videos added') + ' to the collection');
          VID.sel = {}; await renderVideos();
        } catch (e) { toast(e.message || 'Could not do that'); }
      });

      var arch = document.getElementById('bulk-archive');
      if (arch) arch.addEventListener('click', async function () {
        if (arch.dataset.armed !== '1') {
          arch.dataset.armed = '1';
          arch.textContent = 'Archive ' + ids.length + ' — sure?';
          setTimeout(function () { arch.dataset.armed = '0'; arch.textContent = 'Archive'; }, 3000);
          return;
        }
        try {
          for (var i = 0; i < ids.length; i++) {
            var r = await db.rpc('archive_video', { p_id: ids[i] });
            if (r.error) throw r.error;
          }
          toast('Archived');
          VID.sel = {}; await renderVideos();
        } catch (e) { toast(e.message || 'Could not archive those'); }
      });
    }

    // the editor's collections-layer state: which collections hold this
    // video, its extra categories, its filter values, its resource links
    function openVideoExtras(id) {
      VID.catPrimary = (VID.editing && VID.editing.category_id) || null;
      // the links table MIRRORS the primary (the sync trigger) — exclude it
      // here or the home shelf would appear twice in the chip row
      VID.catExtra = (VID.x && VID.x.ok)
        ? VID.x.links.filter(function (l) {
            return l.video_id === id && l.category_id !== VID.catPrimary;
          }).map(function (l) { return l.category_id; })
        : [];
      VID.catExtraInitial = VID.catExtra.slice();
      VID.values = [];
      if (VID.x && VID.x.ok) {
        db.from('content_filter_values').select('*').eq('video_id', id).then(function (r) {
          VID.values = r.data || [];
          var host = document.getElementById('vid-filter-groups');
          if (host) { host.innerHTML = videoFilterGroups(); wireVideoFilters(); }
        });
      }
    }

      if (!v.mux_asset_id) out.push('Upload a video file.');
      else if (v.mux_asset_status !== 'ready') out.push('Mux is still processing the file.');
      return out;
    }

          '</div>' +

        '</aside>' +
        '</div>';

      wireVideoForm();

      function section(title, blurb, inner) {
        return '<section class="vid-section">' +
          '<div class="vid-section-head"><h2>' + esc(title) + '</h2>' +
            (blurb ? '<p>' + esc(blurb) + '</p>' : '') + '</div>' +
          '<div class="vid-section-body">' + inner + '</div></section>';
      }
    }

    // Three visible states out of seven internal ones. draft/ready/errored
    // all mean "not out there yet" to a person writing a video.
    function videoVisibility(v) {
      if (v.status === 'published') return 'published';
      if (v.status === 'scheduled') return 'scheduled';
      return 'unpublished';
    }
    // <input type="datetime-local"> wants local wall-clock with no zone, so
    // the UTC timestamp has to be shifted before it will display at all.
    function videoLocalDatetime(iso) {
      var d = iso ? new Date(iso) : new Date(Date.now() + 86400000);
      if (isNaN(d)) return '';
      var off = d.getTimezoneOffset() * 60000;
      return new Date(d.getTime() - off).toISOString().slice(0, 16);
    }

    function vidTag(k) {
      return '<span class="vid-tag" data-kw="' + esc(k) + '">' + esc(k) +
        '<button type="button" class="vid-tag-x" aria-label="Remove ' + esc(k) + '">' +
        '<span class="material-symbols-sharp">close</span></button></span>';
    }

    // The drop zone. mux-uploader's own chrome is replaced entirely — it is
    // given no UI of its own and driven through its API, so what you see is
    // the app's, not a third party's.
    function videoFileZone(v, isNew, processing) {
      // a NEW video takes the file first: dropping one quietly creates the
      // draft (named from the title box, or the file) and starts uploading
      if (isNew) return dropZoneHTML();
      if (v.mux_playback_id) {
        // The player sits in the well; Replace sits under it, full width, so
        // it reads as an action on the file rather than a control inside it.
        return '<div class="vid-player is-loading" id="vid-player">' +
                 '<div class="vid-player-skel" aria-live="polite" aria-label="Loading the preview"></div></div>';
      }
      if (processing) {
        return '<div class="vid-progress-wrap">' +
                 '<div class="vid-spinner" aria-hidden="true"></div>' +
                 '<p>' + (v.status === 'uploading' ? 'Uploading…' : 'Processing') + '</p>' +
                 '<span class="nf-hint">' + (v.status === 'uploading'
                   ? 'Keep this tab open.'
                   : 'Mux is encoding it. Usually a few minutes — you can keep writing.') + '</span>' +
               '</div>' +
               '<button class="btn-ghost" id="vid-refresh">Check again</button>' +
               // an upload that died with its tab leaves the row stranded in
               // "Uploading…" forever — the way out lives right here
               (v.status === 'uploading'
                 ? '<button class="btn-ghost vid-cancel-upload" id="vid-upload-cancel">Cancel and start over</button>'
                 : '');
      }
      if (v.status === 'errored') {
        return '<p class="nf-err">' + esc(v.mux_error || 'The upload failed.') + '</p>' +
               '<button class="btn-secondary" id="vid-start">Try another file</button>';
      }
      return dropZoneHTML();
    }
    function dropZoneHTML() {
      return '<label class="vid-drop" id="vid-drop">' +
               '<input type="file" id="vid-file" accept="video/*" hidden>' +
               '<span class="material-symbols-sharp">movie</span>' +
               '<span class="vid-drop-main">Drop a video here</span>' +
               '<span class="nf-hint">or <u>browse for a file</u></span>' +
             '</label>';
    }

    // VID.resources holds resource_links rows with the file joined in —
    // detaching removes the LINK; the file itself stays in the library.
    function videoResourceList() {
      var list = VID.resources || [];
      if (!list.length) return '<p class="muted vid-none">Nothing attached yet.</p>';
      return '<ul class="vid-res-list">' + list.map(function (l) {
        var r = l.resources || {};
        return '<li data-link="' + l.id + '">' +
          '<span class="material-symbols-sharp">note_add</span>' +
          '<span class="vid-res-name">' + esc(r.title || 'File') +
            '<span class="nf-hint">' + esc(r.file_name || '') +
            (r.file_size ? ' · ' + Math.round(r.file_size / 1024) + 'KB' : '') + '</span></span>' +
          '<button class="btn-icon adm-del vid-res-del" data-tooltip="Detach" aria-label="Detach ' + esc(r.title || 'file') + '">' +
            '<span class="material-symbols-sharp">delete</span></button></li>';
      }).join('') + '</ul>';
    }

    function videoAttachPicker() {
      var linked = (VID.resources || []).map(function (l) { return l.resource_id; });
      var avail = (VID.allResources || []).filter(function (r) {
        return r.status === 'active' && linked.indexOf(r.id) === -1;
      });
      // the control stays visible even with nothing to offer — an invisible
      // feature may as well not exist
      if (!avail.length) {
        return '<span class="nf-hint">' +
          ((VID.allResources || []).length
            ? 'Everything in the resource library is already attached here.'
            : 'The resource library is empty — drop a PDF above, or upload under Resources.') +
          '</span>';
      }
      return '<div class="vid-cat-row" style="margin-top:8px">' +
        '<select class="modal-input" id="vid-res-pick"><option value="">Attach from the resource library…</option>' +
          avail.map(function (r) { return '<option value="' + r.id + '">' + esc(r.title) + '</option>'; }).join('') +
        '</select></div>';
    }

    // ── the category chips: one row IS the whole picker ─────────────────────
    // The SOLID chip is the home shelf (videos.category_id — publish
    // validation, the member page's breadcrumb). Dim chips are the extra
    // shelves. Click a dim chip to make it home; × removes; the dashed chip
    // opens the app's popover to add — with "New category…" at its foot.
    function videoXcatsHTML() {
      var cats = VID.cats.filter(function (c) { return c.status === 'active'; });
      var byId = {}; cats.forEach(function (c) { byId[c.id] = c; });
      var out = '';
      if (VID.catPrimary && byId[VID.catPrimary]) {
        out += '<span class="col-chip on xcat-home" data-xcat="' + esc(VID.catPrimary) + '" data-tooltip="Home category">' +
          esc(byId[VID.catPrimary].name) +
          '<button type="button" class="vid-tag-x xcat-del" aria-label="Remove ' + esc(byId[VID.catPrimary].name) + '">' +
          '<span class="material-symbols-sharp">close</span></button></span>';
      }
      out += (VID.catExtra || []).map(function (id) {
        var c = byId[id];
        if (!c) return '';
        return '<span class="col-chip on xcat-extra" data-xcat="' + esc(id) + '" data-tooltip="Click to make this the home category">' +
          esc(c.name) +
          '<button type="button" class="vid-tag-x xcat-del" aria-label="Stop showing on ' + esc(c.name) + '">' +
          '<span class="material-symbols-sharp">close</span></button></span>';
      }).join('');
      var avail = cats.filter(function (c) {
        return c.id !== VID.catPrimary && (VID.catExtra || []).indexOf(c.id) === -1;
      });
      out += '<span class="xcat-add">' +
        '<button type="button" class="col-chip" id="xcat-add-btn" aria-haspopup="true" aria-expanded="false">' +
          '<span class="material-symbols-sharp">add</span>' +
          (VID.catPrimary ? 'Add to category' : 'Choose a category') + '</button>' +
        '<div class="vid-menu" id="xcat-menu" role="menu" hidden>' +
          avail.map(function (c) {
            return '<button role="menuitem" data-xadd="' + esc(c.id) + '">' + esc(c.name) + '</button>';
          }).join('') +
          (avail.length ? '<div class="vid-menu-sep"></div>' : '') +
          '<button role="menuitem" id="xcat-newcat">New category…</button>' +
        '</div>' +
      '</span>';
      return out;
    }

    function wireVideoXcats() {
      var host = document.getElementById('vid-xcats');
      if (!host) return;
      host.innerHTML = videoXcatsHTML();

      function changed() { wireVideoXcats(); videoSyncSave(); }

      host.querySelectorAll('.xcat-del').forEach(function (x) {
        x.addEventListener('click', function (e) {
          e.stopPropagation();
          var id = x.closest('[data-xcat]').dataset.xcat;
          if (id === VID.catPrimary) {
            // the home is gone — the first extra shelf inherits it
            VID.catExtra = VID.catExtra || [];
            VID.catPrimary = VID.catExtra.shift() || null;
          } else {
            VID.catExtra = (VID.catExtra || []).filter(function (i) { return i !== id; });
          }
          changed();
        });
      });

      // a dim chip's body promotes it: the old home steps down to an extra
      host.querySelectorAll('.xcat-extra').forEach(function (chip) {
        chip.addEventListener('click', function (e) {
          if (e.target.closest('.xcat-del')) return;
          var id = chip.dataset.xcat;
          VID.catExtra = (VID.catExtra || []).filter(function (i) { return i !== id; });
          if (VID.catPrimary) VID.catExtra.unshift(VID.catPrimary);
          VID.catPrimary = id;
          changed();
        });
      });

      var btn = document.getElementById('xcat-add-btn');
      var menu = document.getElementById('xcat-menu');
      if (btn && menu) {
        var away = function (e) {
          if (!menu.contains(e.target) && !btn.contains(e.target)) closeMenu();
        };
        var closeMenu = function () {
          menu.hidden = true; btn.setAttribute('aria-expanded', 'false');
          document.removeEventListener('click', away);
        };
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var opening = menu.hidden;
          menu.hidden = !opening;
          btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
          if (opening) setTimeout(function () { document.addEventListener('click', away); }, 0);
        });
        menu.querySelectorAll('[data-xadd]').forEach(function (m) {
          m.addEventListener('click', function () {
            var id = m.dataset.xadd;
            if (!VID.catPrimary) VID.catPrimary = id;   // the first pick is home
            else (VID.catExtra = VID.catExtra || []).push(id);
            changed();
          });
        });
        var nc = document.getElementById('xcat-newcat');
        if (nc) nc.addEventListener('click', function () {
          closeMenu();
          var row = document.getElementById('vid-newcat-row');
          if (row) { row.hidden = false; document.getElementById('vid-newcat-name').focus(); }
        });
      }
    }

    // which collections hold this video (read from the list-page snapshot)
    function videoCollectionsOf(videoId) {
      if (!VID.x || !VID.x.ok) return [];
      var colIds = {};
      VID.x.items.forEach(function (i) { if (i.video_id === videoId) colIds[i.collection_id] = true; });
      return VID.x.collections.filter(function (c) { return colIds[c.id]; });
    }

    function videoFilterGroups() {
      return VID.x.filters.map(function (f) {
        var opts = VID.x.options.filter(function (o) { return o.filter_id === f.id; });
        if (!opts.length) return '';
        return '<div class="col-filter-group"><span class="nf-label" style="margin-top:0">' + esc(f.name) + '</span>' +
          '<div class="col-chips">' + opts.map(function (o) {
            var on = (VID.values || []).some(function (v) { return v.option_id === o.id; });
            return '<button type="button" class="col-chip' + (on ? ' on' : '') + '" data-vopt="' + o.id + '">' +
              (on ? '<span class="material-symbols-sharp">check</span>' : '') + esc(o.name) + '</button>';
          }).join('') + '</div></div>';
      }).join('');
    }

    function wireVideoFilters() {
      document.querySelectorAll('#vid-filter-groups [data-vopt]').forEach(function (chip) {
        chip.addEventListener('click', async function () {
          var optId = chip.dataset.vopt;
          var have = (VID.values || []).filter(function (v) { return v.option_id === optId; })[0];
          chip.disabled = true;
          try {
            if (have) {
              var d = await db.from('content_filter_values').delete().eq('id', have.id);
              if (d.error) throw d.error;
              VID.values = VID.values.filter(function (v) { return v.id !== have.id; });
            } else {
              var r = await db.from('content_filter_values')
                .insert({ option_id: optId, video_id: VID.editing.id }).select().single();
              if (r.error) throw r.error;
              VID.values.push(r.data);
            }
            var host = document.getElementById('vid-filter-groups');
            if (host) { host.innerHTML = videoFilterGroups(); wireVideoFilters(); }
          } catch (e) { toast(e.message || 'Could not update that'); chip.disabled = false; }
        });
      });
    }

    // what Mux reports for the asset's text tracks, in plain words
    function videoCaptionList(v) {
      var list = Array.isArray(v.captions) ? v.captions : [];
      var live = list.filter(function (t) { return t.status !== 'errored'; });
      if (!live.length) {
        // new uploads generate captions on their own; this button exists for
        // everything uploaded before that was switched on
        return '<p class="muted vid-none">No captions yet.</p>' +
          (v.mux_asset_status === 'ready'
            ? '<button class="btn-secondary" id="vid-gen-captions" type="button" style="margin-top:8px">Generate captions</button>' +
              '<span class="nf-hint">English, generated from the audio. New uploads get this automatically — this video predates that.</span>'
            : '<span class="nf-hint">English captions are generated automatically once the file finishes processing.</span>');
      }
      var word = { ready: 'Ready', preparing: 'Preparing', errored: 'Failed' };
      return '<ul class="vid-cap-list">' + list.map(function (t) {
        return '<li><span class="material-symbols-sharp">closed_caption</span>' +
          '<span class="vid-res-name">' + esc(t.name || t.language_code || 'Captions') +
            '<span class="nf-hint">' + esc(word[t.status] || t.status || '') +
            (t.source === 'generated_vod' || /auto/i.test(t.name || '') ? ' · auto-generated' : '') + '</span></span></li>';
      }).join('') + '</ul>' +
      '<span class="nf-hint">Members get a CC button in the player. Edits to a caption file happen in the Mux dashboard for now.</span>';
    }

    // Everything Save would write, flattened. Comparing this to a snapshot
    // taken at render is what tells the button whether there is anything to
    // do — a dirty FLAG would drift the moment a field was changed and put
    // back, and the button would lie.
    function videoFingerprint() {
      var v = videoRead();
      var vis = (document.querySelector('input[name="vid-vis"]:checked') || {}).value || '';
      var when = (document.getElementById('vid-when-at') || {}).value || '';
      return JSON.stringify([v.title, v.short_description, v.description, v.category_id,
        v.slug, v.seo_title, v.seo_description, v.thumbnail_mode, v.thumbnail_time_seconds,
        JSON.stringify(v.chapters || []), v.chapters_enabled,
        v.admin_notes, (VID.catExtra || []).slice().sort().join(','),
        (VID.editing.search_keywords || []).join('\u0000'),
        vis, vis === 'scheduled' ? when : '']);
    }

    function videoMarkClean() {
      VID._clean = videoFingerprint();
      videoSyncSave();
    }

    function videoSyncSave() {
      var btn = document.getElementById('vid-save-top');
      if (!btn) return;
      // a new video always has something to save — it does not exist yet
      var dirty = (VID.editing && VID.editing._new) || videoFingerprint() !== VID._clean;
      btn.disabled = !dirty;
      btn.textContent = (VID.editing && VID.editing._new) ? 'Create draft'
        : dirty ? 'Save' : 'Saved';
    }

    // ── the rich description ────────────────────────────────────────────────
    // The editor writes a SMALL dialect of HTML — p, br, strong, em, u,
    // ul/ol/li, a[href] — and rteClean is the gate that enforces it. On
    // load, on paste and on every read, whatever the browser produced is
    // walked and rebuilt from that allowlist, so nothing else can reach
    // the database. fsVL.richText renders the same dialect on the member
    // page: what is authored here is exactly what members see.
    function rteSafeHref(h) {
      h = (h || '').trim();
      if (/^(https?:|mailto:)/i.test(h)) return h;
      if (/^\//.test(h)) return h;
      if (/^[\w-]+(\.[\w-]+)+/.test(h)) return 'https://' + h;   // typed without a protocol
      return null;   // javascript:, data:, and other schemes never survive
    }
    function rteSer(node) {
      if (node.nodeType === 3) return esc(node.nodeValue);
      if (node.nodeType !== 1) return '';
      var kids = Array.prototype.map.call(node.childNodes, rteSer).join('');
      switch (node.tagName) {
        case 'BR': return '<br>';
        case 'B': case 'STRONG': return kids && '<strong>' + kids + '</strong>';
        case 'I': case 'EM':     return kids && '<em>' + kids + '</em>';
        case 'U':                return kids && '<u>' + kids + '</u>';
        case 'UL': case 'OL':    return kids && '<' + node.tagName.toLowerCase() + '>' + kids + '</' + node.tagName.toLowerCase() + '>';
        case 'LI':               return '<li>' + kids + '</li>';
        case 'A': {
          var h = rteSafeHref(node.getAttribute('href'));
          return h ? '<a href="' + esc(h) + '">' + kids + '</a>' : kids;
        }
        case 'P': case 'DIV':    return kids ? '<p>' + kids + '</p>' : '';
        case 'SCRIPT': case 'STYLE': return '';
        default: return kids;   // spans and anything unknown unwrap to their text
      }
    }
    function rteClean(html) {
      var box = document.createElement('div');
      box.innerHTML = html || '';
      return Array.prototype.map.call(box.childNodes, rteSer).join('');
    }
    // legacy plain-text descriptions become paragraphs: blank line = new
    // paragraph, single newline = <br> — the same shape pre-line rendered
    function rtePlainToHtml(s) {
      return (s || '').split(/\n{2,}/).map(function (p) {
        p = p.trim();
        return p ? '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>' : '';
      }).join('');
    }
    function rteIsHtml(s) { return /<([a-z]+)(\s|>|\/)/i.test(s || ''); }
    // one editor component, any field: ids derive from the area's id, so the
    // video and collection editors share every line of this
    function rteHTML(id, placeholder, labelId) {
      return '<div class="rte" id="' + id + '-rte">' +
        '<div class="rte-bar" role="toolbar" aria-label="Text formatting">' +
          [['bold', 'format_bold', 'Bold'],
           ['italic', 'format_italic', 'Italic'],
           ['underline', 'format_underlined', 'Underline']].map(function (b) {
            return '<button type="button" class="rte-btn" data-rte="' + b[0] + '" data-tooltip="' + b[2] + '">' +
              '<span class="material-symbols-sharp">' + b[1] + '</span></button>';
          }).join('') +
          '<span class="rte-sep" aria-hidden="true"></span>' +
          [['insertUnorderedList', 'format_list_bulleted', 'Bulleted list'],
           ['insertOrderedList', 'format_list_numbered', 'Numbered list']].map(function (b) {
            return '<button type="button" class="rte-btn" data-rte="' + b[0] + '" data-tooltip="' + b[2] + '">' +
              '<span class="material-symbols-sharp">' + b[1] + '</span></button>';
          }).join('') +
          '<span class="rte-sep" aria-hidden="true"></span>' +
          '<button type="button" class="rte-btn" id="' + id + '-lk" data-tooltip="Link"><span class="material-symbols-sharp">link</span></button>' +
          '<div class="vid-menu rte-linkbox" id="' + id + '-lkbox" hidden>' +
            '<input class="modal-input" id="' + id + '-lkurl" placeholder="https://…" aria-label="Link address">' +
            '<div class="rte-linkrow">' +
              '<button type="button" class="btn-secondary" id="' + id + '-lkapply">Apply</button>' +
              '<button type="button" class="btn-ghost" id="' + id + '-lkremove">Remove</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="rte-area nf-msg" id="' + id + '" contenteditable="true" role="textbox" aria-multiline="true"' +
          (labelId ? ' aria-labelledby="' + labelId + '"' : '') +
          ' data-placeholder="' + esc(placeholder || '') + '"></div>' +
      '</div>';
    }

    function rteValue(id, fallback) {
      var area = document.getElementById(id);
      if (!area) return fallback || null;
      var out = rteClean(area.innerHTML);
      var probe = document.createElement('div');
      probe.innerHTML = out;
      return probe.textContent.trim() ? out : null;   // markup with no words is empty
    }

    function rteWire(id, src) {
      var area = document.getElementById(id);
      var bar = document.querySelector('#' + id + '-rte .rte-bar');
      if (!area || !bar) return;
      try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (_) {}
      src = src || '';
      area.innerHTML = rteIsHtml(src) ? rteClean(src) : rtePlainToHtml(src);

      // format buttons — mousedown is prevented so the selection being
      // formatted survives the click
      bar.querySelectorAll('[data-rte]').forEach(function (btn) {
        btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
        btn.addEventListener('click', function () {
          area.focus();
          document.execCommand(btn.dataset.rte);
          paintBar();
        });
      });

      // active states follow the caret
      function paintBar() {
        var sel = document.getSelection();
        var inside = sel && sel.anchorNode && area.contains(sel.anchorNode);
        var states = { bold: 'bold', italic: 'italic', underline: 'underline',
                       insertUnorderedList: 'insertUnorderedList', insertOrderedList: 'insertOrderedList' };
        bar.querySelectorAll('[data-rte]').forEach(function (btn) {
          var on = false;
          if (inside) { try { on = document.queryCommandState(states[btn.dataset.rte]); } catch (_) {} }
          btn.classList.toggle('on', on);
        });
        var lk = document.getElementById(id + '-lk');
        if (lk) lk.classList.toggle('on', !!(inside && caretAnchor()));
      }
      function caretAnchor() {
        var sel = document.getSelection();
        var n = sel && sel.anchorNode;
        while (n && n !== area) { if (n.nodeType === 1 && n.tagName === 'A') return n; n = n.parentNode; }
        return null;
      }
      // ONE document listener, a registry of editor ids — forms re-render
      // constantly, so nothing here may bind to document per render
      if (!document._fsRteSel) {
        document._fsRteSel = [];
        document.addEventListener('selectionchange', function () {
          document._fsRteSel.forEach(function (rid) {
            var a2 = document.getElementById(rid);
            if (a2 && a2._paintBar) a2._paintBar();
          });
        });
      }
      if (document._fsRteSel.indexOf(id) === -1) document._fsRteSel.push(id);
      area._paintBar = paintBar;

      // paste arrives through the same gate as everything else
      area.addEventListener('paste', function (e) {
        e.preventDefault();
        var html = e.clipboardData && e.clipboardData.getData('text/html');
        var text = e.clipboardData && e.clipboardData.getData('text/plain');
        var ins = html ? rteClean(html) : esc(text || '').replace(/\n/g, '<br>');
        document.execCommand('insertHTML', false, ins);
      });

      // ── links: a small popover, the app's own, not window.prompt ──
      var lkBtn = document.getElementById(id + '-lk'), box = document.getElementById(id + '-lkbox');
      var url = document.getElementById(id + '-lkurl');
      var saved = null;   // the selection the popover is editing
      function closeBox() { if (box) box.hidden = true; }
      function restoreSel() {
        if (!saved) return;
        var sel = document.getSelection();
        sel.removeAllRanges(); sel.addRange(saved);
      }
      if (lkBtn && box && url) {
        lkBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
        lkBtn.addEventListener('click', function () {
          if (!box.hidden) { closeBox(); return; }
          var sel = document.getSelection();
          if (!sel || !sel.rangeCount || !area.contains(sel.anchorNode)) return;
          var a = caretAnchor();
          if (a) { saved = document.createRange(); saved.selectNodeContents(a); }
          else if (!sel.isCollapsed) saved = sel.getRangeAt(0).cloneRange();
          else return;   // nothing selected and not in a link — nothing to do
          url.value = a ? (a.getAttribute('href') || '') : '';
          box.hidden = false;
          url.focus();
        });
        document.getElementById(id + '-lkapply').addEventListener('click', function () {
          var h = rteSafeHref(url.value);
          if (!h) { url.classList.add('shake'); setTimeout(function () { url.classList.remove('shake'); }, 350); return; }
          restoreSel();
          document.execCommand('createLink', false, h);
          closeBox(); paintBar();
        });
        document.getElementById(id + '-lkremove').addEventListener('click', function () {
          restoreSel();
          document.execCommand('unlink');
          closeBox(); paintBar();
        });
        url.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); document.getElementById(id + '-lkapply').click(); }
          if (e.key === 'Escape') closeBox();
        });
        box.addEventListener('mousedown', function (e) { e.stopPropagation(); });
        area.addEventListener('mousedown', closeBox);
      }
    }

    // ── chapters: time parsing, row rendering, paste importing ─────────────
    function chapParseTime(str) {
      var m = String(str || '').trim().match(/^(?:(\d+):)?(\d{1,2}):(\d{2})(?:\.\d+)?$|^(\d+(?:\.\d+)?)$/);
      if (!m) return null;
      if (m[4] != null) return Math.floor(parseFloat(m[4]));
      return (parseInt(m[1] || 0, 10) * 3600) + (parseInt(m[2], 10) * 60) + parseInt(m[3], 10);
    }
    function chapFmtTime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      var h = Math.floor(sec / 3600), mn = Math.floor((sec % 3600) / 60), s2 = sec % 60;
      return (h ? h + ':' + String(mn).padStart(2, '0') : mn) + ':' + String(s2).padStart(2, '0');
    }
    function chapRowHTML(c) {
      return '<div class="chap-row">' +
        '<input class="chap-time" value="' + esc(chapFmtTime(c.t)) + '" inputmode="numeric" aria-label="Chapter time">' +
        '<input class="chap-title" value="' + esc(c.title || '') + '" maxlength="120" placeholder="Chapter title" aria-label="Chapter title">' +
        '<button type="button" class="vid-tag-x chap-del" aria-label="Remove chapter"><span class="material-symbols-sharp">close</span></button>' +
      '</div>';
    }
    function renderChapterRows(list) {
      var host = document.getElementById('vid-chapters');
      if (host) host.innerHTML = (list || []).map(chapRowHTML).join('');
    }
    function readChapterRows() {
      var out = [];
      document.querySelectorAll('#vid-chapters .chap-row').forEach(function (row) {
        var t2 = chapParseTime(row.querySelector('.chap-time').value);
        var title = row.querySelector('.chap-title').value.trim();
        if (t2 != null && title) out.push({ t: t2, title: title });
      });
      out.sort(function (a, b) { return a.t - b.t; });
      return out;
    }
    // Mux's dashboard beta has no read API — whatever the admin copied
    // parses here: their player SNIPPET (addChapters([...]) with unquoted
    // keys), bare JSON, a WebVTT, or plain "0:00 Title" lines
    function parseChaptersPaste(raw) {
      raw = (raw || '').trim();
      if (!raw) return [];
      // the snippet path first: startTime: 12.3, value: '…' pairs anywhere
      // in the paste — this is what Mux's copy button actually produces
      var pairs = [], re = /startTime\s*:\s*([\d.]+)\s*,\s*value\s*:\s*(['"])([\s\S]*?)\2/g, pm;
      while ((pm = re.exec(raw))) {
        var pt = Math.floor(parseFloat(pm[1]));
        if (!isNaN(pt) && pm[3].trim()) pairs.push({ t: pt, title: pm[3].trim() });
      }
      if (pairs.length) return pairs.sort(function (a, b) { return a.t - b.t; });
      try {
        var j = JSON.parse(raw);
        // Mux's export wraps the list: { "chapters": [ … ] }
        if (j && !Array.isArray(j) && Array.isArray(j.chapters)) j = j.chapters;
        if (Array.isArray(j)) {
          return j.map(function (o) {
            var t2 = o.startTime != null ? o.startTime
              : o.start_time != null ? o.start_time
              : o.start != null ? o.start
              : o.time != null ? o.time : o.t;
            if (typeof t2 === 'string') t2 = chapParseTime(t2);
            var title = String(o.value != null ? o.value : (o.title != null ? o.title : (o.text || ''))).trim();
            return (t2 != null && title) ? { t: Math.floor(Number(t2)), title: title } : null;
          }).filter(Boolean).sort(function (a, b) { return a.t - b.t; });
        }
      } catch (_) {}
      var out = [];
      if (/^WEBVTT/i.test(raw)) {
        var cues = raw.split(/\n\s*\n/).slice(1);
        cues.forEach(function (cue) {
          var lines = cue.trim().split('\n');
          var timeLine = lines.find(function (l) { return l.indexOf('-->') !== -1; });
          if (!timeLine) return;
          var t2 = chapParseTime(timeLine.split('-->')[0].trim().replace(/,/g, '.'));
          var title = lines.slice(lines.indexOf(timeLine) + 1).join(' ').trim();
          if (t2 != null && title) out.push({ t: t2, title: title });
        });
      } else {
        raw.split('\n').forEach(function (line) {
          var m = line.trim().match(/^((?:\d+:)?\d{1,2}:\d{2}(?:\.\d+)?)\s*[-–—·]?\s*(.+)$/);
          if (!m) return;
          var t2 = chapParseTime(m[1]);
          if (t2 != null && m[2].trim()) out.push({ t: t2, title: m[2].trim() });
        });
      }
      return out.sort(function (a, b) { return a.t - b.t; });
    }

    function videoRead() {
      var g = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
      var t = function (id) { return (g(id) || '').trim(); };
      return {
        title: t('vid-title'),
        short_description: t('vid-short') || null,
        description: rteValue('vid-desc', VID.editing ? VID.editing.description : null),
        // chips own the category when the collections layer is present;
        // the fallback select only exists on pre-collections databases
        category_id: document.getElementById('vid-category')
          ? (g('vid-category') || null)
          : (VID.catPrimary || null),
        slug: t('vid-slug'),
        seo_title: t('vid-seo-title') || null,
        seo_description: t('vid-seo-desc') || null,
        admin_notes: document.getElementById('vid-notes') ? (t('vid-notes') || null)
          : (VID.editing.admin_notes || null),
        chapters: document.getElementById('vid-chapters')
          ? readChapterRows()
          : (VID.editing.chapters || null),
        chapters_enabled: document.querySelector('.chap-seg')
          ? !!document.querySelector('.chap-seg .vid-seg-btn.on[data-chapvis="on"]')
          : !!VID.editing.chapters_enabled,
        thumbnail_mode: VID.editing.thumbnail_mode || 'auto',
        thumbnail_time_seconds: VID.editing.thumbnail_mode === 'timestamp'
          ? (parseFloat(t('vid-time')) || 0) : null,
      };
    }

    // Everything that has to happen live: counters, the slug, the search
    // preview, the thumbnail image. Cheap enough to run on every keystroke.
    function videoLive() {
      var v = VID.editing;
      var val = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
      var setCount = function (id, len, limit) {
        var e = document.getElementById(id); if (!e) return;
        e.textContent = len + ' / ' + limit;
        e.classList.toggle('over', len > limit);
      };
      setCount('c-short', val('vid-short').length, VIDEO_LIMITS.short);
      setCount('c-seot', val('vid-seo-title').length, VIDEO_LIMITS.seo_title);
      setCount('c-seod', val('vid-seo-desc').length, VIDEO_LIMITS.seo_desc);

      var serp = document.getElementById('vid-serp');
      if (serp) {
        var title = val('vid-seo-title') || val('vid-title') || 'Your video';
        var desc = val('vid-seo-desc') || val('vid-short') || 'A short description of the video.';
        var slug = val('vid-slug') || 'your-video';
        serp.innerHTML =
          '<span class="vid-serp-url">flowschool.io › video › ' + esc(slug) + '</span>' +
          '<span class="vid-serp-title">' + esc(title) + '</span>' +
          '<span class="vid-serp-desc">' + esc(desc) + '</span>';
      }
      videoThumbPreview();
      videoSyncSave();
    }

    function videoThumbPreview() {
      var v = VID.editing;
      videoSyncPlayerPoster();   // the player shows the same frame — first, before any early return
      var host = document.getElementById('vid-thumb-preview');
      if (!host) return;
      // in Upload mode the preview IS the uploader — click or drop, on the
      // image itself, to set or replace it
      var custom = v.thumbnail_mode === 'custom';
      host.classList.toggle('droppable', custom);
      host.classList.toggle('empty', custom && !v.custom_thumbnail_url);
      if (custom) {
        host.tabIndex = 0;
        host.setAttribute('role', 'button');
        host.setAttribute('aria-label',
          v.custom_thumbnail_url ? 'Replace the thumbnail image' : 'Upload a thumbnail image');
      } else {
        host.removeAttribute('tabindex');
        host.removeAttribute('role');
        host.removeAttribute('aria-label');
      }
      if (custom) {
        // a custom image is ours, not Mux's — no token, no playback id needed
        host.innerHTML = v.custom_thumbnail_url
          ? '<img alt="" src="' + esc(v.custom_thumbnail_url) + '">' +
            '<span class="vid-thumb-swap"><span class="material-symbols-sharp">photo_camera</span>Replace</span>'
          : '<span class="vid-thumb-invite">' +
              '<span class="material-symbols-sharp">add_a_photo</span>' +
              '<span class="vid-drop-main">Drop an image, or <u>browse</u></span>' +
              '<span class="nf-hint">JPG, PNG or WebP · 16:9 works best · up to 5MB</span>' +
            '</span>';
        return;
      }
      if (!v.mux_playback_id) return;
      // The frame time lives INSIDE the signed token — a &time= query param
      // is ignored on signed URLs, which is why scrubbing used to do
      // nothing. Timestamp mode prefers the token minted for the time being
      // scrubbed; otherwise the editor's base token (saved-state claims).
      var tok = (v.thumbnail_mode === 'timestamp' && VID._timeTok) ? VID._timeTok : v.thumb_token;
      if (!tok) { host.innerHTML = '<span class="nf-hint">Preview appears once playback is authorised.</span>'; return; }
      var url = 'https://image.mux.com/' + encodeURIComponent(v.mux_playback_id) +
        '/thumbnail.webp?width=640&token=' + encodeURIComponent(tok);
      var have = host.querySelector('img');
      if (have && have.src === url) { host.classList.remove('loading'); return; }
      // preload, then swap — the old frame holds (dimmed) while Mux cuts
      // the new one, instead of the box going blank
      var img = new Image();
      img.alt = '';
      img.onload = function () {
        host.classList.remove('loading');
        host.innerHTML = '';
        host.appendChild(img);
      };
      img.onerror = function () { host.classList.remove('loading'); };
      if (have) host.classList.add('loading');
      img.src = url;
      if (!have) host.innerHTML = '<span class="nf-hint">Cutting the frame…</span>';
    }

    // The player's poster is the SAME frame the thumbnail picker shows —
    // custom image, scrubbed frame, or the saved one — so changing the
    // thumbnail is visible on the video itself, not just in the picker.
    function videoPlayerPoster() {
      var v = VID.editing;
      if (!v) return null;
      if (v.thumbnail_mode === 'custom' && v.custom_thumbnail_url) return v.custom_thumbnail_url;
      if (!v.mux_playback_id) return null;
      var tok = (v.thumbnail_mode === 'timestamp' && VID._timeTok) ? VID._timeTok : v.thumb_token;
      if (!tok) return null;
      return 'https://image.mux.com/' + encodeURIComponent(v.mux_playback_id) +
        '/thumbnail.webp?width=1280&token=' + encodeURIComponent(tok);
    }

    function videoSyncPlayerPoster() {
      var el = document.querySelector('#vid-player mux-player');
      if (!el) return;
      var poster = videoPlayerPoster();
      if (poster && el.getAttribute('poster') !== poster) el.setAttribute('poster', poster);
    }

    // Scrubbing re-mints the thumbnail token with the chosen time in its
    // claims. Debounced so dragging the slider asks once, not per pixel;
    // sequenced so a slow early answer can never overwrite a later one.
    function videoThumbTimeChanged() {
      var v = VID.editing;
      if (!v || !v.id || !v.mux_playback_id || v.thumbnail_mode !== 'timestamp') return;
      clearTimeout(VID._timeTimer);
      VID._timeTimer = setTimeout(async function () {
        var secs = parseFloat((document.getElementById('vid-time') || {}).value);
        if (isNaN(secs) || secs < 0) secs = 0;
        var seq = (VID._timeSeq = (VID._timeSeq || 0) + 1);
        var host = document.getElementById('vid-thumb-preview');
        if (host && host.querySelector('img')) host.classList.add('loading');
        try {
          var sess = await db.auth.getSession();
          var tok = sess.data && sess.data.session && sess.data.session.access_token;
          var r = await fetch('/api/mux/playback-token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok },
            body: JSON.stringify({ videoId: v.id, thumbTime: secs }),
          });
          var out = await r.json();
          if (!r.ok) throw new Error(out.error || 'Could not cut that frame');
          if (seq !== VID._timeSeq) return;   // a newer scrub already answered
          VID._timeTok = out.thumbnailToken;
          videoThumbPreview();
        } catch (e) {
          // scrubbing should not toast per hiccup — keep the last good frame
          if (host) host.classList.remove('loading');
        }
      }, 350);
    }

    function wireVideoForm() {
      var v = VID.editing;
      var err = document.getElementById('vid-err');
      var $ = function (id) { return document.getElementById(id); };

      var cancel = $('vid-cancel');
      if (cancel) cancel.addEventListener('click', function () { VID.editing = null; editorHash('videos', null); renderVideos(); });

      // ── live fields ──
      ['vid-title', 'vid-short', 'vid-desc', 'vid-seo-title', 'vid-seo-desc', 'vid-slug', 'vid-time']
        .forEach(function (id) { var e = $(id); if (e) e.addEventListener('input', videoLive); });

      // ── the rich description ──
      rteWire('vid-desc', v.description);

      // ── chapters ──
      renderChapterRows(v.chapters || []);
      var chapList = $('vid-chapters');
      if (chapList) {
        chapList.addEventListener('input', videoSyncSave);
        chapList.addEventListener('click', function (e) {
          var del = e.target.closest('.chap-del');
          if (!del) return;
          del.closest('.chap-row').remove();
          videoSyncSave();
        });
        document.querySelectorAll('.chap-seg .vid-seg-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            document.querySelectorAll('.chap-seg .vid-seg-btn').forEach(function (o) {
              o.classList.toggle('on', o === b);
            });
