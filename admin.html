                  '<button role="menuitem" data-act="duplicate">Duplicate collection</button>' +
                  (c.status === 'archived' ? '' : '<button role="menuitem" data-act="archive">Archive</button>') +
                  '<div class="vid-menu-sep"></div>' +
                  '<button role="menuitem" class="danger" data-act="delete">Delete collection</button>' +
                '</div>' +
              '</div>') +
            '<button class="btn-primary" id="col-save-top">' + (isNew ? 'Create draft' : 'Save') + '</button>' +
          '</div>' +
        '</div>' +

        '<div class="vid-layout">' +
        '<div class="vid-main">' +

          colSection('Basics', '',
            '<label class="nf-label" for="col-title">Title <span class="nf-req">required</span></label>' +
            '<input class="modal-input" id="col-title" maxlength="160" value="' + esc(c.title || '') + '" placeholder="Spinning Lotus with a Bird">' +

            '<label class="nf-label" for="col-short">Short description' +
              vidCounter('cc-short', (c.short_description || '').length, COL_LIMITS.short) + '</label>' +
            '<textarea class="modal-input nf-msg" id="col-short" rows="2" maxlength="400" placeholder="One or two lines. This is what shows on the library card.">' + esc(c.short_description || '') + '</textarea>' +

            '<label class="nf-label" id="col-desc-label">Full description</label>' +
            // the same rich editor the video editor uses — one component
            rteHTML('col-desc', 'What the collection covers, who it is for, how to move through it.', 'col-desc-label') +

            (COL.instructors.length > 1
              ? '<label class="nf-label" for="col-instructor">Instructor</label>' +
                '<select class="modal-input" id="col-instructor">' +
                  COL.instructors.map(function (i) {
                    return '<option value="' + i.id + '"' + (c.instructor_id === i.id ? ' selected' : '') + '>' + esc(i.name) + '</option>';
                  }).join('') + '</select>'
              : '')
          ) +

          colSection('Categories', 'The shelves this collection appears on. A collection needs at least one.',
            '<div class="xcat-row" id="col-cats">' + colXcatsHTML() + '</div>' +
            '<div class="vid-newcat-row" id="col-newcat-row" hidden>' +
              '<input class="modal-input" id="col-newcat-name" maxlength="80" placeholder="Category name">' +
              '<button class="btn-secondary" id="col-newcat-save" type="button">Add</button>' +
              '<button class="btn-ghost" id="col-newcat-cancel" type="button">Cancel</button>' +
            '</div>'
          ) +

          colSection('Playlist', 'The videos, in the order members will move through them.',
            isNew
              ? '<p class="muted">Create the draft first, then build the playlist.</p>'
              : '<div id="col-playlist">' + collectionPlaylist() + '</div>' +
                '<div class="col-playlist-actions">' +
                  '<button class="btn-secondary" id="col-add-videos" type="button">Add videos</button>' +
                  '<button class="btn-ghost" id="col-add-divider" type="button">Add a divider</button>' +
                  '<span class="col-total" id="col-total">' + esc(collectionTotalLabel()) + '</span>' +
                '</div>'
          ) +

          colSection('Resources', 'Files for the whole collection — a full-sequence PDF, a planning worksheet. Each video keeps its own resources separately.',
            isNew
              ? '<p class="muted">Save the draft first, then attach files.</p>'
              : '<div id="col-resources">' + collectionResourceList() + '</div>' +
                '<label class="vid-drop vid-drop-sm" id="col-pdf-drop">' +
                  '<input type="file" id="col-pdf-input" accept="application/pdf" hidden multiple>' +
                  '<span class="material-symbols-sharp">note_add</span>' +
                  '<span>Drop a PDF here, or <u>browse</u></span>' +
                  '<span class="nf-hint">Up to 25MB each</span>' +
                '</label>' +
                '<div id="col-res-attach">' + collectionAttachPicker() + '</div>' +
                '<p class="nf-err" id="col-pdf-err"></p>'
          ) +

          colSection('Search keywords', 'How members will find this in the library. Not shown on the page.',
            '<div class="vid-tags" id="col-tags">' +
              kws.map(function (k) { return colTag(k); }).join('') +
              '<input class="vid-tag-input" id="col-tag-input" placeholder="' +
                (kws.length ? 'Add another…' : 'lotus, balance, transitions…') +
                '" aria-label="Add a search keyword">' +
            '</div>' +
            '<span class="nf-hint">Enter or comma to add. Backspace on an empty box removes the last one.</span>'
          ) +

          colSection('Filters', 'Attributes members will filter the library by — level, focus, energy. Define them under Filters.',
            COL.filters.length
              ? (isNew
                  ? '<p class="muted">Create the draft first, then tag it.</p>'
                  : '<div id="col-filter-groups">' + collectionFilterGroups() + '</div>')
              : '<p class="muted">No filters defined yet. Add some under <strong>Filters</strong> in the Video menu — things like Experience Level or Movement Focus.</p>'
          ) +

          colSection('Page and search', '',
            '<label class="nf-label" for="col-seo-title">Page title' +
              vidCounter('cc-seot', (c.seo_title || '').length, COL_LIMITS.seo_title) + '</label>' +
            '<input class="modal-input" id="col-seo-title" maxlength="120" value="' + esc(c.seo_title || '') + '" placeholder="' + esc(c.title || 'Defaults to the title') + '">' +

            '<label class="nf-label" for="col-slug">URL</label>' +
            '<div class="vid-slug-row">' +
              '<span class="vid-slug-prefix">flowschool.io/collection/</span>' +
              '<input class="modal-input" id="col-slug" value="' + esc(c.slug || '') + '" placeholder="spinning-lotus-with-a-bird">' +
            '</div>' +
            (c.status === 'published'
              ? '<span class="nf-hint vid-warn">This collection is published. Changing the URL breaks any link already shared.</span>'
              : '<span class="nf-hint">Made from the title. Edit it and it stays as you set it.</span>') +

            '<label class="nf-label" for="col-seo-desc">Meta description' +
              vidCounter('cc-seod', (c.seo_description || '').length, COL_LIMITS.seo_desc) + '</label>' +
            '<textarea class="modal-input nf-msg" id="col-seo-desc" rows="2" maxlength="320" placeholder="' + esc(c.short_description || 'Defaults to the short description') + '">' + esc(c.seo_description || '') + '</textarea>' +

            '<div class="vid-serp" id="col-serp"></div>'
          ) +

        '</div>' +

        // ══ RIGHT: the rail ══
        '<aside class="vid-rail">' +
          '<div class="vid-card">' +
            '<span class="vid-card-cap">Preview</span>' +
            '<div class="col-preview" id="col-preview"></div>' +
            '<p class="nf-hint">Roughly how the card could look in the library. Not the final design.</p>' +
          '</div>' +

          '<div class="vid-card">' +
            '<span class="vid-card-cap">Artwork</span>' +
            (isNew
              ? '<p class="muted" style="margin:0">Create the draft first.</p>'
              : '<div class="vid-seg" role="group" aria-label="Thumbnail source" style="margin-bottom:10px">' +
                  [['first_video', 'First video'], ['custom', 'Upload one']].map(function (m) {
                    return '<button type="button" class="vid-seg-btn' + (c.thumbnail_mode === m[0] ? ' on' : '') +
                      '" data-art-mode="' + m[0] + '">' + m[1] + '</button>';
                  }).join('') + '</div>' +
                '<div id="col-art-zone">' + collectionArtZone() + '</div>' +
                '<p class="nf-err" id="col-art-err"></p>') +
          '</div>' +

          '<div class="vid-card">' +
            '<span class="vid-card-cap">Visibility</span>' +
            '<div class="vid-radios" role="radiogroup" aria-label="Visibility">' +
              [['unpublished', 'Unpublished', 'Only you can see it.'],
               ['published',   'Published',   'Live in the library now.'],
               ['scheduled',   'Scheduled',   'Goes live on its own, at a time you pick.']]
                .map(function (o) {
                  var on = collectionVisibility(c) === o[0];
                  return '<label class="vid-radio' + (on ? ' on' : '') + '">' +
                    '<input type="radio" name="col-vis" value="' + o[0] + '"' + (on ? ' checked' : '') +
                      (blockers.length && o[0] !== 'unpublished' ? ' disabled' : '') + '>' +
                    '<span class="vid-radio-body"><span class="vid-radio-name">' + o[1] + '</span>' +
                    '<span class="nf-hint">' + o[2] + '</span></span></label>';
                }).join('') +
            '</div>' +
            '<div class="vid-when" id="col-when"' + (collectionVisibility(c) === 'scheduled' ? '' : ' hidden') + '>' +
              '<label class="nf-label" for="col-when-at">Goes live</label>' +
              '<input class="modal-input" type="datetime-local" id="col-when-at" value="' +
                esc(videoLocalDatetime(c.published_at)) + '">' +
              '<span class="nf-hint">Your timezone. It simply becomes visible when this moment passes.</span>' +
            '</div>' +
            '<label class="vid-radio" style="margin-top:10px">' +
              '<input type="checkbox" id="col-unlisted"' + (c.visibility === 'unlisted' ? ' checked' : '') + '>' +
              '<span class="vid-radio-body"><span class="vid-radio-name">Hidden from the library</span>' +
              '<span class="nf-hint">Reachable by direct link only. For private paths and limited releases.</span></span></label>' +
            '<div id="col-checklist" style="margin-top:14px">' + collectionChecklist() + '</div>' +
            '<span class="nf-err" id="col-err"></span>' +
            (c.status === 'published' && c.published_at
              ? '<span class="nf-hint">Published ' + esc(A.fmtDate(c.published_at)) + '</span>' : '') +
            (c.status === 'scheduled' && c.published_at
              ? '<span class="nf-hint">Goes live ' + esc(A.fmtDateTime(c.published_at)) + '</span>' : '') +
          '</div>' +

        '</aside>' +
        '</div>';

      wireCollectionForm();

      function colSection(title, blurb, inner) {
        return '<section class="vid-section">' +
          '<div class="vid-section-head"><h2>' + esc(title) + '</h2>' +
            (blurb ? '<p>' + esc(blurb) + '</p>' : '') + '</div>' +
          '<div class="vid-section-body">' + inner + '</div></section>';
      }
    }

    function collectionVisibility(c) {
      if (c.status === 'published') return 'published';
      if (c.status === 'scheduled') return 'scheduled';
      return 'unpublished';
    }

    function colTag(k) {
      return '<span class="vid-tag" data-kw="' + esc(k) + '">' + esc(k) +
        '<button type="button" class="vid-tag-x" aria-label="Remove ' + esc(k) + '">' +
        '<span class="material-symbols-sharp">close</span></button></span>';
    }

    // ── the playlist ────────────────────────────────────────────────────────
    function collectionPlaylist() {
      var items = COL.items.slice().sort(function (a, b) { return a.position - b.position; });
      if (!items.length) {
        return '<p class="muted vid-none">No videos added yet.</p>';
      }
      var n = 0;
      return '<ul class="col-list" id="col-items">' + items.map(function (it) {
        if (it.kind === 'divider') {
          return '<li class="col-item divider" draggable="true" data-item="' + it.id + '">' +
            '<span class="col-grip" aria-hidden="true"><span class="material-symbols-sharp">drag_indicator</span></span>' +
            '<input class="col-div-input" value="' + esc(it.label || '') + '" maxlength="80" aria-label="Divider name">' +
            '<button class="btn-icon adm-del col-item-del" data-tooltip="Delete divider" aria-label="Delete divider ' + esc(it.label || '') + '">' +
              '<span class="material-symbols-sharp">delete</span></button></li>';
        }
        var v = COL.videos.filter(function (x) { return x.id === it.video_id; })[0] || {};
        n += 1;
        var live = v.status === 'published' || v.status === 'scheduled';
        return '<li class="col-item" draggable="true" data-item="' + it.id + '">' +
          '<span class="col-grip" aria-hidden="true"><span class="material-symbols-sharp">drag_indicator</span></span>' +
          '<span class="col-item-pos">' + n + '</span>' +
          (v.custom_thumbnail_url
            ? '<span class="vid-thumb has-art"><img alt="" loading="lazy" src="' + esc(v.custom_thumbnail_url) + '"></span>'
            : '<span class="vid-thumb"><span class="material-symbols-sharp">movie</span></span>') +
          '<span class="col-item-name"><strong>' + esc(v.title || 'Deleted video') + '</strong>' +
            (live ? '' : '<span class="nf-hint">' + esc((VIDEO_STATUS[v.status] || ['Not published'])[0]) + ' — members will not see it yet</span>') +
          '</span>' +
          '<span class="col-item-dur">' + videoDuration(v.duration_seconds) + '</span>' +
          '<button class="btn-icon adm-del col-item-del" data-tooltip="Remove from collection" aria-label="Remove ' + esc(v.title || 'video') + '">' +
            '<span class="material-symbols-sharp">close</span></button></li>';
      }).join('') + '</ul>';
    }

    function collectionRuntime() {
      var total = 0, count = 0;
      COL.items.forEach(function (it) {
        if (it.kind !== 'video') return;
        var v = COL.videos.filter(function (x) { return x.id === it.video_id; })[0];
        count += 1;
        if (v && v.duration_seconds) total += Number(v.duration_seconds);
      });
      return { count: count, seconds: total };
    }
    function collectionTotalLabel() {
      var r = collectionRuntime();
      if (!r.count) return '';
      return r.count + (r.count === 1 ? ' video · ' : ' videos · ') + fmtRuntime(r.seconds);
    }

    // ── resources ───────────────────────────────────────────────────────────
    function collectionResourceList() {
      var list = COL.resLinks || [];
      if (!list.length) return '<p class="muted vid-none">Nothing attached yet.</p>';
      return '<ul class="vid-res-list">' + list.map(function (l) {
        var r = l.resources || {};
        return '<li data-link="' + l.id + '">' +
          '<span class="material-symbols-sharp">note_add</span>' +
          '<span class="vid-res-name">' + esc(r.title || 'File') +
            '<span class="nf-hint">' + esc(r.file_name || '') +
            (r.file_size ? ' · ' + Math.round(r.file_size / 1024) + 'KB' : '') + '</span></span>' +
          '<button class="btn-icon adm-del col-res-del" data-tooltip="Detach" aria-label="Detach ' + esc(r.title || 'file') + '">' +
            '<span class="material-symbols-sharp">delete</span></button></li>';
      }).join('') + '</ul>';
    }

    // resources already in the library that are not on this collection yet
    function collectionAttachPicker() {
      var linked = (COL.resLinks || []).map(function (l) { return l.resource_id; });
      var avail = (COL.allResources || []).filter(function (r) {
        return r.status === 'active' && linked.indexOf(r.id) === -1;
      });
      if (!avail.length) {
        return '<span class="nf-hint">' +
          ((COL.allResources || []).length
            ? 'Everything in the resource library is already attached here.'
            : 'The resource library is empty — drop a PDF above, or upload under Resources.') +
          '</span>';
      }
      return '<div class="vid-cat-row" style="margin-top:8px">' +
        '<select class="modal-input" id="col-res-pick"><option value="">Attach from the resource library…</option>' +
          avail.map(function (r) { return '<option value="' + r.id + '">' + esc(r.title) + '</option>'; }).join('') +
        '</select></div>';
    }

    // ── the collection's shelves: same quiet picker the video editor has ────
    // Only the CHOSEN shelves render; the dashed chip opens the popover with
    // the rest, "New category…" at its foot. No home shelf here — collections
    // are pure junction membership.
    function colXcatsHTML() {
      var cats = COL.cats.filter(function (c) { return c.status === 'active'; });
      var byId = {}; cats.forEach(function (c) { byId[c.id] = c; });
      var out = (COL.catSel || []).map(function (id) {
        var c = byId[id];
        if (!c) return '';
        return '<span class="col-chip on" data-cat="' + esc(id) + '">' + esc(c.name) +
          '<button type="button" class="vid-tag-x colcat-del" aria-label="Remove from ' + esc(c.name) + '">' +
          '<span class="material-symbols-sharp">close</span></button></span>';
      }).join('');
      var avail = cats.filter(function (c) { return (COL.catSel || []).indexOf(c.id) === -1; });
      out += '<span class="xcat-add">' +
        '<button type="button" class="col-chip" id="colcat-add-btn" aria-haspopup="true" aria-expanded="false">' +
          '<span class="material-symbols-sharp">add</span>' +
          ((COL.catSel || []).length ? 'Add to category' : 'Choose a category') + '</button>' +
        '<div class="vid-menu" id="colcat-menu" role="menu" hidden>' +
          avail.map(function (c) {
            return '<button role="menuitem" data-catadd="' + esc(c.id) + '">' + esc(c.name) + '</button>';
          }).join('') +
          (avail.length ? '<div class="vid-menu-sep"></div>' : '') +
          '<button role="menuitem" id="colcat-newcat">New category…</button>' +
        '</div>' +
      '</span>';
      return out;
    }

    function wireColXcats() {
      var host = document.getElementById('col-cats');
      if (!host) return;
      host.innerHTML = colXcatsHTML();

      function changed() { wireColXcats(); collectionLive(); }

      host.querySelectorAll('.colcat-del').forEach(function (x) {
        x.addEventListener('click', function () {
          var id = x.closest('[data-cat]').dataset.cat;
          COL.catSel = (COL.catSel || []).filter(function (i) { return i !== id; });
          changed();
        });
      });
      var btn = document.getElementById('colcat-add-btn');
      var menu = document.getElementById('colcat-menu');
      if (btn && menu) {
        var away = function (e) {
          if (!menu.contains(e.target) && !btn.contains(e.target)) closeMenu();
        };
        var closeMenu = function () {
          menu.hidden = true; btn.setAttribute('aria-expanded', 'false');
          document.removeEventListener('click', away);
        };
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var opening = menu.hidden;
          menu.hidden = !opening;
          btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
          if (opening) setTimeout(function () { document.addEventListener('click', away); }, 0);
        });
        menu.querySelectorAll('[data-catadd]').forEach(function (m) {
          m.addEventListener('click', function () {
            (COL.catSel = COL.catSel || []).push(m.dataset.catadd);
            changed();
          });
        });
        var nc = document.getElementById('colcat-newcat');
        if (nc) nc.addEventListener('click', function () {
          closeMenu();
          var row = document.getElementById('col-newcat-row');
          if (row) { row.hidden = false; document.getElementById('col-newcat-name').focus(); }
        });
      }
    }

    // ── filters ─────────────────────────────────────────────────────────────
    function collectionFilterGroups() {
      return COL.filters.map(function (f) {
        var opts = COL.options.filter(function (o) { return o.filter_id === f.id; });
        if (!opts.length) return '';
        return '<div class="col-filter-group"><span class="nf-label" style="margin-top:0">' + esc(f.name) + '</span>' +
          '<div class="col-chips">' + opts.map(function (o) {
            var on = COL.values.some(function (v) { return v.option_id === o.id; });
            return '<button type="button" class="col-chip' + (on ? ' on' : '') + '" data-opt="' + o.id + '">' +
              (on ? '<span class="material-symbols-sharp">check</span>' : '') + esc(o.name) + '</button>';
          }).join('') + '</div></div>';
      }).join('');
    }

    // ── artwork ─────────────────────────────────────────────────────────────
    // Three ratios, three slots. Horizontal is the catalog card and is the
    // one the first-video fallback serves; vertical and square are optional,
    // for category rows that will eventually prefer those shapes.
    var COL_ART = {
      horizontal: { col: 'custom_thumbnail_url',   label: 'Horizontal', hint: '1480×840 works best' },
      vertical:   { col: 'thumbnail_vertical_url', label: 'Vertical',   hint: '1188×1682 works best' },
      square:     { col: 'thumbnail_square_url',   label: 'Square',     hint: '1080×1080 works best' },
    };
    function colArtSlot(kind) {
      var c = COL.editing;
      var meta = COL_ART[kind];
      var url = c[meta.col];
      return '<div class="col-art-slot" data-art-slot="' + kind + '">' +
        '<span class="nf-label" style="margin-top:0">' + meta.label + '</span>' +
        (url
          ? '<div class="vid-thumb-preview' + (kind !== 'horizontal' ? ' col-art-' + kind : '') + '" style="margin-bottom:8px"><img alt="" src="' + esc(url) + '"></div>'
          : '') +
        '<label class="vid-drop vid-drop-sm">' +
          '<input type="file" class="col-art-file" accept="image/jpeg,image/png,image/webp" hidden>' +
          '<span class="material-symbols-sharp">add_a_photo</span>' +
          '<span>' + (url ? 'Replace' : 'Drop an image, or <u>browse</u>') + '</span>' +
          '<span class="nf-hint">' + esc(meta.hint) + ' · up to 5MB</span>' +
        '</label>' +
        (url ? '<button class="btn-ghost col-art-remove" type="button" style="margin-top:6px">Remove</button>' : '') +
      '</div>';
    }
    function collectionArtZone() {
      var c = COL.editing;
      var main;
      if (c.thumbnail_mode === 'custom') {
        main = colArtSlot('horizontal');
      } else {
        var url = collectionArt(c);
        main = url
          ? '<div class="vid-thumb-preview"><img alt="" src="' + esc(url) + '"></div>' +
            '<p class="nf-hint">Borrowed from the first video in the playlist.</p>'
          : '<p class="muted" style="margin:0">The first video’s thumbnail will be used once the playlist has one' +
            ' — or upload an image of your own.</p>';
      }
      return main +
        '<div style="margin-top:14px">' + colArtSlot('vertical') + '</div>' +
        '<div style="margin-top:14px">' + colArtSlot('square') + '</div>';
    }

    // ── the ready-to-publish checklist ──────────────────────────────────────
    // Required mirrors publish_collection() exactly; recommended is the
    // nice-to-have list. The split is visual so "recommended" never reads
    // as "blocked".
    function collectionChecklist() {
      var c = COL.editing;
      var t = function (id, fb) { var e = document.getElementById(id); return e ? e.value.trim() : (fb || ''); };
      var vids = COL.items.filter(function (i) { return i.kind === 'video'; }).length;
      var req = [
        ['Title', !!t('col-title', c.title)],
        ['URL', !!t('col-slug', c.slug)],
        ['Category', COL.catSel.length > 0],
        [vids ? vids + (vids === 1 ? ' video' : ' videos') : 'At least one video', vids > 0],
      ];
      var unpub = COL.items.filter(function (i) {
        if (i.kind !== 'video') return false;
        var v = COL.videos.filter(function (x) { return x.id === i.video_id; })[0];
        return v && v.status !== 'published' && v.status !== 'scheduled';
      }).length;
      var rec = [
        ['Thumbnail', !!collectionArt(c)],
        ['Short description', !!t('col-short', c.short_description)],
        ['Meta description', !!t('col-seo-desc', c.seo_description)],
      ];
      var line = function (label, ok, isReq) {
        var cls = ok ? 'ok' : (isReq ? 'miss' : 'rec');
        var ico = ok ? 'check' : (isReq ? 'priority_high' : 'radio_button_unchecked');
        return '<li class="' + cls + '"><span class="material-symbols-sharp">' + ico + '</span>' + esc(label) + '</li>';
      };
      return '<span class="col-check-cap">Ready to publish</span><ul class="col-check">' +
        req.map(function (r) { return line(r[0], r[1], true); }).join('') + '</ul>' +
        '<span class="col-check-cap">Recommended</span><ul class="col-check">' +
        rec.map(function (r) { return line(r[0], r[1], false); }).join('') +
        (unpub ? line(unpub + (unpub === 1 ? ' video is' : ' videos are') + ' not published yet', false, false) : '') +
        '</ul>';
    }

    // ── live updates + dirty tracking ───────────────────────────────────────
    function collectionRead() {
      var g = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
      var t = function (id) { return (g(id) || '').trim(); };
      var out = {
        title: t('col-title'),
        short_description: t('col-short') || null,
        description: rteValue('col-desc', COL.editing ? COL.editing.description : null),
        slug: t('col-slug'),
        seo_title: t('col-seo-title') || null,
        seo_description: t('col-seo-desc') || null,
        // the field left the form; saved notes ride along untouched
        admin_notes: document.getElementById('col-notes') ? (t('col-notes') || null)
          : (COL.editing.admin_notes || null),
        visibility: (document.getElementById('col-unlisted') || {}).checked ? 'unlisted' : 'members',
      };
      var inst = document.getElementById('col-instructor');
      out.instructor_id = inst ? (inst.value || null) : (COL.editing.instructor_id || null);
      return out;
    }

    function collectionFingerprint() {
      var v = collectionRead();
      var vis = (document.querySelector('input[name="col-vis"]:checked') || {}).value || '';
      var when = (document.getElementById('col-when-at') || {}).value || '';
      return JSON.stringify([v.title, v.short_description, v.description, v.slug,
        v.seo_title, v.seo_description, v.admin_notes, v.visibility, v.instructor_id,
        COL.catSel.slice().sort().join(','),
        (COL.editing.search_keywords || []).join('␀'),
        vis, vis === 'scheduled' ? when : '']);
    }
    function collectionDirty() {
      if (!COL.editing) return false;
      if (COL.editing._new) return true;
      try { return collectionFingerprint() !== COL._clean; } catch (_) { return false; }
    }
    function collectionMarkClean() {
      COL._clean = collectionFingerprint();
      collectionSyncSave();
    }
    function collectionSyncSave() {
      var btn = document.getElementById('col-save-top');
      if (!btn) return;
      var dirty = (COL.editing && COL.editing._new) || collectionFingerprint() !== COL._clean;
      btn.disabled = !dirty;
      btn.textContent = (COL.editing && COL.editing._new) ? 'Create draft'
        : dirty ? 'Save' : 'Saved';
    }

    function collectionLive() {
      var val = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
      var setCount = function (id, len, limit) {
        var e = document.getElementById(id); if (!e) return;
        e.textContent = len + ' / ' + limit;
        e.classList.toggle('over', len > limit);
      };
      setCount('cc-short', val('col-short').length, COL_LIMITS.short);
      setCount('cc-seot', val('col-seo-title').length, COL_LIMITS.seo_title);
      setCount('cc-seod', val('col-seo-desc').length, COL_LIMITS.seo_desc);

      var serp = document.getElementById('col-serp');
      if (serp) {
        var title = val('col-seo-title') || val('col-title') || 'Your collection';
        var desc = val('col-seo-desc') || val('col-short') || 'A short description of the collection.';
        var slug = val('col-slug') || 'your-collection';
        serp.innerHTML =
          '<span class="vid-serp-url">flowschool.io › collection › ' + esc(slug) + '</span>' +
          '<span class="vid-serp-title">' + esc(title) + '</span>' +
          '<span class="vid-serp-desc">' + esc(desc) + '</span>';
      }

      // the preview card, from what is on screen right now
      var prev = document.getElementById('col-preview');
      if (prev) {
        var art = collectionArt(COL.editing);
        var names = {};
        COL.cats.forEach(function (x) { names[x.id] = x.name; });
        var catLabel = COL.catSel.map(function (id) { return names[id]; }).filter(Boolean)[0] || 'Uncategorised';
        var r = collectionRuntime();
        prev.innerHTML =
          '<div class="col-preview-art">' + (art
            ? '<img alt="" src="' + esc(art) + '">'
            : '<span class="material-symbols-sharp">stacks</span>') + '</div>' +
          '<div class="col-preview-body">' +
            '<span class="col-preview-cat">' + esc(catLabel) + '</span>' +
            '<div class="col-preview-title">' + esc(val('col-title') || 'Untitled collection') + '</div>' +
            '<span class="col-preview-meta">' + (r.count
              ? r.count + (r.count === 1 ? ' video · ' : ' videos · ') + fmtRuntime(r.seconds)
              : 'No videos yet') + '</span>' +
            (val('col-short') ? '<p class="col-preview-desc">' + esc(val('col-short')) + '</p>' : '') +
          '</div>';
      }
      var check = document.getElementById('col-checklist');
      if (check) check.innerHTML = collectionChecklist();
      var tot = document.getElementById('col-total');
      if (tot) tot.textContent = collectionTotalLabel();
      collectionSyncSave();
    }

    // ── wiring ──────────────────────────────────────────────────────────────
    function wireCollectionForm() {
      var c = COL.editing;
      var err = document.getElementById('col-err');
      var $ = function (id) { return document.getElementById(id); };

      // ── the rich description ──
      rteWire('col-desc', c.description);

      var cancel = $('col-cancel');
      if (cancel) cancel.addEventListener('click', function () {
        if (collectionDirty() && !window.confirm('You have unsaved changes. Leave anyway?')) return;
        COL.editing = null; editorHash('collections', null); renderCollections();
      });

      ['col-title', 'col-short', 'col-desc', 'col-seo-title', 'col-seo-desc', 'col-slug']
        .forEach(function (id) { var e = $(id); if (e) e.addEventListener('input', collectionLive); });
      var inst = $('col-instructor');
      if (inst) inst.addEventListener('change', collectionSyncSave);
      var unl = $('col-unlisted');
      if (unl) unl.addEventListener('change', collectionSyncSave);

      // slug follows the title until touched — then it is the admin's
      var slugEl = $('col-slug'), titleEl = $('col-title');
      if (slugEl) slugEl.addEventListener('input', function () { COL._slugTouched = true; });
      if (titleEl && slugEl) titleEl.addEventListener('input', async function () {
        if (COL._slugTouched || c.status === 'published') return;
        var r = await db.rpc('video_slugify', { p_text: titleEl.value });
        if (!COL._slugTouched) { slugEl.value = r.data || ''; collectionLive(); }
      });

      // ── keyword tags (same grammar as the video form) ──
      var tagInput = $('col-tag-input');
      var addTag = function (raw) {
        var val = String(raw || '').trim().replace(/\s+/g, ' ');
        if (!val) return;
        var have = (COL.editing.search_keywords || []);
        if (have.some(function (k) { return k.toLowerCase() === val.toLowerCase(); })) return;
        COL.editing.search_keywords = have.concat([val]);
        tagInput.insertAdjacentHTML('beforebegin', colTag(val));
        tagInput.value = '';
        wireColTagRemovers();
        collectionSyncSave();
      };
      function removeColTag(kw) {
        COL.editing.search_keywords = (COL.editing.search_keywords || [])
          .filter(function (k) { return k !== kw; });
        var el = document.querySelector('#col-tags .vid-tag[data-kw="' + CSS.escape(kw) + '"]');
        if (el) el.remove();
        collectionSyncSave();
      }
      function wireColTagRemovers() {
        document.querySelectorAll('#col-tags .vid-tag-x').forEach(function (x) {
          if (x.dataset.w) return; x.dataset.w = '1';
          x.addEventListener('click', function () { removeColTag(x.closest('.vid-tag').dataset.kw); });
        });
      }
      if (tagInput) {
        tagInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(tagInput.value); }
          else if (e.key === 'Backspace' && !tagInput.value) {
            var last = (COL.editing.search_keywords || []).slice(-1)[0];
            if (last) removeColTag(last);
          }
        });
        tagInput.addEventListener('blur', function () { addTag(tagInput.value); });
        tagInput.addEventListener('paste', function (e) {
          var text = (e.clipboardData || window.clipboardData).getData('text');
          if (text && text.indexOf(',') !== -1) { e.preventDefault(); text.split(',').forEach(addTag); }
        });
      }
      wireColTagRemovers();

      // ── category chips ──
      wireColXcats();
      var catRow = $('col-newcat-row');
      var catCancel = $('col-newcat-cancel');
      if (catCancel) catCancel.addEventListener('click', function () { catRow.hidden = true; });
      var catSave = $('col-newcat-save');
      if (catSave) catSave.addEventListener('click', async function () {
        var name = ($('col-newcat-name').value || '').trim();
        if (!name) return;
        catSave.disabled = true;
        try {
          var sl = await db.rpc('video_slugify', { p_text: name });
          var r = await db.from('video_categories').insert({ name: name, slug: sl.data }).select().single();
          if (r.error) throw r.error;
          COL.cats.push(r.data);
          COL.catSel.push(r.data.id);   // chosen for you — it is why you made it
          catRow.hidden = true;
          $('col-newcat-name').value = '';
          wireColXcats();
          collectionLive();
          toast('Category added');
        } catch (e) {
          toast(/duplicate/i.test(e.message || '') ? 'There is already a category with that name' : e.message);
        } finally { catSave.disabled = false; }
      });

      // ── playlist ──
      wireCollectionPlaylist();
      var addV = $('col-add-videos');
      if (addV) addV.addEventListener('click', openVideoPicker);
      var addD = $('col-add-divider');
      if (addD) addD.addEventListener('click', async function () {
        addD.disabled = true;
        try {
          var pos = COL.items.length
            ? Math.max.apply(null, COL.items.map(function (i) { return i.position; })) + 1 : 1;
          var r = await db.from('collection_items')
            .insert({ collection_id: c.id, kind: 'divider', label: 'Section', position: pos })
            .select().single();
          if (r.error) throw r.error;
          COL.items.push(r.data);
          redrawPlaylist();
          var input = document.querySelector('[data-item="' + r.data.id + '"] .col-div-input');
          if (input) { input.focus(); input.select(); }
        } catch (e) { toast(e.message || 'Could not add a divider'); }
        finally { addD.disabled = false; }
      });

      // ── resources ──
      wireCollectionResources();

      // ── filter chips ──
      wireCollectionFilters();

      // ── artwork ──
      document.querySelectorAll('[data-art-mode]').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          if (c.thumbnail_mode === btn.dataset.artMode) return;
          // 'custom' with no image yet only changes what the box shows;
          // the row is written once an image actually exists
          var mode = btn.dataset.artMode;
          if (mode === 'first_video' || c.custom_thumbnail_url) {
            var patch = mode === 'first_video'
              ? { thumbnail_mode: 'first_video' }
              : { thumbnail_mode: 'custom' };
            var r = await db.from('collections').update(patch).eq('id', c.id).select().single();
            if (r.error) { toast(r.error.message); return; }
            COL.editing = Object.assign(COL.editing, r.data);
          } else {
            COL.editing.thumbnail_mode = mode;
          }
          document.querySelectorAll('[data-art-mode]').forEach(function (o) {
            o.classList.toggle('on', o === btn);
          });
          var zone = $('col-art-zone');
          if (zone) { zone.innerHTML = collectionArtZone(); wireCollectionArt(); }
          collectionLive();
        });
      });
      wireCollectionArt();

      // ── save ──
      var saveTop = $('col-save-top');
      if (saveTop) saveTop.addEventListener('click', function () { saveCollection(saveTop, err); });

      // radios only change what the box shows; Save applies them
      document.querySelectorAll('input[name="col-vis"]').forEach(function (r) {
        r.addEventListener('change', function () {
          document.querySelectorAll('input[name="col-vis"]').forEach(function (x) {
            x.closest('.vid-radio').classList.toggle('on', x.checked);
          });
          var when = $('col-when');
          if (when) when.hidden = r.value !== 'scheduled';
          collectionSyncSave();
        });
      });
      var whenAt = $('col-when-at');
      if (whenAt) whenAt.addEventListener('input', collectionSyncSave);

      // ── the More menu ──
      var moreBtn = $('col-more-btn'), menu = $('col-menu');
      if (moreBtn && menu) {
        var closeMenu = function () {
          menu.hidden = true; moreBtn.setAttribute('aria-expanded', 'false');
          document.removeEventListener('click', away);
        };
        var away = function (e) { if (!menu.contains(e.target) && e.target !== moreBtn) closeMenu(); };
        moreBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var open = menu.hidden;
          menu.hidden = !open;
          moreBtn.setAttribute('aria-expanded', String(open));
          if (open) setTimeout(function () { document.addEventListener('click', away); }, 0);
        });
        menu.querySelectorAll('[data-act]').forEach(function (item) {
          item.addEventListener('click', async function () {
            var act = item.dataset.act;
            if (act === 'copy') {
              var url = location.origin + '/collection/' + (c.slug || '');
              try { await navigator.clipboard.writeText(url); toast('Link copied'); }
              catch (_) { toast(url); }
              closeMenu(); return;
            }
            if (act === 'duplicate') {
              closeMenu();
              try {
                var r = await db.rpc('duplicate_collection', { p_id: c.id });
                if (r.error) throw r.error;
                toast('Duplicated — you are now editing the copy');
                await loadCollectionsData();
                await openCollection(Array.isArray(r.data) ? r.data[0].id : r.data.id);
              } catch (e) { toast(e.message || 'Could not duplicate that'); }
              return;
            }
            if (act === 'archive') {
              closeMenu();
              try {
                var a = await db.rpc('archive_collection', { p_id: c.id });
                if (a.error) throw a.error;
                toast('Archived — members no longer see it. The videos are untouched.');
                COL.editing = null; editorHash('collections', null); await renderCollections();
              } catch (e) { toast(e.message || 'Could not archive'); }
              return;
            }
            if (act === 'delete') {
              if (item.dataset.armed !== '1') {
                item.dataset.armed = '1';
                item.textContent = 'Really delete? Videos, files and categories all stay.';
                clearTimeout(item._d);
                item._d = setTimeout(function () {
                  item.dataset.armed = '0'; item.textContent = 'Delete collection';
                }, 4000);
                return;
              }
              closeMenu();
              try {
                // the row cascades its items and links; nothing else moves —
                // videos, Mux assets, categories and resource files survive
                var d = await db.from('collections').delete().eq('id', c.id);
                if (d.error) throw d.error;
                toast('Deleted');
                COL.editing = null; editorHash('collections', null); await renderCollections();
              } catch (e) { toast(e.message || 'Could not delete that'); }
            }
          });
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !menu.hidden) { closeMenu(); moreBtn.focus(); }
        });
      }

      collectionLive();
      collectionMarkClean();
    }

    function redrawPlaylist() {
      var host = document.getElementById('col-playlist');
      if (host) { host.innerHTML = collectionPlaylist(); wireCollectionPlaylist(); }
      collectionLive();
    }

    function wireCollectionPlaylist() {
      var list = document.getElementById('col-items');
      var host = document.getElementById('col-playlist');
      if (!host) return;

      // remove / delete
      host.querySelectorAll('.col-item-del').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var id = btn.closest('.col-item').dataset.item;
          try {
            var r = await db.from('collection_items').delete().eq('id', id);
            if (r.error) throw r.error;
            COL.items = COL.items.filter(function (i) { return i.id !== id; });
            redrawPlaylist();
          } catch (e) { toast(e.message || 'Could not remove that'); }
        });
      });

      // divider rename — saved on change, no Save button involved
      host.querySelectorAll('.col-div-input').forEach(function (input) {
        input.addEventListener('change', async function () {
          var id = input.closest('.col-item').dataset.item;
          var label = input.value.trim() || 'Section';
          input.value = label;
          var r = await db.from('collection_items').update({ label: label }).eq('id', id);
          if (r.error) toast(r.error.message);
          else {
            var it = COL.items.filter(function (i) { return i.id === id; })[0];
            if (it) it.label = label;
          }
        });
        // dragging the row must not fight the text cursor
        input.addEventListener('mousedown', function (e) { e.stopPropagation(); });
      });

      // drag and drop — one ordered list, videos and dividers alike
      if (!list) return;
      var dragging = null;
      list.querySelectorAll('.col-item').forEach(function (row) {
        row.addEventListener('dragstart', function (e) {
          dragging = row;
          row.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', row.dataset.item); } catch (_) {}
        });
        row.addEventListener('dragend', function () {
          if (dragging) dragging.classList.remove('dragging');
          dragging = null;
          list.querySelectorAll('.col-item').forEach(function (r) {
            r.classList.remove('drop-above', 'drop-below');
          });
        });
        row.addEventListener('dragover', function (e) {
          if (!dragging || dragging === row) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          var rect = row.getBoundingClientRect();
          var above = e.clientY < rect.top + rect.height / 2;
          list.querySelectorAll('.col-item').forEach(function (r) {
            r.classList.remove('drop-above', 'drop-below');
          });
          row.classList.add(above ? 'drop-above' : 'drop-below');
        });
        row.addEventListener('drop', async function (e) {
          if (!dragging || dragging === row) return;
          e.preventDefault();
          var rect = row.getBoundingClientRect();
          var above = e.clientY < rect.top + rect.height / 2;
          row.parentNode.insertBefore(dragging, above ? row : row.nextSibling);
          list.querySelectorAll('.col-item').forEach(function (r) {
            r.classList.remove('drop-above', 'drop-below');
          });
          await persistPlaylistOrder();
        });
      });
    }

    // read the DOM's order, write it as positions 1..n in one statement
    async function persistPlaylistOrder() {
      var list = document.getElementById('col-items');
      if (!list) return;
      var ids = [].map.call(list.querySelectorAll('.col-item'), function (r) { return r.dataset.item; });
      try {
        var r = await db.rpc('reorder_collection_items', {
          p_collection: COL.editing.id, p_item_ids: ids,
        });
        if (r.error) throw r.error;
        ids.forEach(function (id, at) {
          var it = COL.items.filter(function (i) { return i.id === id; })[0];
          if (it) it.position = at + 1;
        });
        redrawPlaylist();
      } catch (e) {
        toast(e.message || 'Could not save the new order');
        redrawPlaylist();   // fall back to what the database says
      }
    }

    // ── the add-videos picker ───────────────────────────────────────────────
    function openVideoPicker() {
      var existing = {};
      COL.items.forEach(function (i) { if (i.video_id) existing[i.video_id] = true; });
      var picked = {};

      var backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML =
        '<div class="modal-card vidpick" role="dialog" aria-modal="true" aria-label="Add videos">' +
          '<h3>Add videos</h3>' +
          '<div class="vidpick-controls">' +
            '<input type="text" class="modal-input" id="vp-q" placeholder="Search titles and keywords…" aria-label="Search videos">' +
            '<select id="vp-cat" aria-label="Filter by category"><option value="all">Any category</option>' +
              COL.cats.filter(function (x) { return x.status === 'active'; }).map(function (x) {
                return '<option value="' + x.id + '">' + esc(x.name) + '</option>';
              }).join('') + '</select>' +
          '</div>' +
          '<ul class="vidpick-list" id="vp-list"></ul>' +
          '<div class="modal-actions">' +
            '<button class="btn-ghost" id="vp-cancel">Cancel</button>' +
            '<button class="btn-primary" id="vp-add" disabled>Add videos</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(backdrop);

      var listEl = backdrop.querySelector('#vp-list');
      var qEl = backdrop.querySelector('#vp-q');
      var catEl = backdrop.querySelector('#vp-cat');
      var addBtn = backdrop.querySelector('#vp-add');

      function matches() {
        var q = (qEl.value || '').trim().toLowerCase();
        return COL.videos.filter(function (v) {
          if (v.status === 'archived') return false;
          if (catEl.value !== 'all' && v.category_id !== catEl.value) return false;
          if (!q) return true;
          return ((v.title || '') + ' ' + (v.search_keywords || []).join(' '))
            .toLowerCase().indexOf(q) !== -1;
        });
      }
      function paint() {
        var hits = matches();
        listEl.innerHTML = hits.length ? hits.map(function (v) {
          var inCol = !!existing[v.id];
          var live = v.status === 'published' || v.status === 'scheduled';
          return '<li class="vidpick-row' + (inCol ? ' in' : '') + '" data-vid="' + v.id + '">' +
            '<input type="checkbox"' + (inCol ? ' checked disabled' : (picked[v.id] ? ' checked' : '')) +
              ' aria-label="Select ' + esc(v.title) + '">' +
            (v.custom_thumbnail_url
              ? '<span class="vid-thumb has-art"><img alt="" loading="lazy" src="' + esc(v.custom_thumbnail_url) + '"></span>'
              : '<span class="vid-thumb"><span class="material-symbols-sharp">movie</span></span>') +
            '<span class="vidpick-name"><strong>' + esc(v.title) + '</strong>' +
              (inCol ? '<span class="nf-hint">Already in this collection</span>'
                     : (live ? '' : '<span class="nf-hint">' + esc((VIDEO_STATUS[v.status] || [v.status])[0]) + '</span>')) +
            '</span>' +
            '<span class="col-item-dur">' + videoDuration(v.duration_seconds) + '</span>' +
          '</li>';
        }).join('') : '<li class="muted" style="padding:12px">Nothing matches that.</li>';

        listEl.querySelectorAll('.vidpick-row:not(.in)').forEach(function (row) {
          row.addEventListener('click', function (e) {
            var id = row.dataset.vid;
            var box = row.querySelector('input');
            if (e.target !== box) box.checked = !box.checked;
            picked[id] = box.checked;
            sync();
          });
        });
        sync();
      }
      function sync() {
        var n = Object.keys(picked).filter(function (k) { return picked[k]; }).length;
        addBtn.disabled = !n;
        addBtn.textContent = n ? 'Add ' + n + (n === 1 ? ' video' : ' videos') : 'Add videos';
      }
      var qt;
      qEl.addEventListener('input', function () { clearTimeout(qt); qt = setTimeout(paint, 150); });
      catEl.addEventListener('change', paint);
      paint();
      qEl.focus();

      function close() { backdrop.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); }
      document.addEventListener('keydown', onKey);
      backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
      backdrop.querySelector('#vp-cancel').addEventListener('click', close);

      addBtn.addEventListener('click', async function () {
        var ids = Object.keys(picked).filter(function (k) { return picked[k]; });
        if (!ids.length) return;
        addBtn.disabled = true;
        try {
          var pos = COL.items.length
            ? Math.max.apply(null, COL.items.map(function (i) { return i.position; })) : 0;
          var rows = ids.map(function (vid, at) {
            return { collection_id: COL.editing.id, kind: 'video', video_id: vid, position: pos + at + 1 };
          });
          var r = await db.from('collection_items').insert(rows).select();
          if (r.error) throw r.error;
          COL.items = COL.items.concat(r.data || []);
          close();
          redrawPlaylist();
          toast(ids.length === 1 ? 'Video added' : ids.length + ' videos added');
        } catch (e) {
          toast(e.message || 'Could not add those');
          addBtn.disabled = false;
        }
      });
    }

    // ── collection resources ────────────────────────────────────────────────
    function wireCollectionResources() {
      var input = document.getElementById('col-pdf-input');
      var drop = document.getElementById('col-pdf-drop');
      var err = document.getElementById('col-pdf-err');
      if (!input || !drop) return;

      var take = function (files) {
        [].slice.call(files || []).forEach(function (f) { uploadCollectionResource(f, err); });
      };
      input.addEventListener('change', function () { take(input.files); input.value = ''; });
      ['dragenter', 'dragover'].forEach(function (t) {
        drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
      });
      ['dragleave', 'drop'].forEach(function (t) {
        drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
      });
      drop.addEventListener('drop', function (e) { take(e.dataTransfer && e.dataTransfer.files); });

      // detach — the LINK goes; the file stays in the resource library
      document.querySelectorAll('.col-res-del').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          if (btn.dataset.armed !== '1') {
            btn.dataset.armed = '1'; btn.classList.add('armed');
            btn.setAttribute('data-tooltip', 'Click again to detach');
            setTimeout(function () {
              btn.dataset.armed = '0'; btn.classList.remove('armed');
              btn.setAttribute('data-tooltip', 'Detach'); }, 3000);
            return;
          }
          var id = btn.closest('li').dataset.link;
          try {
            var r = await db.from('resource_links').delete().eq('id', id);
            if (r.error) throw r.error;
            await reloadCollectionResources();
            toast('Detached — the file stays in Resources');
          } catch (e) { toast(e.message || 'Could not detach that'); }
        });
      });

      var pick = document.getElementById('col-res-pick');
      if (pick) pick.addEventListener('change', async function () {
        if (!pick.value) return;
        try {
          var r = await db.from('resource_links').insert({
            resource_id: pick.value, collection_id: COL.editing.id,
            sort_order: (COL.resLinks || []).length,
          });
          if (r.error) throw r.error;
          await reloadCollectionResources();
        } catch (e) { toast(e.message || 'Could not attach that'); }
      });
    }

    async function reloadCollectionResources() {
      var got = await Promise.all([
        db.from('resource_links').select('*, resources(*)')
          .eq('collection_id', COL.editing.id).order('sort_order'),
        db.from('resources').select('*').order('created_at', { ascending: false }),
      ]);
      COL.resLinks = got[0].data || [];
      COL.allResources = got[1].data || [];
      var host = document.getElementById('col-resources');
      if (host) host.innerHTML = collectionResourceList();
      var attach = document.getElementById('col-res-attach');
      if (attach) attach.innerHTML = collectionAttachPicker();
      wireCollectionResources();
    }

    async function uploadCollectionResource(file, err) {
      var c = COL.editing;
      if (!c || c._new) return;
      err.textContent = '';
      if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) {
        err.textContent = file.name + ' is not a PDF.'; return;
      }
      if (file.size > 26214400) { err.textContent = file.name + ' is over 25MB.'; return; }

      var host = document.getElementById('col-resources');
      var tmp = document.createElement('p');
      tmp.className = 'nf-hint';
      tmp.textContent = 'Uploading ' + file.name + '…';
      host.appendChild(tmp);
      try {
        var id = (crypto.randomUUID && crypto.randomUUID()) ||
                 (Date.now().toString(36) + Math.random().toString(36).slice(2));
        var path = 'collections/' + c.id + '/' + id + '.pdf';
        var up = await db.storage.from('video-resources')
          .upload(path, file, { contentType: 'application/pdf', upsert: false });
        if (up.error) throw up.error;
        var ins = await db.from('resources').insert({
          title: file.name.replace(/\.pdf$/i, ''),
          storage_path: path, file_name: file.name, file_size: file.size,
        }).select().single();
        if (ins.error) {
          await db.storage.from('video-resources').remove([path]);
          throw ins.error;
        }
        var link = await db.from('resource_links').insert({
          resource_id: ins.data.id, collection_id: c.id,
          sort_order: (COL.resLinks || []).length,
        });
        if (link.error) throw link.error;
        await reloadCollectionResources();
      } catch (e) {
        err.textContent = 'Could not attach ' + file.name + ' — ' + (e.message || 'upload failed');
      } finally { tmp.remove(); }
    }

    // ── collection filter chips (writes are immediate) ──────────────────────
    function wireCollectionFilters() {
      document.querySelectorAll('#col-filter-groups [data-opt]').forEach(function (chip) {
        chip.addEventListener('click', async function () {
          var optId = chip.dataset.opt;
          var have = COL.values.filter(function (v) { return v.option_id === optId; })[0];
          chip.disabled = true;
          try {
            if (have) {
              var d = await db.from('content_filter_values').delete().eq('id', have.id);
              if (d.error) throw d.error;
              COL.values = COL.values.filter(function (v) { return v.id !== have.id; });
            } else {
              var r = await db.from('content_filter_values')
                .insert({ option_id: optId, collection_id: COL.editing.id }).select().single();
              if (r.error) throw r.error;
              COL.values.push(r.data);
            }
            var host = document.getElementById('col-filter-groups');
            if (host) { host.innerHTML = collectionFilterGroups(); wireCollectionFilters(); }
          } catch (e) { toast(e.message || 'Could not update that'); chip.disabled = false; }
        });
      });
    }

    // ── artwork upload ──────────────────────────────────────────────────────
    function wireCollectionArt() {
      var err = document.getElementById('col-art-err');
      document.querySelectorAll('[data-art-slot]').forEach(function (slot) {
        var kind = slot.dataset.artSlot;
        var drop = slot.querySelector('.vid-drop');
        var file = slot.querySelector('.col-art-file');
        if (drop && file) {
          var take = function (f) { if (f) uploadCollectionArt(kind, f, err); };
          file.addEventListener('change', function () { take(file.files && file.files[0]); file.value = ''; });
          ['dragenter', 'dragover'].forEach(function (t) {
            drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
          });
          ['dragleave', 'drop'].forEach(function (t) {
            drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
          });
          drop.addEventListener('drop', function (e) {
            take(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
          });
        }
        var rm = slot.querySelector('.col-art-remove');
        if (rm) rm.addEventListener('click', async function () {
          try {
            var meta = COL_ART[kind];
            var url = COL.editing[meta.col] || '';
            var patch = {}; patch[meta.col] = null;
            // losing the horizontal image also means falling back to the
            // first video's frame
            if (kind === 'horizontal') patch.thumbnail_mode = 'first_video';
            var r = await db.from('collections').update(patch)
              .eq('id', COL.editing.id).select().single();
            if (r.error) throw r.error;
            COL.editing = Object.assign(COL.editing, r.data);
            // tidy the object too — nothing points at it any more
            var m = url.match(/video-thumbnails\/(.+?)(\?|$)/);
            if (m) await db.storage.from('video-thumbnails').remove([decodeURIComponent(m[1])]);
            drawCollectionForm();
            toast('Image removed');
          } catch (e) { toast(e.message || 'Could not remove that'); }
        });
      });
    }

    async function uploadCollectionArt(kind, file, err) {
      var c = COL.editing;
      if (!c || c._new) return;
      err.textContent = '';
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) {
        err.textContent = 'That needs to be a JPG, PNG or WebP.'; return;
      }
      if (file.size > 5242880) { err.textContent = 'That image is over 5MB.'; return; }
      try {
        var meta = COL_ART[kind];
        var ext = file.type === 'image/png' ? 'png' : file.type === 'image/webp' ? 'webp' : 'jpg';
        // same bucket the video posters use; collections keep their own prefix
        var path = 'collections/' + c.id + '/thumbnail-' + kind + '.' + ext;
        var up = await db.storage.from('video-thumbnails')
          .upload(path, file, { contentType: file.type, upsert: true });
        if (up.error) throw up.error;
        var pub = db.storage.from('video-thumbnails').getPublicUrl(path);
        var url = pub.data.publicUrl + '?v=' + Date.now().toString(36);
        var patch = {}; patch[meta.col] = url;
        if (kind === 'horizontal') patch.thumbnail_mode = 'custom';
        var r = await db.from('collections').update(patch).eq('id', c.id).select().single();
        if (r.error) throw r.error;
        COL.editing = Object.assign(COL.editing, r.data);
        drawCollectionForm();
        toast('Artwork updated');
      } catch (e) {
        err.textContent = e.message || 'Could not upload that image.';
      }
    }

    // ── save / publish ──────────────────────────────────────────────────────
    async function saveCollection(btn, err) {
      if (COL.busy) return;
      var c = COL.editing;
      var vals = collectionRead();
      if (!vals.title) { err.textContent = 'A title is required.'; return; }
      COL.busy = true; if (btn) btn.disabled = true;
      err.textContent = '';
      try {
        var kw = COL.editing.search_keywords || [];
        if (c._new) {
          if (!vals.slug) {
            var sl = await db.rpc('video_slugify', { p_text: vals.title });
            vals.slug = sl.data;
          }
          var free = await db.rpc('collection_slug_available', { p_slug: vals.slug, p_exclude: null });
          if (free.data === false) vals.slug += '-' + Date.now().toString(36).slice(-4);
          var ins = await db.from('collections').insert(vals).select().single();
          if (ins.error) throw ins.error;
          COL.editing = ins.data;
          editorHash('collections', ins.data.id);   // addressable from its first save
          if (kw.length) await db.rpc('set_collection_keywords', { p_id: ins.data.id, p_keywords: kw });
          if (COL.catSel.length) {
            var catRows = COL.catSel.map(function (id) {
              return { collection_id: ins.data.id, category_id: id };
            });
            var cr = await db.from('collection_categories').insert(catRows);
            if (cr.error) throw cr.error;
          }
          COL.catInitial = COL.catSel.slice();
          COL.editing.search_keywords = kw;
          toast('Draft created — now build the playlist');
          drawCollectionForm();
          return;
        }

        var free2 = await db.rpc('collection_slug_available', { p_slug: vals.slug, p_exclude: c.id });
        if (free2.data === false) throw new Error('That URL is taken by another collection.');
        var up = await db.from('collections').update(vals).eq('id', c.id).select().single();
        if (up.error) throw up.error;
        await db.rpc('set_collection_keywords', { p_id: c.id, p_keywords: kw });

        // categories: apply the difference, both directions
        var adds = COL.catSel.filter(function (id) { return COL.catInitial.indexOf(id) === -1; });
        var dels = COL.catInitial.filter(function (id) { return COL.catSel.indexOf(id) === -1; });
        if (adds.length) {
          var ar = await db.from('collection_categories').insert(adds.map(function (id) {
            return { collection_id: c.id, category_id: id };
          }));
          if (ar.error) throw ar.error;
        }
        if (dels.length) {
          var dr = await db.from('collection_categories').delete()
            .eq('collection_id', c.id).in('category_id', dels);
          if (dr.error) throw dr.error;
        }
        COL.catInitial = COL.catSel.slice();
        COL.editing = Object.assign({}, up.data, { search_keywords: kw });

        // then the visibility the radios show, if it differs
        var chosen = (document.querySelector('input[name="col-vis"]:checked') || {}).value;
        var now = collectionVisibility(COL.editing);
        if (chosen && chosen !== now) {
          if (chosen === 'published') {
            var p = await db.rpc('publish_collection', { p_id: c.id });
            if (p.error) throw p.error;
          } else if (chosen === 'scheduled') {
            var at = (document.getElementById('col-when-at') || {}).value;
            if (!at) throw new Error('Pick a date and time for it to go live.');
            var sc = await db.rpc('schedule_collection', { p_id: c.id, p_at: new Date(at).toISOString() });
            if (sc.error) throw sc.error;
          } else {
            var un = await db.rpc('unpublish_collection', { p_id: c.id });
            if (un.error) throw un.error;
          }
        }
        toast('Saved');
        await openCollection(c.id);   // re-read; re-baselines through markClean
      } catch (e) {
        err.textContent = e.message || 'Could not save that.';
      } finally {
        COL.busy = false; if (btn) btn.disabled = false;
        collectionSyncSave();
      }
    }

    // leaving the tab with unsaved collection edits deserves the browser's
    // own "are you sure" — same courtesy the upload guard already extends
    window.addEventListener('beforeunload', function (e) {
      if (collectionDirty() || categoryDirty()) { e.preventDefault(); e.returnValue = ''; }
    });

    // ── Content › Video › Resources (the library) ───────────────────────────
    // One file, many homes. The library shows every uploaded file and where
    // it is used; attaching happens in the video and collection editors.
    var RES = { rows: [], links: [], busy: false, editingId: null, thumbs: {} };

    async function renderResourceLibrary() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        var got = await Promise.all([
          db.from('resources').select('*').order('created_at', { ascending: false }),
          db.from('resource_links').select('id, resource_id, video_id, collection_id, videos(title), collections(title)'),
        ]);
        var err = got.filter(function (r) { return r.error; })[0];
        if (err) throw err.error;
        RES.rows = got[0].data || [];
        RES.links = got[1].data || [];
        drawResourceLibrary();
      } catch (e) {
        b.innerHTML = /relation .* does not exist/i.test(e.message || '')
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Resources</h2></div>' +
            '<div class="adm-intro" style="margin:0">This needs <code>supabase/video-collections.sql</code> run in Supabase.</div></div>'
          : stateError(e && e.message);
      }
    }

    function resourceUsage(id) {
      return RES.links.filter(function (l) { return l.resource_id === id; });
    }
    function resourceUsageLabel(id) {
      var links = resourceUsage(id);
      var v = links.filter(function (l) { return l.video_id; }).length;
      var c = links.filter(function (l) { return l.collection_id; }).length;
      if (!v && !c) return 'Not attached yet';
      var parts = [];
      if (v) parts.push(v + (v === 1 ? ' video' : ' videos'));
      if (c) parts.push(c + (c === 1 ? ' collection' : ' collections'));
      return parts.join(' · ');
    }

          '<span>Drop a PDF here, or <u>browse</u></span>' +
          '<span class="nf-hint">Up to 25MB each. It lands in the library, ready to attach.</span>' +

        (RES.rows.length
          ? '<div class="cat-controls lib-bar" style="margin:0">' +
