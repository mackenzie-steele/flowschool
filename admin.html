          '<div class="vid-section-head"><h2>' + esc(title) + '</h2>' +
            (blurb ? '<p>' + esc(blurb) + '</p>' : '') + '</div>' +
          '<div class="vid-section-body">' + inner + '</div></section>';
      }
    }

    function wireCategoryForm() {
      var c = CATE.editing;
      var $ = function (id) { return document.getElementById(id); };

      var cancel = $('cate-cancel');
      if (cancel) cancel.addEventListener('click', async function () {
        if (categoryDirty() && !window.confirm('You have unsaved changes. Leave anyway?')) return;
        // backing out of a never-touched placeholder removes it — the New
        // button must not litter the shelf list with "New category" rows
        if (CATE._freshSlug && c.slug === CATE._freshSlug && c.name === 'New category' && !categoryDirty()) {
          try { await db.from('video_categories').delete().eq('id', c.id); } catch (_) {}
          CATE._freshSlug = null;
        }
        CATE.editing = null; editorHash('video-categories', null); renderVideoCategories();
      });

      ['cate-title', 'cate-subtitle', 'cate-pos', 'cate-short', 'cate-desc', 'cate-slug', 'cate-seo-title', 'cate-seo-desc']
        .forEach(function (id) {
          var e = $(id); if (e) e.addEventListener('input', function () {
            var set = function (cid, len, lim) {
              var el = $(cid); if (!el) return;
              el.textContent = len + ' / ' + lim;
              el.classList.toggle('over', len > lim);
            };
            set('ct-seot', $('cate-seo-title').value.length, CATE_LIMITS.seo_title);
            set('ct-seod', $('cate-seo-desc').value.length, CATE_LIMITS.seo_desc);
            categorySyncSave();
          });
        });

      var save = $('cate-save');
      if (save) save.addEventListener('click', async function () {
        if (CATE.busy) return;
        var vals = categoryRead();
        var err = $('cate-err');
        err.textContent = '';
        if (!vals.name) { err.textContent = 'A title is required.'; return; }
        if (!vals.slug) {
          var sl = await db.rpc('video_slugify', { p_text: vals.name });
          vals.slug = sl.data;
        }
        // a category born from the New button carries a throwaway slug; the
        // first save with a real title claims the real URL — unless the
        // admin already edited the slug herself
        if (CATE._freshSlug && vals.slug === CATE._freshSlug &&
            vals.name && vals.name !== 'New category') {
          var fsl = await db.rpc('video_slugify', { p_text: vals.name });
          if (fsl.data) vals.slug = fsl.data;
        }
        CATE.busy = true; save.disabled = true;
        try {
          var taken = await db.from('video_categories')
            .select('id').ilike('slug', vals.slug).neq('id', c.id);
          if ((taken.data || []).length) throw new Error('That URL is taken by another category.');
          var r = await db.from('video_categories').update(vals).eq('id', c.id).select().single();
          // a database that predates the subtitle column: save everything
          // else and say what is missing, rather than failing the whole form
          if (r.error && /subtitle.*does not exist/i.test(r.error.message || '')) {
            delete vals.subtitle;
            toast('Subtitle needs supabase/video-engagement.sql run — everything else saved');
            r = await db.from('video_categories').update(vals).eq('id', c.id).select().single();
          }
          if (r.error) throw r.error;
          if (CATE._freshSlug && r.data.slug !== CATE._freshSlug) {
            CATE._freshSlug = null;
            var slugEl = $('cate-slug');
            if (slugEl) slugEl.value = r.data.slug;   // show the URL it claimed
          }
          CATE.editing = Object.assign({}, CATE.editing, r.data);
          var i = VID.cats.findIndex(function (x) { return x.id === c.id; });
          if (i !== -1) VID.cats[i] = CATE.editing;
          CATE._clean = categoryFingerprint();
          categorySyncSave();
          toast('Saved');
        } catch (e) {
          err.textContent = e.message || 'Could not save that.';
        } finally { CATE.busy = false; save.disabled = false; categorySyncSave(); }
      });

      // ── cover image ──
      var drop = $('cate-art-drop'), file = $('cate-art-file'), aerr = $('cate-art-err');
      if (drop && file) {
        var take = async function (f) {
          if (!f) return;
          aerr.textContent = '';
          if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { aerr.textContent = 'That needs to be a JPG, PNG or WebP.'; return; }
          if (f.size > 5242880) { aerr.textContent = 'That image is over 5MB.'; return; }
          try {
            var ext = f.type === 'image/png' ? 'png' : f.type === 'image/webp' ? 'webp' : 'jpg';
            var path = 'categories/' + c.id + '/cover.' + ext;
            var up = await db.storage.from('video-thumbnails')
              .upload(path, f, { contentType: f.type, upsert: true });
            if (up.error) throw up.error;
            var pub = db.storage.from('video-thumbnails').getPublicUrl(path);
            var url = pub.data.publicUrl + '?v=' + Date.now().toString(36);
            var r = await db.from('video_categories').update({ cover_image_url: url }).eq('id', c.id).select().single();
            if (r.error) throw r.error;
            CATE.editing = Object.assign(CATE.editing, r.data);
            drawCategoryForm();
            toast('Image updated');
          } catch (e) { aerr.textContent = e.message || 'Could not upload that image.'; }
        };
        file.addEventListener('change', function () { take(file.files && file.files[0]); file.value = ''; });
        ['dragenter', 'dragover'].forEach(function (t) {
          drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
        });
        ['dragleave', 'drop'].forEach(function (t) {
          drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
        });
        drop.addEventListener('drop', function (e) {
          take(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
        });
      }
      var rm = $('cate-art-remove');
      if (rm) rm.addEventListener('click', async function () {
        try {
          var url = c.cover_image_url || '';
          var r = await db.from('video_categories').update({ cover_image_url: null }).eq('id', c.id).select().single();
          if (r.error) throw r.error;
          CATE.editing = Object.assign(CATE.editing, r.data);
          var m = url.match(/video-thumbnails\/(.+?)(\?|$)/);
          if (m) await db.storage.from('video-thumbnails').remove([decodeURIComponent(m[1])]);
          drawCategoryForm();
          toast('Image removed');
        } catch (e) { toast(e.message || 'Could not remove that'); }
      });

      // ── content ──
      var add = $('cate-add');
      if (add) add.addEventListener('click', openCategoryContentPicker);
      wireCategoryContent();
      admHydrateThumbs($('cate-content'));

      CATE._clean = categoryFingerprint();
      categorySyncSave();

      // a fresh placeholder opens ready to be named — the whole point of
      // New-goes-straight-to-the-editor
      if (CATE._freshSlug && c.slug === CATE._freshSlug) {
        var tEl = $('cate-title');
        if (tEl) { tEl.focus(); tEl.select(); }
      }
    }

    function redrawCategoryContent() {
      var host = document.getElementById('cate-content');
      if (host) { host.innerHTML = categoryContentList(); wireCategoryContent(); admHydrateThumbs(host); }
    }

    function wireCategoryContent() {
      var host = document.getElementById('cate-content');
      var list = document.getElementById('cate-items');
      if (!host) return;

      host.querySelectorAll('.cate-item-del').forEach(function (btn) {
        btn.addEventListener('click', async function () {
          var li = btn.closest('.col-item');
          var kind = li.dataset.kind, id = li.dataset.id;
          try {
            if (kind === 'video') {
              var v = CATE.allVideos.filter(function (x) { return x.id === id; })[0];
              if (v && v.category_id === CATE.editing.id) {
                toast('This is the video’s main category — change that in the video editor first.');
                return;
              }
              var r = await db.from('video_category_links').delete()
                .eq('video_id', id).eq('category_id', CATE.editing.id);
              if (r.error) throw r.error;
            } else {
              var r2 = await db.from('collection_categories').delete()
                .eq('collection_id', id).eq('category_id', CATE.editing.id);
              if (r2.error) throw r2.error;
            }
            CATE.items = CATE.items.filter(function (i) { return !(i.kind === kind && i.id === id); });
            redrawCategoryContent();
          } catch (e) { toast(e.message || 'Could not remove that'); }
        });
      });

      if (!list) return;
      var dragging = null;
      list.querySelectorAll('.col-item').forEach(function (row) {
        row.addEventListener('dragstart', function (e) {
          dragging = row; row.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', row.dataset.id); } catch (_) {}
        });
        row.addEventListener('dragend', function () {
          if (dragging) dragging.classList.remove('dragging');
          dragging = null;
          list.querySelectorAll('.col-item').forEach(function (r) {
            r.classList.remove('drop-above', 'drop-below'); });
        });
        row.addEventListener('dragover', function (e) {
          if (!dragging || dragging === row) return;
          e.preventDefault();
          var rect = row.getBoundingClientRect();
          var above = e.clientY < rect.top + rect.height / 2;
          list.querySelectorAll('.col-item').forEach(function (r) {
            r.classList.remove('drop-above', 'drop-below'); });
          row.classList.add(above ? 'drop-above' : 'drop-below');
        });
        row.addEventListener('drop', async function (e) {
          if (!dragging || dragging === row) return;
          e.preventDefault();
          var rect = row.getBoundingClientRect();
          var above = e.clientY < rect.top + rect.height / 2;
          row.parentNode.insertBefore(dragging, above ? row : row.nextSibling);
          list.querySelectorAll('.col-item').forEach(function (r) {
            r.classList.remove('drop-above', 'drop-below'); });
          await persistCategoryOrder();
        });
      });
    }

    // walk the DOM order, stamp 1..n across BOTH junction tables
    async function persistCategoryOrder() {
      var list = document.getElementById('cate-items');
      if (!list) return;
      var writes = [];
      [].forEach.call(list.querySelectorAll('.col-item'), function (row, at) {
        var n = at + 1;
        if (row.dataset.kind === 'video') {
          writes.push(db.from('video_category_links').update({ sort_order: n })
            .eq('video_id', row.dataset.id).eq('category_id', CATE.editing.id));
        } else {
          writes.push(db.from('collection_categories').update({ sort_order: n })
            .eq('collection_id', row.dataset.id).eq('category_id', CATE.editing.id));
        }
        var it = CATE.items.filter(function (i) {
          return i.kind === row.dataset.kind && i.id === row.dataset.id; })[0];
        if (it) it.sort = n;
      });
      var results = await Promise.all(writes);
      var bad = results.filter(function (r) { return r.error; })[0];
      if (bad) { toast(bad.error.message || 'Could not save the new order'); }
      CATE.items.sort(function (a, b2) { return a.sort - b2.sort; });
      redrawCategoryContent();
    }

    function openCategoryContentPicker() {
      var inCat = {};
      CATE.items.forEach(function (i) { inCat[i.kind + ':' + i.id] = true; });
      var picked = {};

      var backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML =
        '<div class="modal-card vidpick" role="dialog" aria-modal="true" aria-label="Add content">' +
          '<h3>Add content</h3>' +
          '<div class="vidpick-controls">' +
            '<input type="text" class="modal-input" id="cp-q" placeholder="Search collections and videos…" aria-label="Search content">' +
          '</div>' +
          '<ul class="vidpick-list" id="cp-list"></ul>' +
          '<div class="modal-actions">' +
            '<button class="btn-ghost" id="cp-cancel">Cancel</button>' +
            '<button class="btn-primary" id="cp-add" disabled>Add</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(backdrop);

      var listEl = backdrop.querySelector('#cp-list');
      var qEl = backdrop.querySelector('#cp-q');
      var addBtn = backdrop.querySelector('#cp-add');

      function pool() {
        var q = (qEl.value || '').trim().toLowerCase();
        var match = function (t) { return !q || (t || '').toLowerCase().indexOf(q) !== -1; };
        var cols = CATE.allCollections.filter(function (x) {
          return x.status !== 'archived' && match(x.title); })
          .map(function (x) { return { kind: 'collection', id: x.id, row: x }; });
        var vids = CATE.allVideos.filter(function (x) {
          return x.status !== 'archived' && match(x.title); })
          .map(function (x) { return { kind: 'video', id: x.id, row: x }; });
        return cols.concat(vids);
      }
      function paint() {
        var hits = pool();
        listEl.innerHTML = hits.length ? hits.map(function (it) {
          var key = it.kind + ':' + it.id;
          var already = !!inCat[key];
          return '<li class="vidpick-row' + (already ? ' in' : '') + '" data-key="' + key + '">' +
            '<input type="checkbox"' + (already ? ' checked disabled' : (picked[key] ? ' checked' : '')) +
              ' aria-label="Select ' + esc(it.row.title) + '">' +
            admContentThumb(it.kind, it.row, it.kind === 'video' ? it.id : null, it.row.mux_playback_id) +
            (it.kind === 'collection' ? '<span class="cate-kind">Collection</span>' : '') +
            '<span class="vidpick-name"><strong>' + esc(it.row.title) + '</strong>' +
              (already ? '<span class="nf-hint">Already in this category</span>' : '') + '</span>' +
          '</li>';
        }).join('') : '<li class="muted" style="padding:12px">Nothing matches that.</li>';

        listEl.querySelectorAll('.vidpick-row:not(.in)').forEach(function (row) {
          row.addEventListener('click', function (e) {
            var box = row.querySelector('input');
            if (e.target !== box) box.checked = !box.checked;
            picked[row.dataset.key] = box.checked;
            sync();
          });
        });
        sync();
        admHydrateThumbs(listEl);
      }
      function sync() {
        var n = Object.keys(picked).filter(function (k) { return picked[k]; }).length;
        addBtn.disabled = !n;
        addBtn.textContent = n ? 'Add ' + n : 'Add';
      }
      var qt;
      qEl.addEventListener('input', function () { clearTimeout(qt); qt = setTimeout(paint, 150); });
      paint();
      qEl.focus();

      function close() { backdrop.remove(); document.removeEventListener('keydown', onKey); }
      function onKey(e) { if (e.key === 'Escape') close(); }
      document.addEventListener('keydown', onKey);
      backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(); });
      backdrop.querySelector('#cp-cancel').addEventListener('click', close);

      addBtn.addEventListener('click', async function () {
        var keys = Object.keys(picked).filter(function (k) { return picked[k]; });
        if (!keys.length) return;
        addBtn.disabled = true;
        try {
          var top = CATE.items.reduce(function (m, i) { return Math.max(m, i.sort || 0); }, 0);
          for (var k = 0; k < keys.length; k++) {
            var kind = keys[k].split(':')[0], id = keys[k].split(':')[1];
            var n = top + k + 1;
            if (kind === 'video') {
              var r = await db.from('video_category_links').upsert(
                [{ video_id: id, category_id: CATE.editing.id, sort_order: n }],
                { onConflict: 'video_id,category_id', ignoreDuplicates: true });
              if (r.error) throw r.error;
              // a video with no home yet gets this as its main category too
              var v = CATE.allVideos.filter(function (x) { return x.id === id; })[0];
              if (v && !v.category_id) {
                await db.from('videos').update({ category_id: CATE.editing.id }).eq('id', id);
              }
            } else {
              var r2 = await db.from('collection_categories').upsert(
                [{ collection_id: id, category_id: CATE.editing.id, sort_order: n }],
                { onConflict: 'collection_id,category_id', ignoreDuplicates: true });
              if (r2.error) throw r2.error;
            }
          }
          close();
          toast(keys.length === 1 ? 'Added' : keys.length + ' added');
          await openCategory(CATE.editing.id);
        } catch (e) {
          toast(e.message || 'Could not add those');
          addBtn.disabled = false;
        }
      });
    }

    // ── Content › Video › Collections ───────────────────────────────────────
    // Category → Collection → Videos. A collection is a curated, ORDERED set
    // of videos (a class combo, a series) with its own page, art, resources
    // and SEO. Videos are referenced, never copied: the playlist is rows in
    // collection_items, so the same video sits in many collections as one
    // Mux asset. Dividers are rows in the same list, which is why dragging
    // a heading around is no different from dragging a video.
    var COL = {
      rows: [], stats: {}, cats: [], videos: [], itemsAll: [], instructors: [],
      filters: [], options: [], allResources: [], resLinkCounts: {},
      editing: null, items: [], catSel: [], catInitial: [], resLinks: [], values: [],
      busy: false, q: '', status: 'all', cat: 'all', sort: 'updated',
    };
    var COL_STATUS = {
      draft:     ['Draft', ''],
      published: ['Published', 'on'],
      scheduled: ['Scheduled', ''],
      archived:  ['Archived', ''],
    };
    var COL_LIMITS = { short: 160, seo_title: 60, seo_desc: 155 };

    function fmtRuntime(sec) {
      var m = Math.round(Number(sec || 0) / 60);
      if (!m) return sec > 0 ? '<1 min' : '0 min';
      if (m < 60) return m + ' min';
      return Math.floor(m / 60) + 'h ' + (m % 60 ? (m % 60) + 'm' : '');
    }

    // one load for the whole Video → Collections world; the editor and the
    // picker reuse it rather than refetching per keystroke
    async function loadCollectionsData() {
      var got = await Promise.all([
        db.from('collections').select('*').order('updated_at', { ascending: false }),
        db.from('collection_stats').select('*'),
        db.from('video_categories').select('*').order('sort_order'),
        db.from('videos').select('id, title, slug, status, category_id, duration_seconds, thumbnail_mode, thumbnail_time_seconds, custom_thumbnail_url, mux_playback_id, short_description, search_keywords').order('created_at', { ascending: false }),
        db.from('collection_items').select('*').order('position'),
        db.from('instructors').select('*').eq('status', 'active').order('sort_order'),
        db.from('filters').select('*').eq('status', 'active').order('sort_order'),
        db.from('filter_options').select('*').eq('status', 'active').order('sort_order'),
      ]);
      var err = got.filter(function (r) { return r.error; })[0];
      if (err) throw err.error;
      COL.rows = got[0].data || [];
      COL.stats = {};
      (got[1].data || []).forEach(function (s) { COL.stats[s.collection_id] = s; });
      COL.cats = got[2].data || [];
      COL.videos = got[3].data || [];
      COL.itemsAll = got[4].data || [];
      COL.instructors = got[5].data || [];
      COL.filters = got[6].data || [];
      COL.options = got[7].data || [];
    }

    async function renderCollections() {
      var b = bodyEl(); b.innerHTML = stateLoading();
      try {
        await loadCollectionsData();
        // arriving via the router: #collections/<id> opens that editor,
        // plain #collections closes any editor so the page matches the
        // address. Direct renderCollections() calls skip this entirely.
        if (COL._openOnRender !== undefined) {
          var target = COL._openOnRender; COL._openOnRender = undefined;
          if (target && COL.rows.some(function (r) { return r.id === target; })) {
            await openCollection(target);
            return;
          }
          COL.editing = null;
          editorHash('collections', null);   // gone or never existed — the list is the truth
        }
        drawCollections();
      } catch (e) {
        b.innerHTML = /relation .* does not exist|collection_stats/i.test(e.message || '')
          ? '<div class="adm-panel"><div class="adm-panel-head"><h2>Collections</h2></div>' +
            '<div class="adm-intro" style="margin:0">This needs <code>supabase/video-collections.sql</code> run in Supabase, then it’ll show here.</div></div>'
          : stateError(e && e.message);
      }
    }

    // the card image a collection would show: its own art, or the first
    // video's uploaded poster. Mux-generated stills need a signed token per
    // video, so in the admin list they fall back to a quiet well.
    function collectionArt(c) {
      if (c.thumbnail_mode === 'custom' && c.custom_thumbnail_url) return c.custom_thumbnail_url;
      var first = COL.itemsAll.filter(function (i) {
        return i.collection_id === c.id && i.kind === 'video';
      }).sort(function (a, b2) { return a.position - b2.position; })[0];
      if (!first) return null;
      var v = COL.videos.filter(function (x) { return x.id === first.video_id; })[0];
      return v && v.custom_thumbnail_url ? v.custom_thumbnail_url : null;
    }
    // Complete / Needs attention / Draft — a glanceable nudge, not a score.
    function collectionHealth(c) {
      if (c.status === 'draft') return null;
      var missing = [];
      if (!collectionArt(c)) missing.push('thumbnail');
      if (!(c.short_description || '').trim()) missing.push('short description');
      if (!(c.seo_description || '').trim()) missing.push('meta description');
      return missing.length ? 'Missing: ' + missing.join(', ') : null;
    }

    function collectionCatNames(cid) {
      var names = {};
      COL.cats.forEach(function (c) { names[c.id] = c.name; });
      return (COL.catLinks || []).filter(function (l) { return l.collection_id === cid; })
        .map(function (l) { return names[l.category_id]; }).filter(Boolean);
    }

    function collectionMatches() {
      var q = (COL.q || '').trim().toLowerCase();
      return COL.rows.filter(function (c) {
        if (COL.status !== 'all' && c.status !== COL.status) return false;
        if (COL.cat !== 'all' && !(COL.catLinks || []).some(function (l) {
          return l.collection_id === c.id && l.category_id === COL.cat; })) return false;
        if (!q) return true;
        return ((c.title || '') + ' ' + (c.short_description || '') + ' ' +
                (c.search_keywords || []).join(' ')).toLowerCase().indexOf(q) !== -1;
      }).sort(function (a, b2) {
        var sa = COL.stats[a.id] || {}, sb = COL.stats[b2.id] || {};
        switch (COL.sort) {
          case 'created':   return new Date(b2.created_at) - new Date(a.created_at);
          case 'alpha':     return (a.title || '').localeCompare(b2.title || '');
          case 'videos':    return (sb.video_count || 0) - (sa.video_count || 0);
          case 'published': return new Date(b2.published_at || 0) - new Date(a.published_at || 0);
          default:          return new Date(b2.updated_at) - new Date(a.updated_at);
        }
      });
    }

    async function drawCollections() {
      var b = bodyEl(); if (!b) return;
      if (COL.editing) { drawCollectionForm(); return; }
      // category links load here (small table, needed for the list's
      // Category column and filter)
      if (!COL.catLinks) COL.catLinks = [];
      var links = await db.from('collection_categories').select('*');
      COL.catLinks = links.data || [];
      var hits = collectionMatches();

      b.innerHTML =
        '<div class="cat-controls lib-bar">' +
          '<input type="text" class="modal-input" id="col-q" placeholder="Search title, description or keywords…" value="' + esc(COL.q) + '" aria-label="Search collections">' +
          '<div class="lib-bar-end">' +
          '<select id="col-status" aria-label="Filter by status"><option value="all">Any status</option>' +
            Object.keys(COL_STATUS).map(function (k) {
              return '<option value="' + k + '"' + (COL.status === k ? ' selected' : '') + '>' + COL_STATUS[k][0] + '</option>';
            }).join('') + '</select>' +
          '<select id="col-cat" aria-label="Filter by category"><option value="all">Any category</option>' +
            COL.cats.filter(function (c) { return c.status === 'active'; }).map(function (c) {
              return '<option value="' + c.id + '"' + (COL.cat === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
            }).join('') + '</select>' +
          '<select id="col-sort" aria-label="Sort collections">' +
            [['updated', 'Recently updated'], ['created', 'Recently created'], ['alpha', 'A to Z'],
             ['videos', 'Most videos'], ['published', 'Published date']].map(function (o) {
              return '<option value="' + o[0] + '"' + (COL.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
            }).join('') + '</select>' +
          '<span class="adm-count">' + num(hits.length) + (hits.length === 1 ? ' collection' : ' collections') + '</span>' +
          '<button class="btn-primary" id="col-new">Create a collection</button>' +
          '</div>' +
        '</div>' +
        (hits.length
          ? '<ul class="lib-list">' +
            hits.map(function (c) {
              var s = COL.stats[c.id] || {};
              var health = collectionHealth(c);
              var meta = [
                collectionCatNames(c.id).join(', ') || 'No category',
                num(s.video_count || 0) + (Number(s.video_count) === 1 ? ' video' : ' videos'),
                fmtRuntime(s.total_seconds),
                c.status === 'scheduled' && c.published_at
                  ? 'Goes live ' + A.fmtDateTime(c.published_at)
                  : 'Updated ' + A.fmtDate(c.updated_at),
              ];
              return '<li class="lib-row" data-cid="' + c.id + '" tabindex="0" role="button" aria-label="Edit ' + esc(c.title || 'Untitled') + '">' +
                collectionLibThumb(c) +
                '<span class="lib-main">' +
                  '<span class="lib-title">' + esc(c.title || 'Untitled') + '</span>' +
                  '<span class="lib-meta">' + esc(meta.join(' · ')) + '</span>' +
                  (health ? '<span class="lib-note">' + esc(health) + '</span>' : '') +
                '</span>' +
                '<span class="lib-side"><span class="adm-pill' +
                  (COL_STATUS[c.status] && COL_STATUS[c.status][1] ? ' ' + COL_STATUS[c.status][1] : '') + '">' +
                  esc((COL_STATUS[c.status] || [c.status])[0]) + '</span></span>' +
              '</li>';
            }).join('') + '</ul>'
          : (COL.rows.length
              ? stateEmpty('Nothing matches that.')
              : '<div class="adm-state"><span class="adm-state-ico"><span class="material-symbols-sharp">stacks</span></span>' +
                '<h3>No collections yet</h3>' +
                '<p>Collections group related videos together — a class combo, a course, a multi-part exploration.</p>' +
                '<button class="btn-primary" id="col-first">Create your first collection</button></div>'));
      wireCollections();
    }

    // the collection row's art at row scale — its own art or the first
    // video's poster, over the stacks glyph when neither exists yet
    function collectionLibThumb(c) {
      var url = collectionArt(c);
      return '<span class="lib-thumb">' +
        (url ? '<img alt="" loading="lazy" src="' + esc(url) + '">'
             : '<span class="material-symbols-sharp">stacks</span>') +
      '</span>';
    }

    function wireCollections() {
      var b = bodyEl(); if (!b) return;
      var fresh = function () {
        COL.editing = {
          _new: true, thumbnail_mode: 'first_video', search_keywords: [],
          visibility: 'members',
          instructor_id: (COL.instructors[0] || {}).id || null,
        };
        COL.items = []; COL.catSel = []; COL.catInitial = []; COL.resLinks = []; COL.values = [];
        drawCollections();
      };
      ['col-new', 'col-first'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('click', fresh);
      });
      var q = document.getElementById('col-q');
      if (q) { var qt; q.addEventListener('input', function () {
        clearTimeout(qt); qt = setTimeout(function () { COL.q = q.value; drawCollections(); }, 200); }); }
      [['col-status', 'status'], ['col-cat', 'cat'], ['col-sort', 'sort']].forEach(function (p) {
        var el = document.getElementById(p[0]);
        if (el) el.addEventListener('change', function () { COL[p[1]] = el.value; drawCollections(); });
      });
      b.querySelectorAll('.lib-row[data-cid]').forEach(function (row) {
        var open = function () { openCollection(row.dataset.cid); };
        row.addEventListener('click', open);
        row.addEventListener('keydown', function (e) {
          if (e.target !== row) return;
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
        });
      });
    }

    async function openCollection(id) {
      var b = bodyEl(); if (b) b.innerHTML = stateLoading();
      try {
        var got = await Promise.all([
          db.from('collections').select('*').eq('id', id).single(),
          db.from('collection_items').select('*').eq('collection_id', id).order('position'),
          db.from('collection_categories').select('category_id').eq('collection_id', id),
          db.from('resource_links').select('*, resources(*)').eq('collection_id', id).order('sort_order'),
          db.from('content_filter_values').select('*').eq('collection_id', id),
          db.from('resources').select('*').order('created_at', { ascending: false }),
        ]);
        var err = got.filter(function (r) { return r.error; })[0];
        if (err) throw err.error;
        COL.editing = got[0].data;
        editorHash('collections', id);
        COL.items = got[1].data || [];
        COL.catSel = (got[2].data || []).map(function (l) { return l.category_id; });
        COL.catInitial = COL.catSel.slice();
        COL.resLinks = got[3].data || [];
        COL.values = got[4].data || [];
        COL.allResources = got[5].data || [];
        COL._slugTouched = !!COL.editing.slug;
        drawCollectionForm();
      } catch (e) {
        if (b) b.innerHTML = stateError(e && e.message);
      }
    }

    // ── the collection editor ───────────────────────────────────────────────
    // Same two-column grammar as the video editor: what the collection IS on
    // the left, what to DO with it on the right. The rail keeps the preview
    // card, the artwork and Publish in sight while Bonnie writes.
    function collectionRequired(c) {
      var out = [];
      if (!((document.getElementById('col-title') || {}).value || c.title || '').trim()) out.push('It needs a title.');
      if (!((document.getElementById('col-slug') || {}).value || c.slug || '').trim()) out.push('It needs a URL.');
      if (!COL.catSel.length) out.push('Choose at least one category.');
      if (!COL.items.some(function (i) { return i.kind === 'video'; })) out.push('Add at least one video.');
      return out;
    }

    function drawCollectionForm() {
      var b = bodyEl(); if (!b) return;
      var c = COL.editing;
      var isNew = !!c._new;
      var kws = c.search_keywords || [];
      var cats = COL.cats.filter(function (x) { return x.status === 'active'; });
      var blockers = collectionRequired(c);

      b.innerHTML =
        '<div class="vid-head">' +
          '<div>' +
            '<button class="btn-ghost vid-back" id="col-cancel">' +
              '<span class="material-symbols-sharp">arrow_back</span>All collections</button>' +
            '<h1 class="vid-title-h">' + (isNew ? 'New collection' : esc(c.title || 'Untitled')) + '</h1>' +
          '</div>' +
          '<div class="vid-head-right">' +
            (isNew ? '' :
              '<div class="vid-more">' +
                '<button class="btn-icon" id="col-more-btn" aria-haspopup="true" aria-expanded="false" aria-label="More actions">' +
                  '<span class="material-symbols-sharp">more_horiz</span></button>' +
                '<div class="vid-menu" id="col-menu" role="menu" hidden>' +
