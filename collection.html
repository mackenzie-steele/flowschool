<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- served at /video/<slug> etc. — without this, every relative URL on the
       page (scripts, styles, the nav's own links) resolves under the slug -->
  <base href="/">
  <script>!function(){var t=localStorage.getItem("fs-theme");document.documentElement.setAttribute("data-theme",t||"dark")}()</script>
  <style>html{background:#0F1116;color-scheme:dark}html[data-theme="light"]{background:#F7F6F4;color-scheme:light}</style>
  <link rel="icon" href="img/flow-school-favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection — Flow School</title>
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="library.css">
  <script src="lib/icons.js"></script>
</head>

<body class="has-sidebar">
  <script src="lib/version.js"></script>
  <script src="lib/nav.js"></script>
  <script src="lib/vendor/supabase-js-v2.110.7.min.js"></script>
  <script src="lib/supabase.js"></script>
  <script src="lib/telemetry.js"></script>
  <script src="lib/sync.js"></script>
  <script src="lib/analytics.js"></script>
  <script src="lib/notifications.js"></script>
  <script src="lib/notification-panel.js"></script>
  <script src="lib/toast.js"></script>
  <div class="toast" id="toast"></div>

  <main>
    <div class="lib-page" id="vl-root">
      <div class="col-hero">
        <div class="col-hero-art lib-skel"></div>
        <div><div class="lib-skel" style="height:34px;width:70%;margin-bottom:12px"></div>
          <div class="lib-skel" style="height:14px;width:90%"></div></div>
      </div>
    </div>
  </main>

  <script src="lib/video-library.js"></script>
  <script>
  (function () {
    var VL = window.fsVL;
    var esc = VL.esc;
    var root = document.getElementById('vl-root');
    var slug = decodeURIComponent((location.pathname.split('/')[2] || '').trim().toLowerCase());
    var catSlug = (new URLSearchParams(location.search).get('cat') || '').trim().toLowerCase();

    function notFound() {
      root.innerHTML =
        '<a class="lib-crumb" href="/library"><span class="material-symbols-sharp">arrow_back</span>Library</a>' +
        '<div class="lib-empty"><h3>There is nothing at this address</h3>' +
        '<p>This collection may have moved or come down. The library home has everything that is live.</p></div>';
    }

    (async function () {
      if (!(await VL.gate(root))) return;
      if (!slug) { notFound(); return; }

      // Direct-by-slug on purpose: an UNLISTED collection is reachable here
      // (that is what unlisted means) while never appearing on any browse
      // surface. Live-ness still applies — a draft is nobody's destination.
      var got = await Promise.all([
        db.from('collections').select('*').ilike('slug', slug).or(VL.liveOr()).limit(1),
        db.from('instructors').select('id, name'),
        // only fetched when the crumb needs a shelf to lead back to
        catSlug
          ? db.from('video_categories').select('name, slug').eq('status', 'active').ilike('slug', catSlug).limit(1)
          : Promise.resolve({ data: [] }),
      ]);
      if (got[0].error || !(got[0].data || []).length) { notFound(); return; }
      var c = got[0].data[0];
      var instructors = {};
      (got[1].data || []).forEach(function (i) { instructors[i.id] = i.name; });

      var got2 = await Promise.all([
        db.from('collection_items').select('id, kind, video_id, label, position')
          .eq('collection_id', c.id).order('position'),
        db.from('collection_stats').select('*').eq('collection_id', c.id),
        db.from('resource_links').select('id, resource_id, sort_order, resources(id, title, description, file_name, file_size)')
          .eq('collection_id', c.id).order('sort_order'),
        VL.loadProgress(),   // watched checks + the Continue button
      ]);
      var items = got2[0].data || [];
      var stats = (got2[1].data || [])[0] || {};
      var resLinks = (got2[2].data || []).filter(function (l) { return l.resources; });

      // the videos in the playlist, live ones only — RLS enforces this for
      // members; the explicit filter keeps the admin preview honest
      var vidIds = items.filter(function (i) { return i.kind === 'video' && i.video_id; })
        .map(function (i) { return i.video_id; });
      var vids = {};
      if (vidIds.length) {
        var vr = await db.from('videos')
          .select('id, title, slug, duration_seconds, thumbnail_mode, custom_thumbnail_url, mux_playback_id, short_description')
          .in('id', vidIds).or(VL.liveOr()).neq('visibility', 'unlisted');
        (vr.data || []).forEach(function (v) { vids[v.id] = v; });
      }

      // ── SEO ──
      document.title = (c.seo_title || c.title) + ' — Flow School';
      if (c.seo_description || c.short_description) {
        var m = document.createElement('meta');
        m.name = 'description'; m.content = c.seo_description || c.short_description;
        document.head.appendChild(m);
      }
      var link = document.createElement('link');
      link.rel = 'canonical'; link.href = 'https://flowschool.io/collection/' + c.slug;
      document.head.appendChild(link);

      // ── hero ──
      var art = (c.thumbnail_mode === 'custom' && c.custom_thumbnail_url) ? c.custom_thumbnail_url : null;
      var firstLive = items.filter(function (i) { return i.kind === 'video' && vids[i.video_id]; })[0];
      var firstVid = firstLive ? vids[firstLive.video_id] : null;
      if (!art && firstVid && firstVid.thumbnail_mode === 'custom' && firstVid.custom_thumbnail_url) {
        art = firstVid.custom_thumbnail_url;
      }
      var tokAttrs = (!art && firstVid && firstVid.mux_playback_id)
        ? ' data-tok-video="' + esc(firstVid.id) + '" data-playback="' + esc(firstVid.mux_playback_id) + '" data-w="1280"'
        : '';
      var count = Number(stats.video_count || 0);
      var meta = [
        instructors[c.instructor_id] || null,
        count + (count === 1 ? ' video' : ' videos'),
        stats.total_seconds ? VL.fmtRuntime(stats.total_seconds) : null,
      ].filter(Boolean).join(' · ');

      // the way back honors how you came: the category shelf by name when
      // the card carried one, the library's front door otherwise
      var backCat = ((got[2] && got[2].data) || [])[0] || null;
      var heroHTML =
        '<a class="lib-crumb" href="' + (backCat ? '/library/' + esc(backCat.slug) : '/library') + '">' +
          '<span class="material-symbols-sharp">arrow_back</span>' +
          (backCat ? esc(backCat.name) : 'Library') + '</a>' +
        '<div class="col-hero">' +
          '<div class="col-hero-art"' + tokAttrs + '>' +
            (art ? '<img alt="" src="' + esc(art) + '">'
                 : '<span class="bare-glyph" style="position:absolute;inset:0;display:grid;place-items:center;color:var(--text-4)"><span class="material-symbols-sharp">stacks</span></span>') +
          '</div>' +
          '<div>' +
            '<span class="col-hero-eyebrow"><span class="material-symbols-sharp">stacks</span>Collection</span>' +
            '<h1>' + esc(c.title) + '</h1>' +
            (meta ? '<div class="col-hero-meta">' + esc(meta) + '</div>' : '') +
            (c.description || c.short_description
              // the editor's small HTML dialect renders; plain text passes
              // through escaped with its line breaks kept
              ? '<div class="col-hero-desc rich-text">' + VL.richText(c.description || c.short_description) + '</div>' : '') +
            (function () {
              // one action row: the play button knows where you are (fresh →
              // Start; mid-way → Continue at the first unwatched; all done →
              // Watch again), and Save/Share sit beside it — the same quiet
              // pair the video page wears.
              var cta = '';
              if (firstVid) {
                var liveVids = items.filter(function (i) { return i.kind === 'video' && vids[i.video_id]; })
                  .map(function (i) { return vids[i.video_id]; });
                var touched = liveVids.some(function (v2) { return VL.progressOf(v2.id); });
                var nextUp = liveVids.filter(function (v2) { return !(VL.progressOf(v2.id) || {}).completed; })[0];
                var target = (touched && nextUp) ? nextUp : firstVid;
                var label = !touched ? 'Start the collection' : (nextUp ? 'Continue' : 'Watch again');
                cta = '<a class="btn-primary" href="/video/' + esc(target.slug) + '?c=' + esc(c.slug) + '">' +
                  '<span class="material-symbols-sharp">play_arrow</span>' + label + '</a>';
              }
              return '<div class="col-start">' + cta +
                '<button class="btn-icon" id="col-save" data-tooltip="Save" aria-label="Save">' +
                  '<span class="material-symbols-sharp save-icon">bookmark</span></button>' +
                '<button class="btn-icon" id="col-share" data-tooltip="Share" aria-label="Share">' +
                  '<span class="material-symbols-sharp">share</span></button>' +
              '</div>';
            })() +
            (resLinks.length ? '<div class="res-chips" id="col-res" style="margin-top:24px"></div>' : '') +
          '</div>' +
        '</div>';

      // ── the playlist, exactly as arranged ──
      var listHTML = '';
      var n = 0;
      var visibleVideos = 0;
      items.forEach(function (it) {
        if (it.kind === 'divider') {
          listHTML += '<div class="pl-divider">' + esc(it.label || '') + '</div>';
          return;
        }
        var v = vids[it.video_id];
        if (!v) return;   // hidden by publishing rules — the list flows on
        visibleVideos += 1; n += 1;
        var thumbInner = (v.thumbnail_mode === 'custom' && v.custom_thumbnail_url)
          ? '<img alt="" loading="lazy" src="' + esc(v.custom_thumbnail_url) + '">'
          : '<span class="material-symbols-sharp">movie</span>';
        var thumbTok = !(v.thumbnail_mode === 'custom' && v.custom_thumbnail_url) && v.mux_playback_id
          ? ' data-tok-video="' + esc(v.id) + '" data-playback="' + esc(v.mux_playback_id) + '" data-w="320"'
          : '';
        var done = !!(VL.progressOf(v.id) || {}).completed;
        listHTML += '<a class="pl-row' + (done ? ' done' : '') + '" href="/video/' + esc(v.slug) + '?c=' + esc(c.slug) + '">' +
          // the check replaces the number — one quiet column carries both
          '<span class="pl-num">' + (done
            ? '<span class="material-symbols-sharp pl-check">check</span>'
            : String(n).padStart(2, '0')) + '</span>' +
          '<span class="pl-thumb"' + thumbTok + '>' + thumbInner + '</span>' +
          '<span class="pl-body"><span class="pl-title">' + esc(v.title) + '</span>' +
            (v.short_description ? '<span class="pl-sub">' + esc(v.short_description) + '</span>' : '') +
          '</span>' +
          '<span class="pl-dur">' + VL.fmtDur(v.duration_seconds) + '</span>' +
        '</a>';
      });

      root.innerHTML = heroHTML +
        '<h2 class="inside-h">What’s inside</h2>' +
        (visibleVideos
          ? listHTML
          : '<div class="lib-empty"><h3>Nothing is live in here yet</h3>' +
            '<p>The videos in this collection have not been published — check back soon.</p></div>');

      // ── collection resources ──
      var resHost = document.getElementById('col-res');
      if (resHost) {
        resHost.innerHTML = resLinks.map(function (l) {
          var r = l.resources;
          return '<button class="res-chip" data-res="' + esc(r.id) + '"' +
            (r.description ? ' data-tooltip="' + esc(r.description) + '"' : '') + '>' +
            '<span class="res-title">' + esc(r.title || r.file_name || 'File') + '</span>' +
            '<span class="res-get"><span class="material-symbols-sharp">download</span></span>' +
          '</button>';
        }).join('');
        resHost.querySelectorAll('.res-chip').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            btn.disabled = true;
            try {
              var out = await VL.resourceUrl(btn.dataset.res);
              window.open(out.url, '_blank', 'noopener');
            } catch (e) { toast(e.message || 'Could not fetch that file'); }
            btn.disabled = false;
          });
        });
      }

      // ── save + share ──
      (async function () {
        var saveBtn = document.getElementById('col-save');
        var shareBtn = document.getElementById('col-share');
        if (!saveBtn) return;
        var isSaved = false, ready = true;
        function paint() {
          saveBtn.classList.toggle('saved', isSaved);
          saveBtn.setAttribute('data-tooltip', isSaved ? 'Saved' : 'Save');
          saveBtn.setAttribute('aria-label', isSaved ? 'Saved — click to remove' : 'Save');
        }
        try {
          var sr = await db.from('library_saves').select('id').eq('collection_id', c.id).limit(1);
          if (sr.error) throw sr.error;
          isSaved = !!(sr.data || []).length;
        } catch (e) {
          if (/relation .* does not exist|library_saves/i.test((e && e.message) || '')) ready = false;
        }
        paint();
        saveBtn.addEventListener('click', async function () {
          if (!ready) { toast('Saving needs supabase/video-engagement.sql run first'); return; }
          isSaved = !isSaved; paint();   // optimistic; reality catches up below
          try {
            if (isSaved) await VL.saveCollection(c.id);
            else await VL.unsaveCollection(c.id);
          } catch (e2) {
            isSaved = !isSaved; paint();
            toast(e2.message || 'Could not update that');
          }
        });
        shareBtn.addEventListener('click', async function () {
          var url = 'https://flowschool.io/collection/' + c.slug;
          if (navigator.share) {
            try { await navigator.share({ title: c.title, url: url }); return; }
            catch (e3) { if (e3 && e3.name === 'AbortError') return; }
          }
          try { await navigator.clipboard.writeText(url); toast('Link copied'); }
          catch (_) { toast(url); }
        });
      })();

      VL.hydrateThumbs(root);
    })();
  })();
  </script>
</body>

</html>
